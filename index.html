<style>
@font-face{font-family:'Oswald';font-style:normal;font-weight:500;font-display:swap;src:url('./fonts/oswald-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Oswald';font-style:normal;font-weight:600;font-display:swap;src:url('./fonts/oswald-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Oswald';font-style:normal;font-weight:700;font-display:swap;src:url('./fonts/oswald-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Lato';font-style:normal;font-weight:300;font-display:swap;src:url('./fonts/lato-latin-300-normal.woff2') format('woff2')}
@font-face{font-family:'Lato';font-style:normal;font-weight:400;font-display:swap;src:url('./fonts/lato-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Lato';font-style:normal;font-weight:700;font-display:swap;src:url('./fonts/lato-latin-700-normal.woff2') format('woff2')}
:root{
  --brand:#8E1428; --brand-dk:#3A0C16; --gold:#A8873F; --ink:#0B1420; --ink-2:#5A6068; --ink-3:#8A9096;
  --ground:#F3F4F2; --surface:#FFFFFF; --surface-2:#EAECE9; --rule:#DDE0DC; --rule-2:#C4C9C3;
  --good:#1A7A40; --good-bg:#E4F0E8; --warn:#9A6B08; --warn-bg:#F6EBD3; --crit:#BF1120; --crit-bg:#F8E2E4;
  --crit-ink:#7C0A14;
  /* A solid red dark enough that white letters on it are legible. Not themed: the
     armed delete button must look and read the same however the app is dressed. */
  --crit-solid:#9E0C18;
  --info:#0A5C8F; --info-bg:#DEEAF3;
  /* How much of the screen the hardware is standing on. On an iPhone with a Dynamic
     Island the top one is about 59px upright and the left or right one about 59px on
     its side; the bottom one is the home indicator. Zero everywhere else, including
     every laptop. Named here so that every edge in the app can allow for them without
     each rule having to spell out env() again. */
  --sa-t:env(safe-area-inset-top,0px);
  --sa-r:env(safe-area-inset-right,0px);
  --sa-b:env(safe-area-inset-bottom,0px);
  --sa-l:env(safe-area-inset-left,0px);
  --fd:'Oswald',Impact,sans-serif; --fb:'Lato',-apple-system,'Segoe UI',sans-serif;
  --sh:0 1px 2px rgba(26,26,26,.05),0 8px 24px -18px rgba(26,26,26,.4);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ink:#ECEEEA; --ink-2:#A2A9A5; --ink-3:#7C8380;
  --ground:#111413; --surface:#191D1C; --surface-2:#222726; --rule:#2C3231; --rule-2:#3C4342;
  --brand:#E84453; --brand-dk:#BF1120;
  --good:#6DBE86; --good-bg:#16281C; --warn:#D6A44A; --warn-bg:#2A2312; --crit:#E8737F; --crit-bg:#2E1619;
  --crit-ink:#FFC2C8;
  --info:#5EA8D8; --info-bg:#122430;
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px -18px rgba(0,0,0,.9);
  color-scheme:dark;
}}
[data-theme=dark]{
  --ink:#F0EAE4; --ink-2:#AFA49C; --ink-3:#80756E;
  --ground:#08060A; --surface:#120D11; --surface-2:#1B1319; --rule:#261A20; --rule-2:#3A2830;
  --brand:#C22A44; --brand-dk:#5C0F1E;
  --gold:#C5A66D;                    /* straight off the logo */
  --good:#4FD69A; --good-bg:#06251A; --warn:#E0AE5C; --warn-bg:#2A1E06; --crit:#E8556B; --crit-bg:#2A0D12;
  --crit-ink:#FFBDC5;
  --info:#6FB6D8; --info-bg:#0A2029;
  --sh:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -26px rgba(0,0,0,1);
  --edge:rgba(197,166,109,.28);      /* gold hairline that catches the light */
  --edge-hot:rgba(194,42,68,.60);    /* brand-lit edge */
  --glow:0 0 22px -6px rgba(197,166,109,.6);
  --glass:rgba(24,17,22,.80);
  color-scheme:dark;
}
/* ══════════════════════════════════════════════════════════════════════
   THE BROCHURE
   The third theme, and the one the system opens on. It is the company
   profile: midnight navy falling to burgundy, brass hairlines, warm paper
   for the text. The colours were sampled off the printed pages rather than
   guessed, so the screen and the brochure a client is holding match.

     navy      #091929      the cover and the section pages
     burgundy  #701729      the contents ground and the tags
     brass     #BD9E65      every rule, numeral and small cap
     paper     #FAF9F5      the body pages

   Everything is scoped to [data-theme=brand] so the plain dark theme and
   the printable light theme are untouched, and print strips all of it.

   Two rules held throughout: text contrast never drops below what the dark
   theme already had, and nothing here moves, resizes or hides a control.
   It is a skin over the same machine.
   ══════════════════════════════════════════════════════════════════════ */
[data-theme=brand]{
  --ink:#F6F2EA; --ink-2:#C3B8A8; --ink-3:#8F8678;
  --ground:#070F1B; --surface:rgba(14,26,42,.72); --surface-2:rgba(20,34,52,.62);
  --rule:rgba(189,158,101,.20); --rule-2:rgba(189,158,101,.34);
  --brand:#8E1D33; --brand-dk:#5E0F22;
  --gold:#BD9E65;
  --good:#4FB78C; --good-bg:rgba(12,48,38,.55);
  --warn:#D9A441; --warn-bg:rgba(62,44,12,.5);
  --crit:#D8455F; --crit-bg:rgba(74,14,26,.55); --crit-ink:#FFBAC4;
  --info:#7FA6C8; --info-bg:rgba(14,34,52,.55);
  --edge:rgba(189,158,101,.32);
  --edge-hot:rgba(142,29,51,.62);
  --glow:0 0 24px -8px rgba(189,158,101,.45);
  --glass:rgba(10,20,34,.76);
  --sh:0 1px 0 rgba(255,255,255,.04) inset,0 22px 50px -30px rgba(0,0,0,.95);
  color-scheme:dark;
}

/* ---------- the ground: the cover, navy falling to burgundy ---------- */
[data-theme=brand] body{background:#070F1B;position:relative}

[data-theme=brand] body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1200px 700px at 12% -12%,rgba(20,40,66,.55),transparent 64%),
    radial-gradient(900px 520px at 92% 4%,rgba(189,158,101,.07),transparent 62%),
    linear-gradient(180deg,#091929 0%,#0A1727 38%,#2A1425 76%,#4A1024 100%);
}
/* a drafting grid, faint, fading out before it reaches any table */
[data-theme=brand] body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(189,158,101,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(189,158,101,.055) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 130% 74% at 50% 0%,#000 10%,transparent 72%);
  -webkit-mask-image:radial-gradient(ellipse 130% 74% at 50% 0%,#000 10%,transparent 72%);
}
/* the brochure has no particles in it, so neither does this */
[data-theme=brand] .starfield{display:none}

/* ---------- panels: paper laid on the cover ---------- */
[data-theme=brand] .panel,[data-theme=brand] .card,[data-theme=brand] .statbox,
[data-theme=brand] .box-quiet,[data-theme=brand] .vital,[data-theme=brand] .queue,
[data-theme=brand] .mod,[data-theme=brand] .vcard,[data-theme=brand] .modal{
  background:linear-gradient(168deg,rgba(17,31,49,.80),rgba(10,20,34,.72));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--rule);
  box-shadow:var(--sh);
}
/* the brass hairline the brochure puts under every heading */
[data-theme=brand] .panel-head{position:relative;border-bottom:1px solid var(--rule)}
[data-theme=brand] .panel-head::after{
  content:'';position:absolute;left:16px;bottom:-1px;width:42px;height:2px;
  background:var(--gold);
}
[data-theme=brand] .panel-head h2{letter-spacing:1.6px}

/* ---------- the rail ---------- */
[data-theme=brand] .rail{
  background:linear-gradient(180deg,rgba(7,15,27,.97),rgba(9,20,34,.94));
  border-right:1px solid var(--rule);
}
[data-theme=brand] .rail button.on{
  color:#fff;
  background:linear-gradient(90deg,rgba(142,29,51,.55),rgba(142,29,51,.06));
}
[data-theme=brand] .rail button.on::before{
  background:var(--gold);box-shadow:0 0 12px 1px rgba(189,158,101,.6);
}
[data-theme=brand] .rail button:hover{background:rgba(189,158,101,.09)}
[data-theme=brand] .rail-sec{color:var(--gold);opacity:.8}

/* ---------- the bar ---------- */
[data-theme=brand] .cmdbar{
  background:linear-gradient(180deg,rgba(8,17,29,.97),rgba(8,17,29,.92));
  border-bottom:1px solid var(--rule);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
[data-theme=brand] .cmdkey{background:rgba(10,20,34,.55);border-color:var(--rule-2)}
[data-theme=brand] .cmdbar .where b{color:var(--gold)}

/* ---------- figures, set the way the brochure sets them ---------- */
[data-theme=brand] .vital .vv,[data-theme=brand] .mod .mv,
[data-theme=brand] .statbox .v{
  color:var(--ink);-webkit-text-fill-color:var(--ink);
}
[data-theme=brand] .vital .vk,[data-theme=brand] .mod .mk,
[data-theme=brand] .statbox .k{color:var(--gold);opacity:.9}

/* ---------- tables ---------- */
[data-theme=brand] thead th{
  background:rgba(9,19,32,.7);color:var(--gold);
  border-bottom:1px solid var(--rule-2);letter-spacing:1.4px;
}
[data-theme=brand] tbody tr:hover{background:rgba(189,158,101,.06)}
[data-theme=brand] .queue-h{
  background:linear-gradient(90deg,rgba(112,23,41,.45),transparent 72%)}
[data-theme=brand] .qrow:hover{background:rgba(189,158,101,.06)}
[data-theme=brand] .qmore{color:var(--ink-3)}

/* ---------- buttons ---------- */
[data-theme=brand] .btn{
  background:linear-gradient(180deg,#8E1D33,#6C1226);
  border:1px solid rgba(189,158,101,.34);color:#fff;
}
[data-theme=brand] .btn:hover{background:linear-gradient(180deg,#A32540,#7C142B)}
[data-theme=brand] .btn.sec{
  background:rgba(255,255,255,.03);border:1px solid var(--rule-2);color:var(--ink-2);
}
[data-theme=brand] .btn.sec:hover{border-color:var(--edge);color:var(--ink)}

/* ---------- the palette ---------- */
[data-theme=brand] .pal{
  background:linear-gradient(168deg,rgba(18,33,52,.96),rgba(10,20,34,.94));
  border:1px solid var(--rule-2);
  box-shadow:0 40px 90px -40px rgba(0,0,0,1);
}
[data-theme=brand] .pal-item.sel{background:rgba(142,29,51,.5)}
[data-theme=brand] .pal-sec{color:var(--gold)}

/* ---------- the funnel and the marks ---------- */
[data-theme=brand] .funnel .f0{background:linear-gradient(90deg,#334352,#26313D)}
[data-theme=brand] .funnel .f1{background:linear-gradient(90deg,#3E5C7A,#2E465E)}
[data-theme=brand] .funnel .f2{background:linear-gradient(90deg,#8E1D33,#6C1226)}
[data-theme=brand] .funnel .f3{
  background:linear-gradient(90deg,#BD9E65,#9A7C43);color:#20180A}
[data-theme=brand] .chip.on{background:var(--brand);border-color:var(--gold)}

/* the sign-in screen gets the same cover */
[data-theme=brand] .login-card{
  background:linear-gradient(160deg,rgba(18,33,52,.78),rgba(10,20,34,.66));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--rule-2);border-radius:16px;
  box-shadow:0 40px 90px -40px rgba(0,0,0,1),0 0 40px -20px rgba(189,158,101,.5);
}

/* nothing decorative survives a print */
@media print{
  [data-theme=brand] body::before,[data-theme=brand] body::after,
  [data-theme=brand] .starfield{display:none !important}
  [data-theme=brand] .panel,[data-theme=brand] .card{
    backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
  [data-theme=brand] .panel-head::after{display:none}
}

/* ══════════════════════════════════════════════════════════════════════
   THE DECK
   The frame was a horizontal tab strip over a page of cards. This replaces
   it with a left command rail, a slim bar carrying only what is live, and
   a palette that opens on the keyboard. The modules underneath are
   untouched: they render inside the deck exactly as they did.
   ══════════════════════════════════════════════════════════════════════ */
.deck{display:grid;grid-template-columns:calc(var(--rail-w,74px) + var(--sa-l)) 1fr;min-height:100vh}
/* The drifting star field only has a look in the brochure theme, but it is a child of the deck
   grid in every theme. Left static it takes the first cell and pushes the rail into the
   second, which is exactly what it did to the light theme. It is decoration: take it out
   of the flow everywhere, and hide it where it is not wanted. */
.starfield{position:fixed;inset:-80px;pointer-events:none;z-index:0}
:root:not([data-theme=brand]) .starfield{display:none}
.deck-main{min-width:0;display:flex;flex-direction:column;position:relative}

/* ---------- the rail ---------- */
.rail{
  position:sticky;top:0;height:100vh;z-index:60;
  display:flex;flex-direction:column;gap:2px;
  padding:calc(12px + var(--sa-t)) 10px calc(16px + var(--sa-b)) calc(10px + var(--sa-l));
  background:linear-gradient(180deg,rgba(16,9,38,.96),rgba(9,5,24,.94));
  border-right:1px solid var(--rule);
  transition:width .18s ease;
}
.rail-top{display:flex;align-items:center;gap:10px;padding:0 4px;height:63px;flex:none;
  margin:-12px -10px 10px;padding-left:14px;border-bottom:1px solid var(--rule);
  overflow:hidden}
.rail-mark{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,#2A1250,#120A2C);overflow:hidden}
.rail-mark img{width:100%;height:100%;object-fit:cover}
.rail-word{font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.6px;
  white-space:nowrap;opacity:0;transition:opacity .15s ease;pointer-events:none}
.rail-sec{font-size:8.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;padding:14px 10px 5px;white-space:nowrap;opacity:0;transition:opacity .15s}
.rail button{
  display:flex;align-items:center;gap:12px;width:100%;
  background:none;border:none;border-radius:10px;padding:9px 10px;cursor:pointer;
  color:var(--ink-3);font-family:var(--fd);font-size:13px;font-weight:600;
  letter-spacing:1px;text-transform:uppercase;
  white-space:nowrap;text-align:left;position:relative;
}
.rail button .ri{width:22px;flex:none;display:grid;place-items:center;font-size:15px;line-height:1}
.rail button .rl{opacity:0;transition:opacity .15s ease;overflow:hidden}
.rail button .rn{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 7px;
  border-radius:9px;background:var(--crit-bg);color:var(--crit-ink);opacity:0;transition:opacity .15s}
.rail button .rn.dot{position:absolute;left:27px;top:7px;margin:0;padding:0;opacity:1;
  width:7px;height:7px;border-radius:50%;background:var(--crit);color:transparent;
  overflow:hidden;box-shadow:0 0 9px 1px var(--crit)}
.rail:hover button .rn.dot,.rail.pinned button .rn.dot,.rail.open button .rn.dot{
  position:static;width:auto;height:auto;padding:1px 7px;border-radius:9px;
  background:var(--crit-bg);color:var(--crit-ink);box-shadow:none;margin-left:auto}
.rail button:hover{color:var(--ink);background:var(--surface-2)}
.rail button.on{color:#fff;background:linear-gradient(90deg,var(--edge-hot),transparent)}
.rail button.on::before{
  content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;
  background:var(--gold);box-shadow:var(--glow);
}
.rail:hover,.rail.pinned{width:230px}
.rail:hover .rail-word,.rail.pinned .rail-word,
.rail:hover .rail-sec,.rail.pinned .rail-sec,
.rail:hover .rl,.rail.pinned .rl,
.rail:hover .rn,.rail.pinned .rn{opacity:1}
.rail:hover{box-shadow:26px 0 60px -30px rgba(0,0,0,.9)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
/* On a real desk there is room for words. Icons alone are a thing you have to be taught,
   and nobody here is going to be taught anything. */
/* Same again for a tablet, at any width, because the narrow rail only names itself when
   the pointer rests on it and a finger cannot rest on anything. Icons alone would mean
   Chris guessing which glyph is Quotations, which is exactly the "nobody needs training"
   line this system is held to. */
@media(min-width:1400px),
       (min-width:760px) and (min-height:620px) and (pointer:coarse){
  .deck{grid-template-columns:calc(230px + var(--sa-l)) 1fr}
  .rail{width:230px}
  .rail .rail-word,.rail .rail-sec{opacity:1}
  .rail button .rl,.rail button .rn{opacity:1}
  .rail button .rn.dot{position:static;width:auto;height:auto;padding:1px 7px;
    border-radius:9px;background:var(--crit-bg);color:var(--crit-ink);box-shadow:none;margin-left:auto}
}

/* ---------- the bar ---------- */
.cmdbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  /* The island and the rounded corners stand on the top and the sides. Installed to a
     home screen there is no browser chrome above this bar, so without the insets the
     menu button sits underneath the island and cannot be pressed. */
  padding:calc(11px + var(--sa-t)) calc(20px + var(--sa-r)) 11px calc(20px + var(--sa-l));
  border-bottom:1px solid var(--rule);
  background:linear-gradient(180deg,rgba(14,8,34,.97),rgba(10,6,26,.94));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.cmdbar .where{font-family:var(--fd);font-size:12px;font-weight:600;letter-spacing:1.8px;
  text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.cmdbar .where b{color:var(--gold)}
/* which office you are in. Small, permanent, and never a dropdown: the currency on every
   figure below depends on it, so it has to be readable at a glance and not one click deep */
.offsw{display:flex;gap:2px;padding:2px;border:1px solid var(--rule-2);border-radius:8px;
  flex:none}
.offbtn{background:none;border:none;cursor:pointer;color:var(--ink-3);border-radius:6px;
  font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:1.2px;padding:5px 9px}
.offbtn:hover{color:var(--ink)}
.offnote{font-size:11px;color:var(--ink-3);margin-left:8px;white-space:nowrap}
.flowrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.offbtn.on{background:var(--brand);color:#fff}
/* This used to be hidden on a phone. It should not be: it decides whether every figure
   on the screen is dirhams or euros, and Chris is the one most likely to be looking at
   it from an airport. Kept, just tighter. */
@media(max-width:760px){ .offbtn{padding:5px 6px;font-size:10px;letter-spacing:.6px} }
.cmdkey{
  flex:1;max-width:520px;display:flex;align-items:center;gap:10px;cursor:pointer;
  padding:8px 12px;border-radius:9px;border:1px solid var(--rule-2);
  background:rgba(14,8,32,.5);color:var(--ink-3);font-size:13px;
}
.cmdkey:hover{border-color:var(--edge);color:var(--ink-2)}
.cmdkey kbd{margin-left:auto;font-family:var(--fb);font-size:10.5px;font-weight:700;
  padding:2px 7px;border-radius:5px;border:1px solid var(--rule-2);color:var(--ink-3)}
.barclocks{display:flex;gap:15px;margin-left:auto;font-family:var(--fd);font-size:11.5px;
  letter-spacing:1.2px;white-space:nowrap}
.barclocks i{font-style:normal;color:var(--gold);font-size:9px;letter-spacing:1.6px;margin-right:5px}
.barclocks b{font-variant-numeric:tabular-nums;color:var(--ink)}
@media (max-width:759px), (max-height:619px){
  /* One column, not two.
     The rail becomes position:fixed just below, and a fixed element is out of the grid
     flow entirely. That left .deck-main as the FIRST in-flow child, so it landed in the
     zero-width first column and the whole app was rendered inside 32 pixels with the
     rest of the screen empty. Two columns only make sense while the rail is in the
     flow, which on a phone it is not. */
  .deck{grid-template-columns:1fr}
  /* overflow:hidden because the section headings inside the closed drawer were wider
     than the 74px it is translated by, so the tails of them showed as loose letters
     down the left edge of every screen */
  .rail{position:fixed;left:0;top:0;width:calc(74px + var(--sa-l));
        transform:translateX(-100%);transition:transform .2s;overflow:hidden}
  .rail.open{overflow-y:auto}
  /* the drawer carries its own 63px logo band, which lines up with the bar it covers */
  .rail{box-shadow:18px 0 50px -20px rgba(0,0,0,.8);z-index:80}
  .rail.open{transform:none;width:calc(230px + var(--sa-l))}
  .rail.open .rail-word,.rail.open .rail-sec,.rail.open .rl,.rail.open .rn{opacity:1}
}
/* The clocks and the BUILDTECH // WHERE label are the first things to go when the bar
   gets tight, whether or not the rail is a drawer. An iPad at 768 keeps its rail and
   still has no room for two clocks. */
@media(max-width:900px){
  .barclocks{display:none}
  .cmdbar .where{display:none}
}
.railtoggle{display:none !important}
@media (max-width:759px), (max-height:619px){.railtoggle{display:grid !important}}

/* ---------- the palette ---------- */
.pal-back{position:fixed;inset:0;z-index:200;background:rgba(4,2,12,.68);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;justify-content:center;align-items:flex-start;
  padding:calc(12vh + var(--sa-t)) calc(16px + var(--sa-r))
          calc(16px + var(--sa-b)) calc(16px + var(--sa-l))}
.pal{width:100%;max-width:620px;border-radius:16px;overflow:hidden;
  background:linear-gradient(160deg,rgba(40,25,80,.94),rgba(16,10,36,.94));
  border:1px solid var(--rule-2);
  box-shadow:0 50px 110px -40px rgba(0,0,0,1),var(--glow)}
.pal input{width:100%;border:none;border-bottom:1px solid var(--rule);border-radius:0;
  background:transparent;padding:17px 20px;font-size:16px;color:var(--ink)}
.pal input:focus{outline:none;box-shadow:none;border-color:var(--edge)}
.pal-list{max-height:52vh;overflow:auto;padding:6px}
.pal-sec{font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;padding:11px 14px 5px}
.pal-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:none;border:none;border-radius:9px;padding:9px 14px;cursor:pointer;color:var(--ink)}
.pal-item .pi{width:22px;flex:none;text-align:center;font-size:14px;color:var(--ink-3)}
.pal-item .pt{font-size:14px}
.pal-item .ps{font-size:11.5px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.pal-item.sel,.pal-item:hover{background:linear-gradient(90deg,var(--edge-hot),transparent)}
.pal-item.sel .pi{color:var(--gold)}
.pal-foot{display:flex;gap:16px;padding:9px 18px;border-top:1px solid var(--rule);
  font-size:11px;color:var(--ink-3)}
.pal-foot b{color:var(--ink-2);font-weight:700}
.pal-empty{padding:26px 18px;text-align:center;color:var(--ink-3);font-size:13.5px}

/* ---------- the operations home ---------- */
.ops-hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:14px;
  margin-bottom:18px}
.vital{position:relative;border-radius:14px;padding:18px 18px 16px;overflow:hidden;
  border:1px solid var(--rule);background:var(--surface)}
.vital::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--brand),transparent)}
.vital .vk{font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.vital .vv{font-family:var(--fd);font-size:34px;line-height:1.05;margin:9px 0 4px;
  color:var(--ink)}
.vital .vs{font-size:12px;color:var(--ink-2)}
.vital.hot{border-color:rgba(255,92,122,.42)}
.vital.hot .vv{color:var(--crit)}
.spark{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:10px}
.spark i{flex:1;border-radius:2px 2px 0 0;background:linear-gradient(180deg,var(--gold),transparent);
  min-height:2px;display:block}

.queue{border-radius:14px;border:1px solid var(--rule);overflow:hidden;margin-bottom:18px;
  background:var(--surface)}
.queue-h{display:flex;align-items:center;gap:12px;padding:13px 18px;
  border-bottom:1px solid var(--rule);
  background:var(--surface-2)}
.queue-h h2{font-family:var(--fd);font-size:13px;letter-spacing:1.6px;text-transform:uppercase;margin:0}
.queue-h .n{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.qrow{display:flex;align-items:center;gap:14px;padding:12px 18px;border-top:1px solid var(--rule);
  cursor:pointer}
.qrow:hover{background:var(--surface-2)}
/* a count of what did not fit, not something you can click into */
/* ---------- what a section costs to buy ---------- */
.cost-h{font-family:var(--fd);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--gold);font-weight:700;margin-bottom:4px}
.cost-t{width:100%;border-collapse:collapse;font-size:13px}
.cost-t th{text-align:left;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;padding:5px 8px;border-bottom:1px solid var(--rule)}
.cost-t th.n,.cost-t td.n{text-align:right;font-variant-numeric:tabular-nums}
.cost-t td{padding:5px 8px;vertical-align:top}
.cost-t tr.secrow td{border-top:1px solid var(--rule);padding-top:9px}
.cost-t tr.itemrow td{padding-top:1px;padding-bottom:1px;font-size:12.5px}
.cost-t tr.itemrow td:first-child{padding-left:16px}
.cost-t tfoot td{border-top:1px solid var(--rule-2);padding-top:8px}
.cost-t tfoot tr:last-child td{color:var(--ink-3);font-size:12.5px;border-top:none;padding-top:1px}
/* the order list, which is editable in place. Every figure on it can be typed over, so
   every cell is a box rather than a printed number. */
.ord-t{min-width:880px}
.ord-t td{border-top:1px solid var(--rule);vertical-align:middle;padding:4px 6px}
.ord-t td.x{color:var(--ink-3);padding:0 2px;text-align:center}
.ord-t input.qn{width:58px;padding:5px 6px;text-align:right;font-variant-numeric:tabular-nums}
.ord-t input.num{width:82px;padding:5px 6px;text-align:right;font-variant-numeric:tabular-nums}
.ord-t input.pname{width:100%;min-width:170px;padding:5px 7px}
.ord-t input.plabel{width:132px;padding:4px 6px;font-size:12px}
.ord-t input.num.sm{width:72px;padding:4px 6px;font-size:12px}
.ord-t input.num.wide{width:104px}
.ord-t td.oname,.ord-t th:first-child{width:36%;min-width:350px}
/* the pack and what goes into stock, under the name, the way their own line names it */
.ord-t .subline{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.ord-t .osup{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.ord-t .uu{color:var(--ink-3);font-size:11.5px;white-space:nowrap}
.ord-t select{padding:5px 6px;max-width:210px}
.ord-t .short{font-size:11.5px;color:var(--crit);margin-top:2px}
.addrow{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-top:10px}
/* where a line's cost came from, under the line it belongs to */
.whycost{grid-column:1/-1;font-size:11.5px;color:var(--ink-3);padding:1px 2px 3px}
.whycost.warn{color:var(--warn)}
/* the settings sections. A row of tabs rather than one long column, because finding the
   supply discount should not mean reading past the pallet volume */
.settabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.settab{background:var(--surface);border:1px solid var(--rule);color:var(--ink-2);
  border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13px;font-weight:600}
.settab:hover{color:var(--ink);border-color:var(--rule-2)}
.settab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.ord-t .xbtn{width:26px;height:26px;font-size:14px}
/* the currency switch, wherever a figure could be read in either money */
.curpick{width:auto;min-width:0;padding:3px 6px;font-size:12px;
         font-family:var(--fd);letter-spacing:.04em}
.polrow input.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.polrow .packlbl{font-size:11.5px;color:var(--ink-3);margin-top:3px;padding-left:2px}
/* said beside the button that caused it, not at the top of a page you cannot see */
.lineerr{font-size:12.5px;color:var(--crit-ink);background:var(--crit-bg);
         padding:5px 9px;border-radius:5px;max-width:520px}
/* what a supplier's proforma was read as, before any of it is written down */
.pfbox{margin:12px;padding:12px 14px;border:1px solid var(--gold);border-radius:8px;
       background:var(--surface-2)}
.pfhead{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13.5px}
.pfbox table{font-size:13px}
.pfbox .ok-tick{color:var(--good);font-weight:700}
.pfbad{color:var(--warn);font-weight:700;cursor:help}
.qmore{padding:11px 18px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-3)}
/* the document list an authority actually handed us, one line each */
.reqrow{display:flex;gap:13px;align-items:flex-start;padding:11px 18px;
  border-top:1px solid var(--rule)}
.reqrow .rqt{font-size:14px;font-weight:600;line-height:1.35}
.reqrow .rqm{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.reqrow.owed .rqt{color:var(--crit)}
.reqrow.owed .rqm{color:var(--crit)}
.reqtick{flex:none;width:22px;height:22px;margin-top:1px;border-radius:6px;cursor:pointer;
  border:1px solid var(--rule-2);background:none;color:var(--ok,#2E9E7E);
  font-size:13px;font-weight:800;line-height:1;display:grid;place-items:center}
.reqtick:hover{border-color:var(--edge)}
.reqrow.owed .reqtick{border-color:var(--crit)}
.qrow .sev{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-3)}
.qrow .sev.hi{background:var(--crit);box-shadow:0 0 10px 1px var(--crit)}
.qrow .sev.md{background:var(--warn);box-shadow:0 0 10px 1px var(--warn)}
.qrow .qt{font-size:14px;font-weight:600}
.qrow .qs{font-size:12px;color:var(--ink-3);margin-top:2px}
.qrow .qgo{margin-left:auto;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
.qrow:hover .qgo{color:var(--gold)}
.queue-ok{padding:26px 18px;text-align:center;color:var(--good);font-size:14px}

/* ---------- market visits ---------- */
.funnel{display:flex;gap:2px;margin:14px 0 4px;border-radius:8px;overflow:hidden;height:34px}
.funnel div{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;
  font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:#fff;white-space:nowrap;padding:0 8px;transition:flex-grow .3s ease}
.funnel .f0{background:linear-gradient(90deg,#5B4B8A,#43356B)}
.funnel .f1{background:linear-gradient(90deg,#3C6FB8,#2E568F)}
.funnel .f2{background:linear-gradient(90deg,#2E9E7E,#217A60)}
.funnel .f3{background:linear-gradient(90deg,#C9A227,#9C7C15);color:#231a00}
.funnel b{font-family:var(--fd);font-size:15px;letter-spacing:0}
.funnel-key{display:flex;gap:16px;font-size:11.5px;color:var(--ink-3);margin-bottom:16px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--rule-2);background:none;color:var(--ink-3);border-radius:20px;
  padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--ink);border-color:var(--edge)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip .c{opacity:.72;margin-left:5px;font-variant-numeric:tabular-nums}
.vstage{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  padding:3px 9px;border-radius:20px;white-space:nowrap}
.vstage.visited{background:rgba(120,110,180,.18);color:#9b93c9}
.vstage.inplay {background:rgba(60,111,184,.18);color:#6ba0e8}
.vstage.quoted {background:rgba(46,158,126,.18);color:#3fc79c}
.vstage.won    {background:var(--gold-bg,rgba(201,162,39,.18));color:var(--gold)}
.vflag{font-size:11px;font-weight:700;color:var(--crit);white-space:nowrap}
.vflag.cold{color:var(--warn)}
.vcard{border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-bottom:10px;
  background:var(--surface-2)}
.vcard .vh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.vcard .vh b{font-family:var(--fd);font-size:15px}
.vcard .vh .who{color:var(--ink-3);font-size:12px}
.vcard dl{margin:0;display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13.5px}
.vcard dt{color:var(--ink-3);font-size:11px;letter-spacing:1px;text-transform:uppercase;
  font-weight:700;padding-top:2px}
.vcard dd{margin:0}
@media(max-width:700px){.vcard dl{grid-template-columns:1fr}.vcard dt{padding-top:8px}}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(184px,100%),1fr));gap:12px}
.mod{position:relative;border-radius:13px;padding:15px 15px 14px;cursor:pointer;overflow:hidden;
  border:1px solid var(--rule);background:linear-gradient(160deg,rgba(34,21,66,.55),rgba(16,10,36,.45));
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.mod:hover{transform:translateY(-3px);border-color:var(--edge);
  box-shadow:var(--glow)}
.mod .mi{font-size:19px;line-height:1;color:var(--gold)}
.mod .mn{font-family:var(--fd);font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;
  margin:11px 0 6px}
.mod .mv{font-family:var(--fd);font-size:23px;line-height:1}
.mod .ms{font-size:11.5px;color:var(--ink-3);margin-top:4px;min-height:16px}
.mod .flag{position:absolute;top:12px;right:12px;width:7px;height:7px;border-radius:50%;
  background:var(--crit);box-shadow:0 0 10px 1px var(--crit)}

/* the plain themes get a readable version of all of the above */
[data-theme=light] .rail,[data-theme=dark] .rail{background:var(--surface)}
[data-theme=light] .cmdbar,[data-theme=dark] .cmdbar{background:var(--surface)}
[data-theme=light] .rail button.on{background:var(--surface-2);color:var(--ink)}
[data-theme=light] .rail button.on::before{background:var(--brand);box-shadow:none}
[data-theme=light] .vital,[data-theme=light] .queue,[data-theme=light] .mod,
[data-theme=dark] .vital,[data-theme=dark] .queue,[data-theme=dark] .mod{
  background:var(--surface)}
[data-theme=light] .vital .vv,[data-theme=light] .mod .mv{-webkit-text-fill-color:var(--ink)}
[data-theme=light] .pal{background:var(--surface)}
/* The search box is a dark translucent slab in the brochure theme. On a pale ground that
   reads as a grey brick with the words lost inside it. */
[data-theme=light] .cmdkey,[data-theme=dark] .cmdkey{
  background:var(--surface-2);color:var(--ink-2);border-color:var(--rule)}
[data-theme=light] .cmdkey kbd,[data-theme=dark] .cmdkey kbd{color:var(--ink-3)}
[data-theme=light] .queue-h,[data-theme=dark] .queue-h{background:var(--surface-2)}
[data-theme=light] .qrow:hover,[data-theme=dark] .qrow:hover{background:var(--surface-2)}

@media print{ .rail,.cmdbar{display:none !important} .deck{grid-template-columns:1fr} }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#root{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:3px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;background:var(--ground);
  padding:calc(24px + var(--sa-t)) calc(24px + var(--sa-r))
          calc(24px + var(--sa-b)) calc(24px + var(--sa-l))}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:32px;box-shadow:var(--sh)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo-mark{width:40px;height:40px;border-radius:6px;background:#3A0C16;display:grid;place-items:center;flex:none;overflow:hidden}
.logo-mark svg{width:26px;height:26px}
.logo-mark img{width:100%;height:100%;object-fit:cover;display:block}
.logo-name{font-family:var(--fd);font-size:20px;font-weight:700;letter-spacing:.5px;line-height:1.1}
.logo-sub{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.login h1{font-family:var(--fd);font-size:19px;font-weight:600;margin:24px 0 4px}
.login p.hint{color:var(--ink-2);font-size:13.5px;margin:0 0 20px}
/* the way back in, for somebody who has no password yet or has lost it */
.linky{display:block;width:100%;margin-top:16px;background:none;border:none;cursor:pointer;
  color:var(--ink-2);font-size:13px;text-decoration:underline;text-underline-offset:3px;
  padding:8px 0}
.linky:hover{color:var(--ink)}
.linky:disabled{opacity:.5;cursor:default}

label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.field{margin-bottom:14px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],select,textarea{
  width:100%;padding:9px 11px;background:var(--surface);border:1px solid var(--rule-2);border-radius:5px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{resize:vertical;min-height:70px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:5px;border:1px solid transparent;background:var(--brand);color:#fff;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--brand-dk)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--rule-2)}
.btn.sec:hover{background:var(--surface-2)}
.btn.wide{width:100%}
.btn.sm{padding:6px 11px;font-size:13px}
/* Deleting something for good. Quiet until it is armed, then unmistakably red.
   The writing is never red: red letters on a red panel, which is where these buttons
   usually sit, cannot be read. Unarmed it is ordinary text with a red outline, and armed
   it is white on solid red, both of which stay legible on any background. */
.btn.danger{background:var(--surface);color:var(--ink);border-color:var(--crit)}
.btn.danger:hover{background:var(--crit-solid);color:#fff;border-color:var(--crit)}
.btn.danger.armed{background:var(--crit-solid);color:#fff;border-color:var(--crit);font-weight:700}
.btn.danger.armed:hover{background:var(--crit-solid);color:#fff}
/* the buttons at the end of a stored scope. They wrap rather than push the table wide,
   which is what a phone needs, and the row goes red once it has been asked once. */
.doc-acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
tr.armed-row>td{background:var(--crit-bg)}
tr.armed-row>td,tr.armed-row .muted{color:var(--crit-ink)}
/* --crit-ink, not --crit: this text sits on a red panel, so it has to be the pale end of
   the red rather than the same red as the background. */
.err{background:var(--crit-bg);color:var(--crit-ink);padding:9px 12px;border-radius:5px;font-size:13.5px;margin-bottom:14px}
/* the same red, but for a problem in the business rather than a failure in the app */
.flagbox{background:var(--crit-bg);color:var(--crit-ink);padding:9px 12px;border-radius:5px;font-size:13.5px;margin-bottom:14px}
.ok{background:var(--good-bg);color:var(--good);padding:9px 12px;border-radius:5px;font-size:13.5px;margin-bottom:14px}

/* ---------- shell ---------- */
.shell{display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px}
[data-theme=dark] .topbar,
:root:not([data-theme=light]):not([data-theme=brand]) .topbar{background:#0A0C0C}
@media(prefers-color-scheme:light){
  :root:not([data-theme=dark]):not([data-theme=brand]) .topbar{background:var(--ink)}}
.topbar .logo-name{color:#fff;font-size:16px}
.topbar .logo-sub{color:rgba(255,255,255,.5)}
.search-wrap{margin-left:auto;position:relative;flex:1;max-width:340px}
.search-wrap input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;padding:7px 11px;font-size:13.5px;border-radius:5px;width:100%}
.search-wrap input::placeholder{color:rgba(255,255,255,.4)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--sh);max-height:60vh;overflow:auto;z-index:60}
.results button{display:block;width:100%;text-align:left;padding:9px 12px;background:none;border:none;border-bottom:1px solid var(--rule);cursor:pointer}
.results button:hover{background:var(--surface-2)}
.results .rk{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.results .rt{font-weight:700;font-size:14px}
.results .rs{font-size:12.5px;color:var(--ink-2)}
.icon-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;width:34px;height:34px;border-radius:5px;cursor:pointer;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.2)}

main{flex:1;max-width:1240px;width:100%;margin:0 auto;
  padding:20px calc(16px + var(--sa-r)) calc(64px + var(--sa-b)) calc(16px + var(--sa-l))}

/* ---------- pieces ---------- */
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-family:var(--fd);font-size:24px;font-weight:700;margin:0;letter-spacing:.3px}
.page-head .sp{margin-left:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:12px;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:16px;box-shadow:var(--sh)}
.card .k{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:8px}
.card .v{font-family:var(--fd);font-size:26px;font-weight:700;line-height:1.05;letter-spacing:.2px}
.card .s{font-size:12.5px;color:var(--ink-2);margin-top:5px}
.card.alert{border-left:3px solid var(--crit)}
.card.alert .v{color:var(--crit)}
.card.okc{border-left:3px solid var(--good)}

.panel{background:var(--surface);border:1px solid var(--rule);border-radius:7px;box-shadow:var(--sh);margin-bottom:20px;overflow:hidden}
.panel-head{padding:13px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.panel-head h2{font-family:var(--fd);font-size:14px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;margin:0}
.panel-head .sp{margin-left:auto}
.panel-body{padding:16px}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:9px 14px;border-bottom:1px solid var(--rule-2);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:36px 16px;text-align:center;color:var(--ink-3)}

.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 8px;border-radius:3px;white-space:nowrap}
.pill.inquiry{background:var(--info-bg);color:var(--info)}
.pill.quoted{background:var(--warn-bg);color:var(--warn)}
.pill.negotiation{background:var(--warn-bg);color:var(--warn)}
.pill.won{background:var(--good-bg);color:var(--good)}
.pill.lost{background:var(--surface-2);color:var(--ink-3)}
.pill.quiet{background:var(--crit-bg);color:var(--crit-ink)}

.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand)}

.modal-bg{position:fixed;inset:0;background:rgba(10,12,12,.5);display:grid;place-items:center;
  z-index:100;overflow:auto;
  padding:calc(16px + var(--sa-t)) calc(16px + var(--sa-r))
          calc(16px + var(--sa-b)) calc(16px + var(--sa-l))}
.modal{background:var(--surface);border-radius:9px;width:100%;max-width:600px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
/* an order line has eight things on it, all of them editable, so it needs the room */
.modal.wide{max-width:960px}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--rule);display:flex;align-items:center}
.modal-head h2{font-family:var(--fd);font-size:17px;margin:0;font-weight:600}
.modal-body{padding:20px;max-height:65vh;overflow:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--rule);display:flex;gap:9px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
/* said beside the button that was pressed, because the top of a scrolled modal is
   somewhere nobody is looking at that moment */
.modal-foot .lineerr{margin-right:auto;max-width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 14px;font-size:14px}
.kv dt{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding-top:3px}
.kv dd{margin:0}
@media(max-width:480px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:10px}}

.prod{border:1px solid var(--rule);border-radius:6px;padding:13px 15px;background:var(--surface)}
.prod h3{font-family:var(--fd);font-size:15px;margin:0 0 3px;font-weight:600}
.prod .sub{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:7px}
.prod .d{font-size:13px;color:var(--ink-2);margin-bottom:9px}
.prod .rate{font-size:12.5px;margin-bottom:4px}
.prod .rate b{color:var(--ink)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:12px}
.pk{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0;border-top:1px dashed var(--rule)}
.pk .price{font-family:var(--fd);font-weight:600;color:var(--brand);white-space:nowrap}
.pk.costline{border-top:none;padding-top:0;font-size:11.5px;color:var(--ink-3)}
.pk.costline .price{color:var(--ink-3);font-weight:600}
.note{margin:0 0 14px;padding:10px 12px;border:1px solid var(--edge);border-left:3px solid var(--brand);
      border-radius:8px;background:var(--surface);color:var(--ink-2);font-size:12.5px;line-height:1.5}
.muted{color:var(--ink-3);font-size:13px}
.spinner{width:22px;height:22px;border:2.5px solid var(--rule-2);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}

/* ---------- reading a scope of works ---------- */
.dropzone{display:block;border:2px dashed var(--rule-2);border-radius:12px;padding:34px 20px;
  text-align:center;cursor:pointer;background:var(--surface-2);transition:border-color .15s,background .15s}
.dropzone:hover,.dropzone.over{border-color:var(--brand);background:var(--surface)}
.dropzone .dz-big{font-family:var(--fd);font-size:16px;letter-spacing:.4px;margin-bottom:6px}
.dropzone .dz-small{font-size:12.5px;color:var(--ink-3)}
.okbox{margin:14px 0 0;padding:10px 12px;border-radius:8px;font-size:13px;
  border:1px solid var(--good);background:var(--good-bg);color:var(--good)}

.scope-in{width:100%;min-height:280px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px;line-height:1.55;white-space:pre;overflow-wrap:normal;overflow-x:auto;
  margin-bottom:12px}
.scope-part{display:grid;grid-template-columns:minmax(min(190px,100%),1fr) minmax(min(210px,100%),1fr);
  gap:8px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.scope-part .sp-label{font-weight:700;font-size:13.5px}
.scope-part .sp-why{grid-column:1 / -1;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.scope-part .sp-why.gap{color:var(--warn)}
.sp-teach{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  font-size:12.5px;color:var(--ink-3);padding:8px 0 2px}
.sp-teach input{max-width:200px;padding:5px 8px;font-size:12.5px}
.sp-teach .ok{color:var(--good)}
.btn.small{padding:5px 10px;font-size:12px}
@media(max-width:620px){ .scope-part{grid-template-columns:1fr} }
ul.tight{margin:0 0 8px;padding-left:20px}
ul.tight li{font-size:13px;line-height:1.6;color:var(--ink-2)}

/* ---------- typing on a phone ----------
   Safari on iOS zooms the whole page in whenever you tap a field whose text is smaller
   than 16px, and it does not zoom back out afterwards. The fields in here are 13.5px,
   which is right on a laptop and wrong on a phone: every tap on a quantity would jump
   the page and leave it magnified until you pinched it back.

   Sixteen pixels only where there is a finger rather than a mouse, so the desktop
   density is untouched. Everything else is left alone. */
@media (pointer:coarse){
  input,select,textarea,.lrow input,.lrow textarea{font-size:16px}
  /* fingers are not mice: the small buttons in table rows need a target, not a hitbox
     the width of the glyph */
  .lrow button,.ord-t button,table button{min-height:32px}
}

/* ---------- quotations ---------- */
.qhead{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:0 14px}
/* the pricing control carries a number, a mode and a button, so it needs two columns */
.qhead .field.wide{grid-column:span 2}
.qhead .field.wide select{min-width:104px}
.qref{font-family:var(--fd);font-size:22px;font-weight:700;letter-spacing:.5px}
.sec-box{border:1px solid var(--rule);border-radius:6px;margin-bottom:14px;overflow:hidden}
.sec-bar{background:var(--surface-2);padding:9px 12px;display:flex;gap:9px;align-items:center}
.sec-bar input{background:var(--surface);font-weight:700}
.lrow{display:grid;grid-template-columns:1fr 78px 84px 106px 106px 74px 118px;gap:8px;padding:8px 12px;border-top:1px solid var(--rule);align-items:start}
/* Margin is read out, never typed. It is a consequence of the sell and cost beside it,
   so it is a div and not an input; an editable box here would invite someone to set a
   margin and expect the price to follow. */
.mgn{display:flex;align-items:center;justify-content:flex-end;height:32px;padding:0 8px;
     border:1px solid var(--rule);border-radius:5px;background:var(--surface-2);
     font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.mgn.pos{color:var(--good);border-color:var(--good)}
.mgn.thin{color:var(--warn);border-color:var(--warn)}
.mgn.neg{color:var(--crit-ink);border-color:var(--crit);background:var(--crit-bg)}
.mgn.na{opacity:.5}
.secmgn{margin-left:auto;display:flex;align-items:center;gap:8px;white-space:nowrap;
        font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.secmgn b{font-size:14px;letter-spacing:0;font-variant-numeric:tabular-nums}
/* the section's own total, which is the number being set and so the loudest thing here */
.secmgn .secsum{font-family:var(--fd);font-weight:700;font-size:14px;color:var(--ink);
                letter-spacing:0;font-variant-numeric:tabular-nums;margin-right:2px}
.secmgn b.pos{color:var(--good)} .secmgn b.thin{color:var(--warn)} .secmgn b.neg{color:var(--crit)}
.lrow.note{grid-template-columns:1fr 72px}
/* A build-up line: priced for us to look at, not part of what the client pays. Marked
   quietly rather than loudly, because on a finished quotation most of the lines are
   build-up and a heavy treatment would make the page look like a warning. */
.lrow.buildup{background:var(--surface-2)}
.lrow.buildup input{opacity:.92}
/* a cost that came from the products underneath rather than from the keyboard */
.lrow input.rolled::placeholder{color:var(--gold);opacity:1;font-weight:700}
/* what a section landed on, when it could not land on the number that was asked for */
.secsaid{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:12.5px;
  background:var(--warn-bg);color:var(--warn);border-top:1px solid var(--rule)}
.secsaid .xbtn{margin-left:auto;width:24px;height:24px;font-size:13px}
.lrow.buildup::before{content:'';position:absolute;left:0;width:3px;height:100%;
  background:var(--gold);opacity:.5}
.lrow{position:relative}

.lrow input,.lrow textarea{padding:6px 8px;font-size:13.5px}
.lrow textarea{min-height:34px}
.xbtn{background:none;border:1px solid var(--rule-2);border-radius:4px;color:var(--ink-3);width:30px;height:30px;cursor:pointer;font-size:15px;line-height:1}
.xbtn:hover{color:var(--crit);border-color:var(--crit)}
.xbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.xbtn.on:hover{color:#fff}
/* the priced / build-up switch. Three letters wide, so it cannot be a 30px square. */
.xbtn.tag{width:auto;min-width:44px;padding:0 7px;font-size:11px;font-weight:700;
          font-family:var(--fd);letter-spacing:.03em}
/* purchase order lines */
.polrow{display:grid;grid-template-columns:minmax(150px,1fr) 84px 62px 78px 62px 82px 62px 78px 74px 92px 62px;gap:8px;
        padding:8px 12px;border-top:1px solid var(--rule);align-items:center}
.polhead{display:grid;grid-template-columns:minmax(150px,1fr) 84px 62px 78px 62px 82px 62px 78px 74px 92px 62px;gap:8px;
         padding:7px 12px;background:var(--surface-2)}
.polhead span{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.polhead span.r{text-align:right}
.polrow input{padding:6px 8px;font-size:13.5px}
.recv{text-align:right;padding:6px 8px;font-size:13.5px;font-variant-numeric:tabular-nums;
      color:var(--ink-3);border:1px solid var(--rule);border-radius:5px;background:var(--surface-2)}
.recv.done{color:var(--good);border-color:var(--good)}
.polval{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px}
.statbox{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--surface-2)}
.statbox .k{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.statbox .v{font-family:var(--fd);font-size:26px;margin:5px 0 3px}
.statbox .s{font-size:12px;color:var(--ink-3)}
.box-quiet{border:1px solid var(--rule);border-radius:7px;padding:11px 13px;
           background:var(--surface-2);margin-top:10px}
@media(max-width:900px){.polrow,.polhead{grid-template-columns:1fr 1fr;gap:6px}.polhead{display:none}}
.lhead{display:grid;grid-template-columns:1fr 78px 84px 106px 106px 74px 34px;gap:8px;padding:7px 12px;background:var(--surface-2)}
.lhead span.r{text-align:right}
.lhead span{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
div.tot{display:grid;grid-template-columns:1fr auto;gap:5px 22px;max-width:340px;margin-left:auto;font-variant-numeric:tabular-nums}
div.tot .lbl{color:var(--ink-2);font-size:13.5px}
div.tot .val{text-align:right;font-weight:700;font-size:13.5px}
div.tot .big{font-family:var(--fd);font-size:19px}
div.tot .neg{color:var(--crit)}
div.tot .pos{color:var(--good)}
.warnbar{background:var(--crit-bg);color:var(--crit-ink);padding:9px 12px;border-radius:5px;font-size:13.5px;margin-bottom:12px;font-weight:700}
.totrow{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
.totside{flex:1 1 260px;min-width:240px}
.totside .muted{margin:0 0 10px;font-size:12.5px;line-height:1.6}
.totmain{flex:0 0 360px;margin-left:auto}
@media(max-width:820px){.totmain{flex:1 1 100%;margin-left:0}}
.floorbox{max-width:360px;margin:16px 0 0 auto;padding:12px 14px;border:1px solid var(--edge);
          border-radius:9px;background:var(--surface-2)}
.floorbox div.tot{margin:0;max-width:none}
td.r,th.r{text-align:right}
tr.tot td{border-top:1px solid var(--rule-2);border-bottom:none;font-variant-numeric:tabular-nums}
ul.plain{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.7}
/* The shared documents panel is a pair of full panels. Dropped inside a card it needs
   its own chrome taken off, or you get a box in a box in a box. */
.nested .panel{border:none;background:none;box-shadow:none;margin:0}
.nested .panel-head{padding-left:0;padding-right:0;background:none;border-bottom:1px solid var(--rule)}
.nested .panel-body{padding-left:0;padding-right:0}
.nested .doc{padding-left:0;padding-right:0}
.nested .empty{padding:14px 0}
.ship-print h3{font-family:var(--fd);font-size:13px;letter-spacing:.04em;text-transform:uppercase;
               color:var(--ink-2);margin:0 0 6px}
@media print{
  .ship-print{display:none}
  /* Printing the request: show only it, wherever it sits in the tree. */
  body.print-ship .print-area{display:none !important}
  body.print-ship .page-head,body.print-ship .panel,body.print-ship .sec-box,
  body.print-ship .cards,body.print-ship .subnav{display:none !important}
  body.print-ship .ship-print{display:block !important}
  body.print-ship .ship-print .panel{display:block !important}
  body.print-ship .topbar,body.print-ship .btn{display:none !important}
}
.floorbox .muted{margin:10px 0 0;font-size:11.5px;line-height:1.5}
/* Setting the price. Same shape as the floor box beside it, because they answer the two
   halves of the same question: what do I want to charge, and how low can I go. */
.pricebox{max-width:360px;margin:16px 0 0 auto;padding:12px 14px;border:1px solid var(--gold);
          border-radius:9px;background:var(--surface-2)}
.pricebox .muted{margin:9px 0 0;font-size:11.5px;line-height:1.5}
.pricerow{display:flex;align-items:center;gap:7px}
.pricerow input{flex:1;min-width:0;font-size:16px;font-weight:700;text-align:right;
                font-variant-numeric:tabular-nums;padding:6px 9px}
.pricerow .pcur{font-family:var(--fd);font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.pricerow .btn{white-space:nowrap}
/* and the same thing on one section, which has to be small enough to sit in its bar */
.secprice{display:flex;align-items:center;gap:5px;margin-left:10px}
.secprice input{width:96px;padding:4px 7px;font-size:12.5px;text-align:right;
                font-variant-numeric:tabular-nums}
@media(max-width:760px){
  .secprice{margin-left:0;order:3;width:100%}
  .secprice input{flex:1;width:auto}
}
.floorhead{display:flex;justify-content:space-between;align-items:center;gap:10px;
           margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--rule);
           font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.03em;
           text-transform:uppercase;color:var(--ink-2)}
.floorhead label{display:flex;align-items:center;gap:5px;font-family:var(--fb);font-weight:400;
                 text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink-3)}
.floorhead select{padding:2px 4px;font-size:12px;width:auto;min-width:0}
/* The price box wears the same hat as the floor box but keeps its own class. Sharing
   .floorhead made ".floorhead select" mean two different selects on one screen, which is
   ambiguous for a test and, more to the point, for anybody reading the stylesheet. */
.pricehead{display:flex;justify-content:space-between;align-items:center;gap:10px;
           margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--rule);
           font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.03em;
           text-transform:uppercase;color:var(--ink-2)}
.pricehead label{display:flex;align-items:center;gap:5px;font-family:var(--fb);font-weight:400;
                 text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink-3)}
.pricehead select{padding:2px 4px;font-size:12px;width:auto;min-width:0}
@media(max-width:760px){
  .lrow,.lhead{grid-template-columns:1fr 1fr;gap:6px}
  .lhead{display:none}
  .lrow.note{grid-template-columns:1fr}
}

/* ---------- projects & stock ---------- */
.pstat{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
       padding:3px 8px;border-radius:3px;white-space:nowrap}
.pstat.upcoming{background:var(--info-bg);color:var(--info)}
.pstat.in_progress{background:var(--warn-bg);color:var(--warn)}
.pstat.on_hold{background:var(--surface-2);color:var(--ink-3)}
.pstat.complete{background:var(--good-bg);color:var(--good)}
.pstat.cancelled{background:var(--surface-2);color:var(--ink-3)}
.mrow{display:grid;grid-template-columns:1fr 92px 92px 92px 34px;gap:8px;padding:8px 14px;
      border-top:1px solid var(--rule);align-items:center}
.mrow input{padding:6px 8px;font-size:13.5px}
.mhead{display:grid;grid-template-columns:1fr 92px 92px 92px 34px;gap:8px;padding:7px 14px;background:var(--surface-2)}
.mhead span{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.milrow{display:grid;grid-template-columns:1fr 72px 132px 132px 132px 132px 34px;gap:8px;
        padding:8px 14px;border-top:1px solid var(--rule);align-items:center}
.milhead{display:grid;grid-template-columns:1fr 72px 132px 132px 132px 132px 34px;gap:8px;
         padding:7px 14px;background:var(--surface-2)}
.milhead span{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.milrow input{padding:6px 8px;font-size:13.5px}
.short{color:var(--crit);font-weight:700}
.okv{color:var(--good);font-weight:700}
.bar-s{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.bar-s i{display:block;height:100%;background:var(--good)}
.bar-s i.part{background:var(--warn)}
@media(max-width:820px){
  .mrow,.mhead,.milrow,.milhead{grid-template-columns:1fr 1fr;gap:6px}
  .mhead,.milhead{display:none}
}
/* ---------- product page ---------- */
.pp-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.pp-title{font-family:var(--fd);font-size:26px;font-weight:700;letter-spacing:.3px;margin:0}
.pp-sub{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.corr{display:grid;grid-template-columns:96px 1fr 34px;gap:12px;align-items:start;
      padding:11px 14px;border-top:1px solid var(--rule)}
.corr .t{font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.corr .m{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.corr-ch{font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
         padding:4px 7px;border-radius:4px;text-align:center;line-height:1.35}
.corr-ch span{display:block;font-weight:400;letter-spacing:.4px;opacity:.75}
.corr-ch.outb{background:var(--info-bg);color:var(--info)}
.corr-ch.inb{background:var(--good-bg);color:var(--good)}
.doc{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
     padding:11px 16px;border-bottom:1px solid var(--rule)}
.doc:last-child{border-bottom:none}
.doc .t{font-weight:700;font-size:14px;line-height:1.3}
.doc .m{font-size:12px;color:var(--ink-3);margin-top:2px}
.doc .acts{display:flex;gap:6px;flex-wrap:wrap}
.doc.editing{grid-template-columns:190px 1fr auto}
.doc.editing select,.doc.editing input{padding:6px 9px;font-size:13.5px}
.doc .t.nameable{cursor:text}
.doc .t.nameable:hover{text-decoration:underline dotted;text-underline-offset:3px}
@media(max-width:620px){.doc.editing{grid-template-columns:1fr}}
.chip-doc{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
          padding:4px 8px;border-radius:3px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.chip-doc.tds{background:var(--info-bg);color:var(--info)}
.chip-doc.sds{background:var(--crit-bg);color:var(--crit-ink)}
.chip-doc.dcd{background:var(--good-bg);color:var(--good)}
.chip-doc.cert{background:var(--warn-bg);color:var(--warn)}
.drop{border:1.5px dashed var(--rule-2);border-radius:6px;padding:16px;background:var(--surface)}
.drop.over{border-color:var(--brand);background:var(--accent-soft,var(--surface-2))}
.docbadge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.6px;padding:2px 6px;
          border-radius:3px;background:var(--info-bg);color:var(--info);margin-left:6px}
.card-click{cursor:pointer}
.card-click:hover{box-shadow:0 4px 18px rgba(0,0,0,.10)}
@media(max-width:620px){.doc{grid-template-columns:1fr;gap:6px}.doc .acts{justify-content:flex-start}}

/* ---------- shipments ---------- */
.sstat{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
       padding:3px 8px;border-radius:3px;white-space:nowrap;background:var(--surface-2);color:var(--ink-3)}
.sstat.planning{background:var(--surface-2);color:var(--ink-3)}
.sstat.quoted{background:var(--info-bg);color:var(--info)}
.sstat.booked{background:var(--info-bg);color:var(--info)}
.sstat.in_transit{background:var(--warn-bg);color:var(--warn)}
.sstat.customs{background:var(--warn-bg);color:var(--warn)}
.sstat.delivered{background:var(--good-bg);color:var(--good)}
.sstat.cancelled{background:var(--surface-2);color:var(--ink-3)}
.check{display:flex;align-items:center;gap:9px;font-size:14px;margin:4px 0 2px;cursor:pointer}
.check input{width:auto;margin:0}
.dgflag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
        padding:3px 7px;border-radius:3px;background:var(--crit-bg);color:var(--crit-ink)}
.shhead,.shrow{display:grid;grid-template-columns:1fr 96px 84px 56px 66px 78px 92px 92px 34px;gap:8px;
               padding:8px 14px;align-items:center}
.shhead{padding:7px 14px;background:var(--surface-2)}
.shhead span{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.shrow{border-top:1px solid var(--rule)}
.shrow input,.shrow select{padding:6px 8px;font-size:13.5px}
@media(max-width:900px){.shrow,.shhead{grid-template-columns:1fr 1fr;gap:6px}.shhead{display:none}}

/* ---------- finance ---------- */
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.subnav button{background:var(--surface);border:1px solid var(--rule-2);border-radius:5px;
  padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.subnav button:hover{color:var(--ink);border-color:var(--ink-3)}
.subnav button.on{background:var(--ink);border-color:var(--ink);color:#fff}
[data-theme=brand] .subnav button{background:rgba(20,34,52,.5);
  border-color:var(--rule-2);color:var(--ink-2)}
[data-theme=brand] .subnav button:hover{color:#fff;border-color:rgba(189,158,101,.55)}
[data-theme=brand] .subnav button.on{
  background:linear-gradient(135deg,var(--brand-dk),var(--brand));border-color:var(--edge);
  color:#fff;box-shadow:0 0 20px -8px rgba(198,75,240,.95)}
.istat{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  padding:3px 8px;border-radius:3px;white-space:nowrap;background:var(--surface-2);color:var(--ink-3)}
.istat.draft{background:var(--surface-2);color:var(--ink-3)}
.istat.sent{background:var(--info-bg);color:var(--info)}
.istat.part_paid{background:var(--warn-bg);color:var(--warn)}
.istat.paid{background:var(--good-bg);color:var(--good)}
.istat.cancelled{background:var(--surface-2);color:var(--ink-3)}
.overdue{color:var(--crit);font-weight:700}
.ehead,.erow{display:grid;grid-template-columns:104px 158px 1fr 128px 110px 34px;gap:8px;
  padding:8px 14px;align-items:center}
.ehead{padding:7px 14px;background:var(--surface-2)}
.ehead span{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.erow{border-top:1px solid var(--rule)}
.erow input,.erow select{padding:6px 8px;font-size:13.5px}
.ihead,.irow{display:grid;grid-template-columns:1fr 78px 90px 110px 110px 34px;gap:8px;
  padding:8px 14px;align-items:center}
.ihead{padding:7px 14px;background:var(--surface-2)}
.ihead span{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.irow{border-top:1px solid var(--rule)}
.irow input{padding:6px 8px;font-size:13.5px}
.irow .ln{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:13.5px}
.phead,.prow{display:grid;grid-template-columns:1fr 118px 118px 118px 118px 34px;gap:8px;
  padding:8px 14px;align-items:center}
.phead{padding:7px 14px;background:var(--surface-2)}
.phead span{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.prow{border-top:1px solid var(--rule)}
.prow input,.prow select{padding:6px 8px;font-size:13.5px}
.ledger{display:grid;grid-template-columns:1fr auto auto auto;gap:10px 20px;padding:14px 16px;
  align-items:center;border-top:1px solid var(--rule);font-variant-numeric:tabular-nums}
.ledger .nm{font-weight:700}
.ledger .sub{font-size:12px;color:var(--ink-3);font-weight:400;margin-top:2px}
.ledger .amt{text-align:right;font-weight:700}
.ledger .verdict{font-size:12px;text-align:right;min-width:150px}
@media(max-width:820px){
  .ehead,.ihead,.phead{display:none}
  .erow,.irow,.prow{grid-template-columns:1fr 1fr;gap:6px}
  .ledger{grid-template-columns:1fr auto}
}
.catbar{display:grid;grid-template-columns:190px 1fr 110px;gap:12px;align-items:center;
  padding:5px 16px;font-size:13.5px}
.catbar .b{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.catbar .b i{display:block;height:100%;background:var(--brand)}
.catbar .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
@media(max-width:620px){.catbar{grid-template-columns:1fr auto;gap:4px 10px}.catbar .b{display:none}}

/* ---------- readiness ---------- */
.ready{display:grid;grid-template-columns:14px 1fr auto;gap:12px 14px;padding:12px 16px;
  border-top:1px solid var(--rule);align-items:center}
.ready:first-of-type{border-top:none}
.ready .dot{width:9px;height:9px;border-radius:50%;background:var(--crit);margin-left:3px}
.ready .dot.warn{background:var(--warn)}
.ready .t{font-weight:700;font-size:14px}
.ready .m{font-size:12.5px;color:var(--ink-3);margin-top:2px}
@media(max-width:620px){.ready{grid-template-columns:14px 1fr}.ready button{grid-column:2}}

/* ---------- approvals ---------- */
.astat{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  padding:3px 8px;border-radius:3px;white-space:nowrap;background:var(--surface-2);color:var(--ink-3)}
.astat.not_started{background:var(--surface-2);color:var(--ink-3)}
.astat.preparing{background:var(--surface-2);color:var(--ink-2)}
.astat.submitted{background:var(--info-bg);color:var(--info)}
.astat.in_review{background:var(--warn-bg);color:var(--warn)}
.astat.approved{background:var(--good-bg);color:var(--good)}
.astat.rejected{background:var(--crit-bg);color:var(--crit-ink)}
.astat.expired{background:var(--crit-bg);color:var(--crit-ink)}
.blocks{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:12px 16px;
  border-top:1px solid var(--rule);align-items:center}
.blocks .q{text-align:right;font-weight:700;color:var(--crit);font-variant-numeric:tabular-nums}

.iv-head{display:flex;align-items:flex-start;gap:14pt;margin-bottom:10pt}

.iv-tbl{width:100%;border-collapse:collapse;font-size:8pt;table-layout:fixed;max-width:100%}

.iv-tbl td.c{text-align:center;white-space:nowrap}
.iv-tot{width:56%;margin-left:auto;border-collapse:collapse;margin-top:7pt;font-size:8.4pt}
.iv-tot td{padding:2.4pt 6pt;border:.5pt solid #808080}
.iv-tot td.k{background:#D9E2F3;text-align:right;font-weight:bold}
.iv-tot td.v{text-align:right;font-weight:bold;white-space:nowrap}
.iv-tot tr.grand td{background:#DEEAF6;font-size:9.6pt}
.iv-words{margin-top:6pt;font-size:8pt;font-style:italic}
.iv-foot{margin-top:10pt;font-size:7.8pt;line-height:1.35}

/* ---------- quotation sheet: styles live outside @media print so the
     auto-fit routine can measure the real layout before printing ---------- */
.print-area{display:none;font-family:Arial,Helvetica,sans-serif;color:#000;font-size:7.8pt;line-height:1.2}
.print-area.measuring{display:block !important;position:absolute;left:-99999px;top:0;width:725px}
.pa-head{display:flex;align-items:flex-start;gap:12pt;margin-bottom:7pt}

.pa-logo img{width:100%;height:auto;display:block}
.pa-headright{flex:1;padding-top:2pt}
.pa-title{font-size:13pt;font-weight:bold;color:#2E74B5;text-align:center;margin-bottom:6pt}
.pa-meta{margin:0 auto;border-collapse:collapse}
.pa-meta td{padding:.2pt 5pt;font-size:7.8pt;vertical-align:top}
.pa-meta td.k{font-weight:bold;text-align:right;white-space:nowrap}
.pa-co{color:#C00000;font-weight:bold}
.pa-gap td{height:4pt;padding:0}

.pa-sec{margin-top:5pt}
.pa-tbl{width:100%;border-collapse:collapse;font-size:7.8pt;table-layout:fixed}
.pa-tbl thead{display:table-header-group}
.pa-tbl tr{page-break-inside:avoid}
.pa-tbl td{border:.5pt solid #808080;padding:.7pt 4pt;vertical-align:top;word-wrap:break-word;height:9pt}
.pa-tbl .band td{background:#4472C4;color:#fff;font-weight:bold;font-size:8.6pt;
                 padding:2.4pt 7pt;border:.5pt solid #4472C4;height:auto}
.pa-tbl .cols td{background:#2F5597;color:#fff;font-weight:bold;font-size:7.4pt;white-space:nowrap;
                 padding:1.8pt 4pt;border:.5pt solid #2F5597;text-align:center;height:auto}
.pa-tbl td.n{text-align:right;white-space:nowrap}
.pa-tbl td.c{text-align:center;white-space:nowrap}
.pa-tbl td.hl{background:#FDF2CC;text-align:center;white-space:nowrap}

.pa-tot{width:100%;border-collapse:collapse;margin-top:7pt;table-layout:fixed;font-size:8.2pt}
