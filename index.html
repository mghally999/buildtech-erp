  const UPPER_R = {A:667,B:667,C:722,D:722,E:667,F:611,G:778,H:722,I:278,J:500,K:667,L:556,
    M:833,N:722,O:778,P:667,Q:778,R:722,S:667,T:611,U:722,V:667,W:944,X:667,Y:667,Z:611};
  const LOWER_R = {a:556,b:556,c:500,d:556,e:556,f:278,g:556,h:556,i:222,j:222,k:500,l:222,
    m:833,n:556,o:556,p:556,q:556,r:333,s:500,t:278,u:556,v:500,w:722,x:500,y:500,z:500};
  const widthOf = (ch, bold) => {
    let w = WID_R[ch] ?? UPPER_R[ch] ?? LOWER_R[ch];
    if(w == null) w = 556;
    if(bold){                                     // Helvetica-Bold is wider in a few places
      if(LOWER_R[ch] != null) w = Math.max(w, 556);
      else if(UPPER_R[ch] != null) w = w + 28;
      else if(ch === ' ') w = 278;
    }
    return w;
  };
  const textWidth = (s, size, bold) =>
    String(s==null?'':s).split('').reduce((t,ch)=>t + widthOf(ch,bold), 0) / 1000 * size;

  const newPage = () => {
    if(ops.length) pages.push(ops.join('\n'));
    ops = []; y = H - M.t; pageNo++;
  };
  newPage();

  const need = h => { if(y - h < M.b + 18){ newPage(); return true; } return false; };

  const api = {
    W, H, M,
    get y(){ return y; }, set y(v){ y = v; },
    get page(){ return pageNo; },
    textWidth,
    need,
    gap(h){ y -= h; },
    // one line of text at an absolute x
    text(s, x, size, bold, colour, align, width){
      const str = String(s==null?'':s);
      if(!str) return;
      let tx = x;
      if(align === 'r') tx = x + (width||0) - textWidth(str, size, bold);
      else if(align === 'c') tx = x + ((width||0) - textWidth(str, size, bold))/2;
      const c = colour || [0,0,0];
      ops.push('BT /'+(bold?'F2':'F1')+' '+size+' Tf '+
               c.map(v=>v.toFixed(3)).join(' ')+' rg '+
               tx.toFixed(2)+' '+y.toFixed(2)+' Td ('+enc(str)+') Tj ET');
    },
    // wrapped paragraph, returns the height used
    para(s, x, width, size, bold, colour, lead){
      const words = String(s==null?'':s).split(/\s+/).filter(Boolean);
      const lh = lead || size*1.35;
      let line = '', used = 0;
      const flush = () => { if(!line) return; need(lh); api.text(line, x, size, bold, colour);
                            y -= lh; used += lh; line=''; };
      words.forEach(w=>{
        const t = line ? line+' '+w : w;
        if(textWidth(t, size, bold) > width && line) flush(), line = w;
        else line = t;
      });
      flush();
      return used;
    },
    rule(x1, x2, colour, w){
      const c = colour || [0.72,0.72,0.72];
      ops.push(c.map(v=>v.toFixed(3)).join(' ')+' RG '+(w||0.6)+' w '+
               x1.toFixed(2)+' '+y.toFixed(2)+' m '+x2.toFixed(2)+' '+y.toFixed(2)+' l S');
    },
    box(x, w, h, colour, rise){
      const c = colour || [0.95,0.95,0.94];
      const up = rise == null ? 3 : rise;
      ops.push(c.map(v=>v.toFixed(3)).join(' ')+' rg '+
               x.toFixed(2)+' '+(y-h+up).toFixed(2)+' '+w.toFixed(2)+' '+h.toFixed(2)+' re f');
    },
    build(){
      if(ops.length) pages.push(ops.join('\n'));
      const objs = [];
      const kids = [];
      // 1 catalogue, 2 pages, 3 F1, 4 F2, then content and page objects
      const first = 5;
      pages.forEach((_,i)=>kids.push((first + i*2 + 1)+' 0 R'));
      objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
      objs[2] = '<< /Type /Pages /Count '+pages.length+' /Kids ['+kids.join(' ')+'] >>';
      objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
      objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
      pages.forEach((content,i)=>{
        const cn = first + i*2, pn = cn + 1;
        objs[cn] = '<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream';
        objs[pn] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+
                   '] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+cn+' 0 R >>';
      });
      let out = '%PDF-1.4\n';
      const offs = [];
      for(let i=1;i<objs.length;i++){
        if(!objs[i]) continue;
        offs[i] = out.length;
        out += i+' 0 obj\n'+objs[i]+'\nendobj\n';
      }
      const xref = out.length;
      const max = objs.length;
      out += 'xref\n0 '+max+'\n0000000000 65535 f \n';
      for(let i=1;i<max;i++)
        out += (offs[i]!=null ? String(offs[i]).padStart(10,'0')+' 00000 n \n'
                              : '0000000000 65535 f \n');
      out += 'trailer\n<< /Size '+max+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
      const bytes = new Uint8Array(out.length);
      for(let i=0;i<out.length;i++) bytes[i] = out.charCodeAt(i) & 0xff;
      return new Blob([bytes], {type:'application/pdf'});
    }
  };
  return api;
}

/* A store-only ZIP, so the request and every safety data sheet go across as one file.
   PDFs are already compressed, so leaving the entries stored costs nothing worth having
   and saves pulling in a compression library. */
function miniZip(files){
  const enc = new TextEncoder();
  const crcTable = (()=>{ const t=[]; for(let n=0;n<256;n++){ let c=n;
    for(let k=0;k<8;k++) c = c & 1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
  const crc32 = buf => { let c = 0xFFFFFFFF;
    for(let i=0;i<buf.length;i++) c = crcTable[(c ^ buf[i]) & 0xFF] ^ (c>>>8);
    return (c ^ 0xFFFFFFFF) >>> 0; };

  const parts = [], central = [];
  let offset = 0;
  const u16 = v => [v & 0xff, (v>>>8) & 0xff];
  const u32 = v => [v & 0xff, (v>>>8) & 0xff, (v>>>16) & 0xff, (v>>>24) & 0xff];

  files.forEach(f=>{
    const name = enc.encode(f.name);
    const data = f.data;
    const crc = crc32(data);
    const local = [].concat([0x50,0x4b,0x03,0x04], u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
    parts.push(new Uint8Array(local), name, data);
    central.push([].concat([0x50,0x4b,0x01,0x02], u16(20), u16(20), u16(0), u16(0),
      u16(0), u16(0), u32(crc), u32(data.length), u32(data.length),
      u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)));
    central[central.length-1].name = name;
    offset += local.length + name.length + data.length;
  });

  const cenParts = [];
  let cenLen = 0;
  central.forEach(c=>{ const head = new Uint8Array(c);
    cenParts.push(head, c.name); cenLen += head.length + c.name.length; });
  const end = new Uint8Array([].concat([0x50,0x4b,0x05,0x06], u16(0), u16(0),
    u16(files.length), u16(files.length), u32(cenLen), u32(offset), u16(0)));

  return new Blob([...parts, ...cenParts, end], {type:'application/zip'});
}

const saveBlob = (blob, name) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
};


/* ══════════════ THE FREIGHT REQUEST AS A DOCUMENT ══════════════
   Everything a forwarder needs to price the job, on one file that can be forwarded as it
   stands: who and where, what is being asked for, the cargo, the dangerous goods, the
   packing, and which paperwork exists. Built from the quotation, so it cannot drift from
   the take-off shown on screen. */
const BRAND = [0.227, 0.047, 0.086];      // the burgundy from the logo

function freightRequestPdf({q, client, c, dg, clean, unknown, trans, docs, cfg, cfgNum}){
  const d = miniPdf();
  const L = d.M.l, R = d.W - d.M.r, WIDTH = R - L;
  const n = (v,dp=0)=>Number(v||0).toLocaleString('en-GB',
             {minimumFractionDigits:dp, maximumFractionDigits:dp});

  const H1 = t => { d.need(30); d.text(t, L, 16, true, BRAND); d.y -= 6; d.rule(L, R, BRAND, 1.2); d.y -= 14; };
  const H2 = t => { d.need(26); d.y -= 6; d.text(t, L, 10.5, true, BRAND); d.y -= 5;
                    d.rule(L, R, [0.8,0.78,0.78], 0.7); d.y -= 12; };
  const P  = (t, size) => { d.para(t, L, WIDTH, size||9.2, false, [0.13,0.13,0.13]); d.y -= 4; };

  // a table with a header band, given column widths and alignments
  const table = (cols, rows, opt) => {
    const o = opt || {};
    const size = o.size || 8.4;
    const rowH = size * 1.55;
    const head = () => {
      d.need(rowH + 6);
      d.box(L, WIDTH, rowH + 3, BRAND, size * 0.82 + 2);
      let x = L;
      cols.forEach(col=>{
        d.text(col.h, x + 4, size - 0.4, true, [1,1,1], col.a === 'r' ? 'r' : 'l',
               col.w - 8);
        x += col.w;
      });
      d.y -= rowH + 6;
    };
    head();
    rows.forEach((r, i)=>{
      // wrap every cell first, so the row is as tall as its tallest cell
      const cells = cols.map((col,ci)=>{
        const txt = String(r[ci] == null ? '' : r[ci]);
        const words = txt.split(/\s+/).filter(Boolean);
        const out = []; let line = '';
        words.forEach(w=>{
          const t = line ? line+' '+w : w;
          if(d.textWidth(t, size, false) > col.w - 8 && line){ out.push(line); line = w; }
          else line = t;
        });
        if(line) out.push(line);
        return out.length ? out : [''];
      });
      const lines = Math.max(...cells.map(x=>x.length));
      const h = lines * rowH;
      if(d.need(h + 4)) head();
      if(i % 2 === 1) d.box(L, WIDTH, h, [0.965,0.962,0.958], size * 0.82 + 1.5);
      const isTot = String(r[0]||'').trim().toLowerCase() === 'total';
      if(isTot){ const keep = d.y; d.y = keep + size * 0.82 + 2;
                 d.rule(L, R, [0.55,0.53,0.53], 0.8); d.y = keep; }
      const top = d.y;
      let x = L;
      cols.forEach((col, ci)=>{
        d.y = top;
        cells[ci].forEach(ln=>{
          d.text(ln, x + 4, size, isTot || !!col.b, [0.13,0.13,0.13],
                 col.a === 'r' ? 'r' : 'l', col.w - 8);
          d.y -= rowH;
        });
        x += col.w;
      });
      d.y = top - h;
      d.rule(L, R, [0.88,0.88,0.88], 0.4);
    });
    d.y -= 8;
  };

  // key and value pairs down the page, the fastest thing for a forwarder to scan
  const kv = pairs => {
    const kw = 128;
    pairs.forEach(([k, v])=>{
      if(v == null || v === '') return;
      const words = String(v).split(/\s+/); const out = []; let line = '';
      words.forEach(w=>{ const t = line ? line+' '+w : w;
        if(d.textWidth(t, 9, false) > WIDTH - kw - 6 && line){ out.push(line); line = w; }
        else line = t; });
      if(line) out.push(line);
      const h = out.length * 12.5;
      d.need(h + 2);
      const top = d.y;
      d.text(k, L, 9, true, [0.35,0.33,0.33]);
      d.y = top;
      out.forEach(ln=>{ d.text(ln, L + kw, 9, false, [0.13,0.13,0.13]); d.y -= 12.5; });
      d.y = top - h - 1.5;
    });
    d.y -= 5;
  };

  // ── the head of the document ──────────────────────────────────────────────────
  d.text(cfg('company_legal_name') || cfg('company_name') || 'Build-Tech',
         L, 9.5, true, BRAND);
  d.y -= 12;
  d.text([cfg('company_address'), cfg('company_email'),
          cfg('trade_licence') ? 'Trade licence '+cfg('trade_licence') : null]
           .filter(Boolean).join('   ·   '), L, 8, false, [0.42,0.4,0.4]);
  d.y -= 22;

  H1('Request for freight quotation');
  P('We are moving a consignment of protective coatings and would like your rate. '
    + 'Everything needed to price it is in this document. '
    + (dg.length ? 'Part of the load is dangerous goods and part of it is not, so please '
                 + 'read the dangerous goods section before you quote.' : ''));
  d.y -= 4;

  H2('1. The shipment');
  kv([
    ['Our reference', q.reference + (q.revision ? ' ' + q.revision : '')],
    ['Date', fmtDate(today())],
    ['Collection', cfg('supplier_address') || 'Krypton Chemical S.L., Hospitalet de l’Infant, Tarragona, Spain'],
    ['Delivery', (client?.location || q.location || 'Dubai, UAE')],
    ['Consignee', cfg('company_legal_name') || cfg('company_name')],
    ['Incoterm', 'To be agreed. Please quote ex works and FOB.'],
    ['Packages', n(c.pails) + ' pails and kits' + (c.rolls ? ', ' + n(c.rolls) + ' rolls' : '')],
    ['Pallets', n(c.pallets) + ', standard euro pallets, shrink wrapped'],
    ['Net weight', n(c.net) + ' kg'],
    ['Gross weight', n(c.gross) + ' kg'],
    ['Volume', n(c.vol, 2) + ' cbm'],
    ['Chargeable', n(c.chargeable, 2) + ' W/M by sea. By air the actual gross of '
      + n(c.gross) + ' kg governs unless the volumetric figure of '
      + n(c.vol * 1000000 / 6000) + ' kg is higher.'],
  ]);
  P('Pallet count and volume are our estimate at ' + cfgNum('pails_per_pallet', 24)
    + ' pails to a pallet, and gross weight adds ' + (cfgNum('pack_tare_pct', 0.11)*100).toFixed(0)
    + ' per cent for tare. Confirm against the manufacturer’s packing list before the '
    + 'booking is firm.', 8.2);

  H2('2. The cargo');
  table(
    [{h:'Product', w:118, b:true}, {h:'Pack', w:96}, {h:'Packages', w:56, a:'r'},
     {h:'Net kg', w:56, a:'r'}, {h:'Gross kg', w:58, a:'r'},
     {h:'HS code', w:62}, {h:'Classification', w:69}],
    c.rows.map(r=>{
      const t = trans[r.product.id] || {};
      return [r.product.name, r.pack, n(r.packs), n(r.net), n(r.gross),
              r.product.hs_code || 'to confirm',
              t.un_numbers ? (t.un_numbers + ' cl.' + (t.un_classes||'') +
                              (t.worst_packing_group ? ' PG ' + t.worst_packing_group : ''))
                           : (t.classified_components ? 'Not regulated' : 'not yet read')];
    }).concat([['Total','', n(c.pails + c.rolls), n(c.net), n(c.gross), '', '']]));
  P('Where an HS code reads "to confirm" it is with the shipper and will follow before the '
    + 'customs entry. It is not needed to price the freight.', 8.2);

  // ── dangerous goods ───────────────────────────────────────────────────────────
  H2('3. Dangerous goods');
  if(dg.length){
    table(
      [{h:'Item', w:150, b:true}, {h:'UN', w:70}, {h:'Class', w:52},
       {h:'Packing group', w:88}, {h:'Marine pollutant', w:105}],
      dg.map(x=>[x.name, x.un, x.cls, x.pg || '', x.mp ? 'Yes' : 'No']));
    const dgKg = c.rows.filter(r=>trans[r.product.id]?.un_numbers)
                       .reduce((t,r)=>t + Number(r.gross||0), 0);
    const okKg = Number(c.gross||0) - dgKg;
    P('Not all of this is dangerous goods. Of ' + n(c.gross) + ' kg gross, ' + n(dgKg)
      + ' kg is regulated and ' + n(okKg) + ' kg is not. Please apply any dangerous goods '
      + 'surcharge to the regulated portion only, and show how it has been worked out.');
  } else {
    P('Nothing on this consignment is classified as dangerous goods.');
  }
  if(clean.length)
    P('Read and found not to be dangerous: ' + clean.map(r=>r.product.name).join(', ')
      + '. Section 14 of each safety data sheet states transport is not regulated.', 8.6);
  if(unknown.length)
    P('NOT YET CLASSIFIED, and a forwarder will need this before booking: '
      + unknown.map(r=>r.product.name).join(', ') + '. We are obtaining the safety data '
      + 'sheets from the manufacturer.', 8.6);

  H2('4. What we would like quoted');
  [ 'Sea LCL from the port of loading to Jebel Ali, and separately to your Dubai CFS.',
    'Air freight, door to door, on the same cargo.',
    'Door delivery in Dubai as a separate line, so we can see it against port collection.',
    'Origin charges, freight, destination charges and customs clearance, itemised. Please do not send a single all-in figure.',
    'Any dangerous goods surcharge shown as its own line.',
    'Transit time, sailing or flight frequency, and how long the rate holds.'
  ].forEach((t,i)=>{ d.need(14);
    d.text(String(i+1)+'.', L, 9.2, true, [0.13,0.13,0.13]);
    d.para(t, L+16, WIDTH-16, 9.2, false, [0.13,0.13,0.13]); d.y -= 2; });
  d.y -= 4;
  P('We ship from this origin several times a year, so please treat this as the first of a '
    + 'series rather than a one-off.');

  H2('5. Paperwork');
  if(docs && docs.length){
    P('Attached to this request, one for every item that needs one:');
    docs.forEach(x=>{ d.need(12);
      d.text('·  ' + x, L + 4, 8.8, false, [0.13,0.13,0.13]); d.y -= 12; });
    d.y -= 6;
  }
  if(unknown.length)
    P('Still to obtain: a safety data sheet for ' + unknown.map(r=>r.product.name).join(', ')
      + '.', 8.8);
  P('Air carriage of the regulated items needs a Shipper’s Declaration for Dangerous '
    + 'Goods signed by a trained person. That is issued by the manufacturer at origin, not '
    + 'by us, and IATA packing instructions differ from sea packing. Please tell us which '
    + 'packing instruction applies to each UN number at the pack sizes above, and whether '
    + 'our pails are acceptable as they stand.', 8.8);

  H2('6. Contact');
  kv([
    ['Company', cfg('company_legal_name') || cfg('company_name')],
    ['Trade licence', cfg('trade_licence')],
    ['Address', cfg('company_address')],
    ['Email', cfg('company_email')],
  ]);

  d.y -= 6;
  d.rule(L, R, [0.8,0.8,0.8], 0.5);
  d.y -= 12;
  d.para('Quantities are worked out of quotation ' + q.reference + ' and rounded up to whole '
    + 'packs. This document is a request for a rate and is not an order.',
    L, WIDTH, 7.6, false, [0.45,0.43,0.43]);

  return d.build();
}

/* ══════════════ CORRESPONDENCE (shared) ══════════════
   What was agreed, and with whom. It was in the original brief and never got a screen, so
   every decision lived on a phone. Hangs off a client, a quotation or an order. */
const CHANNELS=[['whatsapp','WhatsApp'],['call','Call'],['email','Email'],
                ['meeting','Meeting'],['site','Site visit'],['other','Other']];
const chLabel=v=>(CHANNELS.find(x=>x[0]===v)||[v,v||'Note'])[1];

function CorrespondencePanel({clientId,quotationId,poId,heading}){
  const [rows,setRows]=useState(null); const [err,setErr]=useState('');
  const [f,setF]=useState({channel:'whatsapp',direction:'out',who:'',summary:'',
                           occurred_at:today(),follow_up_on:''});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const [busy,setBusy]=useState(false);

  const key = clientId ? ['client_id',clientId]
            : quotationId ? ['quotation_id',quotationId]
            : ['po_id',poId];

  const load=useCallback(async()=>{
    if(!key[1]){ setRows([]); return; }
    const {data,error}=await sb.from('correspondence').select('*')
      .eq(key[0],key[1]).order('occurred_at',{ascending:false});
    if(error) setErr(error.message);
    setRows(data||[]);
  },[key[0],key[1]]);
  useEffect(()=>{load();},[load]);

  const add=async()=>{
    setErr('');
    if(!f.summary.trim()) return setErr('Write what was said or agreed.');
    setBusy(true);
    const row={channel:f.channel, direction:f.direction, who:f.who.trim()||null,
               summary:f.summary.trim(),
               occurred_at:new Date(f.occurred_at+'T12:00:00').toISOString(),
               follow_up_on:f.follow_up_on||null};
    row[key[0]]=key[1];
    const {error}=await sb.from('correspondence').insert(row);
    setBusy(false);
    if(error) return setErr(error.message);
    setF(p=>({...p,summary:'',follow_up_on:''}));
    load();
  };
  const del=async(r)=>{
    if(!confirm('Remove this entry?')) return;
    await sb.from('correspondence').delete().eq('id',r.id); load();
  };

  if(!key[1]) return null;
  const due=(rows||[]).filter(r=>r.follow_up_on && r.follow_up_on<=today());

  return html`
    <div class="panel">
      <div class="panel-head"><h2>${heading||'What was said'}</h2>
        <span class="sp muted">${rows?rows.length:0} ${plural(rows?rows.length:0,'entry','entries')}${
          due.length?', '+due.length+' to follow up':''}</span></div>
      ${err && html`<div class="err" style=${{margin:'10px 14px'}}>${err}</div>`}
      ${rows===null ? html`<div class="spinner"></div>`
        : rows.length ? html`<div>${rows.map(r=>html`
          <div class="corr" key=${r.id}>
            <div class=${'corr-ch '+(r.direction==='in'?'inb':'outb')}>
              ${chLabel(r.channel)}<span>${r.direction==='in'?'in':'out'}</span></div>
            <div>
              <div class="t">${r.summary}</div>
              <div class="m">${fmtDate((r.occurred_at||'').slice(0,10))}${
                r.who?' · '+r.who:''}${
                r.follow_up_on?' · follow up '+fmtDate(r.follow_up_on):''}</div>
            </div>
            <button class="xbtn" onClick=${()=>del(r)}>×</button>
          </div>`)}</div>`
        : html`<div class="empty">Nothing recorded. Every agreement that only exists in a
            WhatsApp thread is one nobody else can find.</div>`}
      <div class="panel-body" style=${{borderTop:'1px solid var(--rule)'}}>
        <div class="field"><label>${_t("What was said or agreed")}</label>
          <textarea placeholder="Lex confirmed we may offer equivalents where there is no exact match"
            value=${f.summary} onInput=${e=>set('summary',e.target.value)}></textarea></div>
        <div class="grid2">
          <div class="field"><label>${_t("How")}</label>
            <select value=${f.channel} onChange=${e=>set('channel',e.target.value)}>
              ${CHANNELS.map(([v,l])=>html`<option key=${v} value=${v}>${l}</option>`)}</select></div>
          <div class="field"><label>${_t("Which way")}</label>
            <select value=${f.direction} onChange=${e=>set('direction',e.target.value)}>
              <option value="out">${_t("We said it")}</option>
              <option value="in">${_t("They said it")}</option></select></div>
          <div class="field"><label>${_t("Who, at their end")}</label>
            <input type="text" placeholder="${_t("Engr. Lex")}" value=${f.who}
                   onInput=${e=>set('who',e.target.value)}/></div>
          <div class="field"><label>${_t("When")}</label>
            <input type="date" value=${f.occurred_at} onInput=${e=>set('occurred_at',e.target.value)}/></div>
          <div class="field"><label>${_t("Follow up on, optional")}</label>
            <input type="date" value=${f.follow_up_on} onInput=${e=>set('follow_up_on',e.target.value)}/></div>
        </div>
        <button class="btn sec" onClick=${add} disabled=${busy}>${busy?'Saving…':'Record it'}</button>
      </div>
    </div>`;
}

/* ══════════════ PURCHASE ORDERS ══════════════
   The buy side. Before this the chain ran quotation, project, materials needed, and then
   stopped: a shipment appeared later with no link to what was ordered, and stock after
   that with no link to the shipment. An order is a commitment, not a cost, so it stays
   out of Money out and out of the partner ledger until the supplier invoices. */
const POSTATUS=[['draft','Draft'],['pending_approval','Waiting for approval'],
                ['approved','Approved'],['sent','Sent'],['confirmed','Confirmed'],
                ['part','Part received'],['received','Received'],['cancelled','Cancelled']];
const poLabel=v=>(POSTATUS.find(x=>x[0]===v)||[v,v])[1];
const poPill=v=>v==='received'?'won':v==='cancelled'?'lost'
              :v==='part'||v==='pending_approval'?'quoted':v==='draft'?'lost':'inquiry';
const PO_DOC_TYPES=[['proforma','Proforma invoice'],['order','Our purchase order'],
                    ['invoice','Supplier invoice'],['packing','Packing list'],
                    ['email','Email or message'],['other','Other']];

function Orders({rate,focus,clearFocus}){
  const [rows,setRows]=useState(null); const [tot,setTot]=useState({});
  const [open,setOpen]=useState(null); const [neu,setNeu]=useState(false);
  const [quotes,setQuotes]=useState([]); const [projects,setProjects]=useState([]);
  const [whs,setWhs]=useState([]); const [err,setErr]=useState('');
  const [view,setView]=useState('all');   // which orders the list shows
  useEffect(()=>{ if(focus){
    if(focus==='new') setNeu(true);
    // "new:<quotation id>" is the shipping request asking for an order off that quotation
    else if(typeof focus==='string' && focus.startsWith('new:')) setNeu({quotation_id:focus.slice(4)});
    else setOpen(focus);
    clearFocus&&clearFocus(); } },[focus]);

  const load=useCallback(async()=>{
    const [po,tt,qt,pj,wh]=await Promise.all([
      sb.from('purchase_orders').select('*, quotations(reference), projects(name)')
        .order('created_at',{ascending:false}),
      sb.from('purchase_order_totals').select('*'),
      sb.from('quotations').select('id,reference,project_name').order('created_at',{ascending:false}),
      sb.from('projects').select('id,name').order('name'),
      sb.from('warehouses').select('id,name').eq('is_active',true).order('name')]);
    const e=po.error||tt.error; if(e) setErr(e.message);
    const m={}; (tt.data||[]).forEach(t=>m[t.po_id]=t);
    setRows(po.data||[]); setTot(m); setQuotes(qt.data||[]);
    setProjects(pj.data||[]); setWhs(wh.data||[]);
  },[]);
  useEffect(()=>{load();},[load]);
  if(!rows) return html`<div class="spinner"></div>`;

  if(open) return html`<${OrderPage} id=${open} rate=${rate} whs=${whs}
    quotes=${quotes} projects=${projects}
    back=${()=>{setOpen(null);load();}}/>`;

  const live=rows.filter(r=>!['received','cancelled'].includes(r.status));
  const onOrder=live.reduce((s,r)=>s+nz(tot[r.id]?.value_aed),0);
  const late=live.filter(r=>r.expected_on && r.expected_on<today());
  const waiting=rows.filter(r=>r.status==='pending_approval');
  const VIEWS=[['all','All'],
               ['pending','Waiting for approval'+(waiting.length?' ('+waiting.length+')':'')],
               ['open','Open'],['received','Received']];
  const shown=rows.filter(r=>view==='pending' ? r.status==='pending_approval'
                           : view==='open'    ? !['received','cancelled'].includes(r.status)
                           : view==='received'? r.status==='received' : true);

  return html`
    ${err && html`<div class="err">${err}</div>`}
    <div class="page-head"><h1>${_t("Orders")}</h1>
      <button class="btn sp" onClick=${()=>setNeu(true)}>${_t("New order")}</button></div>

    <div class="cards">
      <div class="card"><div class="k">On order</div><div class="v">${AED0(onOrder,'AED')}</div>
        <div class="s">${live.length} ${plural(live.length,'order')} not yet fully received</div></div>
      <div class=${'card '+(late.length?'alert':'okc')}><div class="k">Past the date</div>
        <div class="v">${late.length}</div>
        <div class="s">${late.length?'Chase the supplier':'Nothing overdue'}</div></div>
      <div class="card"><div class="k">Orders</div><div class="v">${rows.length}</div>
        <div class="s">${rows.filter(r=>r.status==='received').length} fully received</div></div>
    </div>

    <div class="subnav">
      ${VIEWS.map(([k,l])=>html`<button key=${k} class=${view===k?'on':''}
        onClick=${()=>setView(k)}>${l}</button>`)}
    </div>

    <div class="panel">
      <div class="panel-head"><h2>${_t("Purchase orders")}</h2>
        <span class="sp muted">Newest first</span></div>
      ${shown.length ? html`<div class="tw"><table>
        <thead><tr><th>${_t("Order")}</th><th>${_t("Supplier")}</th><th>${_t("For")}</th><th>${_t("Status")}</th>
          <th class="n">${_t("Value")}</th><th class="n">${_t("Received")}</th><th>${_t("Expected")}</th>
          <th class="n">${_t("Files")}</th></tr></thead>
        <tbody>${shown.map(r=>{const t=tot[r.id]||{};
          return html`<tr key=${r.id} class="clickable" onClick=${()=>setOpen(r.id)}>
            <td><b>${r.reference}</b>${r.supplier_ref?html`<div class="m muted">${r.supplier_ref}</div>`:null}</td>
            <td class="muted">${r.supplier}</td>
            <td class="muted">${r.quotations?.reference||r.projects?.name||'—'}</td>
            <td><span class=${'pill '+poPill(r.status)}>${poLabel(r.status)}</span></td>
            <td class="n">${AED0(t.value_aed,'AED')}</td>
            <td class=${'n '+(nz(t.received_pct)>=100?'':'muted')}>${nz(t.received_pct).toFixed(0)}%</td>
            <td class=${'muted '+(r.expected_on&&r.expected_on<today()&&!['received','cancelled'].includes(r.status)?'short':'')}>
              ${fmtDate(r.expected_on)||'—'}</td>
            <td class="n muted">${t.document_count||0}</td>
          </tr>`;})}</tbody></table></div>`
        : rows.length ? html`<div class="empty">${view==='pending'
            ? 'Nothing is waiting for approval.' : 'Nothing to show under this filter.'}</div>`
        : html`<div class="empty">No orders yet. "New order" creates one, and it can be built
            straight from a quotation so the quantities come off the take-off rather than
            being typed again.</div>`}
    </div>

    ${neu && html`<${NewOrderModal} quotes=${quotes} projects=${projects} whs=${whs} rate=${rate} seed=${neu}
      close=${()=>setNeu(false)}
      saved=${id=>{setNeu(false);load();setOpen(id);}}/>`}`;
}

/* A database that has not had a migration run on it complains about a column nobody has
   heard of. That is a fixable thing, but only if the message says which file to run, so the
   columns each migration adds are named here and the complaint is translated. */
const MIGRATION_OF = {
  packs:'0058', pack_label:'0058', list_price:'0058', discount_pct:'0058',
  weight_kg:'0058', hs_code:'0058', is_costing:'0057',
  price_mode:'0056', price_target:'0056', discount_amount:'0056', discount_label:'0056'
};
function dbWhy(msg){
  const m = String(msg||'');
  const col = Object.keys(MIGRATION_OF).find(c =>
    new RegExp("(column|field)[^a-z0-9]{0,4}[\"']?(\\w+\\.)?" + c + "\\b", 'i').test(m)
    || new RegExp("'" + c + "'", 'i').test(m));
  if(col) return m + ' — this database has not had migration ' + MIGRATION_OF[col]
                   + ' run on it yet. Run it in Supabase and try again.';
  return m;
}

/* Build an order from a quotation, so the quantities come off the same take-off the
   shipping request uses rather than being typed a second time. */
function NewOrderModal({quotes,projects,whs,rate,close,saved,seed}){
  // opened from a shipping request, the form starts on that quotation with its take-off
  const [f,setF]=useState({supplier:'Krypton Chemical S.L.',supplier_ref:'',
    quotation_id:(seed&&seed.quotation_id)||'',
    project_id:'',warehouse_id:whs[0]?.id||'',expected_on:'',currency:'EUR',fromQuote:true});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const [busy,setBusy]=useState(false); const [err,setErr]=useState('');
  const [preview,setPreview]=useState(null);
  // The take-off is a starting point, not a verdict. Charles knows the products better than
  // any consumption figure printed on a data sheet, so every count and pack on this list can
  // be changed here, and the money follows what is on screen.
  const [lines,setLines]=useState([]);
  const [cat,setCat]=useState([]);
  const [rollKg,setRollKg]=useState(9);   // what one roll weighs, from Settings
  /* The supply discount and the euro rate, which the line table needs whether or not the
     order came off a quotation. Without a quotation there is no take-off to read them
     from, and a line priced at nothing would have been written down as costing nothing. */
  const [cfg,setCfg]=useState({disc:0.70,fx:4.27});
  /* An order with nothing on it is nearly always a mistake, and it burnt a reference the
     one time it happened. But not always: an order whose paper is on the way is sometimes
     created first and read into afterwards. So it is asked twice rather than refused. */
  const [armEmpty,setArmEmpty]=useState(false);
  const [adding,setAdding]=useState('');
  // "off a quotation" only counts once a quotation has actually been chosen
  const useQuote=f.fromQuote && !!f.quotation_id;

  /* The catalogue and the settings, loaded as soon as the modal opens. An order typed by
     hand needs both, and it used to have neither, so the only way to get lines onto an
     order was to have a quotation to work them out of. */
  useEffect(()=>{(async()=>{
    const [c,st]=await Promise.all([
      sb.from('products').select('*, product_packs(*), product_aliases(alias)'),
      sb.from('settings').select('*')]);
    const cfgNum=(k,d)=>settingNumber(((st.data||[]).find(x=>x.key===k)||{}).value, d);
    setCat(c.data||[]);
    setRollKg(cfgNum('roll_kg',9));
    setCfg({disc:cfgNum('supply_discount',0.70), fx:cfgNum('eur_aed_rate',4.27)});
  })();},[]);

  // work the cargo out of the chosen quotation, the same way the shipping request does
  useEffect(()=>{(async()=>{
    setPreview(null);
    if(!f.quotation_id || !f.fromQuote) return;
    const [sec,cat,st]=await Promise.all([
      sb.from('quotation_sections')
        .select('*, quotation_lines(*)').eq('quotation_id',f.quotation_id).order('position'),
      sb.from('products').select('*, product_packs(*), product_aliases(alias)'),
      sb.from('settings').select('*')]);
    /* normaliseSection, exactly as the quotation editor reads it: the first line with a
       rate prices the section and everything under it is build-up. Without this the
       products sat on ordinary priced lines, the take-off found no products, and the
       order came back saying there was nothing to order. */
    const secs=(sec.data||[]).map(s=>({...s,lines:normaliseSection((s.quotation_lines||[])
      .slice().sort((a,b)=>(a.position||0)-(b.position||0)))}));
    const cfgNum=(k,d)=>settingNumber(((st.data||[]).find(x=>x.key===k)||{}).value, d);
    const c=cargoFromQuotation(secs,cat.data||[],cfgNum);
    // a roll's weight is a setting, not a property of the pack, and the order needs it to
    // write a weight against a line measured in square metres
    setRollKg(cfgNum('roll_kg', 9));
    setCat(cat.data||[]);
    setPreview(c);
    /* name, sup, kg and list start empty, which means "follow the take-off". They fill in
       only when somebody types over them, and from then on they are what the order says. */
    setLines(c.rows.map((r,i)=>({key:'r'+i, product:r.product, packId:r.packId,
                                 packs:r.packs, required:nz(r.required), unit:r.packUnit,
                                 name:null, packLabel:null, sup:'', kg:'', list:'',
                                 perkg:'', amt:''})));
  })();},[f.quotation_id,f.fromQuote]);

  // ── the arithmetic behind an edited line ──────────────────────────────────────
  /* Everything on a line has two values: what the take-off worked out, and what Charles
     typed over it. The typed one always wins, and it wins on its own: changing the pack
     count still moves a quantity he has not touched, but never moves one he has. That is
     why these read a field that is '' when nothing has been typed rather than carrying the
     computed figure in state, where an edit somewhere else would quietly overwrite it. */
  const typed     = v => v !== '' && v != null && isFinite(Number(v));
  const packsOf   = p => ((p&&p.product_packs)||[]).filter(k=>!k.is_poa);
  const isArea    = k => /m2|m²/i.test((k&&k.unit)||'');
  const packQty   = k => isArea(k) ? rollM2(k) : (Number(k&&k.pack_qty)||0);
  const eurPerUnit= k => nz(k&&k.eur_per_unit) || (packQty(k) ? nz(k.eur_total)/packQty(k) : 0);
  /* A line is on a catalogue pack only while it says so. The moment somebody names their
     own pack, there is no catalogue pack behind the line and every figure on it is theirs. */
  const packOf    = l => { if(!l.packId) return null;
                           const ps=packsOf(l.product);
                           return ps.find(x=>x.id===l.packId) || ps[0] || null; };
  const nameOf    = l => (l.name != null ? l.name : ((l.product&&l.product.name)||''));
  const unitOf    = l => { const k=packOf(l); if(k) return isArea(k)?'m²':'kg';
                           return packSize(l.packLabel).unit || l.unit || 'kg'; };
  const labelOf   = l => { const k=packOf(l);
                           return k ? (k.label||'') : (l.packLabel!=null?l.packLabel:''); };
  /* How much material one pack carries. A catalogue pack says so. A typed line does not,
     but Krypton names their packs the way they mean them, so "12 kg pail" is twelve kilos
     a pail and ten of them is 120 kg without anybody working it out. Anything the label
     does not say stays at nothing and is typed. */
  const packSize = txt => {
    const m = String(txt||'').match(/(\d+(?:[.,]\d+)?)\s*(kg|kgs|l|ltr|litres?|m²|m2)\b/i);
    if(!m) return { qty:0, unit:'' };
    return { qty:Number(String(m[1]).replace(',','.')),
             unit:/m²|m2/i.test(m[2]) ? 'm²' : 'kg' };
  };
  const perPackOf = l => { const k=packOf(l);
                           return k ? packQty(k) : packSize(l.packLabel).qty; };
  const supDef    = l => perPackOf(l) * nz(l.packs);
  const suppliedOf= l => typed(l.sup) ? Number(l.sup) : supDef(l);
  // Krypton's list price for one pack, before the supply discount
  const listDef   = l => { const k=packOf(l); if(!k) return 0;
                           return round2(nz(k.eur_total) || eurPerUnit(k)*packQty(k)); };
  const listOf    = l => typed(l.list) ? Number(l.list) : listDef(l);
  // what a line weighs. Resin is sold by the kilo so the quantity is the weight; a roll is
  // sold by the square metre and weighs whatever Settings says a roll weighs.
  const kgDef     = l => unitOf(l)==='m²' ? nz(rollKg)*nz(l.packs) : suppliedOf(l);
  const kgOf      = l => typed(l.kg) ? Number(l.kg) : kgDef(l);
  /* Krypton's own paper reads across: quantity, unit price, weight, price per kilo, amount.
     Every one of those is a box, and the last thing touched is the one that wins.

       amount    is the quantity times the unit price, less the supply discount, unless
                 somebody typed an amount, or typed a price per kilo to work it from
       per kilo  is the amount over the weight, unless somebody typed it

     Typing the quantity or the unit price clears a typed amount, so the line goes back to
     multiplying out; that is done in the boxes themselves, not here. Nothing here refers
     back to anything below it, so there is no circle to fall into. */
  const supDisc   = preview ? nz(preview.supplyDiscount) : nz(cfg.disc);
  const fxRate    = preview ? nz(preview.fx) : nz(cfg.fx);
  const eurDef    = l => listOf(l) * nz(l.packs) * (1 - supDisc);
  const eurOf     = l => typed(l.amt)   ? Number(l.amt)
                       : typed(l.perkg) ? Number(l.perkg) * kgOf(l)
                       : eurDef(l);
  const perKgOf   = l => typed(l.perkg) ? Number(l.perkg)
                       : (kgOf(l) > 0 ? eurOf(l)/kgOf(l) : 0);
  const aedOf     = l => eurOf(l) * fxRate;
  const ordered   = lines.reduce((t,l)=>t+aedOf(l),0);
  // a line counts as real once it has something on it. A blank one typed by mistake and
  // left blank is not an order line.
  const liveLines = lines.filter(l => nz(l.packs)>0 || suppliedOf(l)>0);

  const setLine=(key,patch)=>setLines(ps=>ps.map(l=>l.key===key?{...l,...patch}:l));
  const dropLine=key=>setLines(ps=>ps.filter(l=>l.key!==key));
  /* Typing a name that is in the catalogue links the line to the product, so receiving it
     still puts the right material into stock. Typing anything else is allowed and carried
     as written, because Krypton sells things this catalogue has never heard of. An existing
     link is only ever replaced by another product, never dropped, so re-wording a line the
     take-off found does not quietly disconnect it from stock. */
  const matchProduct = txt => {
    const s = String(txt||'').trim().toLowerCase(); if(!s) return null;
    const norm = x => String(x||'').trim().toLowerCase();
    return (cat||[]).find(p=>norm(p.name)===s)
        || (cat||[]).find(p=>((p.product_aliases||[]).some(a=>norm(a.alias)===s)))
        || null;
  };
  const setName=(l,txt)=>{
    const hit=matchProduct(txt);
    const patch={name:txt};
    if(hit && (!l.product || hit.id!==l.product.id)){
      patch.product=hit;
      const k=packsOf(hit).slice().sort((a,b)=>packQty(b)-packQty(a))[0];
      if(k){ patch.packId=k.id; patch.unit=isArea(k)?'m²':'kg'; }
    }
    setLine(l.key,patch);
  };
  /* The pack is typed too. Krypton sells Primer Epoxy 100 in sizes our catalogue has never
     been told about, and being offered a choice of two wrong ones is worse than a blank box.
     Typing a name we do hold picks that pack up with its price; typing anything else leaves
     the line standing where it is rather than dropping its figures to nothing. */
  const setPack=(l,txt)=>{
    const norm=x=>String(x||'').trim().toLowerCase();
    const hit=packsOf(l.product).find(k=>norm(k.label)===norm(txt));
    const patch={packLabel:txt, packId:hit?hit.id:''};
    /* Naming your own pack must not drop the line's figures to nothing, so what is on it
       is frozen as it stands. Only what is worth keeping, though: freezing a zero, which
       is what a line has before anything has been typed into it, would leave a box that
       never fills in again however much else is typed. */
    if(!hit){
      if(!typed(l.list) && listOf(l)>0) patch.list=String(round2(listOf(l)));
      if(!typed(l.kg)   && kgOf(l)>0)   patch.kg  =String(round2(kgOf(l)));
      // "20 kg pail" says how much is in it. A name that does not say keeps what was there.
      if(!typed(l.sup) && !packSize(txt).qty && suppliedOf(l)>0)
        patch.sup=String(round2(suppliedOf(l)));
    }
    setLine(l.key,patch);
  };
  const addLine=pid=>{
    const p=(cat||[]).find(x=>x.id===pid); if(!p) return;
    // biggest pack first, because that is what anybody buying by the pallet would pick
    const k=packsOf(p).slice().sort((a,b)=>packQty(b)-packQty(a))[0];
    if(!k) return setErr(p.name+' has no priced pack, so it cannot be ordered yet.');
    setLines(ps=>[...ps,{key:'m'+Date.now(), product:p, packId:k.id, packs:1,
                         required:0, unit:isArea(k)?'m²':'kg',
                         name:null, packLabel:null, sup:'', kg:'', list:'',
                         perkg:'', amt:''}]);
    setAdding('');
  };
  // a line for something that is not in the catalogue at all
  const addTyped=()=>{ setErr('');
    setLines(ps=>[...ps,{key:'t'+Date.now(), product:null, packId:'', packs:1,
                         required:0, unit:'kg',
                         name:'', packLabel:'', sup:'', kg:'', list:'',
                         perkg:'', amt:''}]); };

  const save=async()=>{
    setErr('');
    // Creating the order before the take-off has finished used to make an empty order with a
    // reference burnt on it, which is how PO-0003 came to exist with nothing on it. The button
    // is disabled while it works, and this is the belt to that pair of braces.
    if(useQuote && preview===null)
      return setErr('The take-off is still being worked out. Give it a second.');
    if(!liveLines.length && !armEmpty){
      setArmEmpty(true);
      return setErr('This order would have nothing on it. Add a product under "What gets '
        +'ordered", or press Create order again to make it empty and read a proforma into '
        +'it on the next screen.');
    }
    // a line with no description cannot be sent to anybody, so it is said now rather than
    // written as a blank row on Krypton's order
    if(liveLines.some(l=>!nameOf(l).trim()))
      return setErr('One of the lines has no description. Type what it is, or take it off.');
    /* A line worth money with nothing to receive would be written down as worth nothing,
       because what a line comes to is the quantity times the price. Better said here than
       discovered when the order value comes out short. */
    if(liveLines.some(l=>eurOf(l)>0 && !(suppliedOf(l)>0)))
      return setErr('One of the lines has a price but no quantity. Type how many kilos or '
        +'square metres it is, so the warehouse has something to receive.');
    setBusy(true);
    const {data:ref,error:e0}=await sb.rpc('next_po_reference');
    if(e0){setBusy(false);return setErr(e0.message);}
    const {data,error}=await sb.from('purchase_orders').insert({
      reference:ref, supplier:f.supplier.trim()||'Krypton Chemical S.L.',
      supplier_ref:f.supplier_ref.trim()||null,
      quotation_id:f.quotation_id||null, project_id:f.project_id||null,
      warehouse_id:f.warehouse_id||null, expected_on:f.expected_on||null,
      currency:f.currency, eur_aed_rate:rate, status:'draft'}).select().single();
    if(error){setBusy(false);return setErr(error.message);}

    // what goes on the order is what is on the screen, edits and all
    if(lines.length){
      /* An order to Krypton is an order for PACKS. Their proforma reads "I BT MAX B1K
         25KG, 91, 282,50, 70%, 2.275,00 kg", not "2,275 kg of resin", and an order that
         cannot be laid beside their paper and read down the column is an order somebody
         has to retype. So the line is the pack: how many, their list price for it, the
         discount, and what it weighs.

         unit_price stays the NET price, list less discount, because that is what we
         actually pay and what line_total is worked out from. */
      /* Krypton reads packs: "I BT MAX B1K 25KG, 91". A warehouse holds kilos. Both go on
         the line, and neither is derived from the other at read time, so the order can be
         laid beside their proforma AND receiving can put the right weight into stock.
         qty_ordered and unit_price stay in kilos and square metres, exactly as before, so
         line_total, receiving and every stock movement keep meaning what they meant. */
      /* Every figure here is read off the screen rather than worked out again, because the
         screen is where the corrections were made. unit_price is the one exception, and it
         is not a second opinion: it is the amount divided by the quantity, so line_total,
         which the database works out from those two, comes to the amount that was shown. */
      const disc0 = supDisc * 100;
      const rows=liveLines.map((l,i)=>{
        const qty  = Math.round(suppliedOf(l)*1000)/1000;
        const amt  = eurOf(l);
        const kg   = kgOf(l);
        /* Three numbers on Krypton's order have to agree with each other: the packs, the
           list price and the discount must multiply out to the amount. They do on their
           own until somebody types an amount that says otherwise, and then the discount is
           whatever those figures imply rather than the one in Settings. Where no discount
           can express it, because the amount is above the list, the list price becomes the
           amount over the packs and the discount is nothing. */
        let list = round2(listOf(l)), disc = disc0;
        const packs = Math.round(nz(l.packs)*1000)/1000;
        if(packs>0 && list>0){
          const implied = (1 - amt/(packs*list))*100;
          if(implied >= 0 && implied < 100) disc = Math.round(implied*100)/100;
          else { list = round2(amt/packs); disc = 0; }
        }
        return {po_id:data.id, position:i+1,
                product_id:(l.product&&l.product.id)||null,
                description:nameOf(l).trim(), unit:unitOf(l),
                packs:packs,
                pack_label:labelOf(l).trim()||null,
                hs_code:(l.product&&l.product.hs_code)||null,
                qty_ordered:qty,
                list_price:list,
                discount_pct:disc,
                unit_price:qty>0 ? Math.round(amt/qty*10000)/10000 : 0,
                weight_kg:kg ? Math.round(kg*1000)/1000 : null};
      });
      const {error:e2}=await sb.from('purchase_order_lines').insert(rows);
      if(e2){
        /* The order and its lines are one thing. Writing the order and then failing on the
           lines used to leave a reference burnt on an order with nothing on it, which is
           how PO-0003 came about, and the message saying why was at the top of a modal
           already scrolled past. So the order is taken back out and the reason is said
           beside the button that was pressed. */
        await sb.from('purchase_orders').delete().eq('id',data.id);
        setBusy(false);
        return setErr('Nothing was ordered: '+dbWhy(e2.message));
      }
    }
    setBusy(false); saved(data.id);
  };

  return html`<div class="modal-back" onClick=${close}>
    <div class="modal wide" onClick=${e=>e.stopPropagation()}>
      <div class="modal-head"><h2>${_t("New order")}</h2></div>
      <div class="modal-body">
        ${err && html`<div class="err">${err}</div>`}
        <div class="grid2">
          <div class="field"><label>${_t("Supplier")}</label>
            <input type="text" value=${f.supplier} onInput=${e=>set('supplier',e.target.value)}/></div>
          <div class="field"><label>${_t("Their reference, optional")}</label>
            <input type="text" placeholder="${_t("Proforma number")}" value=${f.supplier_ref}
                   onInput=${e=>set('supplier_ref',e.target.value)}/></div>
          <div class="field"><label>${_t("Against which quotation")}</label>
            <select value=${f.quotation_id} onChange=${e=>set('quotation_id',e.target.value)}>
              <option value="">${_t("None")}</option>
              ${quotes.map(q=>html`<option key=${q.id} value=${q.id}>
                ${q.reference}${q.project_name?' · '+q.project_name:''}</option>`)}</select></div>
          <div class="field"><label>${_t("Against which project")}</label>
            <select value=${f.project_id} onChange=${e=>set('project_id',e.target.value)}>
              <option value="">${_t("None")}</option>
              ${projects.map(p=>html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select></div>
          <div class="field"><label>${_t("Delivering into")}</label>
            <select value=${f.warehouse_id} onChange=${e=>set('warehouse_id',e.target.value)}>
              <option value="">${_t("Decide later")}</option>
              ${whs.map(w=>html`<option key=${w.id} value=${w.id}>${w.name}</option>`)}</select></div>
          <div class="field"><label>${_t("Expected")}</label>
            <input type="date" value=${f.expected_on} onInput=${e=>set('expected_on',e.target.value)}/></div>
        </div>
        ${f.quotation_id && html`<div class="field">
          <label>${_t("Lines")}</label>
          <select value=${f.fromQuote?'y':'n'} onChange=${e=>set('fromQuote',e.target.value==='y')}>
            <option value="y">${_t("Work them out of the quotation")}</option>
            <option value="n">${_t("Start empty and type them myself")}</option>
          </select></div>`}
        ${f.fromQuote && f.quotation_id && html`<div class="box-quiet">
          ${preview===null ? html`<span class="muted">Working out the cargo…</span>`
           : preview.rows.length ? html`<${Frag}>

              <div class="cost-h">What each section costs us</div>
              <p class="muted" style=${{margin:'0 0 8px'}}>${
                'Krypton list less the '+Math.round(preview.supplyDiscount*100)
                +'% supply discount, at '+preview.fx+' to the euro. Material only, before '
                +'freight, duty and the applicator.'}</p>
              <table class="cost-t">
                <thead><tr><th>${_t("Section")}</th><th class="n">${_t("m\u00b2")}</th>
                  <th class="n">${_t("AED / m\u00b2")}</th><th class="n">${_t("Cost")}</th></tr></thead>
                <tbody>
                ${preview.sections.map(g=>html`<${Frag} key=${g.title}>
                  <tr class="secrow">
                    <td><b>${g.title}</b></td>
                    <td class="n">${nz(g.m2).toLocaleString()}</td>
                    <td class="n"><b>${AED2(g.aedPerM2,'AED')}</b></td>
                    <td class="n"><b>${AED0(g.aed,'AED')}</b></td>
                  </tr>
                  ${g.items.map(it=>html`<tr class="itemrow" key=${it.name}>
                    <td>${'· '+it.name}${it.byArea ? html`<span class="muted">${
                        ' one for one with the area'}</span>`
                      : html`<span class="muted">${' at '+round2(it.kgPerM2)+' kg/m², '
                          +AED2(it.aedPerUnit,'AED')+' / kg'}</span>`}</td>
                    <td class="n muted">${round2(it.qty).toLocaleString()+' '+it.unit}</td>
                    <td class="n muted">${AED2(it.aedPerM2,'AED')}</td>
                    <td class="n muted">${AED0(it.aed,'AED')}</td>
                  </tr>`)}
                </${Frag}>`)}
                </tbody>
                <tfoot><tr>
                  <td colspan="3"><b>What the work needs</b></td>
                  <td class="n"><b>${AED0(preview.goodsNeeded,'AED')}</b></td>
                </tr><tr>
                  <td colspan="3">${'Whole packs, which is what you actually buy'}</td>
                  <td class="n"><b>${AED0(ordered,'AED')}</b></td>
                </tr></tfoot>
              </table>

              ${preview.unresolved.length>0 && html`<p class="muted" style=${{marginTop:'8px'}}>
                ${preview.unresolved.length} ${plural(preview.unresolved.length,'line')} could not
                be worked out and ${preview.unresolved.length===1?'is':'are'} left off, so the
                cost above is short by whatever ${preview.unresolved.length===1?'it':'they'}
                would have come to. Add ${preview.unresolved.length===1?'it':'them'} by hand.</p>`}
            </${Frag}>`
           : preview.unresolved.length ? html`<${Frag}>
              <div class="cost-h">Nothing could be ordered</div>
              <p class="muted" style=${{margin:'0 0 8px'}}>${
                'Every line on this quotation could not be worked out, so nothing has been '
                +'worked out for you. Type the lines in below instead.'}</p>
              <ul class="plain">${preview.unresolved.map((u,i)=>html`<li key=${i}>
                ${u.text+' '}<span class="muted">${'· '+u.why
                  +(u.section?' · '+u.section:'')}</span></li>`)}</ul>
            </${Frag}>`
           : html`<span class="muted">Nothing could be worked out of that quotation. Its
              sections need a priced area and a product on the specification lines. Type the
              lines in below instead.</span>`}
        </div>`}

        <!-- The order list itself, which exists whether or not there is a quotation behind
             it. It used to be part of the take-off, so an order not built from a quotation
             was created with nothing on it and no way to say what should be. -->
        <div class="box-quiet ordbox">
              <div class="cost-h">What gets ordered</div>
              <p class="muted" style=${{margin:'0 0 8px'}}>${
                'The same columns Krypton write on their proforma, so the two can be laid '
                +'side by side and read down. Every box can be typed over, and the money is '
                +'in euros because that is what they invoice. Type a quantity or a unit '
                +'price and the amount multiplies out; type an amount or a price per kilo '
                +'and that is the figure, whatever the rest says.'}</p>
              <div class="tw"><table class="cost-t ord-t">
              <thead><tr>
                <th>${_t("Product")}</th><th class="n">${_t("Quantity")}</th>
                <th class="n">${_t("Unit price")}</th><th class="n">${_t("Weight kg")}</th>
                <th class="n">${_t("Price / kg")}</th><th class="n">${_t("Amount")}</th>
                <th></th>
              </tr></thead>
              <tbody>
              ${lines.map(l=>{
                const ps=packsOf(l.product), sup=suppliedOf(l);
                const short=l.required>0 && sup<l.required-0.001;
                /* Touching the quantity or the unit price puts the line back to
                   multiplying out, because otherwise an amount typed earlier would sit
                   there ignoring them and the line would read as three numbers that
                   disagree. Last thing touched wins. */
                const remult={amt:'',perkg:''};
                return html`<tr class="ordrow" key=${l.key}>
                  <td class="oname">
                    <input class="pname" type="text" list="ordprodlist"
                        placeholder="${_t('What to order')}" value=${nameOf(l)}
                        onInput=${e=>setName(l,e.target.value)}/>
                    <div class="subline">
                      <input class="plabel" type="text" list=${'packs-'+l.key}
                          placeholder="${_t('25 kg pail')}" value=${labelOf(l)}
                          onInput=${e=>setPack(l,e.target.value)}/>
                      ${ps.length ? html`<datalist id=${'packs-'+l.key}>${ps.map(x=>html`
                          <option key=${x.id} value=${x.label}></option>`)}</datalist>` : null}
                      <span class="osup">
                        <span class="uu">${_t("into stock")}</span>
                        <input class="num sm" type="number" min="0" step="any"
                            value=${typed(l.sup)?l.sup:round2(supDef(l))}
                            onInput=${e=>setLine(l.key,{sup:e.target.value})}/>
                        <span class="uu">${unitOf(l)}</span>
                      </span>
                    </div>
                    ${short && html`<div class="short">${'Short. The take-off asked for '
                      +round2(l.required).toLocaleString()+' '+(l.unit||'kg')+'.'}</div>`}</td>
                  <td class="n oqty"><input class="qn" type="number" min="0" step="1"
                      value=${l.packs}
                      onInput=${e=>setLine(l.key,{...remult,
                        packs:Math.max(0,Math.round(Number(e.target.value)||0))})}/></td>
                  <td class="n oeur"><input class="num" type="number" min="0" step="0.01"
                      value=${typed(l.list)?l.list:round2(listDef(l))}
                      onInput=${e=>setLine(l.key,{...remult,list:e.target.value})}/></td>
                  <td class="n okg"><input class="num" type="number" min="0" step="any"
                      value=${typed(l.kg)?l.kg:round2(kgDef(l))}
                      onInput=${e=>setLine(l.key,{kg:e.target.value})}/></td>
                  <td class="n operkg"><input class="num" type="number" min="0" step="0.01"
                      value=${typed(l.perkg)?l.perkg:round2(perKgOf(l))}
                      onInput=${e=>setLine(l.key,{perkg:e.target.value,amt:''})}/></td>
                  <td class="n oamt"><input class="num wide" type="number" min="0" step="0.01"
                      value=${typed(l.amt)?l.amt:round2(eurOf(l))}
                      onInput=${e=>setLine(l.key,{amt:e.target.value,perkg:''})}/></td>
                  <td class="n"><button class="xbtn" title="Take this off the order"
                      onClick=${()=>dropLine(l.key)}>×</button></td>
                </tr>`;})}
              </tbody></table></div>
              ${!lines.length && html`<p class="muted">${
                useQuote ? 'Nothing was worked out of that quotation. Add the products below.'
                         : 'Nothing on the order yet. Pick a product below, or type a line.'}</p>`}
              <datalist id="ordprodlist">${(cat||[]).map(p=>html`
                <option key=${p.id} value=${p.name}></option>`)}</datalist>
              <div class="addrow">
                <div class="field" style=${{maxWidth:'340px',margin:0}}>
                  <label>${_t("Add a product")}</label>
                  <select value=${adding} onChange=${e=>addLine(e.target.value)}>
                    <option value="">${_t("Pick a product")}</option>
                    ${(cat||[]).slice().sort((a,b)=>a.name.localeCompare(b.name))
                      .map(p=>html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}
                  </select>
                </div>
                <button class="btn sec sm" type="button" onClick=${addTyped}>${
                  _t("Type a line myself")}</button>
              </div>
              <p class="muted" style=${{marginTop:'6px',fontSize:'12px'}}>${
                'A typed line does not have to be in the catalogue. If what you type matches '
                +'a product it links to it, so receiving still puts it into stock.'}</p>
        </div>
      </div>
      <div class="modal-foot">
        ${err && html`<div class="lineerr">${err}</div>`}
        <button class="btn sec" onClick=${close}>${_t("Cancel")}</button>
        ${(()=>{
          const working=useQuote && preview===null;
          const empty=!working && !liveLines.length;
          return html`<button class="btn" onClick=${save} disabled=${busy||working}>${
            busy?'Creating…':working?'Working out the cargo…'
            :(empty&&armEmpty)?'Create it empty':'Create order'}</button>`;
        })()}
      </div>
    </div></div>`;
}

function OrderPage({id,rate,whs,quotes,projects,back}){
  const [o,setO]=useState(null); const [lines,setLines]=useState([]);
  const [err,setErr]=useState(''); const [msg,setMsg]=useState(''); const [busy,setBusy]=useState(false);
  const [rec,setRec]=useState(null);
  const [armed,setArmed]=useState(false);   // the delete button, once it has been asked twice
  const [viewCur,setViewCur]=useState('');  // read the order in euros or in dirhams
  /* Said beside the button that caused it. Up here with the other hooks because this
     component returns a spinner while it loads, and a hook below that point only runs on
     some renders, which React refuses. */
  const [lineErr,setLineErr]=useState('');
  const [pfBusy,setPfBusy]=useState('');       // reading their proforma
  const [pf,setPf]=useState(null);             // what it said, before anything is written
  const [cat,setCat]=useState([]);             // the catalogue, to match their names to ours
  const [people,setPeople]=useState([]);       // who asked, approved and sent, by name
  const set=(k,v)=>setO(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    const [po,ln]=await Promise.all([
      sb.from('purchase_orders').select('*').eq('id',id).single(),
      sb.from('purchase_order_lines').select('*, products(name)').eq('po_id',id).order('position')]);
    // Both answers are read. The lines used to ask for a column the catalogue does not
    // have, the whole query was refused, and the refusal was thrown away: every order
    // opened with nothing on it and said so with a straight face.
    const e=po.error||ln.error; if(e) setErr(e.message);
    setO(po.data); setLines(ln.data||[]);
    // the catalogue, so a name on a supplier's proforma can be matched to our product and
    // receiving still moves the right stock
    const pr=await sb.from('products').select('id,name');
    setCat(pr.data||[]);
    const pf=await sb.from('profiles').select('id,full_name,email');
    setPeople(pf.data||[]);
  },[id]);
  useEffect(()=>{load();},[load]);
  if(!o) return html`<div class="spinner"></div>`;

  const value=lines.reduce((s,l)=>s+nz(l.qty_ordered)*nz(l.unit_price),0);
  const valueAed=value*nz(o.eur_aed_rate||rate);

  /* ── which money you are looking at ──────────────────────────────────────────
     The order is placed in euros because that is what Krypton invoices, but every
     conversation in Dubai about what it costs happens in dirhams. Rather than make
     anybody do the sum in their head, the whole order can be read in either, at the rate
     recorded on the order itself so an old order keeps the rate it was placed at. */
  const poRate = nz(o.eur_aed_rate) || nz(rate) || 4.27;
  const poCur  = viewCur || o.currency || 'EUR';
  const toView = v => { const n = nz(v);
    if(poCur === (o.currency||'EUR')) return n;
    return poCur === 'AED' ? n*poRate : n/poRate; };
  const fmtMoney = (v,cur) => toView(v).toLocaleString('en',
    {minimumFractionDigits:2, maximumFractionDigits:2});

  /* Krypton quotes a list price and a discount. What we actually pay, and therefore what
     the line is worth, is the two multiplied out, so changing either keeps unit_price in
     step rather than leaving three numbers that disagree. */
  /* Krypton lists a price per PACK. We pay for it per kilo, because that is how the
     warehouse and every cost in this system are measured. One pack holds qty_ordered
     divided by packs of whatever the line is measured in, so the two convert exactly and
     changing either the list or the discount keeps them in step. */
  const perPack = l => { const k = nz(l.packs); return k > 0 ? nz(l.qty_ordered)/k : 0; };
  const netOfList = (l, list, disc) => { const per = perPack(l);
    const net = nz(list) * (1 - nz(disc)/100);
    return per > 0 ? Math.round(net/per * 10000)/10000 : Math.round(net*10000)/10000; };
  const setListPrice = (i,v) => setLines(a=>a.map((x,n)=>n!==i?x:
    ({...x, list_price:v, unit_price: netOfList(x, v, x.discount_pct)})));
  const setDiscount  = (i,v) => setLines(a=>a.map((x,n)=>n!==i?x:
    ({...x, discount_pct:v,
      unit_price: x.list_price!=null && x.list_price!=='' ? netOfList(x, x.list_price, v)
                                                          : x.unit_price})));
  const outstanding=lines.filter(l=>nz(l.qty_ordered)-nz(l.qty_received)>0.001);
  const pct=lines.length? lines.reduce((s,l)=>s+nz(l.qty_received),0)
                        / Math.max(lines.reduce((s,l)=>s+nz(l.qty_ordered),0),0.0001)*100 : 0;

  /* The approval step. A draft is asked to be approved, an owner approves it, and only
     then is it sent, so the supplier never sees an order nobody has signed off. The
     database writes who took each step and when, and refuses the steps out of order. */
  const moveTo=async st=>{
    setErr(''); setMsg('');
    const {error}=await sb.from('purchase_orders').update({status:st}).eq('id',id);
    if(error){setErr(error.message);return;}
    setMsg(st==='pending_approval' ? 'Sent for approval.'
         : st==='approved' ? 'Approved. It can go to the supplier now.'
         : st==='sent' ? 'Marked as sent to the supplier.' : 'Back to a draft.');
    load();
  };
  const who=pid=>{ const p=people.find(x=>x.id===pid); return p ? (p.full_name||p.email) : 'somebody'; };
  const when=d=>d ? new Date(d).toLocaleString('en-GB',
    {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
  // the office that raised it, for the letterhead on the printed order
  const poOffice=OFFICE_BY_ID[o.office_id]||{};
  const deliverTo=whs.find(w=>w.id===o.warehouse_id);
  const poMoney=o.currency||'EUR';   // the order's own money on the printed sheet, whatever the screen shows
  const save=async()=>{
    setBusy(true); setErr(''); setMsg('');
    const {error}=await sb.from('purchase_orders').update({
      supplier:o.supplier, supplier_ref:o.supplier_ref||null, status:o.status,
      quotation_id:o.quotation_id||null, project_id:o.project_id||null,
      warehouse_id:o.warehouse_id||null, ordered_on:o.ordered_on||null,
      expected_on:o.expected_on||null, notes:o.notes||null}).eq('id',id);
    if(!error){
      /* The Krypton columns arrived in migration 0058. If that has not been run yet, an
         update naming them comes back "column does not exist" and the whole save looks
         broken, when in truth everything the order already had would have saved fine. So
         it is tried with them, and on that one error tried again without, and the person
         is told which migration is missing rather than shown Postgres's own sentence. */
      let missing = false;
      for(const l of lines){
        const core = { description:l.description, unit:l.unit,
          qty_ordered:num(l.qty_ordered)||0, unit_price:num(l.unit_price)||0 };
        const extra = { hs_code:l.hs_code||null,
          packs:num(l.packs), pack_label:l.pack_label||null,
          list_price:num(l.list_price), discount_pct:num(l.discount_pct)||0,
          weight_kg:num(l.weight_kg) };
        const r = missing ? await sb.from('purchase_order_lines').update(core).eq('id',l.id)
                          : await sb.from('purchase_order_lines').update({...core,...extra}).eq('id',l.id);
        if(r.error && /column .* does not exist|schema cache/i.test(r.error.message||'')){
          missing = true;
          await sb.from('purchase_order_lines').update(core).eq('id',l.id);
        }
      }
      if(missing) setLineErr('Saved, but the pack, list price, discount and weight columns '
        + 'are not in the database yet. Run migration 0058 in Supabase and save again.');
    }
    setBusy(false);
    if(error) setErr(error.message); else { setMsg('Saved.'); load(); }
  };
  /* Adding a line. The error used to go to the box at the top of the page, which on a
     long order is a screen and a half above the button that was just pressed, so a
     refused insert looked like a button that did nothing. It is said here, beside the
     button, and it says what the database said rather than a tidied version of it.

     Wrapped in a try as well, because a rejected promise inside a click handler is
     swallowed by the browser: no line, no message, a button that does nothing. */
  const addLine=async()=>{
    setLineErr('');
    try{ await addLineInner(); }
    catch(e){ setLineErr('The line could not be added: '
      + ((e && (e.message || e.error_description)) || String(e))); }
  };
  const addLineInner=async()=>{
    const {error}=await sb.from('purchase_order_lines').insert({
      po_id:id, position:lines.length+1, description:'', unit:'kg',
      qty_ordered:0, unit_price:0});
    if(error){
      // everything the database said, because a tidied message is a message that cannot
      // be looked up
      setLineErr(dbWhy([error.message, error.details, error.hint,
                        error.code && '('+error.code+')']
        .filter(Boolean).join(' · ')) || 'The line could not be added.');
      return;
    }
    load();
  };
  const delLine=async(l)=>{
    if(nz(l.qty_received)>0) return setErr('Some of that line has already been received, so it cannot be removed.');
    await sb.from('purchase_order_lines').delete().eq('id',l.id); load();
  };

  /* ── reading their proforma ──────────────────────────────────────────────────
     Nothing is written until it has been looked at. The reader can only be as good as
     the paper it is given, and a supplier order written from a misread document is a
     container of the wrong material, so it is shown first and confirmed second. */
  const readProforma=async(file)=>{
    setLineErr(''); setPf(null); setPfBusy('Reading '+file.name+'…');
    try{
      const { text } = await readScopeFile(file);
      const got = parseProforma(text);
      setPfBusy('');
      if(!got.lines.length){
        setLineErr('Nothing on ' + file.name + ' reads as an order line. It needs a '
          + 'commodity code, a quantity and a price on each row. '
          + (got.unread.length ? got.unread.length + ' rows were close but not readable.' : ''));
        return;
      }
      setPf({ file:file.name, ...got });
    }catch(e){
      setPfBusy('');
      setLineErr('That file could not be read: ' + ((e&&e.message)||String(e)));
    }
  };
  /* Written only when Charles says so, and matched to the catalogue where the name is
     recognised so receiving still moves the right stock. */
  const takeProforma=async()=>{
    if(!pf) return;
    setPfBusy('Adding '+pf.lines.length+' lines…');
    try{
      const rows=pf.lines.map((l,i)=>{
        const prod=cat.find(p=>normName(p.name)===normName(l.description))
          || cat.find(p=>normName(l.description).includes(normName(p.name)));
        const kg=nz(l.weight_kg);
        return { po_id:id, position:lines.length+i+1,
                 product_id:prod?prod.id:null,
                 description:prod?prod.name:l.description,
                 unit:'kg',
                 packs:l.packs, pack_label:prod?null:null,
                 hs_code:l.hs_code,
                 qty_ordered:kg>0?kg:l.packs,
                 list_price:l.list_price, discount_pct:l.discount_pct,
                 unit_price: kg>0 ? Math.round(l.amount/kg*10000)/10000
                                  : Math.round(l.list_price*(1-l.discount_pct/100)*10000)/10000,
                 weight_kg: kg>0?kg:null };
      });
      const {error}=await sb.from('purchase_order_lines').insert(rows);
      setPfBusy('');
      if(error){ setLineErr('The lines could not be added: '+error.message
        + (/column .* does not exist|schema cache/i.test(error.message||'')
           ? ' Run migration 0058 in Supabase first.' : '')); return; }
      setPf(null); load();
    }catch(e){ setPfBusy(''); setLineErr('The lines could not be added: '+((e&&e.message)||String(e))); }
  };
  const upL=(i,k,v)=>setLines(a=>a.map((x,n)=>n===i?{...x,[k]:v}:x));

  // ── deleting the whole order ──────────────────────────────────────────────────
  // An order that has taken delivery of anything is the only record of why that stock is in
  // the warehouse, and the balance would stay behind after the order went, so it stays.
  // A draft that was created by mistake can go, but only on a second, deliberate click.
  const received=lines.reduce((s,l)=>s+nz(l.qty_received),0);
  const remove=async()=>{
    if(received>0){ setArmed(false);
      return setErr('Some of this order has already been received, so it cannot be deleted. '
        +'Set its status to Cancelled instead, which keeps the stock and the history.'); }
    setBusy(true); setErr('');
    const {error}=await sb.from('purchase_orders').delete().eq('id',id);
    setBusy(false); setArmed(false);
    if(error) return setErr(error.message);
    back();
  };

  return html`
    ${err && html`<div class="err">${err}</div>`}
    ${msg && html`<div class="ok">${msg}</div>`}
    <div class="page-head">
      <button class="btn sec sm" onClick=${back}>${_t("\u2190 All orders")}</button>
      <span class="qref">${o.reference}</span>
      <div class="sp" style=${{display:'flex',gap:'8px'}}>
        ${armed && html`<button class="btn sec" onClick=${()=>setArmed(false)}>${_t("Keep it")}</button>`}
        <button class=${'btn danger'+(armed?' armed':'')} disabled=${busy}
          onClick=${()=>armed?remove():setArmed(true)}>${
          armed ? 'Delete '+o.reference+' for good' : 'Delete this order'}</button>
        <button class="btn" onClick=${save} disabled=${busy}>${busy?_t('Saving…'):_t('Save')}</button>
      </div>
    </div>
    ${armed && html`<div class="flagbox">${received>0
      ? 'Some of this order has already been received. Deleting it would leave that stock in '
        +'the warehouse with nothing to explain it, so cancel it instead of deleting it.'
      : 'This removes the order and its lines for good. Nothing has been received against it, '
        +'so no stock is affected.'}</div>`}

    <div class="cards">
      <div class="card"><div class="k">Order value</div><div class="v">${AED0(valueAed,'AED')}</div>
        <div class="s">${o.currency+' '+value.toLocaleString('en',{maximumFractionDigits:2})
          +' at '+nz(o.eur_aed_rate||rate)}</div></div>
      <div class=${'card '+(pct>=100?'okc':'')}><div class="k">Received</div>
        <div class="v">${pct.toFixed(0)}%</div>
        <div class="s">${outstanding.length?outstanding.length+' '+plural(outstanding.length,'line')+' still outstanding':'Everything has landed'}</div></div>
      <div class=${'card '+(o.expected_on&&o.expected_on<today()&&!['received','cancelled'].includes(o.status)?'alert':'')}>
        <div class="k">Expected</div><div class="v" style=${{fontSize:'20px'}}>${fmtDate(o.expected_on)||'—'}</div>
        <div class="s">${poLabel(o.status)}</div></div>
    </div>

    <div class="panel"><div class="panel-body flowrow">
      <span class=${'pill '+poPill(o.status)}>${poLabel(o.status)}</span>
      ${o.status==='draft' && html`<button class="btn" onClick=${()=>moveTo('pending_approval')}
          title="Ask an owner to approve this order before it goes to the supplier">${_t("Ask for approval")}</button>`}
      ${o.status==='pending_approval' && (MY_ROLE==='owner'
        ? html`<button class="btn" onClick=${()=>moveTo('approved')}>${_t("Approve")}</button>
               <button class="btn sec" onClick=${()=>moveTo('draft')}>${_t("Send it back")}</button>`
        : html`<span class="muted">Waiting for an owner to approve it</span>`)}
      ${o.submitted_at && ['pending_approval','approved'].includes(o.status)
        && html`<span class="muted">Asked by ${who(o.submitted_by)}, ${when(o.submitted_at)}</span>`}
      ${o.status==='approved' && html`<button class="btn" onClick=${()=>moveTo('sent')}>${_t("Mark as sent to the supplier")}</button>`}
      ${o.approved_at && html`<span class="muted">Approved by ${who(o.approved_by)}, ${when(o.approved_at)}</span>`}
      ${o.sent_at && html`<span class="muted">Sent by ${who(o.sent_by)}, ${when(o.sent_at)}</span>`}
      <button class="btn sec sp" onClick=${printOnePage}
        title="The order on our letterhead, to send to the supplier">${_t("Print / PDF")}</button>
    </div></div>

    ${/* The order on our own letterhead, to send to the supplier. Hidden on screen and the
          only thing on the page when printed, the same way the invoice is. Notes stay
          off it: they are ours. */''}
    <div class="print-area">
      <div class="iv-head">
        <div class="pa-logo"><img src="./logo.png" alt=""
             onError=${e=>{e.target.parentNode.style.visibility='hidden';}}/></div>
        <div style=${{flex:1}}>
          <div class="iv-title">PURCHASE ORDER</div>
          <table class="pa-meta" style=${{marginLeft:'auto',marginRight:0}}><tbody>
            <tr><td class="k">Order no :</td><td>${o.reference}</td></tr>
            <tr><td class="k">Date :</td><td>${fmtDate(o.ordered_on||today())}</td></tr>
            ${o.expected_on && html`<tr><td class="k">Expected :</td><td>${fmtDate(o.expected_on)}</td></tr>`}
            ${o.supplier_ref && html`<tr><td class="k">Your ref :</td><td>${o.supplier_ref}</td></tr>`}
          </tbody></table>
        </div>
      </div>
      <div class="iv-parties">
        <div>
          <h5>From</h5>
          <div class="pa-co">${(poOffice.legal_name||poOffice.name||'').toUpperCase()}</div>
          ${(poOffice.address||'').split('\n').filter(t=>t.trim()).map((t,n)=>html`<div key=${n}>${t}</div>`)}
          ${poOffice.tax_id && html`<div><b>${poOffice.tax_id_label||'TRN'} ${poOffice.tax_id}</b></div>`}
          ${poOffice.email && html`<div>${poOffice.email}</div>`}
          ${poOffice.phone && html`<div>${poOffice.phone}</div>`}
        </div>
        <div>
          <h5>To</h5>
          <div class="pa-co">${o.supplier||''}</div>
          ${deliverTo && html`<div>Deliver to: ${deliverTo.name}</div>`}
        </div>
      </div>
      <table class="iv-tbl">
        <thead><tr><th style=${{width:'4%'}}>#</th><th>Description</th><th style=${{width:'10%'}}>Code</th>
          <th style=${{width:'7%'}}>Packs</th><th style=${{width:'9%'}}>Qty</th><th style=${{width:'6%'}}>Unit</th>
          <th style=${{width:'10%'}}>List/pack</th><th style=${{width:'7%'}}>Disc %</th>
          <th style=${{width:'9%'}}>Weight kg</th><th style=${{width:'12%'}}>${'Amount '+poMoney}</th></tr></thead>
        <tbody>${lines.map((l,i)=>html`<tr key=${l.id}>
          <td class="c">${i+1}</td>
          <td>${l.description||''}${l.pack_label?html`<div>${l.pack_label}</div>`:null}</td>
          <td class="c">${l.hs_code||''}</td>
          <td class="n">${l.packs??''}</td>
          <td class="n">${nz(l.qty_ordered).toLocaleString('en',{maximumFractionDigits:3})}</td>
          <td class="c">${l.unit||''}</td>
          <td class="n">${l.list_price==null||l.list_price===''?'':fmtN(l.list_price)}</td>
          <td class="n">${nz(l.discount_pct)?nz(l.discount_pct)+'%':''}</td>
          <td class="n">${l.weight_kg==null||l.weight_kg===''?'':nz(l.weight_kg).toLocaleString('en',{maximumFractionDigits:2})}</td>
          <td class="n">${fmtN(nz(l.qty_ordered)*nz(l.unit_price))}</td>
        </tr>`)}</tbody>
      </table>
      <table class="iv-tot"><tbody>
        <tr><td class="k">Total weight</td><td class="v">${lines.reduce((t,l)=>t+nz(l.weight_kg),0)
              .toLocaleString('en',{maximumFractionDigits:2})} kg</td></tr>
