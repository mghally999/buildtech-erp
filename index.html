          ${packBusy?'Working…':'Download the whole pack'}</button>
      </div></div>
    <div class="panel-body">
      ${packErr && html`<div class="err">${packErr}</div>`}
      ${packBusy && html`<div class="ok">${packBusy}</div>`}
      <p class="muted" style=${{marginTop:0}}>
        <b>Save as PDF</b> gives you the request on its own. <b>Download the whole pack</b>
        gives you a zip holding the request and every safety data sheet we hold, ready to
        forward without attaching anything else.</p>

    <p class="muted">Worked out of this quotation, not typed again. Quantities are the priced
    area times the consumption on each specification line, rounded up to whole packs.</p>

    <table><thead><tr>
      <th>${_t("Product")}</th><th>${_t("Pack")}</th><th class="r">${_t("Packages")}</th>
      <th class="r">${_t("Net kg")}</th><th class="r">${_t("Gross kg")}</th><th>${_t("Worked from")}</th></tr></thead>
      <tbody>
      ${c.rows.map(r=>html`<tr key=${r.product.id}>
        <td><b>${r.product.name}</b></td><td>${r.pack}</td>
        <td class="r">${n(r.packs)}</td>
        <td class="r">${n(r.net,0)}</td><td class="r">${n(r.gross,0)}</td>
        <td class="muted" style=${{fontSize:'11.5px'}}>${r.from}</td></tr>`)}
      <tr class="tot"><td><b>Total</b></td><td></td>
        <td class="r"><b>${n(c.pails+c.rolls)}</b></td>
        <td class="r"><b>${n(c.net,0)}</b></td><td class="r"><b>${n(c.gross,0)}</b></td><td></td></tr>
      </tbody></table>

    <div class="tot" style=${{marginTop:'14px'}}>
      <span class="lbl">${_t("Packages")}</span><span class="val">${n(c.pails)} pails and kits, ${n(c.rolls)} rolls</span>
      <span class="lbl">${_t("Pallets")}</span><span class="val">${n(c.pallets)}</span>
      <span class="lbl">${_t("Volume")}</span><span class="val">${n(c.vol,2)} m³</span>
      <span class="lbl">${_t("Chargeable, weight or measure")}</span>
      <span class="val">${n(c.chargeable,2)} W/M</span>
    </div>

    <h3 style=${{marginTop:'18px'}}>Dangerous goods</h3>
    ${dg.length ? html`<table><thead><tr>
        <th>${_t("Product")}</th><th>${_t("UN")}</th><th>${_t("Class")}</th><th>${_t("Packing group")}</th><th>${_t("Marine pollutant")}</th>
      </tr></thead><tbody>
      ${dg.map(d=>html`<tr key=${d.name}><td>${d.name}</td><td>${d.un}</td><td>${d.cls}</td>
        <td>${d.pg}</td><td>${d.mp?'Yes':'No'}</td></tr>`)}
      </tbody></table>`
      : html`<p class="muted">Nothing on this consignment has a classification on file yet.</p>`}

    ${clean.length>0 && html`<p class="muted" style=${{marginTop:'8px'}}>
      Read and found not to be dangerous goods: ${clean.map(r=>r.product.name).join(', ')}.
      Do not let anyone charge a dangerous goods surcharge on ${clean.length>1?'these':'this'}.</p>`}

    ${unknown.length>0 && html`<div class="warnbar" style=${{marginTop:'12px'}}>
      ${unknown.length} product${unknown.length>1?'s have':' has'} no transport classification:
      ${' '+unknown.map(r=>r.product.name).join(', ')}.
      Nobody has read a data sheet for ${unknown.length>1?'them':'it'}, which is not the same as
      it being safe. A forwarder cannot be firm without it.</div>`}

    <h3 style=${{marginTop:'18px'}}>Documents for the folder</h3>
    ${haveSds.length>0 && html`<${Frag}>
      <p class="muted">In the catalogue, ready to send:</p>
      <ul class="plain">${haveSds.map(r=>html`<li key=${r.product.id}>${r.product.name+' '}<span class="muted">· ${
          trans[r.product.id].sds_on_file} ${plural(trans[r.product.id].sds_on_file,'sheet')}</span></li>`)}</ul>
    </${Frag}>`}
    ${noSds.length>0 && html`<${Frag}>
      <p class="muted" style=${{marginTop:'10px'}}>Still to obtain. Ask Krypton, then upload each one
      against its product in the Catalogue and this list empties itself:</p>
      <ul class="plain">${noSds.map(r=>html`<li key=${r.product.id}>${r.product.name}</li>`)}</ul>
    </${Frag}>`}
    ${!noSds.length && html`<p class="muted">Every product on this consignment has its safety data
      sheet in the catalogue. Download them from each product page and send them with the request.</p>`}

    ${c.unresolved.length>0 && html`<${Frag}>
      <h3 style=${{marginTop:'18px'}}>Lines this could not read</h3>
      <p class="muted">Nothing here has been guessed at. Add these to the cargo by hand, or fix the
      specification line on the quotation and they will come through on their own.</p>
      <ul class="plain">${c.unresolved.map((u,i)=>html`<li key=${i}>
        <b>${u.section}</b> · ${u.text} · <span class="muted">${u.why}</span></li>`)}</ul>
    </${Frag}>`}

    <p class="muted" style=${{marginTop:'16px'}}>
      Gross weight adds ${(cfgNum('pack_tare_pct',0.11)*100).toFixed(0)}% for tare and pallets are
      figured at ${cfgNum('pails_per_pallet',24)} pails each. Both are in Settings. Check them against
      the manufacturer's packing list before a booking is firm.</p>
    </div></div>`;
}

/* Print just the shipping request, not the quotation sheet behind it. */
function printShipping(){
  document.body.classList.add('print-ship');
  const done=()=>{ document.body.classList.remove('print-ship');
                   window.removeEventListener('afterprint',done); };
  window.addEventListener('afterprint',done);
  window.print();
  setTimeout(done, 1500);   // some browsers never fire afterprint
}

/* ══════════════ QUOTATIONS ══════════════ */
const QSTATUS=['draft','sent','approved','rejected','expired'];
const num = v => v===''||v==null ? null : Number(v);
const nz  = v => Number(v||0);
const e2Msg = e => e && e.message ? e.message : String(e);
const fmtN = n => Number(n||0).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
// the existing sheet writes quantities and unit rates with a comma decimal (525,00)
const eu = v => (v===''||v==null) ? '' : Number(v).toFixed(2).replace('.',',');
// and money with a thousands comma and no decimals (126,000 AED)
// Round once, at the line, and total the rounded lines. Rounding each cell and then
// separately rounding the true sum leaves a printed column that does not add up, which is
// the first thing a client checks.
const roundAed = n => Math.round(Number(n||0));
// weights, not money: keep the two decimals a bill of lading actually quotes
const round2 = n => Math.round(Number(n||0)*100)/100;
// The sheet writes the currency after the figure, the way the existing template does.
// Belgium groups with a full stop, so 126.000 EUR, which is what a Belgian client expects
// to read and what their own accountant will send back.
const money = (n,cur) => roundAed(n).toLocaleString(curLocale(cur||'AED'))
                       + ' ' + (cur||'AED');
/* ── the words on the client's copy ───────────────────────────────────────────────
   Only the sheet the client reads is translated here, and only the words the sheet
   actually uses. A Belgian client gets a document in his own language or he reads it as
   a foreign supplier's paperwork and prices it accordingly.

   Dutch and French are Belgium's two, chosen per quotation, because Bruges sells into
   Flanders in Dutch and into Brussels and Wallonia in French, and getting that the wrong
   way round is worse than writing in English. */
const SHEET = {
  en:{title:'QUOTATION', project:'Project', reference:'Reference', date:'Date',
      address:'Address', tax:'TRN', forWhom:'For', site:'Site',
      description:'Description', unit:'Unit', qty:'Qty', unitPrice:'Unit price',
      lineTotal:'Total price', subtotal:'SUBTOTAL', vat:'VAT', total:'TOTAL',
      discount:'DISCOUNT', netTotal:'NET', noVat:'not applied',
      remarks:'Remarks', terms:'Terms and conditions', bank:'Bank details',
      licence:'Trade licence', validUntil:'Valid until',
      approvalClient:'For approval Client', approvalUs:'For approval'},
  nl:{title:'OFFERTE', project:'Project', reference:'Referentie', date:'Datum',
      address:'Adres', tax:'BTW', forWhom:'Voor', site:'Werf',
      description:'Omschrijving', unit:'Eenheid', qty:'Aantal', unitPrice:'Eenheidsprijs',
      lineTotal:'Totaalprijs', subtotal:'SUBTOTAAL', vat:'BTW', total:'TOTAAL',
      discount:'KORTING', netTotal:'NETTO', noVat:'niet van toepassing',
      remarks:'Opmerkingen', terms:'Algemene voorwaarden', bank:'Bankgegevens',
      licence:'Ondernemingsnummer', validUntil:'Geldig tot',
      approvalClient:'Voor akkoord Klant', approvalUs:'Voor akkoord'},
  fr:{title:'DEVIS', project:'Projet', reference:'Référence', date:'Date',
      address:'Adresse', tax:'TVA', forWhom:'Pour', site:'Chantier',
      description:'Description', unit:'Unité', qty:'Qté', unitPrice:'Prix unit.',
      lineTotal:'Prix total', subtotal:'SOUS-TOTAL', vat:'TVA', total:'TOTAL',
      discount:'REMISE', netTotal:'NET', noVat:'non applicable',
      remarks:'Remarques', terms:'Conditions générales', bank:'Coordonnées bancaires',
      licence:'Numéro d’entreprise', validUntil:'Valable jusqu’au',
      approvalClient:'Pour accord Client', approvalUs:'Pour accord'},
};
/* Named in the language of the person choosing, not in its own language. The list is
   read by somebody deciding what to switch TO, and "Nederlands" is the one word in it
   they might not recognise. */
const LANGS = [['en','English'],['nl','Dutch'],['fr','French']];

/* What the office switch says. The code in the database stays BRU, because it is wired
   into the quotation numbering and the office rows; this is only what is printed on the
   button. Charles reads BRU as an airport, and means the country. */
const OFFICE_TAG = {BRU:'BEL'};
const officeTag = c => OFFICE_TAG[c] || c;
// A Belgian reads 06/09/2026 the same way we do, so the sheet keeps one date format and
// only the words around it change.
const sheetWords = lang => SHEET[lang] || SHEET.en;

// bold runs up to and including the colon, as on the sheet
// Shrink the sheet just enough to land on a single A4 page. Never enlarges.
function printOnePage(){
  const el = document.querySelector('.print-area');
  if(!el){ window.print(); return; }
  const PAGE_H = 1054;   // A4 height at 9mm margins, in CSS px
  const MIN   = 0.72;    // never shrink below roughly 5.6pt, it stops being readable

  const secs = [...el.querySelectorAll('.pa-sec')];
  secs.forEach(s => s.style.breakBefore = '');   // start from a clean slate every time
  el.style.zoom = '';
  el.classList.add('measuring');

  let h = el.scrollHeight;
  let zoom = 1;
  if(h > PAGE_H){
    zoom = Math.max(MIN, (PAGE_H / h) * 0.985);
    el.style.zoom = zoom;
    // one correction pass, because reflow changes the wrapping
    if(el.scrollHeight * zoom > PAGE_H){
      zoom = Math.max(MIN, zoom * (PAGE_H / (el.scrollHeight * zoom)) * 0.99);
      el.style.zoom = zoom;
    }
  }

  // A long bill will not fit on one page at a size anybody can read, and the default
  // break dumps the last section and the remarks onto a near-empty second page. If we
  // are spilling anyway, split it down the middle instead so both pages look intended.
  if(el.scrollHeight * (zoom || 1) > PAGE_H && secs.length > 1){
    el.style.zoom = '';
    const top  = el.getBoundingClientRect().top;
    const half = el.scrollHeight / 2;
    let best = null, bestGap = Infinity;
    secs.forEach((s,i) => {
      if(i === 0) return;                       // never break above the first section
      const gap = Math.abs((s.getBoundingClientRect().top - top) - half);
      if(gap < bestGap){ bestGap = gap; best = s; }
    });
    if(best) best.style.breakBefore = 'page';
    zoom = 1;
  }

  el.classList.remove('measuring');
  window.print();
}

/* ── bold on part of a line ────────────────────────────────────────────────────
   The B button makes a whole line bold, which is right for "To be priced by us" and
   wrong for a product name sitting at the front of its own specification. Charles wants
   to select IBTMAX B 1K in "IBTMAX B 1K : Approx. 2,50 kg/m2." and press ⌘B.

   The marks are kept in the text itself, wrapped in **, for two reasons. There is no
   schema change, so nothing already saved has to be migrated; and what is bold is visible
   while you are typing rather than hidden in a formatting layer you cannot see. It is the
   same convention as every chat box in the world, so nobody needs telling.

   Everything that prints goes through richText, so the ** never reaches a client. */
const BOLD_MARK = '**';
function richText(txt){
  const s = String(txt == null ? '' : txt);
  if(s.indexOf(BOLD_MARK) === -1) return s;
  const parts = s.split(/\*\*/);
  // an odd number of marks means one is unclosed: print it as written rather than
  // guessing, because a half typed line is not a reason to bold the rest of the page
  if(parts.length % 2 === 0) return s;
  return html`<${Frag}>${parts.map((p,i) =>
    i % 2 ? html`<b key=${i}>${p}</b>` : p)}</${Frag}>`;
}
/* The same text with the marks taken out and nothing made bold. For anywhere the value is
   a plain string rather than something rendered: a title attribute, a filename, a search. */
const plainText = t => String(t == null ? '' : t).split(BOLD_MARK).join('');

/* ⌘B, or Ctrl+B. Wraps the selection in ** and unwraps it if it is already wrapped, then
   puts the cursor back where it was so typing carries on uninterrupted. */
function toggleBoldSelection(el, onChange){
  if(!el) return false;
  const v = String(el.value == null ? '' : el.value);
  let a = el.selectionStart, b = el.selectionEnd;
  if(a == null || b == null) return false;

  // nothing selected: bold the word the cursor is sitting in, which is what somebody
  // means when they put the caret in a product name and press the keys
  if(a === b){
    let i = a, j = a;
    while(i > 0 && !/\s/.test(v[i-1])) i--;
    while(j < v.length && !/\s/.test(v[j])) j++;
    if(i === j) return false;
    a = i; b = j;
  }

  const before = v.slice(0, a), sel = v.slice(a, b), after = v.slice(b);
  let next, from, to;
  if(before.endsWith(BOLD_MARK) && after.startsWith(BOLD_MARK)){
    // already bold, take the marks off
    next = before.slice(0, -2) + sel + after.slice(2);
    from = a - 2; to = b - 2;
  } else if(sel.startsWith(BOLD_MARK) && sel.endsWith(BOLD_MARK) && sel.length > 4){
    next = before + sel.slice(2, -2) + after;
    from = a; to = b - 4;
  } else {
    next = before + BOLD_MARK + sel + BOLD_MARK + after;
    from = a + 2; to = b + 2;
  }
  onChange(next);
  // after React has repainted the field, put the selection back
  requestAnimationFrame(() => { try{ el.setSelectionRange(from, to); el.focus(); }catch(e){} });
  return true;
}
const boldKey = onChange => e => {
  if(!(e.metaKey || e.ctrlKey) || String(e.key).toLowerCase() !== 'b') return;
  if(toggleBoldSelection(e.target, onChange)) e.preventDefault();
};

const boldPrefix = (txt,bold) => {
  if(!txt) return '';
  const body = richText(txt);
  if(!bold) return body;
  const plain = plainText(txt);
  const i = plain.indexOf(':');
  // a whole line marked bold, and nothing inside it marked separately: the old behaviour,
  // where everything up to the colon is the heading
  if(String(txt).indexOf(BOLD_MARK) === -1 && i !== -1)
    return html`<${Frag}><b>${txt.slice(0,i+1)}</b>${txt.slice(i+1)}</${Frag}>`;
  return html`<b>${body}</b>`;
};
/* Takes a date, and also a full timestamp, because created_at is one and being handed
   "2026-09-08T12:52:22.268Z" used to print "08T12:52:22.268Z/09/2026". */
const fmtDate = d => { if(!d) return '';
  const [y,m,dd] = String(d).slice(0,10).split('-');
  return (dd && m && y) ? dd+'/'+m+'/'+y : String(d); };

function Quotations({rate,settings,offices,office,focus,clearFocus,me,go}){
  const [rows,setRows]=useState(null); const [openId,setOpenId]=useState(null);
  const [clients,setClients]=useState([]); const [loadErr,setLoadErr]=useState('');
  useEffect(()=>{ if(focus){ setOpenId(focus); clearFocus&&clearFocus(); } },[focus]);
  const load=useCallback(async()=>{
    setLoadErr('');
    // quotation_totals is a view with no foreign key, so it cannot be embedded.
    // Fetch it separately and match on quotation_id.
    const [qr,cr,tr]=await Promise.all([
      sb.from('quotations').select('*, clients(name)').order('created_at',{ascending:false}),
      sb.from('clients').select('*').order('name'),
      sb.from('quotation_totals').select('*')]);
    const firstErr = qr.error || cr.error || tr.error;
    if(firstErr) setLoadErr(firstErr.message);
    const totals = {};
    (tr.data||[]).forEach(t=>{ totals[t.quotation_id]=t; });
    setRows((qr.data||[]).map(q=>({...q, totals: totals[q.id]||{}})));
    setClients(cr.data||[]);
  },[]);
  useEffect(()=>{load();},[load]);

  // Opens a blank in memory. No row, and no number, until you press Save.
  const create=()=>setOpenId('new');
  // Reading a scope of works. Everything it needs is loaded here rather than inside the
  // reader, so the reader stays a pure thing that can be handed a catalogue and tested.
  const [scope,setScope]=useState(false);
  const [kit,setKit]=useState(null);
  const [docs,setDocs]=useState([]);
  const loadDocs=useCallback(async()=>{
    const {data}=await sb.from('scope_documents').select('*').order('created_at',{ascending:false});
    setDocs(data||[]);
  },[]);
  useEffect(()=>{loadDocs();},[loadDocs]);
  /* The file is private, so it is never on an address anybody can guess. Pressing Open
     asks Supabase for a link that works for two minutes and then stops working. */
  const openDoc=async d=>{
    if(!d.file_path) return;
    const {data,error}=await sb.storage.from('scope-docs').createSignedUrl(d.file_path,120);
    if(error||!data) return;
    window.open(data.signedUrl,'_blank','noopener');
  };
  /* ── throwing one away ──────────────────────────────────────────────────────────
     The same three uploads of the same bill of quantities pile up quickly, and there is
     no reason to keep looking at them. But this is the paper a price was built on, so it
     goes only when it is asked for twice, and it does not go at all once a quotation has
     been saved against it: that document is the evidence behind a number a client has
     been given, and losing it is losing the answer to "why did we say that". */
  const [armedDoc,setArmedDoc]=useState(null);
  const [docErr,setDocErr]=useState('');
  const [docBusy,setDocBusy]=useState(false);
  const removeDoc=async d=>{
    if(d.quotation_id){ setArmedDoc(null);
      return setDocErr('A quotation was built from '+(d.title||d.file_name)+', so it stays. '
        +'It is the paper behind a price a client has already been given.'); }
    setDocBusy(true); setDocErr('');
    // The file first. If the row went first and this failed, the file would sit in the
    // bucket for good with nothing left pointing at it.
    if(d.file_path){
      const {error}=await sb.storage.from('scope-docs').remove([d.file_path]);
      if(error){ setDocBusy(false); setArmedDoc(null);
        return setDocErr('The file could not be removed: '+error.message); }
    }
    const {error}=await sb.from('scope_documents').delete().eq('id',d.id);
    setDocBusy(false); setArmedDoc(null);
    if(error) return setDocErr(error.message);
    loadDocs();
  };
  const openScope=async()=>{
    const [pr,eq,pl]=await Promise.all([
      sb.from('products').select('*, product_aliases(alias), product_packs(*)'),
      sb.from('spec_equivalents').select('*'),
      sb.from('quotation_lines').select('description,product_id').not('product_id','is',null),
    ]);
    setKit({products:pr.data||[], equivalents:eq.data||[], pastLines:pl.data||[]});
    setScope(true);
  };

  if(!rows) return html`<div class="spinner"></div>`;
  if(openId) return html`<${QuotationEditor} id=${openId} clients=${clients} settings=${settings} go=${go}
      rate=${rate} offices=${offices} office=${office}
      back=${()=>{setOpenId(null);load();loadDocs();}}/>`;

  /* The reader hands back a set of sections. They are written to the same local draft the
     editor already restores after a crash, and then the blank editor is opened, which
     picks them up. Nothing is written to the database until Charles presses Save, so a
     draft he does not like costs him one press of Start again. */
  if(scope && kit) return html`<${ScopeReader} ...${kit} settings=${settings} rate=${rate}
      office=${office} me=${me}
      ${/* Backing out of the reader still leaves the document behind, because it is
            uploaded the moment it is chosen. The list has to be re-read or it shows the
            state before the upload and the document looks lost. */''}
      cancel=${()=>{setScope(false);loadDocs();}}
      done=${d=>{
        try{
          localStorage.setItem('bt-draft-new', JSON.stringify({
            from:'scope',
            seed:{ project_name: d.parsed.title || '',
                   client_name:  d.parsed.client || '',
                   notes:        d.notes || [],
                   internal:     d.internal || [] },
            secs:d.secs, at:Date.now()}));
        }catch(e){}
        setScope(false); setOpenId('new');
      }}/>`;

  // The office switcher decides what is on this list. Set it to Both and you get the
  // company, which is the view the owners actually want.
  // A row with no office at all is shown in every view rather than none. It should not
  // happen, since the migration gave every existing quotation an office, but a quotation
  // that quietly disappears off the list is far worse than one that appears twice.
  const shown = office ? rows.filter(r=>!r.office_id || r.office_id===office.id) : rows;
  const byOffice = {}; (offices||[]).forEach(o=>{ byOffice[o.id]=o; });

  return html`
    <div class="page-head"><h1>${_t('Quotations')+(office?' · '+office.name:'')}</h1>
      <button class="btn ghost sp" onClick=${openScope}
        title="Upload the client's document and it works out the draft">${_t("Read a scope")}</button>
      <button class="btn" onClick=${create}>${_t("New quotation")}</button></div>
    ${loadErr && html`<div class="err">Could not load quotations: ${loadErr}</div>`}
    <div class="panel">
      ${shown.length ? html`<div class="tw"><table>
        <thead><tr><th>${_t("Reference")}</th>${!office?html`<th>${_t("Office")}</th>`:''}<th>${_t("Client")}</th>
          <th>${_t("Project")}</th><th>${_t("Date")}</th>
          <th>${_t("Status")}</th><th class="n">${_t("Subtotal")}</th><th class="n">${_t("Margin")}</th></tr></thead>
        <tbody>${shown.map(r=>{
          const t=r.totals||{}; const sub=nz(t.subtotal); const gp=nz(t.gross_profit);
          const pct= sub? gp/sub*100 : null;
          return html`<tr key=${r.id} class="click" onClick=${()=>setOpenId(r.id)}>
            <td><b>${r.reference}${r.revision?' '+r.revision:''}</b></td>
            ${!office?html`<td class="muted">${(byOffice[r.office_id]||{}).name||'—'}</td>`:''}
            <td>${r.clients?.name||html`<span class="muted">not set</span>`}</td>
            <td>${r.project_name||'—'}</td>
            <td class="muted">${fmtDate(r.quote_date)}</td>
            <td><span class="pill ${r.status==='approved'?'won':r.status==='rejected'?'lost':'quoted'}">${r.status}</span></td>
            ${/* each row in its own money: a Belgian job stays in euros on a mixed list */''}
            <td class="n">${AED0(sub, r.currency)}</td>
            <td class="n" style=${{color:pct==null?'':pct<0?'var(--crit)':'var(--good)'}}>
              ${pct==null?'—':pct.toFixed(1)+'%'}</td>
          </tr>`;})}</tbody></table></div>`
        : html`<div class="empty">${(office?_t('Nothing here yet for')+' '+office.name+'. ':_t('No quotations yet.')+' ')
            +_t('New quotation opens a blank, and the number is issued when you save.')}</div>`}
    </div>

    ${/* What clients have actually sent us. Kept whether or not a quotation came of it,
          because the question six months from now is not only what we quoted but what we
          were asked for. */''}
    ${docs.length>0 && html`<div class="panel">
      <div class="panel-head"><h2>${_t('Scopes we have been sent')}</h2>
        <span class="sp muted">${docs.length} ${plural(docs.length,'document')}</span></div>
      ${docErr && html`<div class="err">${docErr}</div>`}
      <div class="tw"><table>
        <thead><tr><th>${_t('Document')}</th><th>${_t('Client')}</th>
          <th class="n">${_t('Items')}</th><th>${_t('Received')}</th><th></th></tr></thead>
        <tbody>${docs.map(d=>{
          const arm = armedDoc===d.id;
          return html`<tr key=${d.id} class=${arm?'armed-row':''}>
          <td><b>${d.title||d.file_name}</b>
            ${d.title && html`<div class="muted" style=${{fontSize:'12px'}}>${d.file_name}</div>`}
            ${d.note && html`<div class="muted" style=${{fontSize:'12px'}}>${d.note}</div>`}
            ${arm && html`<div class="muted" style=${{fontSize:'12px',marginTop:'4px'}}>${
              d.quotation_id
                ? _t('A quotation was built from this one, so it cannot be thrown away.')
                : _t('This removes the file and what was read out of it, for good.')}</div>`}</td>
          <td>${d.client_name||'—'}</td>
          <td class="n">${d.item_count!=null?d.item_count:'—'}</td>
          <td class="muted">${fmtDate(d.created_at)}</td>
          <td class="n"><div class="doc-acts">
            ${d.file_path && !arm && html`<button class="btn ghost small"
              onClick=${()=>openDoc(d)}>${_t('Open')}</button>`}
            ${arm && html`<button class="btn sec small"
              onClick=${()=>{setArmedDoc(null);setDocErr('');}}>${_t('Keep it')}</button>`}
            <button class=${'btn danger small'+(arm?' armed':'')} disabled=${docBusy}
              onClick=${()=>arm?removeDoc(d):(setDocErr(''),setArmedDoc(d.id))}>${
              arm ? _t('Delete for good') : _t('Remove')}</button>
          </div></td>
        </tr>`;})}</tbody></table></div>
    </div>`}`;
}



/* ══════════════ READING A PDF ══════════════
   A PDF does not contain a table. It contains instructions to draw glyph number 37 at
   x=412.5, y=680.2, and the fact that those glyphs line up into a column is something a
   human eye does, not something the file says. That is why a PDF is the hardest of the
   three formats and why it gets the most code.

   Four jobs, in order:

     1. pull the indirect objects out of the file, including the ones packed inside
        compressed object streams, and inflate every stream
     2. work out, for each font, what a byte in a string actually means, out of its
        ToUnicode map or its encoding differences
     3. walk the drawing instructions keeping track of where the text cursor is
     4. put the pieces back into lines and columns by their positions, so a quantity ends
        up beside its own description rather than three rows away

   Step 4 is the one that matters for a bill of quantities, and the one nothing else here
   needed to do. A gap wider than about an em is a column boundary, so it becomes a tab,
   which is exactly the shape the scope parser already reads.

   What it will not do is guess at a scanned PDF. Pictures of words have no words in
   them, and it says so rather than returning half a page. */

const pdfLatin = (() => {
  // WinAnsi where it differs from Latin-1, which covers the punctuation a spec uses
  const w = {128:0x20AC,130:0x201A,131:0x0192,132:0x201E,133:0x2026,134:0x2020,135:0x2021,
    136:0x02C6,137:0x2030,138:0x0160,139:0x2039,140:0x0152,142:0x017D,145:0x2018,
    146:0x2019,147:0x201C,148:0x201D,149:0x2022,150:0x2013,151:0x2014,152:0x02DC,
    153:0x2122,154:0x0161,155:0x203A,156:0x0153,158:0x017E,159:0x0178};
  return c => String.fromCharCode(w[c] || c);
})();

/* Tolerant on purpose. A PDF stream is almost always followed by a newline before the
   endstream keyword, and where the /Length is an indirect reference those bytes cannot be
   trimmed exactly without resolving it. DecompressionStream treats one stray byte after
   the end of the data as a broken stream and throws away everything it had already
   produced, so the output is collected chunk by chunk and a late error is ignored: by
   then the whole page has already come out. */
async function inflate(bytes, raw){
  const ds = new DecompressionStream(raw ? 'deflate-raw' : 'deflate');
  const w = ds.writable.getWriter();
  w.write(bytes).catch(()=>{});
  w.close().catch(()=>{});
  const r = ds.readable.getReader();
  const chunks = []; let n = 0;
  try{
    for(;;){ const { done, value } = await r.read(); if(done) break; chunks.push(value); n += value.length; }
  }catch(e){ /* trailing bytes after the deflate stream: keep what came out */ }
  if(!n) throw new Error('nothing inflated');
  const out = new Uint8Array(n); let at = 0;
  chunks.forEach(c => { out.set(c, at); at += c.length; });
  return out;
}

/* Every "N G obj … endobj" in the file, found by scanning rather than by trusting the
   cross reference table. Scanning is slower and much harder to break: a PDF that has
   been edited, appended to, or produced by something careless still reads. */
function pdfObjects(u8){
  const s = new TextDecoder('latin1').decode(u8);
  const objs = new Map();
  const re = /(\d+)\s+(\d+)\s+obj\b/g; let m;
  while((m = re.exec(s))){
    const num = Number(m[1]);
    const start = m.index + m[0].length;
    const end = s.indexOf('endobj', start);
    if(end < 0) continue;
    const body = s.slice(start, end);
    const sm = /\bstream\r?\n/.exec(body);
    let dict = body, stream = null;
    if(sm){
      dict = body.slice(0, sm.index);
      const dataStart = start + sm.index + sm[0].length;
      const len = /\/Length\s+(\d+)\b/.exec(dict);
      let dataEnd;
      if(len){
        dataEnd = dataStart + Number(len[1]);
        // a /Length that points somewhere silly means it was an indirect reference
        const tail = s.slice(dataEnd, dataEnd + 20);
        if(!/^\s*endstream/.test(tail)) dataEnd = -1;
      } else dataEnd = -1;
      if(dataEnd < 0){
        const es = s.indexOf('endstream', dataStart);
        dataEnd = es < 0 ? dataStart : es;
      }
      stream = u8.subarray(dataStart, dataEnd);
    }
    objs.set(num, { dict, stream });
  }
  return objs;
}

const pdfDeref = (v, objs) => {
  const m = /^\s*(\d+)\s+\d+\s+R\s*$/.exec(String(v||''));
  if(!m) return null;
  return objs.get(Number(m[1])) || null;
};

async function pdfStreamText(o, objs){
  if(!o || !o.stream) return '';
  const flate = /\/Filter\s*(\/FlateDecode|\[\s*\/FlateDecode\s*\])/.test(o.dict);
  if(!flate) return new TextDecoder('latin1').decode(o.stream);
  try{ return new TextDecoder('latin1').decode(await inflate(o.stream)); }
  catch(e){
    try{ return new TextDecoder('latin1').decode(await inflate(o.stream, true)); }
    catch(e2){ return ''; }
  }
}

/* PDF 1.5 onwards packs most of the small objects into one compressed stream, so a file
   can look empty of pages until these are unpacked. */
async function pdfExpandObjStm(objs){
  for(const [, o] of [...objs]){
    if(!o.stream || !/\/Type\s*\/ObjStm/.test(o.dict)) continue;
    const txt = await pdfStreamText(o, objs);
    if(!txt) continue;
    const n = Number((/\/N\s+(\d+)/.exec(o.dict)||[])[1] || 0);
    const first = Number((/\/First\s+(\d+)/.exec(o.dict)||[])[1] || 0);
    const head = txt.slice(0, first).trim().split(/\s+/).map(Number);
    for(let i = 0; i < n; i++){
      const num = head[i*2], off = head[i*2+1];
      if(!isFinite(num) || !isFinite(off)) continue;
      const next = (i+1 < n) ? first + head[(i+1)*2+1] : txt.length;
      if(!objs.has(num)) objs.set(num, { dict: txt.slice(first + off, next), stream: null });
    }
  }
}

/* What a byte in a string means. ToUnicode first, because it is the map the producer
   wrote for exactly this purpose; the encoding differences after, for older files. */
async function pdfFontMap(fontObj, objs){
  const out = { two: /\/Subtype\s*\/Type0/.test(fontObj.dict), map: new Map(), diff: new Map() };

  const tu = /\/ToUnicode\s+(\d+)\s+\d+\s+R/.exec(fontObj.dict);
  if(tu){
    const cm = await pdfStreamText(objs.get(Number(tu[1])), objs);
    const hex = h => h.replace(/\s+/g,'');
    const toStr = h => { let s=''; for(let i=0;i+3<h.length+1;i+=4) s+=String.fromCharCode(parseInt(h.substr(i,4),16)); return s; };
    let m;
    const bc = /beginbfchar([\s\S]*?)endbfchar/g;
    while((m = bc.exec(cm))){
      const pairs = m[1].match(/<([0-9A-Fa-f\s]+)>\s*<([0-9A-Fa-f\s]+)>/g) || [];
      pairs.forEach(p => {
        const q = /<([0-9A-Fa-f\s]+)>\s*<([0-9A-Fa-f\s]+)>/.exec(p);
        out.map.set(parseInt(hex(q[1]),16), toStr(hex(q[2])));
      });
    }
    const br = /beginbfrange([\s\S]*?)endbfrange/g;
    while((m = br.exec(cm))){
      const body = m[1];
      // <lo> <hi> <dst>
      const one = /<([0-9A-Fa-f\s]+)>\s*<([0-9A-Fa-f\s]+)>\s*<([0-9A-Fa-f\s]+)>/g; let r;
      while((r = one.exec(body))){
        const lo = parseInt(hex(r[1]),16), hi = parseInt(hex(r[2]),16);
        const base = parseInt(hex(r[3]).slice(-4),16);
        for(let c = lo; c <= hi && c - lo < 4096; c++)
          out.map.set(c, String.fromCharCode(base + (c - lo)));
      }
      // <lo> <hi> [ <d1> <d2> … ]
      const arr = /<([0-9A-Fa-f\s]+)>\s*<([0-9A-Fa-f\s]+)>\s*\[([\s\S]*?)\]/g;
      while((r = arr.exec(body))){
        const lo = parseInt(hex(r[1]),16);
        const items = r[3].match(/<([0-9A-Fa-f\s]+)>/g) || [];
        items.forEach((it, i) => out.map.set(lo + i, toStr(hex(it.slice(1,-1)))));
      }
    }
  }

  const enc = /\/Encoding\s+(\d+)\s+\d+\s+R/.exec(fontObj.dict);
  const encDict = enc ? (objs.get(Number(enc[1]))||{}).dict : fontObj.dict;
  const dm = /\/Differences\s*\[([\s\S]*?)\]/.exec(encDict || '');
  if(dm){
    const toks = dm[1].trim().split(/\s+/);
    let code = 0;
    const NAMES = { space:' ', hyphen:'-', period:'.', comma:',', colon:':', semicolon:';',
      slash:'/', parenleft:'(', parenright:')', percent:'%', ampersand:'&', quotesingle:"'",
      quotedblleft:'“', quotedblright:'”', quoteleft:'‘', quoteright:'’', endash:'–',
      emdash:'—', bullet:'•', multiply:'×', degree:'°', plus:'+', equal:'=' };
    toks.forEach(t => {
      if(/^\d+$/.test(t)) { code = Number(t); return; }
      const nm = t.replace(/^\//,'');
      let ch = NAMES[nm] || null;
      if(!ch && /^uni([0-9A-Fa-f]{4})$/.test(nm)) ch = String.fromCharCode(parseInt(nm.slice(3),16));
      if(!ch && nm.length === 1) ch = nm;
      if(ch) out.diff.set(code, ch);
      code++;
    });
  }
  return out;
}

const pdfDecodeString = (raw, font) => {
  let out = '';
  if(font && font.two){
    for(let i = 0; i + 1 < raw.length; i += 2){
      const c = (raw.charCodeAt(i) << 8) | raw.charCodeAt(i+1);
      out += font.map.get(c) ?? '';
    }
    return out;
  }
  for(let i = 0; i < raw.length; i++){
    const c = raw.charCodeAt(i);
    out += (font && font.map.get(c)) ?? (font && font.diff.get(c)) ?? pdfLatin(c);
  }
  return out;
};

/* A PDF string is either (…) with escapes or <hex>. */
function pdfReadString(s, i){
  if(s[i] === '<'){
    const end = s.indexOf('>', i);
    const hex = s.slice(i+1, end).replace(/[^0-9A-Fa-f]/g,'');
    let out = '';
    for(let k = 0; k + 1 < hex.length; k += 2) out += String.fromCharCode(parseInt(hex.substr(k,2),16));
    return { text: out, next: end + 1 };
  }
  let depth = 0, out = '', k = i;
  for(; k < s.length; k++){
    const c = s[k];
    if(c === '\\'){
      const n = s[k+1];
      if(n === 'n') out += '\n'; else if(n === 'r') out += '\r';
      else if(n === 't') out += '\t'; else if(n === 'b') out += '\b';
      else if(n === 'f') out += '\f';
      else if(n >= '0' && n <= '7'){
        let oct = ''; let j = k + 1;
        while(j < s.length && oct.length < 3 && s[j] >= '0' && s[j] <= '7') oct += s[j++];
        out += String.fromCharCode(parseInt(oct, 8)); k = j - 1; continue;
      }
      else if(n === '\n'){ k++; continue; }
      else out += n;
      k++; continue;
    }
    if(c === '('){ depth++; if(depth === 1) continue; }
    if(c === ')'){ depth--; if(depth === 0) return { text: out, next: k + 1 }; }
    if(depth >= 1) out += c;
  }
  return { text: out, next: k };
}

/* The drawing instructions, walked with just enough state to know where each piece of
   text was put on the page. */
function pdfRunsFromContent(content, fonts){
  const runs = [];
  const mul = (a, b) => [
    a[0]*b[0] + a[1]*b[2],         a[0]*b[1] + a[1]*b[3],
    a[2]*b[0] + a[3]*b[2],         a[2]*b[1] + a[3]*b[3],
    a[4]*b[0] + a[5]*b[2] + b[4],  a[4]*b[1] + a[5]*b[3] + b[5],
  ];
  let ctm = [1,0,0,1,0,0], stack = [];
  let tm = [1,0,0,1,0,0], tlm = [1,0,0,1,0,0];
  let font = null, size = 12, leading = 0;
  const ops = [];

  /* Marked content. A tagged PDF wraps every piece of text in "/P <</MCID 7>> BDC …
     EMC", and that number is the thread back to the structure tree, which knows which
     table cell the text was in. Carrying it on the run is what lets a table be read
     rather than reconstructed. */
  const mcStack = [];
  const curMcid = () => { for(let k = mcStack.length-1; k >= 0; k--)
    if(mcStack[k] !== null) return mcStack[k]; return null; };

  const flush = txt => {
    if(!txt) return;
    const m = mul(tm, ctm);
    runs.push({ x: m[4], y: m[5], size: Math.abs(size * (tm[3] || 1)), text: txt,
                mcid: curMcid() });
  };
  const advance = w => { tm = mul([1,0,0,1,w,0], tm); };

  let i = 0;
  const num = t => { const v = parseFloat(t); return isFinite(v) ? v : 0; };
  while(i < content.length){
    const c = content[i];
    /* A dictionary opens and closes with two characters, and they have to be stepped
       over as a pair. Skipping them one at a time leaves the second < looking exactly
       like the start of a hex string, so pdfReadString ran off and ate "/MCID 0 " and
       every tagged PDF lost its marked content numbers. */
    if(c === '<' && content[i+1] === '<'){ i += 2; continue; }
    if(c === '>' && content[i+1] === '>'){ i += 2; continue; }
    if(c === '(' || c === '<'){
      const r = pdfReadString(content, i);
      ops.push({ str: r.text }); i = r.next; continue;
    }
    if(c === '[' || c === ']'){ ops.push({ tok: c }); i++; continue; }
    if(/\s/.test(c)){ i++; continue; }
    let j = i;
    /* > closes a dictionary and a producer is entitled to write ">>BDC" with no space
       between them. Without > as a delimiter that reads as one word called ">>BDC",
       the marked content operator never fires, and a tagged PDF loses the one thing
       that makes it readable. */
    while(j < content.length && !/[\s\(\[\]<>]/.test(content[j])) j++;
    const t = content.slice(i, j); i = j === i ? i + 1 : j;
    if(!t) continue;

    switch(t){
      case 'q': stack.push(ctm.slice()); break;
      case 'Q': ctm = stack.pop() || [1,0,0,1,0,0]; break;
      case 'BDC': {
        // the operands are still in ops: /P /MCID 7 >>  (the << is skipped by the
        // tokeniser, which does not matter, only the number does)
        let id = null;
        for(let k = 0; k < ops.length - 1; k++)
          if(ops[k].tok === '/MCID' && /^\d+$/.test(ops[k+1].tok||'')) id = Number(ops[k+1].tok);
        mcStack.push(id);
        break; }
      case 'BMC': mcStack.push(null); break;
      case 'EMC': mcStack.pop(); break;
      case 'cm': {
        const a = ops.slice(-6).map(o => num(o.tok));
        if(a.length === 6) ctm = mul(a, ctm);
        break; }
      case 'BT': tm = [1,0,0,1,0,0]; tlm = tm.slice(); break;
      case 'ET': break;
      case 'Tf': {
        const nm = ops[ops.length-2] && ops[ops.length-2].tok;
        size = num(ops[ops.length-1] && ops[ops.length-1].tok);
        font = fonts[(nm||'').replace(/^\//,'')] || null;
        break; }
      case 'TL': leading = num(ops[ops.length-1].tok); break;
      case 'Td': {
        const ty = num(ops[ops.length-1].tok), tx = num(ops[ops.length-2].tok);
        tlm = mul([1,0,0,1,tx,ty], tlm); tm = tlm.slice(); break; }
      case 'TD': {
        const ty = num(ops[ops.length-1].tok), tx = num(ops[ops.length-2].tok);
        leading = -ty;
        tlm = mul([1,0,0,1,tx,ty], tlm); tm = tlm.slice(); break; }
      case 'Tm': {
        const a = ops.slice(-6).map(o => num(o.tok));
        if(a.length === 6){ tlm = a.slice(); tm = a.slice(); }
        break; }
      case 'T*': tlm = mul([1,0,0,1,0,-leading], tlm); tm = tlm.slice(); break;
      case 'Tj': case "'": case '"': {
        if(t !== 'Tj'){ tlm = mul([1,0,0,1,0,-leading], tlm); tm = tlm.slice(); }
        const last = [...ops].reverse().find(o => o.str !== undefined);
        const txt = last ? pdfDecodeString(last.str, font) : '';
        flush(txt);
        advance(txt.length * size * 0.5);
        break; }
      case 'TJ': {
        // everything back to the opening bracket, in order
        let k = ops.length - 1, depth = 0, from = 0;
        for(; k >= 0; k--){ if(ops[k].tok === ']') depth++;
          if(ops[k].tok === '['){ if(depth === 0){ from = k; break; } depth--; } }
        let txt = '';
        for(let q = from + 1; q < ops.length; q++){
          const o = ops[q];
          if(o.str !== undefined) txt += pdfDecodeString(o.str, font);
          else if(o.tok !== undefined && /^-?[\d.]+$/.test(o.tok)){
            const kern = -num(o.tok) / 1000 * size;
            // a big negative kern inside a TJ is a space the producer did not write
            if(kern > size * 0.18) txt += ' ';
          }
        }
        flush(txt);
        advance(txt.length * size * 0.5);
        break; }
      default: ops.push({ tok: t }); continue;      // an operand, keep it for the operator
    }
    /* An operator consumes its operands. Without this the list grows for the whole page
       and every TJ concatenates everything that came before it, so each line comes out
       carrying the entire document up to that point. */
    ops.length = 0;
  }
  return runs;
}

/* ══════════════ THE TABLE THE DOCUMENT ALREADY KNOWS ABOUT ══════════════
   Everything below this was written to work out where a table's rows and columns are by
   looking at where the words landed on the page. That is the only thing you can do with
   a PDF printed from a drawing program, and it is a guess. It guessed wrong on Charles's
   market floor bill, and the way it guessed wrong is instructive: the word "Description"
   is centred over its column, so its x is nowhere near the x of the descriptions
   underneath it, and the header could not be matched to its own data.

   But a PDF made by Word, which is what a consultant sends, is TAGGED. Inside it is a
   structure tree that says, in the producer's own words, this is a Table, this is a Row,
   this is a Cell, and the text in that cell is marked content number 7. There is nothing
   to work out. The rows are in the file.

   So this is tried first and the geometry is the fallback. On a tagged bill it is exact;
   on an untagged one it returns nothing and the old path runs.

   Two pieces: a walker over the structure tree that says which cell each marked content
   number belongs to, and an assembler that turns that into tab separated rows. */

/* The raw text of one key's value, with brackets and dictionaries balanced, because
   /K [<</Type/MCR/MCID 3>> 7 0 R] cannot be read with a regular expression. */
function pdfValueOf(dict, key){
  const at = String(dict||'').indexOf(key);
  if(at < 0) return '';
  let i = at + key.length;
  while(i < dict.length && /\s/.test(dict[i])) i++;
  if(dict[i] === '['){
    let depth = 0;
    for(let j = i; j < dict.length; j++){
      if(dict[j] === '[') depth++;
      else if(dict[j] === ']'){ depth--; if(!depth) return dict.slice(i, j+1); }
    }
    return dict.slice(i);
  }
  if(dict[i] === '<' && dict[i+1] === '<'){
    let depth = 0;
    for(let j = i; j < dict.length - 1; j++){
      if(dict[j] === '<' && dict[j+1] === '<'){ depth++; j++; }
      else if(dict[j] === '>' && dict[j+1] === '>'){ depth--; j++; if(!depth) return dict.slice(i, j+1); }
    }
    return dict.slice(i);
  }
  // a reference, a name or a number
  const m = /^(\d+\s+\d+\s+R|\/[^\s\/\[\]<>()]+|-?[\d.]+)/.exec(dict.slice(i));
  return m ? m[1] : '';
}

/* Walks the tree and returns, per page object number, which table cell every marked
   content number sits in. */
function pdfStructMap(objs){
  const byPage = new Map();          // page object number -> Map(mcid -> {t,r,c,head})
  let root = null;
  for(const [, o] of objs) if(/\/Type\s*\/Catalog/.test(o.dict)){
    const m = /\/StructTreeRoot\s+(\d+)\s+\d+\s+R/.exec(o.dict);
    if(m) root = Number(m[1]);
  }
  if(root === null) return byPage;

  const put = (page, mcid, cell) => {
    if(page === null || mcid === null || !cell) return;
    if(!byPage.has(page)) byPage.set(page, new Map());
    const m = byPage.get(page);
    if(!m.has(mcid)) m.set(mcid, cell);
  };

  const refNum = v => { const m = /^(\d+)\s+\d+\s+R$/.exec(String(v||'').trim());
    return m ? Number(m[1]) : null; };

  // the children of a /K value, in order: numbers are marked content, dictionaries are
  // references to marked content on a named page, and refs are more structure elements
  const childrenOf = raw => {
    const s = String(raw||'').trim();
    const out = [];
    if(!s) return out;
    const body = s.startsWith('[') ? s.slice(1, -1) : s;
    const re = /(<<[\s\S]*?>>)|(\d+\s+\d+\s+R)|(-?\d+)/g;
    let m;
    while((m = re.exec(body))){
      if(m[1]) out.push({ dict:m[1] });
      else if(m[2]) out.push({ ref: refNum(m[2]) });
      else out.push({ mcid: Number(m[3]) });
    }
    return out;
  };

  let tables = 0;
  /* The row and cell counters have to live with the table rather than with the
     recursion, or a nested element restarts them halfway down. */
  const state = { rowOf: new Map(), colOf: new Map() };

  const walkKids = (dict, ctx, depth) => {
    const kids = childrenOf(pdfValueOf(dict, '/K'));
    kids.forEach(k => {
      if(k.mcid !== undefined) put(ctx.page, k.mcid, ctx.cell);
      else if(k.dict){
        const id = /\/MCID\s+(\d+)/.exec(k.dict);
        const pg = refNum((/\/Pg\s+(\d+\s+\d+\s+R)/.exec(k.dict)||[])[1]);
        if(id) put(pg === null ? ctx.page : pg, Number(id[1]), ctx.cell);
      }
      else if(k.ref !== null && k.ref !== undefined) step(k.ref, ctx, depth + 1);
    });
  };

  const step = (num, ctx, depth) => {
    if(depth > 60) return;
    const o = objs.get(num); if(!o) return;
    const dict = o.dict;
    const role = (pdfValueOf(dict, '/S') || '').replace(/^\//,'');
    const pgRef = refNum(pdfValueOf(dict, '/Pg'));
    const next = { ...ctx };
    if(pgRef !== null) next.page = pgRef;

    if(role === 'Table'){ next.t = ++tables; state.rowOf.set(next.t, 0); next.cell = null; }
    else if(role === 'TR' && next.t){
      const r = state.rowOf.get(next.t) + 1;
      state.rowOf.set(next.t, r);
      next.r = r; state.colOf.set(next.t + ':' + r, 0);
      next.cell = null;
    }
    else if((role === 'TD' || role === 'TH') && next.t && next.r){
      const ck = next.t + ':' + next.r;
      const c = (state.colOf.get(ck) || 0) + 1;
      state.colOf.set(ck, c);
      // a cell that spans columns still starts where it starts, which is all that matters
      next.cell = { t: next.t, r: next.r, c, head: role === 'TH' };
      const span = Number((/\/ColSpan\s+(\d+)/.exec(pdfValueOf(dict,'/A')||dict)||[])[1] || 1);
      if(span > 1) state.colOf.set(ck, c + span - 1);
    }
    walkKids(dict, next, depth);
  };

  step(root, { page:null, t:0, r:0, cell:null }, 0);
  return byPage;
}

/* The runs of one page, grouped by the cell the document says they were in, written out
   as one line per row with a tab between cells. */
function pdfTaggedText(runs, cellMap){
  if(!cellMap || !cellMap.size) return null;
  const cells = new Map();     // "t:r:c" -> {t,r,c,head,parts,y}
  const loose = [];
  runs.forEach(rn => {
    const cell = rn.mcid === null || rn.mcid === undefined ? null : cellMap.get(rn.mcid);
    if(!cell){ loose.push(rn); return; }
    const k = cell.t + ':' + cell.r + ':' + cell.c;
    let e = cells.get(k);
    if(!e){ e = { ...cell, parts: [], y: rn.y }; cells.set(k, e); }
    e.parts.push(rn);
    e.y = Math.max(e.y, rn.y);
  });
  if(cells.size < 4) return null;      // not enough of a table to be worth trusting

  // the rows, in the order the tree gave them
  const rows = new Map();
  cells.forEach(e => {
    const k = e.t + ':' + e.r;
    let row = rows.get(k);
    if(!row){ row = { t:e.t, r:e.r, y:e.y, cells:[] }; rows.set(k, row); }
    row.cells.push(e);
    row.y = Math.max(row.y, e.y);
  });

  const blocks = [];
  rows.forEach(row => {
    row.cells.sort((a,b) => a.c - b.c);
    const wide = row.cells[row.cells.length-1].c;
    const text = [];
    for(let c = 1; c <= wide; c++){
      const e = row.cells.find(x => x.c === c);
      text.push(e ? e.parts.sort((a,b) => (b.y - a.y) || (a.x - b.x))
                     .map(p => p.text).join(' ').replace(/\s+/g,' ').trim() : '');
    }
    // a row where every cell but one is empty is a heading inside the table, not a row
    blocks.push({ y: row.y, text: text.join('\t').replace(/\t+$/,'') });
  });

  // and whatever was not in the table, in the place on the page where it was
  pdfLines(loose).forEach(l => blocks.push({ y: l.y, text: pdfJoinLine(l.parts) }));

  blocks.sort((a,b) => b.y - a.y);
  const out = blocks.map(b => b.text).filter(t => t.trim()).join('\n');
  return out.trim() ? out : null;
}

/* ── putting a drawn table back together ───────────────────────────────────────
   The first version of this joined runs into lines and called a wide gap a tab. That
   works for a simple table and falls apart on a real bill of quantities, because a
   consultant's table centres the serial number in its cell. When the description wraps,
   the number lands on the MIDDLE line of the row, with the unit and quantity beside it,
   and the description lines sit above and below it. Read as lines, item 1 comes out as
   three unrelated fragments and nothing parses at all. That is exactly what happened to
   the Waterfront bill.

   So the columns are found first, from where the words actually sit, and the rows are
   anchored on the serial numbers: every other line belongs to whichever serial number
   it is nearest to. Then the row is written out in one piece.

   It also stops assuming the column order. Charles's bill runs SN, Description, unit,
   quantity; the one before it ran No, Description, Quantity, Unit. The header says
   which is which, so the header is read rather than guessed at. */

const pdfLines = runs => {
  const lines = [];
  runs.slice().sort((a,b) => (b.y - a.y) || (a.x - b.x)).forEach(r => {
    if(!String(r.text).trim()) return;
    const tol = Math.max(2, (r.size || 10) * 0.4);
    const line = lines.find(l => Math.abs(l.y - r.y) <= tol);
    if(line){ line.parts.push(r); }
    else lines.push({ y: r.y, parts: [r] });
  });
  lines.forEach(l => l.parts.sort((a,b) => a.x - b.x));
  return lines;
};

const pdfJoinLine = parts => {
  let out = '', prevEnd = null, prevSize = 10;
  parts.forEach(p => {
    const w = String(p.text).length * (p.size || 10) * 0.5;
    if(prevEnd !== null){
      const gap = p.x - prevEnd;
      if(gap > (prevSize || 10) * 1.1) out += '\t';
      else if(gap > (prevSize || 10) * 0.12 && !/\s$/.test(out)) out += ' ';
    }
    out += p.text;
    prevEnd = p.x + w; prevSize = p.size || 10;
  });
  return out.replace(/[ \t]+$/,'');
};

/* Which column each word is in. Columns are clusters of left edges: everything in a
   column starts at the same x, which is what a table is. */
function pdfColumns(lines){
  const xs = [];
  lines.forEach(l => l.parts.forEach(p => xs.push(p.x)));
  xs.sort((a,b) => a - b);
  const cols = [];
  xs.forEach(x => {
    const last = cols[cols.length - 1];
    if(last && x - last.x <= 6){ last.n++; last.x = Math.min(last.x, x); }
    else cols.push({ x, n: 1 });
  });
  return cols.filter(c => c.n >= 2).map(c => c.x);
}

const pdfCellOf = (x, cols) => {
  let at = 0;
  for(let i = 0; i < cols.length; i++) if(x >= cols[i] - 3) at = i;
  return at;
};

/* The header tells us the order of the columns, so neither the order nor the names have
   to be assumed. */
function pdfHeaderRoles(line, cols){
  const roles = {};
  let seen = 0;
  line.parts.forEach(p => {
    const t = String(p.text).trim().toLowerCase().replace(/[^a-z]/g,'');
    const c = pdfCellOf(p.x, cols);
    if(/^(sn|sno|srno|no|item|itemno|ref)$/.test(t))         { roles[c] = 'sn';   seen++; }
    else if(/^(description|descriptions|particulars|item)$/.test(t)) { roles[c] = 'desc'; seen++; }
    else if(/^(unit|units|uom|unitofmeasure)$/.test(t))      { roles[c] = 'unit'; seen++; }
    else if(/^(quantity|qty|quantities|qnty)$/.test(t))      { roles[c] = 'qty';  seen++; }
    else if(/^(rate|price|unitrate)$/.test(t))               { roles[c] = 'rate'; }
    else if(/^(amount|total)$/.test(t))                      { roles[c] = 'amount'; }
  });
  return seen >= 3 ? roles : null;
}

function pdfTableText(lines){
  const cols = pdfColumns(lines);
  if(cols.length < 3) return null;

  const cellText = (line, col) => line.parts.filter(p => pdfCellOf(p.x, cols) === Number(col))
    .map(p => p.text).join(' ').replace(/\s+/g,' ').trim();

  /* A page can hold more than one table: the car park bill has the main one and then an
     Optional one, each with its own header. Treating the page as a single table put the
     optional item into the row above it and swallowed the notes underneath, which is a
     quiet way to lose an item off a quotation. So every header is found, and a header is
     a hard boundary that nothing may be joined across. */
  const headers = [];
  let roles = null;
  lines.forEach((l, i) => {
    const r = pdfHeaderRoles(l, cols);
    if(r){ headers.push(i); if(!roles) roles = r; }
  });
  if(!roles || !headers.length) return null;
  const snCol = Object.keys(roles).find(k => roles[k] === 'sn');
  if(snCol === undefined) return null;

  const isHeader = new Set(headers);
  /* A word standing alone in a bill is a heading, not part of a row: Optional, Notes,
     Remarks. It ends whatever table was running. */
  const STANDALONE = /^(optional|notes?|remarks?|general|preamble|summary|total)\b/i;

  const anchors = [];
  lines.forEach((l, i) => {
    if(isHeader.has(i)) return;
    const v = cellText(l, snCol);
    const whole = pdfJoinLine(l.parts).trim();
    if(STANDALONE.test(whole)) return;
    if(/^\d{1,3}[\.\)]?$/.test(v)) anchors.push({ i, y: l.y, no: v.replace(/[^\d]/g,'') });
  });
  if(anchors.length < 2) return null;

  // how far apart the lines of this page are, so "too far to be the same row" has a
  // number behind it rather than a guess
  const ys = lines.map(l => l.y).sort((a,b) => b - a);
  const gaps = [];
  for(let i = 1; i < ys.length; i++){ const g = ys[i-1] - ys[i]; if(g > 1 && g < 60) gaps.push(g); }
  gaps.sort((a,b) => a - b);
  const lineH = gaps.length ? gaps[Math.floor(gaps.length/2)] : 12;
  const reach = lineH * 3.2;

  /* Two layouts, and they need opposite rules.

     Where the serial number sits at the TOP of its cell, its own description starts on
     the same line and the rest of it follows underneath: a row runs downwards from its
     number to just before the next one.

     Where the number is CENTRED, it lands in the middle of a wrapped description, with
     lines above it as well as below, and it usually sits alone on its line with only the
     unit and the quantity for company.

     Which one this document is can be measured rather than guessed: look at whether the
     numbered lines carry any description of their own. */
  const descCol = Object.keys(roles).find(k => roles[k] === 'desc');
  const carrying = anchors.filter(a => cellText(lines[a.i], descCol)).length;
  const topAligned = carrying >= Math.max(2, Math.ceil(anchors.length * 0.6));

  const rows = anchors.map(a => ({ i: a.i, no: a.no, desc: [], unit: '', qty: '' }));
  const owner = new Array(lines.length).fill(-1);

  lines.forEach((l, i) => {
    if(isHeader.has(i)) return;
    const whole = pdfJoinLine(l.parts).trim();
    if(STANDALONE.test(whole)) return;
    let best = -1, bestD = Infinity;
    anchors.forEach((a, k) => {
      // nothing joins across a header, which is what keeps two tables apart
      const lo = Math.min(a.i, i), hi = Math.max(a.i, i);
      for(const h of headers) if(h > lo && h < hi) return;
      if(topAligned && a.i > i) return;        // a row never reaches back up above itself
      const d = Math.abs(a.y - l.y);
      if(d < bestD){ bestD = d; best = k; }
    });
    if(best < 0 || bestD > reach) return;      // too far away to be part of any row
    owner[i] = best;
    const row = rows[best];
    Object.keys(roles).forEach(c => {
      const t = cellText(l, c);
      if(!t) return;
      if(roles[c] === 'desc') row.desc.push(t);
      else if(roles[c] === 'unit' && !row.unit) row.unit = t;
      else if(roles[c] === 'qty'  && !row.qty)  row.qty  = t;
    });
  });

  // written out in the order the page has them, with everything that is not table
  // content left exactly where it was
  const out = [];
  const done = new Set();
  let any = false;
  lines.forEach((l, i) => {
    if(isHeader.has(i)){ out.push('No.\tDescription\tQuantity\tUnit'); return; }
    const k = owner[i];
    if(k < 0){ out.push(pdfJoinLine(l.parts)); return; }
    if(done.has(k)) return;
    done.add(k);
    const r = rows[k];
    if(r.desc.length && r.qty){
      out.push([r.no, r.desc.join(' ').replace(/\s+/g,' ').trim(), r.qty, r.unit].join('\t'));
      any = true;
    } else out.push(pdfJoinLine(l.parts));
  });
  return any ? out.join('\n') : null;
}

/* Where no header could be found and the lines are joined as they fall, a cell that was
   too long for its column is still spread over several lines with only the first
   carrying the quantity. This puts those back together. It is the fallback: where the
   header was found, the table has already been rebuilt properly above. */
function pdfStitchRows(text){
  const ROW  = /^(\d{1,3})[\t ]+([\s\S]*?)[\t ]+([\d][\d,\.]*)[\t ]+([^\t]{1,14})$/;
  const STOP = /^(optional|notes?|no\.?\b|annex|appendix|section|part)\b/i;
  const out = [];
  let open = null;
  const close = () => {
    if(!open) return;
    out.push(open.no + '\t' + open.desc.replace(/\s+/g,' ').trim()
             + '\t' + open.qty + '\t' + open.unit);
    open = null;
  };
  String(text).split('\n').forEach(raw => {
    const line = raw.replace(/\s+$/, '');
    const t = line.trim();
    const m = ROW.exec(t);
    if(m){ close(); open = { no:m[1], desc:m[2], qty:m[3], unit:m[4].trim() }; return; }
    if(!t || STOP.test(t)){ close(); out.push(line); return; }
    if(open){ open.desc += ' ' + t; return; }
    out.push(line);
  });
  close();
  return out.join('\n');
}

function pdfRunsToText(runs){
  if(!runs.length) return '';
  const lines = pdfLines(runs);
  const table = pdfTableText(lines);
  if(table) return table;
  return lines.map(l => pdfJoinLine(l.parts)).join('\n');
}

async function pdfToText(buf){
  const u8 = new Uint8Array(buf);
  const objs = pdfObjects(u8);
  await pdfExpandObjStm(objs);

  // pages, in the order the document puts them
  const pages = [];
  const seen = new Set();
  const walk = async (num, depth) => {
    if(depth > 40 || seen.has(num)) return;
    seen.add(num);
    const o = objs.get(num); if(!o) return;
    if(/\/Type\s*\/Pages/.test(o.dict)){
      const kids = /\/Kids\s*\[([\s\S]*?)\]/.exec(o.dict);
      if(kids) for(const k of kids[1].match(/(\d+)\s+\d+\s+R/g) || [])
        await walk(Number(/(\d+)/.exec(k)[1]), depth + 1);
      return;
    }
    if(/\/Type\s*\/Page\b/.test(o.dict)) pages.push({ num, o });
  };
  for(const [num, o] of objs) if(/\/Type\s*\/Catalog/.test(o.dict)){
    const r = /\/Pages\s+(\d+)\s+\d+\s+R/.exec(o.dict);
    if(r) await walk(Number(r[1]), 0);
  }
  if(!pages.length) for(const [num, o] of objs)
    if(/\/Type\s*\/Page\b/.test(o.dict)) pages.push({ num, o });

  // what the document itself says its tables are, if it says anything
  let struct = new Map();
  try{ struct = pdfStructMap(objs); }catch(e){ struct = new Map(); }

  const out = [];
  let images = 0;
  for(const { num: pageNum, o: page } of pages){
    // the fonts this page uses, by the name the content stream calls them
    const fonts = {};
    let res = /\/Resources\s*<<([\s\S]*?)>>\s*(?:\/|$)/.exec(page.dict);
    let resText = res ? res[1] : '';
    const resRef = /\/Resources\s+(\d+)\s+\d+\s+R/.exec(page.dict);
    if(resRef) resText = (objs.get(Number(resRef[1]))||{}).dict || '';
    const fontBlock = /\/Font\s*<<([\s\S]*?)>>/.exec(resText);
    let fontText = fontBlock ? fontBlock[1] : '';
    const fontRef = /\/Font\s+(\d+)\s+\d+\s+R/.exec(resText);
    if(fontRef) fontText = (objs.get(Number(fontRef[1]))||{}).dict || '';
    for(const fm of fontText.match(/\/([A-Za-z0-9#+.\-]+)\s+(\d+)\s+\d+\s+R/g) || []){
      const q = /\/([A-Za-z0-9#+.\-]+)\s+(\d+)/.exec(fm);
      const fo = objs.get(Number(q[2]));
      if(fo) fonts[q[1]] = await pdfFontMap(fo, objs);
    }
    if(/\/Subtype\s*\/Image/.test(resText)) images++;

    // the content, which may be one stream or several
    const cRefs = [];
    const cOne = /\/Contents\s+(\d+)\s+\d+\s+R/.exec(page.dict);
    const cArr = /\/Contents\s*\[([\s\S]*?)\]/.exec(page.dict);
    if(cArr) for(const k of cArr[1].match(/(\d+)\s+\d+\s+R/g) || []) cRefs.push(Number(/(\d+)/.exec(k)[1]));
    else if(cOne) cRefs.push(Number(cOne[1]));

    let content = '';
    for(const r of cRefs) content += (await pdfStreamText(objs.get(r), objs)) + '\n';
    if(!content.trim()) continue;
    const runs = pdfRunsFromContent(content, fonts);
    /* The tagged reading first. It is not a reconstruction: the producer wrote down
       which cell each piece of text was in, so where it works there is nothing left to
       get wrong. Where the file is not tagged it returns nothing and the geometry runs. */
    let text = null;
    try{ text = pdfTaggedText(runs, struct.get(pageNum)); }catch(e){ text = null; }
    if(!text) text = pdfRunsToText(runs);
    if(text.trim()) out.push(text);
  }

  /* normaliseColumns because a tagged table comes out in the document's own column
     order, and this bill runs SN, Description, unit, quantity while the last one ran
     No, Description, Quantity, Unit. The header row says which, so it is read. */
  const joined = normaliseColumns(
    pdfStitchRows(out.join('\n\n')).replace(/\n{3,}/g, '\n\n').trim());
  if(!joined){
    throw new Error(images
      ? 'That PDF is a scan: its pages are pictures, and a picture of a table has no '
        + 'numbers in it that can be read. The file is kept. Paste the table in.'
      : 'No text could be read out of that PDF. The file is kept. Paste the table in.');
  }
  return joined;
}


/* ══════════════ READING THE FILE ITSELF ══════════════
   A .docx and a .xlsx are both zip archives of XML. The browser can already inflate a
   deflate stream, so both can be opened here with no library and nothing loaded from a
   CDN, which is what keeps this free and what keeps it working behind the egress rules.

   What comes out is plain text in the same shape the paste box expects: one line per
   paragraph or row, columns separated by tabs. Everything downstream is unchanged, so a
   pasted scope and an uploaded one go through exactly the same parser and get exactly
   the same answer. */

/* The central directory of a zip, read backwards from the end-of-directory record. Only
   what is needed: the name of each entry and where its data starts. */
async function zipEntries(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  // find the End Of Central Directory, scanning back over the comment
  let eo = -1;
  for(let i = u8.length - 22; i >= 0 && i > u8.length - 22 - 65536; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eo = i; break; }
  }
  if(eo < 0) throw new Error('not a zip file');
  const count = dv.getUint16(eo + 10, true);
  let p = dv.getUint32(eo + 16, true);

  const out = [];
  for(let n = 0; n < count; n++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method  = dv.getUint16(p + 10, true);
    const csize   = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extLen  = dv.getUint16(p + 30, true);
    const cmtLen  = dv.getUint16(p + 32, true);
    const lho     = dv.getUint32(p + 42, true);
    const name    = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nameLen));
    out.push({ name, method, csize, lho });
    p += 46 + nameLen + extLen + cmtLen;
  }
  return { dv, u8, entries: out };
}

async function zipRead(buf, wanted){
  const { dv, u8, entries } = await zipEntries(buf);
  const e = entries.find(x => x.name === wanted);
  if(!e) return null;
  // the local header repeats the name and extra field, and only it has the real lengths
  const nameLen = dv.getUint16(e.lho + 26, true);
  const extLen  = dv.getUint16(e.lho + 28, true);
  const start   = e.lho + 30 + nameLen + extLen;
  const data    = u8.subarray(start, start + e.csize);
  if(e.method === 0) return new TextDecoder().decode(data);      // stored, not compressed
  if(e.method !== 8) throw new Error('unsupported compression in the file');
  const ds = new DecompressionStream('deflate-raw');
  const out = new Response(new Blob([data]).stream().pipeThrough(ds));
  return new TextDecoder().decode(await out.arrayBuffer());
}

/* There is no standard order for the columns of a bill of quantities. Charles's market
   floor bill runs SN, Description, unit, quantity; the car park one ran No, Description,
   Quantity, Unit; the next one will do something else. So wherever a header can be
   found, the columns are put into one order here and everything downstream reads that
   one order. The PDF reader does this from the geometry; this does it from the tabs, for
   Word, Excel, CSV and anything pasted. */
const BOQ_ROLE = t => {
  const w = String(t||'').trim().toLowerCase().replace(/[^a-z]/g,'');
  if(/^(sn|sno|srno|no|item|itemno|ref|slno)$/.test(w))                 return 'sn';
  if(/^(description|descriptions|particulars|scope|work|works)$/.test(w)) return 'desc';
  if(/^(unit|units|uom|unitofmeasure|measure)$/.test(w))                return 'unit';
  if(/^(quantity|qty|quantities|qnty|quant)$/.test(w))                  return 'qty';
  return null;
};

function normaliseColumns(text){
  const lines = String(text||'').split('\n');
  let hi = -1, roles = null;
  for(let i = 0; i < lines.length; i++){
    const cells = lines[i].split('\t');
    if(cells.length < 3) continue;
    const r = cells.map(BOQ_ROLE);
    const seen = r.filter(Boolean).length;
    if(seen >= 3 && r.includes('desc') && r.includes('qty')){ hi = i; roles = r; break; }
  }
  if(!roles) return text;
  // already in the order everything downstream expects
  const want = ['sn','desc','qty','unit'];
  const order = roles.filter(Boolean);
  if(want.every((w,k) => order[k] === w)) return text;

  const at = k => roles.indexOf(k);
  const out = lines.slice(0, hi).concat(['No.\tDescription\tQuantity\tUnit']);
  lines.slice(hi + 1).forEach(l => {
    const c = l.split('\t');
    if(c.length < roles.length){ out.push(l); return; }
    const pick = k => (at(k) >= 0 ? (c[at(k)] || '') : '').trim();
    const row = [pick('sn'), pick('desc'), pick('qty'), pick('unit')];
    out.push(row.some(x => x) ? row.join('\t') : l);
  });
  return out.join('\n');
}

const xmlText = s => String(s||'')
  .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
  .replace(/&apos;/g,"'").replace(/&#(\d+);/g, (m,d)=>String.fromCharCode(+d))
  .replace(/&amp;/g,'&');

/* Word. A paragraph is a line and a table cell is a tab, which is exactly the shape the
   parser already expects from a table pasted out of Word. */
function docxToText(xml){
  /* Tables have to be pulled out and converted on their own, before anything else. A
     table cell contains paragraphs, so treating every </w:p> as a line break puts each
     cell of a bill of quantities on its own line and the quantity is no longer beside
     its description. Inside a cell a paragraph is a space; a cell is a tab; a row is a
     line. Outside a table a paragraph is a line, as you would expect. */
  const strip = t => xmlText(String(t)
    .replace(/<w:tab\b[^>]*\/>/g, ' ')
    .replace(/<w:br\b[^>]*\/>/g, ' ')
    .replace(/<\/w:p>/g, ' ')
    .replace(/<[^>]+>/g, '')).replace(/\s+/g, ' ').trim();

  const held = [];
  let s = xml.replace(/<w:tbl>[\s\S]*?<\/w:tbl>/g, tbl => {
    const rows = (tbl.match(/<w:tr\b[\s\S]*?<\/w:tr>/g) || []).map(tr =>
      (tr.match(/<w:tc>[\s\S]*?<\/w:tc>|<w:tc\b[^>]*>[\s\S]*?<\/w:tc>/g) || [])
        .map(strip).join('\t'));
    held.push(rows.join('\n'));
    return '\u0000' + (held.length - 1) + '\u0000';
  });

  s = s.replace(/<w:tab\b[^>]*\/>/g, '\t')
       .replace(/<w:br\b[^>]*\/>/g, '\n')
       .replace(/<\/w:p>/g, '\n')
       .replace(/<[^>]+>/g, '');
  s = xmlText(s).replace(/\u0000(\d+)\u0000/g, (m, i) => held[Number(i)] || '');

  return s.replace(/[ \t]+$/gm, '')
          .replace(/\n{3,}/g, '\n\n')
          .trim();
}

/* Excel. The strings live in one shared table and the cells point into it by index,
   which is why a sheet on its own reads as a list of numbers. */
function xlsxToText(sheetXml, sharedXml){
  const shared = [];
  if(sharedXml){
    const re = /<si\b[^>]*>([\s\S]*?)<\/si>/g; let m;
    while((m = re.exec(sharedXml))){
      // an <si> can be one <t> or several, when Excel has split a run
      const parts = (m[1].match(/<t\b[^>]*>([\s\S]*?)<\/t>/g) || [])
        .map(x => x.replace(/<[^>]+>/g, ''));
      shared.push(xmlText(parts.join('')));
    }
  }
  const colOf = ref => {
    const a = String(ref||'').match(/^([A-Z]+)/); if(!a) return 0;
    let n = 0; for(const ch of a[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  };
  const lines = [];
  const rowRe = /<row\b[^>]*>([\s\S]*?)<\/row>/g; let r;
  while((r = rowRe.exec(sheetXml))){
    const cells = [];
    const cRe = /<c\b([^>]*)>([\s\S]*?)<\/c>|<c\b([^>]*)\/>/g; let c;
    while((c = cRe.exec(r[1]))){
      const attrs = c[1] || c[3] || '';
      const body  = c[2] || '';
      const ref   = (attrs.match(/r="([^"]+)"/) || [])[1];
      const type  = (attrs.match(/t="([^"]+)"/) || [])[1];
      let v = '';
      if(type === 'inlineStr'){
        v = xmlText((body.match(/<t\b[^>]*>([\s\S]*?)<\/t>/) || [,''])[1].replace(/<[^>]+>/g,''));
      } else {
        const raw = (body.match(/<v>([\s\S]*?)<\/v>/) || [,''])[1];
        v = type === 's' ? (shared[Number(raw)] ?? '') : xmlText(raw);
      }
      cells[colOf(ref)] = v;
    }
    for(let i = 0; i < cells.length; i++) if(cells[i] === undefined) cells[i] = '';
    lines.push(cells.join('\t').replace(/\t+$/, ''));
  }
  return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

/* What a file turns into. Returns the text and, when it cannot get any, says why in a
   sentence rather than handing back an empty string that looks like an empty document. */
/* ══════════════ READING A SUPPLIER'S PROFORMA ══════════════
   Krypton send back a proforma with everything the order needs already on it:

     I BT MAX B1K 25KG   39095090   91   282,50   70%   2.275,00   3,39   7.712,25

   Description, commodity code, how many packs, their list price, the discount, the
   weight, the price a kilo and the amount. Typing that in again is how a digit gets
   dropped, and it is the one document where a dropped digit is a customs problem as well
   as a money one.

   The commodity code is what makes this readable. It is eight digits with nothing else
   like it on the line, so everything before it is the description and everything after it
   is figures, in a fixed order. No column positions are guessed at.

   The figures are Spanish: 2.275,00 is two thousand two hundred and seventy five. Read as
   English that is 2.275, which would order a hundredth of the resin. */
const euNum = t => {
  const s = String(t == null ? '' : t).trim().replace(/\s/g,'').replace(/€|%/g,'');
  if(!s) return null;
  // 1.234.567,89 — dots group, comma decides. 83,50 — comma decides. 91 — neither.
  const n = /,/.test(s) ? Number(s.replace(/\./g,'').replace(',','.'))
                        : Number(s.replace(/\.(?=\d{3}\b)/g,''));
  return isFinite(n) ? n : null;
};

function parseProforma(text){
  const out = { lines: [], ref: '', unread: [] };
  const rows = String(text||'').replace(/\r/g,'').split('\n');

  rows.forEach(raw => {
    const t = raw.replace(/\t/g,' ').replace(/\s+/g,' ').trim();
    if(!t) return;
    let m;
    if(!out.ref && (m = t.match(/\b(\d{8}-[A-Z][A-Z\- ]{3,})/))) out.ref = m[1].trim();

    /* An eight digit commodity code, standing on its own. Anchoring on it is what makes
       the rest of the line unambiguous: a description can hold anything, but nothing else
       on the line is eight digits with spaces either side. */
    const code = t.match(/(?:^|\s)(\d{8})(?=\s)/);
    if(!code) return;

    const desc = t.slice(0, code.index).trim();
    const rest = t.slice(code.index + code[0].length).trim();
    if(desc.length < 3) return;

    // the figures, in the order their sheet prints them
    const toks = rest.split(' ').filter(Boolean);
    const disc = (() => { const i = toks.findIndex(x => /%$/.test(x));
      if(i < 0) return { pct: 0, rest: toks };
      return { pct: euNum(toks[i]) || 0, rest: toks.slice(0,i).concat(toks.slice(i+1)) }; })();
    const nums = disc.rest.map(euNum).filter(n => n != null);

    /* Five figures without a discount, six with it taken out: quantity, unit price,
       weight, price a kilo, amount. Anything else and the line is not a line we
       understand, and saying so beats inventing one. */
    if(nums.length < 4){ out.unread.push(t); return; }
    const [qty, price] = nums;
    const amount = nums[nums.length - 1];
    const perKg  = nums.length >= 3 ? nums[nums.length - 2] : null;
    const weight = nums.length >= 4 ? nums[nums.length - 3] : null;

    if(!(qty > 0) || !(price > 0)){ out.unread.push(t); return; }

    out.lines.push({
      description: desc, hs_code: code[1],
      packs: qty, list_price: price, discount_pct: disc.pct,
      weight_kg: weight, per_kg: perKg, amount,
      // what their own figures say the line comes to, so a misread shows up as a mismatch
      checks: Math.abs(qty*price*(1-disc.pct/100) - amount) < Math.max(1, amount*0.005),
    });
  });
  return out;
}

async function readScopeFile(file){
  const name = String(file.name || '');
  const ext  = (name.split('.').pop() || '').toLowerCase();

  if(['txt','csv','tsv','md','text'].includes(ext))
    return { text: normaliseColumns(await file.text()), kind: ext };

  const buf = await file.arrayBuffer();

  if(ext === 'docx'){
    const xml = await zipRead(buf, 'word/document.xml');
    if(!xml) throw new Error('That .docx has no document inside it.');
    return { text: normaliseColumns(docxToText(xml)), kind:'docx' };
  }
  if(ext === 'xlsx' || ext === 'xlsm'){
    const { entries } = await zipEntries(buf);
    const sheets = entries.map(e=>e.name)
      .filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n))
      .sort();
    if(!sheets.length) throw new Error('That workbook has no sheets in it.');
    const shared = await zipRead(buf, 'xl/sharedStrings.xml');
    const parts = [];
    for(const s of sheets){
      const xml = await zipRead(buf, s);
      if(xml) parts.push(xlsxToText(xml, shared));
    }
    return { text: normaliseColumns(parts.filter(Boolean).join('\n\n')),
             kind:'xlsx', sheets: sheets.length };
  }
  if(ext === 'doc' || ext === 'xls')
    throw new Error('That is the old Word or Excel format. Save it as .docx or .xlsx and '
      + 'upload it again, or paste the table in.');
  if(ext === 'pdf'){
    /* A PDF is drawing instructions, not a document, so this is the one format that has
       to be reconstructed rather than read. When it works it is exact; when the pages
       turn out to be pictures there is genuinely nothing to read and it says so. */
    return { text: await pdfToText(buf), kind:'pdf' };
  }
  throw new Error('Upload a Word document, an Excel workbook, or a text file. '
    + 'A PDF can be kept but its table has to be pasted.');
}

/* ══════════════ READING A SCOPE OF WORKS ══════════════
   A consultant sends a bill of quantities. It names his products, not ours, and the
   quantities are in a table that has been through Word and email and back. Turning that
   into a draft quotation by hand is an hour of typing and the place where a decimal
   point gets lost.

   This reads it instead. Three separate jobs, kept separate on purpose so each can be
   wrong on its own and be found:

     parseScope    the text into numbered items with a quantity and a unit
     matchItem     each item to what we would actually supply
     buildDraft    the matches into sections in the shape our quotations are written in

   None of it calls anything. There is no service and no key: it is a few hundred lines
   running in the browser against the catalogue and the equivalents table, which is what
   keeps the running cost at nothing.

   What it must never do is guess quietly. A wrong equivalent on a 28,000 m² car park is
   an expensive kind of tidy, so anything it is unsure of comes back marked, and the
   review screen makes you look at it before a draft exists. */

const SCOPE_UNITS = {
  'm²':'sq.m','m2':'sq.m','sqm':'sq.m','sq.m':'sq.m','sq m':'sq.m','m^2':'sq.m',
  'lm':'lm','l.m':'lm','rm':'lm','m':'lm','mtr':'lm','meter':'lm','metre':'lm',
  'no':'nr','no.':'nr','nos':'nr','nr':'nr','pcs':'nr','pc':'nr','ea':'nr','each':'nr',
  'item':'item','lump sum':'item','lumpsum':'item','ls':'item','l.s':'item','sum':'item',
  'lot':'item','set':'item','job':'item','ps':'item','p.s':'item','prov sum':'item',
  'kg':'kg','ltr':'ltr','l':'ltr','litre':'ltr','ton':'ton','tonne':'ton',
};
const scopeUnit = u => SCOPE_UNITS[String(u||'').trim().toLowerCase().replace(/\.$/,'')] || null;
// a line measured by area, the only kind a per-square-metre cost can be put against
const isAreaUnit = u => /m2|m²|sq\.?\s?m|sqm/i.test(String(u||''));

/* Words that carry no meaning for matching. Kept short: over-filtering loses the very
   words that identify a product, and "coating" and "system" are worth keeping because
   they are what half the catalogue is. */
const SCOPE_STOP = new Set(('a an and the of for to in on at by with including include '
 + 'includes included as per all any other such shall must be is are it its will from '
 + 'work works item items no nos number provide provision supply supplying install '
 + 'installation installed applying application applied approx approximately etc '
 // Colours matched "Painting of kerbs in yellow, white and black" to a tin of pigment.
 // A colour never identifies which product is wanted, only what shade of it.
 + 'white black yellow red blue green grey gray colour color colours colors shade ral '
 // and nor do the words every construction document is made of
 + 'existing new area areas level levels basement floor floors ceiling ceilings soffit '
 + 'soffits wall walls column columns repair repairs crack cracks client contractor '
 + 'site building project quantity unit description sqm required necessary'
 ).split(' '));

/* Things a bill lists as items that are not products at all. Getting these wrong is
   worse than getting them blank: a line reading "Removal of existing coating" must not
   come back matched to a coating. */
const SCOPE_WORKS = [
  [/\b(remov|strip|grind|shot ?blast|scarif|demolit|dispos)/i, 'taking the old one off'],
  [/\bhoarding|screening|artwork\b/i,                          'site hoarding'],
