function LogVisitModal({company,companies,close,saved}){
  const [f,setF]=useState({client_id:company||'', visit_date:today(),
    visited_by:'Mohammad Gias Uddin', contact_person:'', summary:'', product_interest:'',
    assessment:'', next_action:'', next_action_by:'', priority:'medium'});
  const [newName,setNewName]=useState('');
  const [err,setErr]=useState(''); const [busy,setBusy]=useState(false);
  const set=(k,v)=>setF(x=>({...x,[k]:v}));

  const save=async()=>{
    if(!f.client_id && !newName.trim()) return setErr('Pick the company, or type a new name.');
    if(!f.summary.trim()) return setErr('Write what happened on the visit.');
    setBusy(true); setErr('');
    let cid=f.client_id;
    if(!cid){
      const {data,error}=await sb.from('clients')
        .insert({name:newName.trim(), kind:'prospect', location:'Abu Dhabi',
                 contact_person:f.contact_person||null, first_visited_on:f.visit_date})
        .select('id').single();
      if(error){ setBusy(false); return setErr(error.message); }
      cid=data.id;
    }
    const {error}=await sb.from('field_visits').insert({
      client_id:cid, visit_date:f.visit_date, visited_by:f.visited_by||'Unknown',
      contact_person:f.contact_person||null, summary:f.summary,
      product_interest:f.product_interest||null, assessment:f.assessment||null,
      next_action:f.next_action||null, next_action_by:f.next_action_by||null,
      priority:f.priority});
    setBusy(false);
    if(error) return setErr(error.message);
    saved();
  };

  return html`<div class="modal-back" onMouseDown=${e=>{if(e.target===e.currentTarget) close();}}>
    <div class="modal">
      <div class="modal-head"><h2>${_t("Log a visit")}</h2></div>
      <div class="modal-body">
        ${err && html`<div class="err">${err}</div>`}
        <label>Company
          <select value=${f.client_id} onChange=${e=>set('client_id',e.target.value)}>
            <option value="">${_t("A company we have not seen before")}</option>
            ${companies.map(c=>html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}
          </select></label>
        ${!f.client_id && html`<label>Name of the new company
          <input value=${newName} onInput=${e=>setNewName(e.target.value)}
                 placeholder="${_t("Al Geemi Contracting Co. L.L.C")}"/></label>`}
        <div class="row2">
          <label>Date of the visit
            <input type="date" value=${f.visit_date} onInput=${e=>set('visit_date',e.target.value)}/></label>
          <label>Who went
            <input value=${f.visited_by} onInput=${e=>set('visited_by',e.target.value)}/></label>
        </div>
        <label>Who was met
          <input value=${f.contact_person} onInput=${e=>set('contact_person',e.target.value)}
                 placeholder="${_t("Mr. Tariq, Plant Manager")}"/></label>
        <label>What happened
          <textarea rows="3" value=${f.summary} onInput=${e=>set('summary',e.target.value)}
            placeholder="${_t("Met the procurement team and introduced the range.")}"></textarea></label>
        <label>What they might buy
          <textarea rows="2" value=${f.product_interest}
            onInput=${e=>set('product_interest',e.target.value)}
            placeholder="${_t("Roof waterproofing, epoxy flooring")}"></textarea></label>
        <label>Your read on it
          <textarea rows="2" value=${f.assessment} onInput=${e=>set('assessment',e.target.value)}
            placeholder="${_t("Live project, decision sits with procurement.")}"></textarea></label>
        <div class="row2">
          <label>What you promised to do
            <input value=${f.next_action} onInput=${e=>set('next_action',e.target.value)}
                   placeholder="${_t("Send the profile and data sheets")}"/></label>
          <label>By when
            <input type="date" value=${f.next_action_by}
                   onInput=${e=>set('next_action_by',e.target.value)}/></label>
        </div>
        <label>How strong is it
          <select value=${f.priority} onChange=${e=>set('priority',e.target.value)}>
            <option value="high">${_t("High, worth chasing this week")}</option>
            <option value="medium">${_t("Medium")}</option>
            <option value="low">${_t("Low, keep on file")}</option>
          </select></label>
        <p class="muted" style=${{marginBottom:0}}>A date on the promise is what puts the
        company in front of you again. Leave it blank and nothing will chase it.</p>
      </div>
      <div class="modal-foot">
        <button class="btn sec" onClick=${close}>${_t("Cancel")}</button>
        <button class="btn" disabled=${busy} onClick=${save}>${busy?'Saving…':'Save the visit'}</button>
      </div>
    </div>
  </div>`;
}

function Visits({go,focus,clearFocus}){
  const [rows,setRows]=useState(null); const [log,setLog]=useState([]);
  const [open,setOpen]=useState(focus||null); const [filter,setFilter]=useState('all');
  const [neu,setNeu]=useState(false); const [err,setErr]=useState('');

  const load=useCallback(async()=>{
    const [f,l]=await Promise.all([
      sb.from('visit_funnel').select('*'),
      sb.from('visit_log').select('*').order('visit_date',{ascending:false})]);
    if(f.error||l.error) setErr((f.error||l.error).message);
    setRows(f.data||[]); setLog(l.data||[]);
  },[]);
  useEffect(()=>{load();},[load]);
  useEffect(()=>{ if(focus){ setOpen(focus); clearFocus&&clearFocus(); } },[focus]);
  if(!rows) return html`${err&&html`<div class="err">${err}</div>`}<div class="spinner"></div>`;

  const seen=rows.length;
  const won=rows.filter(r=>r.stage==='won').length;
  const quoted=rows.filter(r=>r.stage==='quoted').length;
  const inplay=rows.filter(r=>r.stage==='in play').length;
  const visited=rows.filter(r=>r.stage==='visited').length;
  const chase=rows.filter(r=>r.follow_up_overdue||r.going_cold);
  const hot=rows.filter(r=>r.flagged_high&&r.stage==='visited');
  const visitCount=rows.reduce((s,r)=>s+nz(r.visits),0);

  // ── one company ────────────────────────────────────────────────────────────────
  const cur=rows.find(r=>r.client_id===open);
  if(cur){
    const mine=log.filter(v=>v.client_id===cur.client_id);
    return html`
      ${neu && html`<${LogVisitModal} company=${cur.client_id}
        companies=${rows.map(r=>({id:r.client_id,name:r.name}))}
        close=${()=>setNeu(false)} saved=${()=>{setNeu(false);load();}}/>`}
      <div class="page-head">
        <button class="btn sec sm" onClick=${()=>setOpen(null)}>← All visits</button>
        <h1 style=${{width:'100%'}}>${cur.name}</h1>
        <span class=${'vstage '+V_STAGE[cur.stage]}>${cur.stage}</span>
        <button class="btn sec sp" onClick=${()=>setNeu(true)}>${_t("Log a visit")}</button>
        <button class="btn" onClick=${()=>go(['pipeline'])}>${_t("Open an inquiry")}</button>
      </div>
      <div class="panel"><div class="panel-body">
        <dl class="kv">
          <dt>${_t("Contact")}</dt><dd>${cur.contact_person||'Not recorded'}</dd>
          <dt>${_t("Phone")}</dt><dd>${cur.phone||'Not recorded'}</dd>
          <dt>${_t("Email")}</dt><dd>${cur.email||'Not recorded'}</dd>
          <dt>${_t("Where")}</dt><dd>${cur.location||'—'}</dd>
          <dt>${_t("First seen")}</dt><dd>${fmtDate(cur.first_visit)}</dd>
          <dt>${_t("Last seen")}</dt><dd>${fmtDate(cur.last_visit)}${
            cur.days_since_visit!=null?', '+cur.days_since_visit+' '+plural(cur.days_since_visit,'day')+' ago':''}</dd>
          <dt>${_t("Quotations")}</dt><dd>${cur.quotations
            ? cur.quotations+' '+plural(cur.quotations,'quotation')
            : 'None. Nothing has been priced for this company.'}</dd>
        </dl>
        ${cur.follow_up_overdue && html`<div class="flagbox" style=${{marginTop:12}}>
          Something was promised by ${fmtDate(cur.next_due)} and has not happened.</div>`}
        ${!cur.follow_up_overdue && cur.going_cold && html`<div class="warnbox" style=${{marginTop:12}}>
          Seen ${cur.days_since_visit} days ago and nothing has moved since.</div>`}
      </div></div>
      <div class="panel">
        <div class="panel-head"><h2>${_t("Every visit")}</h2>
          <span class="sp muted">${mine.length} ${plural(mine.length,'visit')}</span></div>
        <div class="panel-body">
          ${mine.map(v=>html`<div class="vcard" key=${v.id}>
            <div class="vh"><b>${fmtDate(v.visit_date)}</b>
              <span class="who">${v.visited_by}${v.contact_person?' met '+v.contact_person:''}</span>
              ${v.priority==='high' && html`<span class="vflag">HIGH</span>`}</div>
            <dl>
              <dt>${_t("What happened")}</dt><dd>${v.summary||'—'}</dd>
              ${v.product_interest && html`<${Frag}>
                <dt>${_t("Might buy")}</dt><dd>${v.product_interest}</dd></${Frag}>`}
              ${v.assessment && html`<${Frag}>
                <dt>${_t("The read")}</dt><dd>${v.assessment}</dd></${Frag}>`}
              ${v.next_action && html`<${Frag}>
                <dt>${_t("Promised")}</dt><dd>${v.next_action}${
                  v.next_action_by?' — by '+fmtDate(v.next_action_by):''}</dd></${Frag}>`}
            </dl>
          </div>`)}
          ${!mine.length && html`<div class="empty">No visits logged for this company.</div>`}
        </div>
      </div>`;
  }

  // ── the list ───────────────────────────────────────────────────────────────────
  const FILTERS=[
    ['all','Everything',seen],
    ['chase','Needs chasing',chase.length],
    ['hot','High potential, untouched',hot.length],
    ['quoted','Quoted',quoted+won],
    ['won','Won',won],
  ];
  const shown=(filter==='chase'?chase
    : filter==='hot'?hot
    : filter==='quoted'?rows.filter(r=>['quoted','won'].includes(r.stage))
    : filter==='won'?rows.filter(r=>r.stage==='won')
    : rows)
    // worst first: a promise already broken, then the ones going quiet, then by age
    .slice().sort((a,b)=>
      (b.follow_up_overdue?2:0)+(b.going_cold?1:0) - ((a.follow_up_overdue?2:0)+(a.going_cold?1:0))
      || nz(b.days_since_visit)-nz(a.days_since_visit));

  const bar=(n,cls,label)=>n>0 && html`<div class=${cls} style=${{flexGrow:n}}
    title=${n+' '+label}><b>${n}</b> <span>${label}</span></div>`;

  return html`
    ${err && html`<div class="err">${err}</div>`}
    ${neu && html`<${LogVisitModal} company=${''}
      companies=${rows.map(r=>({id:r.client_id,name:r.name}))}
      close=${()=>setNeu(false)} saved=${()=>{setNeu(false);load();}}/>`}
    <div class="page-head">
      <h1>${_t("Market visits")}</h1>
      <button class="btn sp" onClick=${()=>setNeu(true)}>${_t("Log a visit")}</button>
    </div>

    <div class="ops-hero">
      <div class="vital"><div class="vk">Companies seen</div><div class="vv">${seen}</div>
        <div class="vs">${visitCount} ${plural(visitCount,'visit')} since ${fmtDate(
          rows.reduce((m,r)=>!m||r.first_visit<m?r.first_visit:m,null))}</div></div>
      <div class=${'vital'+(quoted+won===0?' hot':'')}><div class="vk">Turned into a price</div>
        <div class="vv">${quoted+won}</div>
        <div class="vs">${seen?Math.round((quoted+won)/seen*1000)/10:0}% of everyone we called on</div></div>
      <div class=${'vital'+(chase.length?' hot':'')}><div class="vk">Needs chasing</div>
        <div class="vv">${chase.length}</div>
        <div class="vs">Promised something, or gone quiet</div></div>
    </div>

    <div class="panel"><div class="panel-body">
      <h2 style=${{margin:'0 0 2px',fontSize:'14px'}}>Where the ${seen} companies sit</h2>
      <div class="funnel">
        ${bar(visited,'f0','only visited')}
        ${bar(inplay,'f1','in play')}
        ${bar(quoted,'f2','quoted')}
        ${bar(won,'f3','won')}
      </div>
      <div class="funnel-key">
        <span>A company moves along on its own: it counts as quoted when a quotation exists
        against it, and won when a quotation is approved or a job is opened.</span>
      </div>
    </div></div>

    <div class="chips">
      ${FILTERS.map(([k,l,n])=>html`<button key=${k}
        class=${'chip'+(filter===k?' on':'')} onClick=${()=>setFilter(k)}>
        ${l}<span class="c">${n}</span></button>`)}
    </div>

    <div class="panel">
      ${shown.length ? html`<div class="tw"><table>
        <thead><tr><th>${_t("Company")}</th><th>${_t("Last seen")}</th><th class="n">${_t("Days")}</th>
          <th class="n">${_t("Visits")}</th><th>${_t("Stage")}</th><th>${_t("What was promised")}</th></tr></thead>
        <tbody>${shown.map(r=>html`<tr key=${r.client_id} class="row-click"
            onClick=${()=>setOpen(r.client_id)}>
          <td><b>${r.name}</b>${r.flagged_high&&r.stage==='visited'
            ? html`<span class="vflag" style=${{marginLeft:8}}>HIGH</span>`:''}
            <div class="muted" style=${{fontSize:'12px'}}>${r.contact_person||'No contact name'}</div></td>
          <td class="muted">${fmtDate(r.last_visit)}</td>
          <td class="n">${r.days_since_visit}</td>
          <td class="n">${r.visits}</td>
          <td><span class=${'vstage '+V_STAGE[r.stage]}>${r.stage}</span></td>
          <td class="muted">${(()=>{
            const last=log.find(v=>v.client_id===r.client_id&&v.next_action);
            if(r.follow_up_overdue) return html`<span class="vflag">Overdue: </span>${last?last.next_action:''}`;
            if(r.going_cold) return html`<span class="vflag cold">Gone quiet. </span>${last?last.next_action:''}`;
            return last?last.next_action:'—';})()}</td>
        </tr>`)}</tbody></table></div>`
      : html`<div class="empty">Nothing here.</div>`}
    </div>`;
}

function Clients({focus,clearFocus,go}){
  const [rows,setRows]=useState(null); const [edit,setEdit]=useState(null); const [open,setOpen]=useState(focus||null);
  const [quotes,setQuotes]=useState([]); const [projs,setProjs]=useState([]);
  const [prospects,setProspects]=useState(0);
  const load=useCallback(async()=>{
    const [cl,qt,pj]=await Promise.all([
      sb.from('clients').select('*, inquiries(id,project_name,stage,estimated_value,next_action,office_id)')
        .neq('kind','prospect').order('name'),
      sb.from('quotations').select('id,reference,project_name,quote_date,status,client_id')
        .order('created_at',{ascending:false}),
      sb.from('projects').select('id,name,status,value,client_id,office_id').order('name')]);
    setRows(cl.data||[]); setQuotes(qt.data||[]); setProjs(pj.data||[]);
    const pv=await sb.from('clients').select('id',{count:'exact',head:true}).eq('kind','prospect');
    setProspects(pv.count||0);
  },[]);
  useEffect(()=>{load();},[load]);
  useEffect(()=>{ if(focus) setOpen(focus); },[focus]);

  /* ── removing a client ──────────────────────────────────────────────────────────
     A client with a quotation, a project, an inquiry or an invoice against it is not a
     mistake, it is history, and the database refuses to delete it. Rather than let that
     come back as a foreign key error nobody can read, the counts are looked up first and
     the answer is given in words. What does go, because it belongs to nobody else, is
     the correspondence and the visits, so the warning says so before the second press. */
  const [armed,setArmed]=useState(false);
  const [delErr,setDelErr]=useState('');
  const [delBusy,setDelBusy]=useState(false);
  const [ties,setTies]=useState(null);
  const countTies=useCallback(async id=>{
    const one=(t,col)=>sb.from(t).select('id',{count:'exact',head:true}).eq(col||'client_id',id);
    const [iq,qt,pj,iv,cr,vs]=await Promise.all([
      one('inquiries'),one('quotations'),one('projects'),one('invoices'),
      one('correspondence'),one('field_visits')]);
    return {inquiries:iq.count||0, quotations:qt.count||0, projects:pj.count||0,
            invoices:iv.count||0, correspondence:cr.count||0, visits:vs.count||0};
  },[]);
  const armDelete=async c=>{
    setDelErr(''); setTies(null); setArmed(true);
    try{ setTies(await countTies(c.id)); }catch(e){ setTies({}); }
  };
  const blocking=t=>!t?[]:[['quotation',t.quotations],['project',t.projects],
      ['inquiry',t.inquiries,'inquiries'],['invoice',t.invoices]]
    .filter(x=>x[1]>0).map(x=>x[1]+' '+(x[1]===1?x[0]:(x[2]||x[0]+'s')));
  const removeClient=async c=>{
    const t = ties || await countTies(c.id);
    const stop = blocking(t);
    if(stop.length){ setArmed(false);
      return setDelErr(c.name+' has '+listOut(stop)+' against it, so it stays. '
        +'Delete or move those first if the client really has to go.'); }
    setDelBusy(true); setDelErr('');
    const {error}=await sb.from('clients').delete().eq('id',c.id);
    setDelBusy(false); setArmed(false);
    if(error) return setDelErr(error.message);
    setOpen(null); clearFocus&&clearFocus(); load();
  };

  if(!rows) return html`<div class="spinner"></div>`;
  const cur = rows.find(r=>r.id===open);

  if(cur) return html`
    <div class="page-head">
      <button class="btn sec sm" onClick=${()=>{setOpen(null);clearFocus&&clearFocus();setArmed(false);setDelErr('');}}>← All clients</button>
      <h1 style=${{width:'100%'}}>${cur.name}</h1>
      <div class="sp" style=${{display:'flex',gap:'8px',flexWrap:'wrap'}}>
        ${/* Edit first and Delete last, so the destructive one is not next to the one
              somebody reaches for twenty times a day. */''}
        <button class="btn sec" onClick=${()=>setEdit(cur)}>${_t("Edit")}</button>
        ${armed && html`<button class="btn sec" onClick=${()=>{setArmed(false);setDelErr('');}}>${_t("Keep it")}</button>`}
        <button class=${'btn danger'+(armed?' armed':'')} disabled=${delBusy}
          onClick=${()=>armed?removeClient(cur):armDelete(cur)}>${
          armed ? _t('Delete')+' '+cur.name+' '+_t('for good') : _t('Delete this client')}</button>
      </div>
    </div>
    ${delErr && html`<div class="err">${delErr}</div>`}
    ${armed && html`<div class="flagbox">${
      ties===null ? _t('Checking what is attached to this client…')
      : blocking(ties).length
        ? cur.name+' has '+listOut(blocking(ties))+' against it. Deleting is not possible '
          +'while that is true, and pressing again will only tell you the same thing.'
        : 'Nothing is quoted, invoiced or built for this client, so it can go. '
          +(ties.correspondence+ties.visits>0
             ? listOut([ties.correspondence>0?ties.correspondence+' '+plural(ties.correspondence,'note'):null,
                        ties.visits>0?ties.visits+' '+plural(ties.visits,'visit'):null].filter(Boolean))
               +' will be removed with it.'
             : 'There is nothing else attached to it.')}</div>`}
    <div class="panel"><div class="panel-body">
      <dl class="kv">
        <dt>${_t("Contact")}</dt><dd>${cur.contact_person||'—'}</dd>
        <dt>${_t("Email")}</dt><dd>${cur.email||'—'}</dd>
        <dt>${_t("Phone")}</dt><dd>${cur.phone||'—'}</dd>
        <dt>${_t("Location")}</dt><dd>${cur.location||'—'}</dd>
        <dt>${_t("TRN")}</dt><dd>${cur.trn||'—'}</dd>
        <dt>${_t("Notes")}</dt><dd>${cur.notes||'—'}</dd>
      </dl>
    </div></div>
    <div class="panel">
      <div class="panel-head"><h2>${_t("Inquiries")}</h2></div>
      ${cur.inquiries?.length ? html`<div class="tw"><table>
        <thead><tr><th>${_t("Project")}</th><th>${_t("Stage")}</th><th class="n">${_t("Value")}</th><th>${_t("Next action")}</th></tr></thead>
        <tbody>${cur.inquiries.map(i=>html`<tr key=${i.id}>
          <td><b>${i.project_name}</b></td><td><span class="pill ${i.stage}">${i.stage}</span></td>
          <td class="n">${AED0(i.estimated_value,officeCur(i.office_id))}</td><td class="muted">${i.next_action||'—'}</td>
        </tr>`)}</tbody></table></div>`
        : html`<div class="empty">No inquiries for this client yet.</div>`}
    </div>
    ${(()=>{ const qs=quotes.filter(x=>x.client_id===cur.id);
             const ps=projs.filter(x=>x.client_id===cur.id);
      return html`<${Frag}>
      <div class="panel"><div class="panel-head"><h2>${_t("Quotations")}</h2>
        <span class="sp muted">${qs.length} ${plural(qs.length,'quotation')}</span></div>
        ${qs.length ? html`<div class="tw"><table>
          <thead><tr><th>${_t("Reference")}</th><th>${_t("Project")}</th><th>${_t("Date")}</th><th>${_t("Status")}</th></tr></thead>
          <tbody>${qs.map(x=>html`<tr key=${x.id}>
            <td><b>${x.reference}</b></td><td>${x.project_name||'—'}</td>
            <td class="muted">${fmtDate(x.quote_date)}</td>
            <td><span class=${'pill '+(x.status==='approved'?'won':x.status==='rejected'?'lost':'quoted')}>${x.status}</span></td>
          </tr>`)}</tbody></table></div>`
          : html`<div class="empty">Nothing quoted for this client yet.</div>`}
      </div>
      <div class="panel"><div class="panel-head"><h2>${_t("Projects")}</h2>
        <span class="sp muted">${ps.length} ${plural(ps.length,'project')}</span></div>
        ${ps.length ? html`<div class="tw"><table>
          <thead><tr><th>${_t("Project")}</th><th>${_t("Status")}</th><th class="n">${_t("Value")}</th></tr></thead>
          <tbody>${ps.map(x=>html`<tr key=${x.id}>
            <td><b>${x.name}</b></td><td class="muted">${x.status}</td>
            <td class="n">${AED0(x.value,officeCur(x.office_id))}</td></tr>`)}</tbody></table></div>`
          : html`<div class="empty">No projects for this client yet.</div>`}
      </div></${Frag}>`; })()}
    <${CorrespondencePanel} clientId=${cur.id} heading="What was said"/>
    ${edit && html`<${ClientModal} row=${edit} close=${()=>setEdit(null)} saved=${()=>{setEdit(null);load();}}/>`}`;

  return html`
    <div class="page-head"><h1>${_t("Clients")}</h1>
      <button class="btn sp" onClick=${()=>setEdit({name:''})}>${_t("New client")}</button></div>
    ${prospects>0 && html`<div class="box-quiet" style=${{marginBottom:14}}>
      ${'This is who we sell to. Another '+prospects+' '
        +plural(prospects,'company','companies')
        +' have been called on but never quoted. They sit in '}
      <a href="#" onClick=${e=>{e.preventDefault();go&&go(['visits']);}}>Visits</a>
      ${' until something is priced for them, and move here the day it is.'}
    </div>`}
    <div class="panel">
      ${rows.length ? html`<div class="tw"><table>
        <thead><tr><th>${_t("Client")}</th><th>${_t("Contact")}</th><th>${_t("Location")}</th><th class="n">${_t("Open inquiries")}</th><th class="n">${_t("Pipeline value")}</th></tr></thead>
        <tbody>${rows.map(r=>{
          const op=(r.inquiries||[]).filter(i=>OPEN_STAGES.includes(i.stage));
          return html`<tr key=${r.id} class="click" onClick=${()=>setOpen(r.id)}>
            <td><b>${r.name}</b></td><td class="muted">${r.contact_person||'—'}</td>
            <td class="muted">${r.location||'—'}</td><td class="n">${op.length}</td>
            <td class="n">${AED0(op.reduce((s,i)=>s+Number(i.estimated_value||0),0))}</td>

function Catalogue({rate,focus,clearFocus}){
  const [rows,setRows]=useState(null); const [q,setQ]=useState(''); const [cat,setCat]=useState('all');
  const [openProduct,setOpenProduct]=useState(null);
  // the queue can name a part of the product page as well as the product itself
  const [section,setSection]=useState(null);
  useEffect(()=>{ if(focus){
    const [pid,part]=String(focus).split('#');
    setOpenProduct(pid); setSection(part||null); clearFocus&&clearFocus();
  } },[focus]);
  // What we actually pay Krypton, and what that implies we should sell at. Keyed by
  // pack so a 25 kg pail and a 6 kg pail each show their own figure.
  const [cost,setCost]=useState(null); const [showCost,setShowCost]=useState(false);
  useEffect(()=>{ (async()=>{
    const [{data},cp]=await Promise.all([
      sb.from('products')
        .select('*, product_packs(*), product_aliases(alias), product_documents(id)')
        .order('category').order('name'),
      sb.from('catalogue_pricing').select('*')
    ]);
    setRows(data||[]);
    if(cp && !cp.error && cp.data){
      const m={}; cp.data.forEach(r=>{ m[r.pack_id]=r; }); setCost(m);
    }
  })(); },[]);
  if(openProduct) return html`<${ProductPage} id=${openProduct} rate=${rate} section=${section}
      back=${()=>{setOpenProduct(null);setSection(null);}}/>`;
  if(!rows) return html`<div class="spinner"></div>`;
  const cats=[...new Set(rows.map(r=>r.category))].sort();
  const t=q.trim().toLowerCase();
  const shown=rows.filter(r=>(cat==='all'||r.category===cat) && (!t ||
    [r.name,r.subcategory,r.description,r.application,...(r.product_aliases||[]).map(a=>a.alias)]
      .some(x=>(x||'').toLowerCase().includes(t))));
  return html`
    <div class="page-head"><h1>${_t("Catalogue")}</h1>
      <span class="muted">${shown.length} of ${rows.length}</span>
      <select class="sp" style=${{width:'auto'}} value=${cat} onChange=${e=>setCat(e.target.value)}>
        <option value="all">${_t("All categories")}</option>
        ${cats.map(c=>html`<option key=${c} value=${c}>${c[0].toUpperCase()+c.slice(1)}</option>`)}
      </select>
      <input type="text" style=${{width:'220px'}} placeholder="${_t("Search products\u2026")}" value=${q} onInput=${e=>setQ(e.target.value)}/>
      ${cost && html`<button class=${'btn '+(showCost?'':'ghost')}
          onClick=${()=>setShowCost(v=>!v)}
          title="What we pay Krypton, and what the standard margin says to charge">
          ${showCost?'Hide cost':'Show cost'}</button>`}
    </div>
    ${showCost && html`<div class="note">
      Cost is catalogue RRP less the supply discount in Settings. The sell rate is that
      cost per square metre at the standard margin, plus the application rate. Both are a
      starting point for pricing, not a promise: check the coverage for the real job.
    </div>`}
    <div class="plist">
      ${shown.map(p=>html`
        <div class="prod card-click" key=${p.id} onClick=${()=>setOpenProduct(p.id)}
             role="button" tabIndex="0"
             onKeyDown=${e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setOpenProduct(p.id);}}}>
          <h3>${p.name}${p.product_documents?.length
            ? html`<span class="docbadge">${p.product_documents.length} doc${p.product_documents.length>1?'s':''}</span>`
            : ''}</h3>
          <div class="sub">${p.subcategory||p.category}</div>
          <div class="d">${p.description}</div>
          <div class="rate">Coverage: <b>${p.consumption_text||'—'}</b></div>
          ${p.product_aliases?.length ? html`<div class="rate muted">Also known as ${p.product_aliases.map(a=>a.alias).join(', ')}</div>`:''}
          ${(p.product_packs||[]).map(k=>{
            const c = showCost && cost ? cost[k.id] : null;
            return html`
            <div class="pk" key=${k.id}>
              <span>${k.label}</span>
              ${/* converted at the rate, so it is dirhams whichever office is on screen */''}
              <span class="price">${k.is_poa?'On application':AED(k.eur_per_unit*rate,'AED')+' / '+k.unit}</span>
            </div>
            ${c && html`<div class="pk costline" key=${k.id+'-c'}>
              <span>Costs us ${AED(Number(c.cost_aed),'AED')}${c.material_cost_aed_m2!=null
                ? ', '+AED(Number(c.material_cost_aed_m2),'AED')+' / m²' : ''}</span>
              <span class="price">${c.sell_aed_m2!=null
                ? 'Sell '+AED(Number(c.sell_aed_m2),'AED')+' / m²' : ''}</span>
            </div>`}`;
          })}
        </div>`)}
    </div>
    ${!shown.length && html`<div class="empty">Nothing matches that search.</div>`}`;
}

const PSTATUS=[['upcoming','Upcoming'],['in_progress','In progress'],['on_hold','On hold'],
               ['complete','Complete'],['cancelled','Cancelled']];
const pLabel=v=>(PSTATUS.find(x=>x[0]===v)||['','']) [1];

function Projects({focus,clearFocus}){
  const [rows,setRows]=useState(null); const [totals,setTotals]=useState({});
  const [clients,setClients]=useState([]); const [quotes,setQuotes]=useState([]);
  const [openId,setOpenId]=useState(null); const [newOpen,setNewOpen]=useState(false);
  const [err,setErr]=useState('');
  // The palette hands us a record to open, rather than dropping you on a list to hunt
  // through. Clear it straight away so a Back does not bounce you into the same record.
  useEffect(()=>{ if(focus){ setOpenId(focus); clearFocus&&clearFocus(); } },[focus]);
  const load=useCallback(async()=>{
    setErr('');
    const [pr,cl,qu,tt]=await Promise.all([
      sb.from('projects').select('*, clients(name)').order('expected_completion',{nullsFirst:false}),
      sb.from('clients').select('id,name').order('name'),
      sb.from('quotations').select('id,reference,client_id,project_name,location').order('reference'),
      sb.from('project_totals').select('*')]);
    const e=pr.error||cl.error||qu.error||tt.error; if(e) setErr(e.message);
    const t={}; (tt.data||[]).forEach(x=>{t[x.project_id]=x;});
    setRows(pr.data||[]); setClients(cl.data||[]); setQuotes(qu.data||[]); setTotals(t);
  },[]);
  useEffect(()=>{load();},[load]);
  if(!rows) return html`<div class="spinner"></div>`;
  if(openId) return html`<${ProjectPage} id=${openId} clients=${clients}
      back=${()=>{setOpenId(null);load();}}/>`;

  const live=rows.filter(r=>['upcoming','in_progress'].includes(r.status));
  const owed=Object.values(totals).reduce((s,t)=>s+officeToActive(t.outstanding,t.office_id),0);

  return html`
    <div class="page-head"><h1>${_t("Projects")}</h1>
      <button class="btn sp" onClick=${()=>setNewOpen(true)}>${_t("New project")}</button></div>
    ${err && html`<div class="err">${err}</div>`}
    <div class="cards">
      <div class="card"><div class="k">Live projects</div><div class="v">${live.length}</div>
        <div class="s">${AED0(live.reduce((s,r)=>s+officeToActive(r.value,r.office_id),0))} of work${bothNote()}</div></div>
      <div class=${'card '+(owed>0?'alert':'okc')}><div class="k">Invoiced, not paid</div>
        <div class="v">${AED0(owed)}</div><div class="s">Across all projects</div></div>
      <div class="card"><div class="k">Completing this month</div>
        <div class="v">${live.filter(r=>r.expected_completion &&
          r.expected_completion.slice(0,7)===today().slice(0,7)).length}</div>
        <div class="s">By expected completion date</div></div>
    </div>
    ${rows.some(r=>nz(r.value)>0) && html`
      <div class="panel">
        <div class="panel-head"><h2>${_t("Margin by project")}</h2>
          <span class="sp muted">Value less materials, freight, duty and everything else</span></div>
        <div class="viz-wrap">
          <${BarsDiverging}
            rows=${rows.filter(r=>nz(r.value)>0).map(r=>{
              const cost=nz(r.material_cost)+nz(r.freight_cost)+nz(r.duty_cost)+nz(r.other_cost);
              const g=nz(r.value)-cost;
              return {label:r.name,value:g,pct:nz(r.value)?g/nz(r.value)*100:null};
            }).sort((a,b)=>b.value-a.value)}
            empty="No priced projects yet."/>
        </div>
      </div>`}

    <div class="panel">
      ${rows.length ? html`<div class="tw"><table>
        <thead><tr><th>${_t("Project")}</th><th>${_t("Client")}</th><th>${_t("Site")}</th><th>${_t("Status")}</th>
          <th class="n">${_t("Value")}</th><th class="n">${_t("Invoiced")}</th><th class="n">${_t("Outstanding")}</th>
          <th class="n">${_t("Due")}</th></tr></thead>
        <tbody>${rows.map(r=>{const t=totals[r.id]||{}; const c=officeCur(r.office_id);
          return html`<tr key=${r.id} class="click" onClick=${()=>setOpenId(r.id)}>
            <td><b>${r.name}</b></td>
            <td>${r.clients?.name||'—'}</td>
            <td class="muted">${r.site||'—'}</td>
            <td><span class=${'pstat '+r.status}>${pLabel(r.status)}</span></td>
            <td class="n">${AED0(r.value,c)}</td>
            <td class="n">${AED0(t.invoiced,c)}</td>
            <td class="n" style=${{color:nz(t.outstanding)>0?'var(--crit)':''}}>${AED0(t.outstanding,c)}</td>
            <td class="n muted">${r.expected_completion||'—'}</td>
          </tr>`;})}</tbody></table></div>`
        : html`<div class="empty">No projects yet. Create one from a won quotation.</div>`}
    </div>
    ${newOpen && html`<${NewProjectModal} clients=${clients} quotes=${quotes}
       close=${()=>setNewOpen(false)} saved=${id=>{setNewOpen(false);load();setOpenId(id);}}/>`}`;
}

function NewProjectModal({clients,quotes,close,saved}){
  const [f,setF]=useState({quotation_id:'',client_id:'',name:'',site:'',value:'',
                           start_date:today(),expected_completion:'',status:'upcoming'});
  const [err,setErr]=useState(''); const [busy,setBusy]=useState(false);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const pickQuote=async(qid)=>{
    set('quotation_id',qid);
    if(!qid) return;
    const q=quotes.find(x=>x.id===qid); if(!q) return;
    const {data:tot}=await sb.from('quotation_totals').select('*').eq('quotation_id',qid);
    const t=(tot||[])[0]||{};
    setF(p=>({...p,quotation_id:qid,client_id:q.client_id||p.client_id,
      name:p.name||q.project_name||'', site:p.site||q.location||'',
      value:t.subtotal!=null?String(t.subtotal):p.value,
      material_cost:t.cost_total}));
  };
  const save=async()=>{
    if(!f.name.trim()) return setErr('Give the project a name.');
    if(!f.client_id)   return setErr('Choose a client.');
    setBusy(true); setErr('');
    const {data,error}=await sb.from('projects').insert({
      client_id:f.client_id, quotation_id:f.quotation_id||null, name:f.name.trim(),
      site:f.site||null, value:num(f.value), start_date:f.start_date||null,
      expected_completion:f.expected_completion||null, status:f.status,
      material_cost:num(f.material_cost)||0}).select().single();
    if(error){setBusy(false);setErr(error.message);return;}
    // carry the quotation's priced lines across as the materials list
    if(f.quotation_id){
      const {data:secs}=await sb.from('quotation_sections')
        .select('id, quotation_lines(description,unit,quantity,is_spec_note,product_id)')
        .eq('quotation_id',f.quotation_id);
      const lines=[]; let pos=1;
      (secs||[]).forEach(sc=>(sc.quotation_lines||[]).forEach(l=>{
        if(l.is_spec_note||!l.quantity) return;
        lines.push({project_id:data.id, product_id:l.product_id||null,
                    description:l.description||'Line', unit:l.unit||'kg',
                    qty_required:l.quantity, qty_delivered:0, position:pos++});
      }));
      if(lines.length) await sb.from('project_materials').insert(lines);
    }
    setBusy(false); saved(data.id);
  };
  return html`
    <div class="modal-bg" onClick=${e=>e.target===e.currentTarget&&close()}>
      <div class="modal"><div class="modal-head"><h2>${_t("New project")}</h2></div>
      <div class="modal-body">
        ${err && html`<div class="err">${err}</div>`}
        <div class="field"><label>${_t("Create from a quotation, optional")}</label>
          <select value=${f.quotation_id} onChange=${e=>pickQuote(e.target.value)}>
            <option value="">${_t("Start blank")}</option>
            ${quotes.map(q=>html`<option key=${q.id} value=${q.id}>
              ${q.reference}${q.project_name?' · '+q.project_name:''}</option>`)}
          </select></div>
        <div class="field"><label>${_t("Client")}</label>
          <select value=${f.client_id} onChange=${e=>set('client_id',e.target.value)}>
            <option value="">${_t("Choose\u2026")}</option>
            ${clients.map(c=>html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}
          </select></div>
        <div class="field"><label>${_t("Project name")}</label>
          <input type="text" value=${f.name} onInput=${e=>set('name',e.target.value)}/></div>
        <div class="grid2">
          <div class="field"><label>${_t("Site")}</label>
            <input type="text" value=${f.site} onInput=${e=>set('site',e.target.value)}/></div>
          <div class="field"><label>${_t("Value (AED)")}</label>
            <input type="number" step="0.01" value=${f.value} onInput=${e=>set('value',e.target.value)}/></div>
          <div class="field"><label>${_t("Start date")}</label>
            <input type="date" value=${f.start_date} onInput=${e=>set('start_date',e.target.value)}/></div>
          <div class="field"><label>${_t("Expected completion")}</label>
            <input type="date" value=${f.expected_completion} onInput=${e=>set('expected_completion',e.target.value)}/></div>
        </div>
        <p class="muted">Creating from a quotation copies its client, value, cost and priced lines into the materials list.</p>
      </div>
      <div class="modal-foot">
        <button class="btn sec" onClick=${close}>${_t("Cancel")}</button>
        <button class="btn" onClick=${save} disabled=${busy}>${busy?'Creating…':'Create project'}</button>
      </div></div></div>`;
}

function ProjectPage({id,clients,back}){
  const [p,setP]=useState(null); const [mats,setMats]=useState([]); const [mils,setMils]=useState([]);
  const [prods,setProds]=useState([]); const [msg,setMsg]=useState(''); const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);
  const [act,setAct]=useState(null); const [spend,setSpend]=useState([]);
  const set=(k,v)=>setP(x=>({...x,[k]:v}));
  const load=useCallback(async()=>{
    const [pj,mt,ml,pd,ac,ex]=await Promise.all([
      sb.from('projects').select('*, clients(name), quotations(reference)').eq('id',id).single(),
      sb.from('project_materials').select('*').eq('project_id',id).order('position'),
      sb.from('payment_milestones').select('*').eq('project_id',id).order('position'),
      sb.from('products').select('id,name').order('name'),
      sb.from('project_actuals').select('*').eq('project_id',id).maybeSingle(),
      sb.from('expenses').select('*').eq('project_id',id).order('expense_date',{ascending:false})]);
    if(pj.error) setErr(pj.error.message);
    setP(pj.data); setMats(mt.data||[]); setMils(ml.data||[]); setProds(pd.data||[]);
    setAct(ac.data||null); setSpend(ex.data||[]);
  },[id]);
  useEffect(()=>{load();},[load]);
  if(!p) return html`<div class="spinner"></div>`;

  const cost=nz(p.material_cost)+nz(p.freight_cost)+nz(p.duty_cost)+nz(p.other_cost);
  const gross=nz(p.value)-cost;
  const pCur=officeCur(p.office_id);   // the project's money, whichever office is on screen
  const marginPct=nz(p.value)?gross/nz(p.value)*100:null;
  const scheduled=mils.reduce((s,m)=>s+nz(m.amount),0);
  const overScheduled=nz(p.value)>0 && scheduled>nz(p.value)+0.005;
  const invoiced=mils.filter(m=>m.invoiced_on).reduce((s,m)=>s+nz(m.amount),0);
  const paid=mils.filter(m=>m.paid_on).reduce((s,m)=>s+nz(m.amount),0);
  const outstanding=invoiced-paid;
  const milTotal=mils.reduce((s,m)=>s+nz(m.amount),0);

  const save=async()=>{
    setErr(''); setMsg('');
    // The database rejects anything outside 0 to 100, and the failed save was taking every
    // other edit on the page down with it without saying why.
    if(nz(p.progress_pct)<0 || nz(p.progress_pct)>100)
      return setErr('Progress has to be between 0 and 100. Nothing was saved.');
    setBusy(true);
    const {error}=await sb.from('projects').update({
      name:p.name, site:p.site||null, value:num(p.value), lpo_number:p.lpo_number||null,
      start_date:p.start_date||null, expected_completion:p.expected_completion||null,
      status:p.status, progress_pct:Number(p.progress_pct)||0,
      material_cost:num(p.material_cost)||0, freight_cost:num(p.freight_cost)||0,
      duty_cost:num(p.duty_cost)||0, other_cost:num(p.other_cost)||0,
      notes:p.notes||null}).eq('id',id);
    if(error){setBusy(false);setErr(error.message);return;}
    for(const m of mats){
      await sb.from('project_materials').update({
        description:m.description, unit:m.unit, product_id:m.product_id||null,
        qty_required:num(m.qty_required)||0, qty_delivered:num(m.qty_delivered)||0}).eq('id',m.id);
    }
    for(const m of mils){
      await sb.from('payment_milestones').update({
        name:m.name, percentage:num(m.percentage), amount:num(m.amount)||0,
        due_date:m.due_date||null, invoice_ref:m.invoice_ref||null,
        invoiced_on:m.invoiced_on||null, paid_on:m.paid_on||null}).eq('id',m.id);
    }
    setBusy(false); setMsg('Saved.'); load();
  };
  const addMat=async()=>{
    const row=addedRow(await sb.from('project_materials').insert({project_id:id,description:'',
      unit:'kg',qty_required:0,qty_delivered:0,position:mats.length+1}).select().single(),setErr,'The material line');
    if(row) setMats(v=>[...v,row]);
  };
  const delMat=async(m)=>{ await sb.from('project_materials').delete().eq('id',m.id);
                           setMats(v=>v.filter(x=>x.id!==m.id)); };
  const addMil=async()=>{
    const row=addedRow(await sb.from('payment_milestones').insert({project_id:id,
      name:'',amount:0,position:mils.length+1}).select().single(),setErr,'The milestone');
    if(row) setMils(v=>[...v,row]);
  };
  const delMil=async(m)=>{ await sb.from('payment_milestones').delete().eq('id',m.id);
                           setMils(v=>v.filter(x=>x.id!==m.id)); };
  const upM=(i,k,v)=>setMats(a=>a.map((x,n)=>n===i?{...x,[k]:v}:x));
  const upL=(i,k,v)=>setMils(a=>a.map((x,n)=>n===i?{...x,[k]:v}:x));

  return html`
    <div class="page-head">
      <button class="btn sec sm" onClick=${back}>${_t("\u2190 All projects")}</button>
      <h1 style=${{width:'100%'}}>${p.name}</h1>
      <span class=${'pstat '+p.status}>${pLabel(p.status)}</span>
      <button class="btn sp" onClick=${save} disabled=${busy}>${busy?_t('Saving…'):_t('Save')}</button>
    </div>
    ${err && html`<div class="err">${err}</div>`}
    ${msg && html`<div class="ok">${msg}</div>`}

    <div class="cards">
      <div class="card"><div class="k">Value</div><div class="v">${AED0(p.value,pCur)}</div>
        <div class="s">${p.clients?.name||'no client'}${p.quotations?.reference?' · '+p.quotations.reference:''}</div></div>
      <div class="card"><div class="k">Gross profit</div>
        <div class="v" style=${{color:gross<0?'var(--crit)':'var(--good)'}}>${AED0(gross,pCur)}</div>
        <div class="s">${marginPct==null?'—':marginPct.toFixed(1)+'% after all costs'}</div></div>
      <div class=${'card '+(outstanding>0?'alert':'')}><div class="k">Invoiced, not paid</div>
        <div class="v">${AED0(outstanding,pCur)}</div>
        <div class="s">${AED0(invoiced,pCur)} invoiced, ${AED0(paid,pCur)} received</div></div>
      <div class="card"><div class="k">Progress</div><div class="v">${p.progress_pct}%</div>
        <div class="bar-s"><i style=${{width:p.progress_pct+'%'}}></i></div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>${_t("Quoted against actual")}</h2>
        <span class="sp muted">What we assumed when we priced it, against what has really been spent</span></div>
      <div class="panel-body">
        ${!act || !act.has_actuals ? html`<div class="empty" style=${{padding:'22px 0'}}>
          Nothing has been booked against this job yet, which is not the same as it having
          cost nothing. Costs land here from three places: an expense entered against this
          project in Money out, the landed cost of a shipment linked to it, and material
          issued to it in Stock.</div>`
        : (()=>{ const done = p.status==='complete';
                 const over = nz(act.actual_cost) > nz(act.quoted_cost) && nz(act.quoted_cost)>0;
          return html`<${Frag}>
          <div class="tw"><table>
            <thead><tr><th>${_t("Where the money went")}</th><th class="n">${_t("Quoted")}</th>
              <th class="n">${done?'Actual':'Spent so far'}</th>
              <th class="n">${done?'Difference':'Still to spend'}</th></tr></thead>
            <tbody>
              <tr><td>Costs booked to the job${nz(act.labour_cost)>0
                    ? html`<div class="m muted">of which ${AED0(act.labour_cost,'AED')} is labour</div>`:null}</td>
                  <td class="n muted">—</td><td class="n">${AED0(act.costs_booked,'AED')}</td><td class="n"></td></tr>
              <tr><td>Shipments against the job</td>
                  <td class="n muted">—</td><td class="n">${AED0(act.shipment_cost,'AED')}</td><td class="n"></td></tr>
              <tr><td>Material issued from stock<div class="m muted">valued at what we buy it for</div></td>
                  <td class="n muted">—</td><td class="n">${AED0(act.material_issued,'AED')}</td><td class="n"></td></tr>
              <tr class="tot"><td><b>Total cost</b></td>
                  <td class="n"><b>${AED0(act.quoted_cost,'AED')}</b></td>
                  <td class="n"><b>${AED0(act.actual_cost,'AED')}</b></td>
                  <td class=${'n '+(over?'short':'')}><b>${
                    nz(act.quoted_cost)<=0 ? '—'
                    : over ? AED0(nz(act.actual_cost)-nz(act.quoted_cost),'AED')+' over'
                    : AED0(nz(act.quoted_cost)-nz(act.actual_cost),'AED')}</b></td></tr>
            </tbody></table></div>
          <div class="grid2" style=${{marginTop:'14px'}}>
            <div class="statbox"><div class="k">Margin when we priced it</div>
              <div class="v">${act.quoted_margin_pct==null?'—':Number(act.quoted_margin_pct).toFixed(1)+'%'}</div>
              <div class="s">${AED0(nz(act.contract_value)-nz(act.quoted_cost),'AED')} expected</div></div>
            ${done ? html`<div class="statbox"><div class="k">Margin actually made</div>
              <div class="v" style=${{color:nz(act.actual_margin_pct)<0?'var(--crit)'
                :nz(act.actual_margin_pct)+0.05<nz(act.quoted_margin_pct)?'var(--warn)':'var(--good)'}}>
                ${act.actual_margin_pct==null?'—':Number(act.actual_margin_pct).toFixed(1)+'%'}</div>
              <div class="s">${AED0(act.actual_gross,'AED')} kept${
                act.quoted_margin_pct!=null&&act.actual_margin_pct!=null
                  ? ', '+Math.abs(nz(act.actual_margin_pct)-nz(act.quoted_margin_pct)).toFixed(1)
                    +' points '+(nz(act.actual_margin_pct)<nz(act.quoted_margin_pct)?'worse':'better')
                    +' than planned' : ''}</div></div>`
             : html`<div class="statbox"><div class="k">Cost used so far</div>
              <div class="v" style=${{color:over?'var(--crit)':'var(--ink)'}}>${
                nz(act.quoted_cost)>0
                  ? (nz(act.actual_cost)/nz(act.quoted_cost)*100).toFixed(0)+'%'
                  : '—'}</div>
              <div class="s">${over
                ? 'Already past what the job was priced to cost'
                : 'of the cost this job was priced to carry'}</div></div>`}
          </div>
          ${!done && html`<p class="muted" style=${{marginTop:'12px'}}>
            The job is still running, so this is what has been spent so far, not the final
            answer. There is deliberately no margin figure here: a margin worked out on half
            the costs looks better than the job is, which is the direction that loses money.
            Mark the project complete and the real margin appears.</p>`}
        </${Frag}>`; })()}
        ${spend.length>0 && html`<div style=${{marginTop:'14px'}}>
          <p class="muted" style=${{margin:'0 0 6px'}}>Costs booked to this job:</p>
          <ul class="plain">${spend.slice(0,8).map(x=>html`<li key=${x.id}>
            ${fmtDate(x.expense_date)+' · '+x.description+' '}
            <span class="muted">${'· '+AED0(x.amount_aed,'AED')+(x.paid_on?'':', not yet paid')}</span>
          </li>`)}</ul>
          ${spend.length>8 && html`<p class="muted">and ${spend.length-8} more, in Money out.</p>`}
        </div>`}
      </div>
    </div>

    <div class="panel"><div class="panel-head"><h2>${_t("Details")}</h2></div><div class="panel-body">
      <div class="grid2">
        <div class="field"><label>${_t("Project name")}</label>
          <input type="text" value=${p.name||''} onInput=${e=>set('name',e.target.value)}/></div>
        <div class="field"><label>${_t("Site")}</label>
          <input type="text" value=${p.site||''} onInput=${e=>set('site',e.target.value)}/></div>
        <div class="field"><label>${_t("Value (AED)")}</label>
          <input type="number" step="0.01" value=${p.value??''} onInput=${e=>set('value',e.target.value)}/></div>
        <div class="field"><label>${_t("Client LPO number")}</label>
          <input type="text" value=${p.lpo_number||''} onInput=${e=>set('lpo_number',e.target.value)}/></div>
        <div class="field"><label>${_t("Start date")}</label>
          <input type="date" value=${p.start_date||''} onInput=${e=>set('start_date',e.target.value)}/></div>
        <div class="field"><label>${_t("Expected completion")}</label>
          <input type="date" value=${p.expected_completion||''} onInput=${e=>set('expected_completion',e.target.value)}/></div>
        <div class="field"><label>${_t("Status")}</label>
          <select value=${p.status} onChange=${e=>set('status',e.target.value)}>
            ${PSTATUS.map(([v,l])=>html`<option key=${v} value=${v}>${l}</option>`)}</select></div>
        <div class="field"><label>${_t("Progress %")}</label>
          <input type="number" min="0" max="100" value=${p.progress_pct}
                 onInput=${e=>set('progress_pct',e.target.value)}/></div>
      </div>
      <div class="field"><label>${_t("Notes")}</label>
        <textarea value=${p.notes||''} onInput=${e=>set('notes',e.target.value)}></textarea></div>
    </div></div>

    <div class="panel"><div class="panel-head"><h2>${_t("What it costs")}</h2></div><div class="panel-body">
      <div class="grid2">
        <div class="field"><label>${_t("Materials (AED)")}</label>
          <input type="number" step="0.01" value=${p.material_cost??''} onInput=${e=>set('material_cost',e.target.value)}/></div>
        <div class="field"><label>${_t("Freight (AED)")}</label>
          <input type="number" step="0.01" value=${p.freight_cost??''} onInput=${e=>set('freight_cost',e.target.value)}/></div>
        <div class="field"><label>${_t("Customs duty (AED)")}</label>
          <input type="number" step="0.01" value=${p.duty_cost??''} onInput=${e=>set('duty_cost',e.target.value)}/></div>
        <div class="field"><label>${_t("Other, labour and site (AED)")}</label>
          <input type="number" step="0.01" value=${p.other_cost??''} onInput=${e=>set('other_cost',e.target.value)}/></div>
      </div>
      <div class="tot">
        <span class="lbl">${_t("Value")}</span><span class="val">${AED(p.value,pCur)}</span>
        <span class="lbl">${_t("Total cost")}</span><span class="val">${AED(cost,pCur)}</span>
        <span class="lbl"><b>Gross profit</b></span>
        <span class=${'val big '+(gross<0?'neg':'pos')}>${AED(gross,pCur)}${marginPct==null?'':' ('+marginPct.toFixed(1)+'%)'}</span>
      </div>
      <p class="muted" style=${{marginTop:'12px'}}>Freight and duty belong here, not in the quotation. Leave them out and the margin flatters the job.</p>
    </div></div>

    <div class="panel">
      <div class="panel-head"><h2>${_t("Payment milestones")}</h2>
        <span class=${'sp '+(overScheduled?'':'muted')}
          style=${overScheduled?{color:'var(--crit)',fontWeight:700}:null}>
          ${AED0(milTotal,pCur)} of ${AED0(p.value,pCur)} scheduled${
            overScheduled?', which is '+AED0(scheduled-nz(p.value),pCur)+' more than the project is worth':''}</span></div>
      <div class="milhead"><span>Milestone</span><span>%</span><span>Amount</span>
        <span>Due</span><span>Invoiced on</span><span>Paid on</span><span></span></div>
      ${mils.map((m,i)=>html`<div class="milrow" key=${m.id}>
        <input type="text" placeholder="${_t("Advance, progress, retention\u2026")}" value=${m.name||''}
               onInput=${e=>upL(i,'name',e.target.value)}/>
        <input type="number" step="0.01" value=${m.percentage??''}
               onInput=${e=>{upL(i,'percentage',e.target.value);
                 if(p.value) upL(i,'amount',(nz(p.value)*Number(e.target.value||0)/100).toFixed(2));}}/>
        <input type="number" step="0.01" value=${m.amount??''} onInput=${e=>upL(i,'amount',e.target.value)}/>
        <input type="date" value=${m.due_date||''} onInput=${e=>upL(i,'due_date',e.target.value)}/>
        <input type="date" value=${m.invoiced_on||''} onInput=${e=>upL(i,'invoiced_on',e.target.value)}/>
        <input type="date" value=${m.paid_on||''} onInput=${e=>upL(i,'paid_on',e.target.value)}/>
        <button class="xbtn" onClick=${()=>delMil(m)}>×</button>
      </div>`)}
      <div style=${{padding:'10px 14px'}}><button class="btn sec sm" onClick=${addMil}>${_t("Add milestone")}</button></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>${_t("Materials")}</h2></div>
      <div class="mhead"><span>Item</span><span>Unit</span><span>Required</span><span>Delivered</span><span></span></div>
      ${mats.map((m,i)=>{const rem=nz(m.qty_required)-nz(m.qty_delivered);
        return html`<div class="mrow" key=${m.id}>
        <div>
          <input type="text" list="prodlist2" value=${m.description||''}
                 onInput=${e=>upM(i,'description',e.target.value)}/>
          <div class="muted" style=${{fontSize:'12px',marginTop:'3px'}}>
            ${rem>0?html`<span class="short">${rem.toLocaleString()} still to deliver</span>`
                   :html`<span class="okv">fully delivered</span>`}</div>
        </div>
        <input type="text" value=${m.unit||''} onInput=${e=>upM(i,'unit',e.target.value)}/>
        <input type="number" step="0.001" value=${m.qty_required??''} onInput=${e=>upM(i,'qty_required',e.target.value)}/>
        <input type="number" step="0.001" value=${m.qty_delivered??''} onInput=${e=>upM(i,'qty_delivered',e.target.value)}/>
        <button class="xbtn" onClick=${()=>delMat(m)}>×</button>
      </div>`;})}
      <datalist id="prodlist2">${prods.map(x=>html`<option key=${x.id} value=${x.name}></option>`)}</datalist>
      <div style=${{padding:'10px 14px'}}><button class="btn sec sm" onClick=${addMat}>${_t("Add material")}</button></div>
    </div>`;
}

/* ══════════════ STOCK ══════════════ */
function Stock(){
  const [pos,setPos]=useState(null); const [whs,setWhs]=useState([]); const [prods,setProds]=useState([]);
  const [moves,setMoves]=useState([]); const [projects,setProjects]=useState([]);
  const [detail,setDetail]=useState([]);
  const [err,setErr]=useState(''); const [msg,setMsg]=useState('');
  const [f,setF]=useState({product:'',warehouse_id:'',direction:'in',quantity:'',
                           project_id:'',reference:'',note:''});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const load=useCallback(async()=>{
    setErr('');
    const [sp,w,pd,mv,pj,sd]=await Promise.all([
      sb.from('stock_position').select('*'),
      sb.from('warehouses').select('*').order('name'),
      sb.from('products').select('id,name').order('name'),
      sb.from('stock_movements').select('*, products(name), warehouses(name), projects(name)')
        .order('created_at',{ascending:false}).limit(25),
      sb.from('projects').select('id,name').in('status',['upcoming','in_progress']).order('name'),
      sb.from('stock_detail').select('*')]);
    const e=sp.error||w.error||pd.error||mv.error||pj.error||sd.error; if(e) setErr(e.message);
    setPos(sp.data||[]); setWhs(w.data||[]); setProds(pd.data||[]);
    setMoves(mv.data||[]); setProjects(pj.data||[]); setDetail(sd.data||[]);
  },[]);
  useEffect(()=>{load();},[load]);
  if(!pos) return html`<div class="spinner"></div>`;

  const shorts=pos.filter(r=>nz(r.available)<0);
  const reorder=pos.filter(r=>nz(r.reorder_level)>0 && nz(r.on_hand)<=nz(r.reorder_level));
  const held=detail.filter(r=>r.blocked);
  const heldText = sumByUnit(held) || '0';

  const record=async()=>{
    setErr(''); setMsg('');
    const prod=prods.find(x=>x.name===f.product.trim());
    if(!prod) return setErr('Choose a product from the list.');
    if(!f.warehouse_id) return setErr('Choose a warehouse.');
    if(!(Number(f.quantity)>0)) return setErr('Enter a quantity greater than zero.');
    if(f.direction==='out'){
      // What is actually on the shelf, and whether it may leave. Held stock stays where it
      // is until the civil defence paperwork is in order, and nobody issues more than is
      // there; before this, both went out with a success message and the count went negative.
      const here=detail.find(x=>x.product_id===prod.id && x.warehouse_id===f.warehouse_id);
      const onHand=here?nz(here.qty_on_hand):0;
      if(here && here.blocked)
        return setErr('This stock is held: '+(here.block_reason||'the civil defence paperwork is not in order')
          +'. It cannot be issued until that is cleared.');
      if(Number(f.quantity)>onHand+1e-9)
        return setErr('Only '+onHand+(here&&here.unit?' '+here.unit:'')+' of '+prod.name
          +' is in that warehouse, so '+f.quantity+' cannot be issued.');
    }
    const {error}=await sb.from('stock_movements').insert({
      product_id:prod.id, warehouse_id:f.warehouse_id, direction:f.direction,
      quantity:Number(f.quantity), project_id:f.project_id||null,
      reference:f.reference||null, note:f.note||null});
    if(error){setErr(error.message);return;}
    setMsg((f.direction==='in'?'Received ':'Issued ')+f.quantity+' of '+prod.name+'.');
    setF({product:'',warehouse_id:f.warehouse_id,direction:f.direction,quantity:'',
          project_id:'',reference:f.reference,note:''});
    load();
  };
  const upW=(i,k,v)=>setWhs(a=>a.map((x,n)=>n===i?{...x,[k]:v}:x));
  const saveWhs=async()=>{
    setErr(''); setMsg('');
    for(const w of whs){
      const {error}=await sb.from('warehouses').update({name:w.name,location:w.location||null,
        dcd_certified:!!w.dcd_certified, dcd_certificate_ref:w.dcd_certificate_ref||null,
        dcd_expiry:w.dcd_expiry||null, storage_notes:w.storage_notes||null}).eq('id',w.id);
      if(error){setErr(error.message);return;}
    }
    setMsg('Warehouses saved.'); load();
  };
  const addWh=async()=>{
    const {data,error}=await sb.from('warehouses').insert({name:'New warehouse'}).select().single();
    if(error){setErr(error.message);return;}
    setWhs(v=>[...v,data]);
  };
  const setReorder=async(r,val)=>{
    const {data:rowsS}=await sb.from('stock').select('id').eq('product_id',r.product_id);
    if(!rowsS||!rowsS.length){setErr('Record a movement for this product first, so it has a stock record.');return;}
    for(const s of rowsS) await sb.from('stock').update({reorder_level:Number(val)||0}).eq('id',s.id);
    load();
  };

  return html`
    <div class="page-head"><h1>${_t("Stock")}</h1></div>
    ${err && html`<div class="err">${err}</div>`}
    ${msg && html`<div class="ok">${msg}</div>`}

    <div class="cards">
      <div class=${'card '+(held.length>0?'alert':'okc')}><div class="k">Cannot be moved</div>
        <div class="v">${held.length>0?heldText:'0'}</div>
        <div class="s">${held.length>0?'Held pending approvals':'Everything held is clear to move'}</div></div>
      <div class=${'card '+(shorts.length?'alert':'okc')}><div class="k">Cannot fulfil</div>
        <div class="v">${shorts.length}</div>
        <div class="s">${shorts.length?'Committed to projects but not in stock':'Everything committed is covered'}</div></div>
      <div class=${'card '+(reorder.length?'alert':'okc')}><div class="k">At reorder level</div>
        <div class="v">${reorder.length}</div><div class="s">Products to order</div></div>
      <div class="card"><div class="k">Products in stock</div>
        <div class="v">${pos.filter(r=>nz(r.on_hand)>0).length}</div>
        <div class="s">Across ${whs.length} ${whs.length===1?'warehouse':'warehouses'}</div></div>
    </div>

    ${held.length>0 && html`
      <div class="panel">
        <div class="panel-head"><h2>${_t("Held, cannot be moved")}</h2>
          <span class="sp muted">${heldText} sitting still</span></div>
        <div class="tw"><table>
          <thead><tr><th>${_t("Product")}</th><th>${_t("Warehouse")}</th><th class="n">${_t("Quantity")}</th><th>${_t("What is missing")}</th></tr></thead>
          <tbody>${held.map(r=>html`<tr key=${r.stock_id}>
            <td><b>${r.product_name}</b></td>
            <td class="muted">${r.warehouse_name}</td>
            <td class="n short">${nz(r.qty_on_hand).toLocaleString()} ${r.unit||''}</td>
            <td>${r.block_reason||'Blocked'}</td>
          </tr>`)}</tbody></table></div>
        <div class="panel-body" style=${{borderTop:'1px solid var(--rule)'}}>
          <p class="muted" style=${{margin:0}}>${'Two separate permissions decide this. The product needs its Civil Defence approval, and the warehouse needs its certificate for storing materials. Tick them off below and on the product page, and this list clears itself.'}</p>
        </div>
      </div>`}

    ${shorts.length>0 && html`
      <div class="panel">
        <div class="panel-head"><h2>${_t("Short for committed work")}</h2></div>
        <div class="tw"><table>
          <thead><tr><th>${_t("Product")}</th><th class="n">${_t("On hand")}</th><th class="n">${_t("Committed")}</th><th class="n">${_t("Short by")}</th></tr></thead>
          <tbody>${shorts.map(r=>html`<tr key=${r.product_id}>
            <td><b>${r.product_name}</b></td>
            <td class="n">${nz(r.on_hand).toLocaleString()}</td>
            <td class="n">${nz(r.committed).toLocaleString()}</td>
            <td class="n short">${Math.abs(nz(r.available)).toLocaleString()} ${r.unit||''}</td>
          </tr>`)}</tbody></table></div>
      </div>`}

    <div class="panel">
      <div class="panel-head"><h2>${_t("Position")}</h2><span class="sp muted">${pos.length} ${plural(pos.length,"product")}</span></div>
      ${pos.length ? html`<div class="tw"><table>
        <thead><tr><th>${_t("Product")}</th><th class="n">${_t("On hand")}</th><th class="n">${_t("Held")}</th>
          <th class="n">${_t("Committed")}</th><th class="n">${_t("Free to move")}</th>
          <th class="n">${_t("Reorder at")}</th><th></th></tr></thead>
        <tbody>${pos.map(r=>{const av=nz(r.available);
          const movable = r.movable!=null ? nz(r.movable)
                        : Math.max((r.free_to_move==null?nz(r.on_hand):nz(r.free_to_move))
                                   - nz(r.committed), 0);
          const low=nz(r.reorder_level)>0 && nz(r.on_hand)<=nz(r.reorder_level);
          const partHeld = nz(r.blocked)>0 && nz(r.blocked) < nz(r.on_hand);
          return html`<tr key=${r.product_id}>
            <td><b>${r.product_name}</b></td>
            <td class="n">${nz(r.on_hand).toLocaleString()}</td>
            <td class=${'n '+(nz(r.blocked)>0?'short':'')}>${nz(r.blocked)?nz(r.blocked).toLocaleString():'—'}</td>
            <td class="n">${nz(r.committed).toLocaleString()}</td>
            <td class=${'n '+(movable<=0?'short':'')}>${movable.toLocaleString()}</td>
            <td class="n"><input type="number" style=${{width:'90px',padding:'4px 7px',fontSize:'13px'}}
                  defaultValue=${r.reorder_level??0} key=${'ro'+r.product_id+'-'+(r.reorder_level??0)}
                  onBlur=${e=>setReorder(r,e.target.value)}/></td>
            <td>${nz(r.blocked)>0
                   ? html`<span class="pill quiet">${partHeld?'part held':'held'}</span>`
                 :av<0?html`<span class="pill quiet">short</span>`
                 :low?html`<span class="pill quoted">reorder</span>`
                 :html`<span class="pill won">ok</span>`}</td>
          </tr>`;})}</tbody></table></div>`
        : html`<div class="empty">Nothing in stock yet. Record a movement below.</div>`}
    </div>

    <div class="panel">
      <div class="panel-head"><h2>${_t("Record a movement")}</h2></div>
      <div class="panel-body">
        <div class="grid2">
          <div class="field"><label>${_t("Product")}</label>
            <input type="text" list="stockprods" placeholder="${_t("Start typing\u2026")}" value=${f.product}
                   onInput=${e=>set('product',e.target.value)}/>
            <datalist id="stockprods">${prods.map(x=>html`<option key=${x.id} value=${x.name}></option>`)}</datalist></div>
          <div class="field"><label>${_t("Warehouse")}</label>
            <select value=${f.warehouse_id} onChange=${e=>set('warehouse_id',e.target.value)}>
              <option value="">${_t("Choose\u2026")}</option>

          <td class="muted">${m.projects?.name||'—'}</td>

            <select value=${w.dcd_certified?'y':'n'}

// onChange fires only after a document is added, renamed or removed, never after the
// first load. Calling it on load would let a parent that reloads on change remount this
// component, which calls load again, which fires onChange again.
function DocumentsPanel({table,bucket,fk,id,types,heading,onChange,scrollTo}){
  const [docs,setDocs]=useState(null); const [busy,setBusy]=useState(''); const [err,setErr]=useState('');
  const [type,setType]=useState(types[0][0]); const [title,setTitle]=useState('');
  const [expires,setExpires]=useState('');
  const [url,setUrl]=useState(''); const [over,setOver]=useState(false);
  const [editId,setEditId]=useState(null); const [eTitle,setETitle]=useState(''); const [eType,setEType]=useState(types[0][0]);
  const fileRef=useRef(null);
  const label=t=>(types.find(x=>x[0]===t)||[t,t])[1];
  const cls=t=>['tds','sds','dcd','cert','bill_of_lading','dg_declaration'].includes(t)?
    ({bill_of_lading:'dcd',dg_declaration:'sds'}[t]||t):'';

  const load=useCallback(async()=>{
    const {data,error}=await sb.from(table).select('*').eq(fk,id).order('created_at',{ascending:false});
    if(error) setErr(error.message);
    setDocs(data||[]);
  },[table,fk,id]);
  useEffect(()=>{load();},[load]);

  const upload=async(file)=>{
    if(!file) return;
    setErr(''); setBusy('Uploading '+file.name+'…');
    const safe=file.name.replace(/[^A-Za-z0-9._-]/g,'_');
    const path=id+'/'+Date.now()+'-'+safe;
    const {error:e1}=await sb.storage.from(bucket).upload(path,file,{upsert:false});
    if(e1){setBusy('');setErr('Upload failed: '+e1.message);return;}
    const row={doc_type:type,title:(title.trim()||file.name),storage_path:path,
               file_size:file.size,mime_type:file.type||null}; row[fk]=id;
    if(expires && table==='product_documents') row.expires_on=expires;
    const {error:e2}=await sb.from(table).insert(row);
    setBusy(''); if(e2){setErr(e2.message);return;}
    setTitle(''); if(fileRef.current) fileRef.current.value=''; load(); onChange&&onChange();
  };
  const addLink=async()=>{
    const u=url.trim(); if(!u) return;
    setErr(''); setBusy('Saving link…');
    const row={doc_type:type,title:(title.trim()||u),external_url:u}; row[fk]=id;
    if(expires && table==='product_documents') row.expires_on=expires;
    const {error}=await sb.from(table).insert(row);
    setBusy(''); if(error){setErr(error.message);return;}
    setUrl(''); setTitle(''); load(); onChange&&onChange();
  };
  const open=async(d)=>{
    if(d.external_url){window.open(d.external_url,'_blank','noopener');return;}
    const {data,error}=await sb.storage.from(bucket).createSignedUrl(d.storage_path,120);
    if(error){setErr('Could not open the file: '+error.message);return;}
    window.open(data.signedUrl,'_blank','noopener');
  };
  const remove=async(d)=>{
    if(!confirm('Remove "'+d.title+'"?')) return;
    if(d.storage_path) await sb.storage.from(bucket).remove([d.storage_path]);
    const {error}=await sb.from(table).delete().eq('id',d.id);
    if(error) setErr(error.message); else { load(); onChange&&onChange(); }
  };
  const startEdit=d=>{setEditId(d.id);setETitle(d.title);setEType(d.doc_type);};
  const saveEdit=async()=>{
    const t=eTitle.trim(); if(!t){setErr('Give the document a name.');return;}
    setErr('');
    const {error}=await sb.from(table).update({title:t,doc_type:eType}).eq('id',editId);
    if(error){setErr(error.message);return;}
    setEditId(null); load(); onChange&&onChange();
  };

  // When an alert about a document sent us here, put the documents in front of the reader
  // rather than leaving them to scroll for the thing they just clicked on.
  const box=useRef(null);
  useEffect(()=>{
    if(!scrollTo || docs===null || !box.current) return;
    const t=setTimeout(()=>{
      try{ box.current.scrollIntoView({block:'start',behavior:'smooth'}); }catch(e){}
    },120);
    return ()=>clearTimeout(t);
  },[scrollTo,docs]);

  return html`
    ${err && html`<div class="err">${err}</div>`}
    <div class="panel" ref=${box}>
      <div class="panel-head"><h2>${heading||'Documents'}</h2>
        <span class="sp muted">${docs?docs.length:0} on file</span></div>
      ${docs===null ? html`<div class="spinner"></div>`
        : docs.length ? docs.map(d=> editId===d.id ? html`
          <div class="doc editing" key=${d.id}>
            <select value=${eType} onChange=${e=>setEType(e.target.value)}>
              ${types.map(([v,l])=>html`<option key=${v} value=${v}>${l}</option>`)}</select>
            <input type="text" value=${eTitle} autoFocus onInput=${e=>setETitle(e.target.value)}
              onKeyDown=${e=>{if(e.key==='Enter')saveEdit(); if(e.key==='Escape')setEditId(null);}}/>
            <div class="acts">
              <button class="btn sm" onClick=${saveEdit}>${_t("Save")}</button>
              <button class="btn sec sm" onClick=${()=>setEditId(null)}>${_t("Cancel")}</button>
            </div>
          </div>` : html`
          <div class="doc" key=${d.id}>
            <span class=${'chip-doc '+cls(d.doc_type)}>${label(d.doc_type)}</span>
            <div>
              <div class="t nameable" title="Click to rename" onClick=${()=>startEdit(d)}>${d.title}</div>
              <div class="m">${[d.external_url?'Link':'File',
                 d.file_size?kb(d.file_size):null,
                 d.created_at?'added '+d.created_at.slice(0,10):null
                 ].filter(Boolean).join(' · ')}${
                 d.expires_on ? html`<span class=${expired(true,d.expires_on)?'short':''}>
                   ${' · '+(expired(true,d.expires_on)?'EXPIRED ':'expires ')+fmtDate(d.expires_on)}
                 </span>` : null}</div>
            </div>
            <div class="acts">
              <button class="btn sec sm" onClick=${()=>open(d)}>${_t("Open")}</button>
              <button class="btn sec sm" onClick=${()=>startEdit(d)}>${_t("Rename")}</button>
              <button class="btn sec sm" style=${{color:'var(--crit)'}} onClick=${()=>remove(d)}>${_t("Remove")}</button>
            </div>
          </div>`)
        : html`<div class="empty">Nothing here yet. Add the paperwork below.</div>`}
    </div>

    <div class="panel">
      <div class="panel-head"><h2>${_t("Add a document")}</h2></div>
      <div class="panel-body">
        ${busy && html`<div class="ok">${busy}</div>`}
        <div class="grid2">
          <div class="field"><label>${_t("Document type")}</label>
            <select value=${type} onChange=${e=>setType(e.target.value)}>
              ${types.map(([v,l])=>html`<option key=${v} value=${v}>${l}</option>`)}</select></div>
          <div class="field"><label>${_t("Title, optional")}</label>
            <input type="text" placeholder="${_t("Defaults to the file name")}" value=${title}
                   onInput=${e=>setTitle(e.target.value)}/></div>
          ${table==='product_documents' && html`<div class="field">
            <label>${_t("Expires on, for a certificate")}</label>
            <input type="date" value=${expires} onInput=${e=>setExpires(e.target.value)}/></div>`}
        </div>
        <div class=${'drop'+(over?' over':'')}
             onDragOver=${e=>{e.preventDefault();setOver(true);}}
             onDragLeave=${()=>setOver(false)}
             onDrop=${e=>{e.preventDefault();setOver(false);upload(e.dataTransfer.files[0]);}}>
          <p style=${{margin:'0 0 10px'}} class="muted">Drop a file here, or choose one.</p>
          <input type="file" ref=${fileRef} onChange=${e=>upload(e.target.files[0])}/>
        </div>
        <div class="field" style=${{marginTop:'16px'}}>
          <label>${_t("Or paste a link, for a file kept in Drive")}</label>
          <div style=${{display:'flex',gap:'8px'}}>
            <input type="text" placeholder="https://…" value=${url} onInput=${e=>setUrl(e.target.value)}/>
            <button class="btn sec" onClick=${addLink}>${_t("Add link")}</button>
          </div>
        </div>
      </div>
    </div>`;
}

const DOC_TYPES=[['tds','Technical data sheet'],['sds','Safety data sheet / MSDS'],
                 ['dcd','DCD approval'],['cert','Certificate / CE / BBA'],

const docLabel=t=>(DOC_TYPES.find(x=>x[0]===t)||['other','Other'])[1];
const docClass=t=>['tds','sds','dcd','cert'].includes(t)?t:'';
const kb=n=>n==null?'':n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB';

function ProductPage({id,rate,back,section}){

  useEffect(()=>{(async()=>{

    setP(data);

  if(!p) return html`<div class="spinner"></div>`;

  const saveShipping=async()=>{

      hs_code:(p.hs_code||'').trim()||null,
      un_number:(p.un_number||'').trim()||null,

  };

  return html`
    <div class="page-head">
      <button class="btn sec sm" onClick=${back}>${_t("\u2190 Catalogue")}</button>
    </div>
    <div class="pp-head">
      <div>
        <div class="pp-sub">${p.subcategory||p.category}</div>
        <h1 class="pp-title">${p.name}</h1>
      </div>
    </div>
    ${err && html`<div class="err">${err}</div>`}

    <div class="panel"><div class="panel-body">
      <dl class="kv">
        <dt>${_t("Description")}</dt><dd>${p.description||'—'}</dd>
        <dt>${_t("Application")}</dt><dd>${p.application||'—'}</dd>
        <dt>${_t("Coverage")}</dt><dd>${p.consumption_text||'—'}</dd>
        <dt>${_t("Colours")}</dt><dd>${p.colours||'—'}</dd>
        <dt>${_t("Category")}</dt><dd>${p.category}${p.subcategory?' / '+p.subcategory:''}</dd>
        ${p.product_aliases?.length ? html`<${Frag}><dt>${_t("Also called")}</dt>
          <dd>${p.product_aliases.map(a=>a.alias).join(', ')}</dd></${Frag}>`:''}
      </dl>
    </div></div>

    <div class="panel">
      <div class="panel-head"><h2>${_t("Pack sizes and prices")}</h2></div>
      <div class="tw"><table>
        <thead><tr><th>${_t("Pack")}</th><th class="n">${_t("EUR")}</th><th class="n">${_t("AED")}</th><th class="n">${_t("Per unit (AED)")}</th></tr></thead>
        <tbody>${(p.product_packs||[]).map(k=>html`<tr key=${k.id}>
          <td><b>${k.label}</b></td>
          <td class="n">${k.is_poa?'—':Number(k.eur_total||0).toFixed(2)}</td>
          <td class="n">${k.is_poa?'On application':AED(nz(k.eur_total)*rate,'AED')}</td>
          <td class="n">${k.is_poa?'—':AED(nz(k.eur_per_unit)*rate,'AED')+' / '+(k.unit||'kg')}</td>
        </tr>`)}</tbody>
      </table></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>${_t("Shipping, customs and approvals")}</h2>
        <span class="sp">
          ${p.is_dangerous ? html`<span class="dgflag">Dangerous goods</span>` : ''}
          ${expired(p.dcd_approved,p.dcd_expiry)
            ? html`<span class="pill quiet" style=${{marginLeft:'6px'}}
                title=${'Expired '+fmtDate(p.dcd_expiry)}>DCD approval expired</span>`
            : p.dcd_approved
            ? html`<span class="pill won" style=${{marginLeft:'6px'}}>DCD approved</span>`
            : html`<span class="pill quiet" style=${{marginLeft:'6px'}}>No DCD approval</span>`}
        </span></div>
      <div class="panel-body">
        ${msg && html`<div class="ok">${msg}</div>`}
        <div class="grid2">
          <div class="field"><label>${_t("HS code")}</label>
            <input type="text" placeholder="e.g. 3214.90" value=${p.hs_code||''}
                   onInput=${e=>set('hs_code',e.target.value)}/></div>
          <div class="field"><label>${_t("UN number, if dangerous")}</label>
            <input type="text" placeholder="e.g. UN1263" value=${p.un_number||''}
                   onInput=${e=>set('un_number',e.target.value)}/></div>
          <div class="field"><label>${_t("Packing group")}</label>
            <select value=${p.packing_group||''} onChange=${e=>set('packing_group',e.target.value)}>
              <option value="">${_t("Not applicable")}</option>
              <option value="I">${_t("I")}</option><option value="II">${_t("II")}</option><option value="III">${_t("III")}</option>
            </select></div>
          <div class="field"><label>${_t("Classified dangerous")}</label>
            <select value=${p.is_dangerous?'yes':'no'} onChange=${e=>set('is_dangerous',e.target.value==='yes')}>
              <option value="no">${_t("No")}</option><option value="yes">${_t("Yes")}</option></select></div>
          <div class="field"><label>${_t("Civil Defence approval")}</label>
            <select value=${p.dcd_approved?'yes':'no'} onChange=${e=>set('dcd_approved',e.target.value==='yes')}>
              <option value="no">${_t("Not approved, stock cannot move")}</option>
              <option value="yes">${_t("Approved")}</option></select></div>
          <div class="field"><label>${_t("DCD approval number")}</label>
            <input type="text" value=${p.dcd_ref||''} onInput=${e=>set('dcd_ref',e.target.value)}/></div>
          <div class="field"><label>${_t("Approval expires")}</label>
            <input type="date" value=${p.dcd_expiry||''} onInput=${e=>set('dcd_expiry',e.target.value)}/></div>
        </div>
        <button class="btn" onClick=${saveShipping} disabled=${busy}>${busy?_t('Saving…'):_t('Save')}</button>
        <p class="muted" style=${{marginTop:'12px'}}>Entered once here, then copied onto every shipment line that carries this product, so the forwarder gets the same numbers each time.</p>
      </div>
    </div>

    <${DocumentsPanel} table="product_documents" bucket="product-docs"
       fk="product_id" id=${id} types=${DOC_TYPES} heading="Documents" scrollTo=${section==='documents'}/>`;
}




/* ══════════════ A SMALL PDF WRITER ══════════════
   The app loads nothing from a CDN by design, so this builds the file itself. It is
   deliberately narrow: A4, Helvetica and Helvetica-Bold, text, rules and filled boxes.
   That is everything a freight request needs and nothing more.

   The two fonts are PDF base-14, so nothing has to be embedded and the file stays small
   enough to attach to an email. Text is encoded WinAnsi, which covers the characters that
   actually appear on this document: the superscript two in m², the middle dot, the degree
   sign and curly quotes. */
function miniPdf(opts){
  const W = 595.28, H = 841.89;                 // A4 in points
  const M = { l: 40, r: 40, t: 46, b: 44 };
  const pages = [];
  let ops = [], y = H - M.t, pageNo = 0;

  const WIN = {'‘':0x91,'’':0x92,'“':0x93,'”':0x94,'–':0x96,
               '—':0x97,'•':0x95,'·':0xb7,'²':0xb2,'³':0xb3,
               '°':0xb0,'€':0x80,'…':0x85,'é':0xe9,'è':0xe8,
               'í':0xed,'ñ':0xf1,'ü':0xfc};
  const enc = s => String(s==null?'':s).split('').map(ch=>{
    const cp = ch.codePointAt(0);
    if(cp === 40 || cp === 41 || cp === 92) return '\\' + ch;      // ( ) backslash
    if(cp < 128) return ch;
    const w = WIN[ch];
    if(w) return '\\' + w.toString(8).padStart(3,'0');
    if(cp < 256) return '\\' + cp.toString(8).padStart(3,'0');
    return '?';                                   // anything else is not worth guessing at
  }).join('');

  // Helvetica widths, in 1/1000 em. Only what is needed to wrap and right-align text.
  const WID_R = {' ':278,'!':278,'"':355,'#':556,'$':556,'%':889,'&':667,"'":191,'(':333,
    ')':333,'*':389,'+':584,',':278,'-':333,'.':278,'/':278,'0':556,'1':556,'2':556,'3':556,
    '4':556,'5':556,'6':556,'7':556,'8':556,'9':556,':':278,';':278,'<':584,'=':584,'>':584,
    '?':556,'@':1015,'[':278,'\\':278,']':278,'^':469,'_':556,'`':333,'{':334,'|':260,
    '}':334,'~':584};
