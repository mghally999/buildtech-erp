     it names, because a cost that is quietly short is worse than no cost at all. */
  /* A spec note is written the way a specifier writes it, not the way the catalogue spells
     it: "Geomax 80gr./m²" against a catalogue entry called "Geomax (80 g/m²)". So a
     product is looked for by its exact name, then by its aliases, then by the part of its
     name before any bracket, which is what people actually type. The longest match wins,
     so IBT-Floor is never mistaken for IBT. */
  const catKeys = (()=>{
    const out=[];
    (cat||[]).forEach(p=>{
      const add=(txt,exact)=>{ const k=normName(txt); if(k.length>=4) out.push({k,p,exact}); };
      add(p.name,true);
      (p.product_aliases||[]).forEach(a=>add(a.alias,true));
      const bare=String(p.name||'').split('(')[0];
      if(bare && bare.trim()!==String(p.name||'').trim()) add(bare,false);
    });
    return out.sort((a,b)=>b.k.length-a.k.length);
  })();
  const findProduct = raw => {
    const head = normName(String(raw).split(':')[0]);
    const whole = normName(raw);
    if(!head) return null;
    const hit = catKeys.find(x=>x.k===head)
             || catKeys.find(x=>head.startsWith(x.k))
             || catKeys.find(x=>whole.startsWith(x.k));
    return hit ? hit.p : null;
  };
  const supplyDisc = settingNumber(cfg('supply_discount'), 0.70);
  const fxRate     = qCur==='EUR' ? 1 : settingNumber(cfg('eur_aed_rate'), rate||4.27);
  // cheapest priced pack, per kilo, in the quotation's currency
  // Krypton's own list price per unit, straight off the catalogue: the CATALOGUS column
  // of their price sheet. The cheapest pack, because that is the one anybody would buy.
  const packList = p => {
    const per=k=>nz(k.eur_per_unit)||(nz(k.pack_qty)?nz(k.eur_total)/nz(k.pack_qty):0);
    return (p.product_packs||[]).filter(k=>!k.is_poa).map(per)
             .filter(x=>x>0).sort((a,b)=>a-b)[0] || 0;
  };
  // and what we actually pay for it: that list less the supply discount, in this
  // quotation's currency. It is the KOSTPRIJS column of the same sheet.
  const packCost = p => { const l=packList(p);
    return l ? l*(1-supplyDisc)*fxRate : 0; };
  const sectionCost = s => {
    const notes=s.lines.filter(l=>l.is_spec_note && (l.description||'').trim());
    let total=0; const used=[], missed=[];
    notes.forEach(l=>{
      const raw=l.description;
      const prod=findProduct(raw);
      if(!prod) return;                                   // prose, not a product
      const unitCost=packCost(prod);
      if(!unitCost){ missed.push(prod.name+', no priced pack'); return; }
      const list=packList(prod);
      const isArea=(prod.product_packs||[]).some(k=>/m2|m²/i.test(k.unit||''));
      if(isArea){ total+=unitCost;
        used.push(prod.name+' one for one, Krypton list €'+round2(list)+'/m² less '
                  +Math.round(supplyDisc*100)+'%'); return; }
      const said=parseConsumption(raw);
      const cov = said ? {kg:said.kg, how:'line', text:round2(said.kg)+' kg/m²'}
                       : coverageOf(prod);
      if(!cov){ missed.push(prod.name + (('coverage_max' in prod)||('coverage_unit' in prod)
        ? ', no consumption recorded for it'
        : ', this page never loaded the consumption figures, reload it')); return; }
      total+=cov.kg*unitCost;
      used.push(prod.name+' at '+cov.text
                +(cov.how==='catalogue'?' from the data sheet':'')
                +', Krypton list €'+round2(list)+'/kg less '
                +Math.round(supplyDisc*100)+'%');
    });
    return {perM2:total, used, missed, any:used.length>0};
  };
  // sell that carries the margin, which is on the sell and not a mark-up on the cost
  const atMargin = c => sellFrom(c, targetPct);
  // a line is following the margin if its price is the one the margin would set
  const onMargin = l => l.cost_rate!=null && l.cost_rate!=='' && nz(l.sell_rate)>0
                     && Math.abs(nz(l.sell_rate)-atMargin(l.cost_rate))<0.51;

  const costSection = i => setSecs(a=>a.map((s,n)=>{
    if(n!==i) return s;
    const r=sectionCost(s);
    if(!r.any) return s;
    return {...s, lines:s.lines.map(l=> (l.is_spec_note || !isAreaUnit(l.unit)) ? l
      : {...l, cost_rate:round2(r.perM2),
         // price it too, unless a price has already been decided by hand
         sell_rate:(l.sell_rate===''||l.sell_rate==null||onMargin(l))
                   ? atMargin(r.perM2) : l.sell_rate})};
  }));
  const repriceAll = () => setSecs(a=>a.map(s=>({...s, lines:s.lines.map(l=>
    (l.is_spec_note || l.cost_rate==null || l.cost_rate==='') ? l
      : {...l, sell_rate:atMargin(l.cost_rate)})})));



  // ── Margin readouts ──────────────────────────────────────────────────────────
  // Gross margin on the sell, not mark-up on the cost. 160 sell against 104 cost is
  // 35% margin and 54% mark-up, and quoting one while thinking of the other is how a
  // job comes in under water. The label says Margin and the arithmetic matches it.
  //
  // A blank cost is not a cost of zero. A line with no cost reads "-" and is left out
  // of its section's total, because showing 100% against an unpriced line would be a
  // lie in the flattering direction, which is the one that costs money.
  const pctTone = p => p<0 ? 'neg' : (p < floorPct ? 'thin' : 'pos');

  const lineMargin = l => {
    const hasCost = l.cost_rate!=null && l.cost_rate!=='';
    const sell = nz(l.sell_rate);
    if(!hasCost)   return {text:'—', tone:'na', hint:'No cost entered on this line'};
    if(sell<=0)    return {text:'—', tone:'na', hint:'No sell rate entered on this line'};
    const p = (sell - nz(l.cost_rate)) / sell * 100;
    return {
      text: p.toFixed(1)+'%',
      tone: pctTone(p),
      hint: p<0
        ? 'Below cost by ' + AED(nz(l.cost_rate)-sell,qCur) + ' per ' + (l.unit||'unit')
        : 'Margin on the sell rate: ' + AED(sell-nz(l.cost_rate),qCur) + ' per '
          + (l.unit||'unit') + ' kept out of ' + AED(sell,qCur) + '. The same job as a mark-up on '
          + 'cost is ' + ((sell-nz(l.cost_rate))/nz(l.cost_rate)*100).toFixed(0) + '%.'
          + (p<floorPct ? ' Under your '+floorPct+'% floor.' : '')
    };
  };

  // A section total weights by quantity, so a large cheap line and a small rich one
  // do not average as if they were the same size.
  /* What this section makes. The money in is the priced lines; the money out is every
     line with a cost on it, build-up lines included, because those are the products that
     the priced line is made of. */
  const secMargin = s => {
    const sell = sellTotal(s.lines);
    const rows = s.lines.filter(l=>!l.is_spec_note && l.cost_rate!=null && l.cost_rate!=='');
    const cost = rows.reduce((t,l)=>t+nz(l.quantity)*nz(l.cost_rate),0);
    if(!rows.length || sell<=0) return null;
    const p = (sell-cost)/sell*100;
    // a star means some of what is being sold has no cost against it anywhere
    const bare = s.lines.filter(l=>!l.is_spec_note && !l.is_costing
                                && nz(l.sell_rate) && (l.cost_rate==null||l.cost_rate===''));
    const anyBuildUp = s.lines.some(l=>l.is_costing && l.cost_rate!=null && l.cost_rate!=='');
    return {pct:p, gp:sell-cost, tone:pctTone(p), partial: bare.length>0 && !anyBuildUp};
  };

  const save=async()=>{
    setBusy(true); setMsg('');
    let qid = q.id; let newRef = null;
    if(!qid){
      // the number comes from the office, so Dubai and Bruges never take the same one
      const {data:ref,error:e0}=await sb.rpc('next_quotation_reference',
                                             {p_office:q.office_id||null});
      if(e0){setBusy(false);setMsg('Error: could not allocate a number. '+e0.message);return;}
      const {data:ins,error:e1}=await sb.from('quotations').insert({
        reference:ref,
        // a euro quotation converts nothing, because it was priced in euros to start with
        eur_aed_rate: q.currency==='EUR' ? 1 : rate,
        office_id:q.office_id||null, currency:q.currency||'AED', language:q.language||'en',
        quote_date:q.quote_date, status:q.status,
        vat_applies:q.vat_applies, vat_rate:nz(q.vat_rate)}).select().single();
      if(e1){setBusy(false);setMsg('Error: '+e1.message);return;}
      qid = ins.id; newRef = ref;
      setQ(p=>({...p,id:qid,reference:ref}));
    }
    const {error}=await sb.from('quotations').update({
      client_id:q.client_id||null,project_name:q.project_name||null,location:q.location||null,
      quote_date:q.quote_date,valid_until:q.valid_until||null,status:q.status,
      vat_rate:nz(q.vat_rate),vat_applies:q.vat_applies,remarks:q.remarks||null,
      language:q.language||'en',
      price_mode:q.price_mode||null, price_target:num(q.price_target),
      discount_amount:num(q.discount_amount), discount_label:q.discount_label||null,
      meeting_notes:q.meeting_notes||null,revision:q.revision||''}).eq('id',qid);
    if(error){setBusy(false);setMsg('Error: '+error.message);return;}
    // The product behind a line, so stock, shipments and the scope reader can find it
    // later. Only lines that name one, and only where the name really is in the catalogue,
    // so a typo does not become a product.
    const lineProduct = l => { if(l.product_id) return l.product_id;
      if(!(l.is_costing || l.is_spec_note)) return null;
      const p = findProduct(plainText(l.description||'')); return p ? p.id : null; };
    // One call, one transaction. The old sections go only once every new one is in;
    // before this a failure halfway left the quotation empty in the database.
    const sections=secs.map((s,i)=>({title:s.title||('Section '+(i+1)),
      lines:(s.lines||[]).map(l=>({description:l.description||'',
        is_spec_note:!!l.is_spec_note,is_bold:!!l.is_bold,is_costing:!!l.is_costing,
        product_id:lineProduct(l), unit:l.unit||null, quantity:num(l.quantity),
        sell_rate:num(l.sell_rate), cost_rate:num(l.cost_rate), is_provisional:!!l.is_provisional}))}));
    const {data:savedAt,error:e2}=await sb.rpc('save_quotation',{p_quotation:qid,p_sections:sections});
    if(e2){setBusy(false);setMsg('Error: '+e2Msg(e2));return;}
    /* Remember how each product was worded and what it was costed at, so the next
       quotation offers both rather than making somebody remember them. Only the build-up
       lines, because those are the ones that name a product; and only where the name
       resolves to something in the catalogue, so a typo does not become a suggestion.
       Best effort: a quotation that saved must not report an error because a convenience
       did not. */
    try{
      const said = new Map();
      secs.forEach(s2=>(s2.lines||[]).forEach(l=>{
        if(l.is_spec_note || !l.is_costing) return;
        const text = plainText(l.description).trim();
        if(text.length < 3) return;
        const prod = findProduct(text);
        if(!prod) return;
        said.set(prod.id+'|'+text, {
          product_id: prod.id, wording: text,
          last_cost: num(l.cost_rate), cost_unit: l.unit || null,
          currency: q.currency || 'AED',
          last_used_at: new Date().toISOString() });
      }));
      for(const row of said.values()){
        const hit = (wordings||[]).find(w =>
          w.product_id === row.product_id && w.wording === row.wording);
        if(hit) await sb.from('product_wordings').update({
          last_cost: row.last_cost, cost_unit: row.cost_unit, currency: row.currency,
          times_used: nz(hit.times_used)+1, last_used_at: row.last_used_at }).eq('id', hit.id);
        else await sb.from('product_wordings').insert(row);
      }
    }catch(e){ /* the quotation is saved; the memory is a convenience */ }

    // it is in the database now: what is on screen is the saved copy, and the local
    // draft has done its job
    const after={...q, id:qid, reference:q.reference||newRef, updated_at:savedAt};
    savedRef.current = JSON.stringify({q:after, secs});
    setQ(after); setOffered(null);
    dropDraft(); setRestored('');
    setBusy(false); setMsg(newRef ? 'Saved as '+newRef+'.' : 'Saved.');
  };
  const remove=async()=>{
    if(!q.id){ dropDraft(); back(); return; }
    if(!confirm('Delete quotation '+q.reference+'? The number stays used and is never reissued.')) return;
    await sb.from('quotations').delete().eq('id',q.id); dropDraft(); back();
  };

  const client=clients.find(c=>c.id===q.client_id);

  /* Choosing a client brings his details with him. His address and tax number were always
     read straight off his record onto the printed sheet, so those were never retyped, but
     the site was, every single time, for a client whose site is his own address. It fills
     in what is blank and never overwrites what has been typed: a main contractor's office
     and the site he is building on are two different places, and quietly replacing one
     with the other would put the wrong address on a quotation. */
  const pickClient = id => {
    const c = clients.find(x=>x.id===id);
    setQ(p=>({...p, client_id:id,
      location: (p.location && p.location.trim()) ? p.location : ((c && c.location) || '')}));
  };

  return html`
    <div class="shell-inner">
    <div class="page-head">
      <button class="btn sec sm" onClick=${back}>${_t("\u2190 All quotations")}</button>
      <span class="qref">${q.reference ? q.reference+(q.revision?' '+q.revision:'')
        : html`<span class="muted" style=${{fontFamily:'var(--fb)',fontWeight:400,fontSize:'14px'}}>
            ${_t('New quotation, number issued when you save')}</span>`}</span>
      ${unpriced.length>0 && html`<span class="muted needprice" style=${{fontSize:'13px'}}>${
        unpriced.length+' of '+secs.length+' '+plural(secs.length,'section')+' still '
        +(unpriced.length===1?'needs':'need')+' a price'}</span>`}
      <div class="sp" style=${{display:'flex',gap:'8px'}}>
        <button class="btn sec" onClick=${()=>setShipOpen(v=>!v)} disabled=${!q.id}
          title=${q.id?'Work the cargo out of this quotation and ask a forwarder for a rate'
                     :'Save first'}>${shipOpen?'Hide shipping':'Shipping request'}</button>
        <button class="btn sec" onClick=${printOnePage} disabled=${!q.id}
          title=${q.id?'Turn on Background graphics in the print dialog, or the blue and gold blocks drop out'
                     :'Save first, then the number is issued'}>${_t("PDF")}</button>
        <button class="btn" onClick=${save} disabled=${busy}>${busy?_t('Saving…'):_t('Save')}</button>
      </div>
    </div>
    ${msg && html`<div class=${msg.startsWith('Error')?'err':'ok'}>${msg}</div>`}
    ${restored && html`<div class="flagbox">${restored}
      <button class="btn sec sm" style=${{marginLeft:'10px'}}
        onClick=${()=>{ dropDraft(); setRestored(''); window.location.reload(); }}
        title="Throw the unsaved work away and start from what is in the database"
        >Start again</button></div>`}
    ${offered && html`<div class="flagbox">${offered.text}
      <button class="btn sec sm" style=${{marginLeft:'10px'}}
        onClick=${()=>{ setQ(offered.q); setSecs(offered.secs); setOffered(null);
          setRestored('Your unsaved draft is back on screen. Saving it replaces what your colleague saved.'); }}
        title="Put the unsaved work from this machine back on screen"
        >Use my unsaved draft</button>
      <button class="btn sec sm" style=${{marginLeft:'6px'}}
        onClick=${()=>{ dropDraft(); setOffered(null); }}
        title="Throw the unsaved work away and keep the saved copy"
        >Discard it</button></div>`}
    ${shipOpen && html`<${ShippingRequest} q=${q} secs=${secs} cat=${cat} trans=${trans}
                          onOrder=${go && q.id ? ()=>go(['orders','new:'+q.id]) : null}
                          settings=${settings} client=${clients.find(c=>c.id===q.client_id)}/>`}
    ${belowCost.length>0 && html`<div class="warnbar">
      ${belowCost.length} line${belowCost.length>1?'s are':' is'} priced below cost.</div>`}

    <datalist id="prodlist">${prods.map(n=>html`<option key=${n} value=${n}></option>`)}</datalist>

    <div class="panel"><div class="panel-body">
      <div class="qhead">
        <div class="field"><label>${_t("Client")}</label>
          <select value=${q.client_id||''} onChange=${e=>pickClient(e.target.value||null)}>
            <option value="">${_t("Choose\u2026")}</option>
            ${clients.map(c=>html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}
          </select></div>
        <div class="field"><label>${_t("Project")}</label>
          <input type="text" value=${q.project_name||''} onInput=${e=>set('project_name',e.target.value)}/></div>
        <div class="field"><label>${_t("Location")}</label>
          <input type="text" value=${q.location||''} onInput=${e=>set('location',e.target.value)}/></div>
        <div class="field"><label>${_t("Date")}</label>
          <input type="date" value=${q.quote_date||''} onInput=${e=>set('quote_date',e.target.value)}/></div>
        <div class="field"><label>${_t("Valid until")}</label>
          <input type="date" value=${q.valid_until||''} onInput=${e=>set('valid_until',e.target.value)}/></div>
        <div class="field"><label>${_t("Status")}</label>
          <select value=${q.status} onChange=${e=>set('status',e.target.value)}>
            ${QSTATUS.map(s=>html`<option key=${s} value=${s}>${_t(s[0].toUpperCase()+s.slice(1))}</option>`)}
          </select></div>
        <div class="field"><label>${_t("Revision")}</label>
          <input type="text" placeholder="blank, or Rev B" value=${q.revision||''}
                 onInput=${e=>set('revision',e.target.value)}/></div>
        <div class="field"><label>${_t("VAT")}</label>
          <select value=${q.vat_applies?'y':'n'} onChange=${e=>set('vat_applies',e.target.value==='y')}>
            <option value="y">${_t('Add')+' '+(nz(q.vat_rate)*100).toFixed(0)+'%'}</option>
            <option value="n">${_t("Not applicable")}</option>
          </select></div>
        ${/* The office is fixed once the number has been issued: the reference came out of
              that office's own count, so moving it would leave a hole in one series and a
              clash in the other. Before saving, it can still be changed. */''}
        <div class="field"><label>${_t("Office")}</label>
          ${q.id ? html`<input type="text" disabled value=${(qOffice&&qOffice.name)||'—'}/>`
           : html`<select value=${q.office_id||''} onChange=${e=>{
                const o=(offices||[]).find(x=>x.id===e.target.value);
                setQ(p=>({...p, office_id:e.target.value,
                  currency:o?o.currency:p.currency,
                  language:o?o.default_lang:p.language,
                  vat_rate:o?Number(o.vat_rate):p.vat_rate}));}}>
              ${(offices||[]).map(o=>html`<option key=${o.id} value=${o.id}>${
                o.name+' · '+o.currency+' · VAT '+(Number(o.vat_rate)*100).toFixed(0)+'%'}</option>`)}
            </select>`}</div>
        ${/* Move this and every price that was following it moves with it. A price typed
              over by hand stays exactly where it was put. */''}
        ${(()=>{
          // moving either the number or the mode carries the lines that were following it
          const move=(v,mode)=>{
            const oldP=targetPct, oldM=priceMode;
            setTargetPct(v); if(mode!==oldM) setMode(mode);
            setSecs(a=>a.map(s=>({...s,lines:s.lines.map(l=>{
              if(l.is_spec_note||l.cost_rate==null||l.cost_rate==='') return l;
              const was=sellFrom(l.cost_rate,oldP,oldM);
              if(Math.abs(nz(l.sell_rate)-was)>=0.51) return l;   // priced by hand, leave it
              return {...l, sell_rate:sellFrom(l.cost_rate,v,mode)};
            })})));
          };
          const times = priceMode==='markup' ? 1+targetPct/100
                      : (targetPct>=100 ? null : 1/(1-targetPct/100));
          const other = priceMode==='markup'
            ? (times>0 ? ((times-1)/times*100).toFixed(0)+'% margin' : '')
            : (times ? ((times-1)*100).toFixed(0)+'% mark-up' : '');
          return html`<div class="field wide"><label>${_t('Margin')}</label>
            <div style=${{display:'flex',gap:'6px'}}>
              <input class="qn" type="number" min="0" max=${priceMode==='markup'?'900':'99'}
                step="1" value=${targetPct}
                title=${priceMode==='markup'
                  ? 'Added on top of the cost. 100% here means double the cost.'
                  : 'Kept out of the sell price. It cannot reach 100%: that would mean the '
                    +'job cost nothing. Doubling the cost is 50% margin, or 100% mark-up.'}
                onInput=${e=>{ const cap=priceMode==='markup'?900:99;
                  move(Math.max(0,Math.min(cap,Math.round(Number(e.target.value)||0))),priceMode);}}/>
              <select value=${priceMode} style=${{maxWidth:'112px'}}
                onChange=${e=>move(targetPct,e.target.value)}>
                <option value="margin">${_t('margin')}</option>
                <option value="markup">${_t('mark-up')}</option>
              </select>
              <button class="btn sec sm" onClick=${repriceAll}
                title="Put every line back on this, including any priced by hand"
                >${_t('Apply to all')}</button>
            </div>
            <div class="muted" style=${{fontSize:'11.5px',marginTop:'3px'}}>${
              times ? ('= '+round2(times)+'× cost'+(other?', or '+other:'')) : ''}</div>
          </div>`;})()}
        ${qLangs.length>1 && html`<div class="field"><label>${_t("Written in")}</label>
          <select value=${q.language||'en'} onChange=${e=>set('language',e.target.value)}>
            ${qLangs.map(c=>html`<option key=${c} value=${c}>${
              (LANGS.find(l=>l[0]===c)||[c,c])[1]}</option>`)}
          </select></div>`}
      </div>
      ${client && html`<p class="muted" style=${{margin:'8px 0 0'}}>${
        [client.contact_person, client.phone, client.email, client.location,
         client.trn ? (coTaxLabel+' '+client.trn) : '']
          .filter(Boolean).join(' · ')
        + '. These print on the quotation straight off the client record, so correcting '
        + 'them under Clients corrects every quotation.'}</p>`}
      ${qOffice && html`<p class="muted" style=${{margin:'4px 0 0'}}>${
        'Priced in '+qOffice.currency+', VAT '+(Number(qOffice.vat_rate)*100).toFixed(0)
        +'%, on '+qOffice.legal_name+'’s letterhead. The client’s copy prints in '
        +((LANGS.find(l=>l[0]===(q.language||'en'))||['','English'])[1])+'.'}</p>`}
    </div></div>

    ${secs.map((s,i)=>html`
      <div class="sec-box" key=${s.id}>
        <div class="sec-bar">
          <b style=${{minWidth:'18px'}}>${i+1}.</b>
          <input type="text" placeholder="${_t("Scope title, for example Roof waterproofing")}"
                 value=${s.title||''} onInput=${e=>upSec(i,'title',e.target.value)}/>
          ${/* What this section comes to, first, because that is the number being set and
                the one a client argues about. The margin beside it answers whether the
                number is worth taking. Before, only the gross profit showed, so setting a
                section to 120,000 and seeing "AED 69,993" beside it looked as though
                nothing had happened. */''}
          ${(()=>{ const total=sellTotal(s.lines); const m=secMargin(s);
            if(!total && !m) return null;
            return html`<span class="secmgn"
              title=${'This section comes to '+AED(total,qCur)
                      +(m?'. Gross profit on it: '+AED(m.gp,qCur):'')
                      +(m&&m.partial?'. Some priced lines have no cost, they are left out.':'')}>
              <span class="secsum">${AED(total,qCur)}</span>
              ${m && html`<${Frag}><b class=${m.tone}>${m.pct.toFixed(1)}%</b>
                <span>${AED(m.gp,qCur)}${m.partial?' *':''}</span></${Frag}>`}
            </span>`; })()}
          ${/* set this one section to a number, when a client argues about one trade */''}
          <span class="secprice">
            <input type="text" inputMode="decimal"
              placeholder=${Math.round(sellTotal(s.lines))||_t('set to')}
              value=${secWant[i]||''} onInput=${e=>setSecWant(s=>({...s,[i]:e.target.value}))}
              onKeyDown=${e=>{ if(e.key==='Enter') applySecPrice(i); }}
              title=${'Type what this section should come to and press Enter. The rates in '
                     +'it are scaled to land on that number.'}/>
            <button class="btn small" disabled=${!(num(secWant[i])>0)}
              onClick=${()=>applySecPrice(i)}>${_t('Set')}</button>
          </span>
          <button class="xbtn" title="Remove section" onClick=${()=>delSec(i)}>×</button>
        </div>
        ${secSaid[i] && html`<div class="secsaid">${secSaid[i]}
          <button class="xbtn" onClick=${()=>setSecSaid(m=>({...m,[i]:''}))}>×</button></div>`}
        <div class="lhead">
          <span>Description</span><span>Unit</span><span>Qty</span>
          <span>Sell rate</span><span>Cost rate</span><span class="r">Margin</span><span></span>
        </div>
        ${s.lines.map((l,j)=>l.is_spec_note ? html`
          <div class="lrow note" key=${l.id}>
            <textarea placeholder="${_t("Product specification text, not priced")}" value=${l.description}
              list="prodlist" onInput=${e=>upLine(i,j,'description',e.target.value)}
              onKeyDown=${boldKey(v=>upLine(i,j,'description',v))}></textarea>
            <div style=${{display:'flex',gap:'4px'}}>
              ${/* the button still makes the whole line bold. ⌘B on a selection marks
                    only what is selected, which is the one the product names need. */''}
              <button class=${'xbtn'+(l.is_bold?' on':'')}
                title="Bold the whole line on the PDF. To bold part of it, select the words and press ⌘B."
                onClick=${()=>upLine(i,j,'is_bold',!l.is_bold)}><b>B</b></button>
              <button class="xbtn" onClick=${()=>delLine(i,j)}>×</button>
            </div>
          </div>` : html`
          <div class=${'lrow'+(l.is_costing?' buildup':'')} key=${l.id}>
            <input type="text" list="prodlist" placeholder="${_t("Description")}" value=${l.description}
                   title="Select any words and press ⌘B to bold them on the quotation"
                   onInput=${e=>pickWording(i,j,e.target.value)}
                   onKeyDown=${boldKey(v=>upLine(i,j,'description',v))}/>
            <input type="text" placeholder="sq.m" value=${l.unit||''}
                   onInput=${e=>upLine(i,j,'unit',e.target.value)}/>
            <input type="number" step="0.01" placeholder="0" value=${l.quantity??''}
                   onInput=${e=>upLine(i,j,'quantity',e.target.value)}/>
            <input type="number" step="0.01" placeholder="${_t("Sell")}" value=${l.sell_rate??''}
                   onInput=${e=>upLine(i,j,'sell_rate',e.target.value)}/>
            ${(()=>{
              /* The priced line's own cost is normally left blank, because the cost of the
                 job is the products underneath it. So when it is blank, the rolled up
                 build-up cost per unit is shown in its place, greyed, and the margin next
                 to it is the real margin rather than a hundred percent. Type over it and
                 what you type wins, for a section priced as one lump. */
              const roll = l.is_costing ? null : buildUpCost(s.lines);
              const shown = (l.cost_rate==null || l.cost_rate==='') && roll ? roll.perUnit : null;
              return html`<${Frag}>
                <input type="number" step="0.01"
                  class=${shown!=null?'rolled':''}
                  placeholder=${shown!=null ? String(shown) : _t("Cost")}
                  title=${shown!=null
                    ? 'The products under this line come to '+AED2(shown,qCur)+' the '
                      +(l.unit||'unit')+'. Type a figure here to override it.'
                    : ''}
                  value=${l.cost_rate??''}
                  onInput=${e=>upLine(i,j,'cost_rate',e.target.value)}/>
                ${(()=>{ const m=lineMargin(shown!=null ? {...l, cost_rate:shown} : l);
                  return html`<div class=${'mgn '+m.tone}
                    title=${shown!=null ? 'Against the products underneath it. '+m.hint : m.hint}
                    >${m.text}</div>`; })()}
              </${Frag}>`; })()}
            <div style=${{display:'flex',gap:'4px'}}>
              ${/* A section is one thing sold, with the products it is made of underneath.
                    This button says which of the two a line is. A build-up line keeps its
                    rate and its margin, because that is what it is for, but its amount is
                    not part of the price and the client's copy prints it as words. */''}
              <button class=${'xbtn tag'+(l.is_costing?' on':'')}
                title=${l.is_costing
                  ? 'Build-up: shown to us, not charged. Press to make it a priced line.'
                  : 'Priced: this amount is part of the section price. Press to make it '
                    + 'build-up, so it shows the product and its cost without adding to the total.'}
                onClick=${()=>upLine(i,j,'is_costing',!l.is_costing)}>${
                  l.is_costing?_t('build-up'):_t('priced')}</button>
              <button class="xbtn" onClick=${()=>delLine(i,j)}>×</button>
            </div>
            ${(()=>{
              // where this line's cost came from. A figure with no explanation is a figure
              // nobody trusts, and one taken off a data sheet range is worth flagging as
              // an assumption rather than a decision.
              const d=lineCostDetail(l); if(!d) return '';
              if(!d.perUnit) return html`<div class="whycost warn">${
                d.prod.name+': '+d.why}</div>`;
              return html`<div class="whycost">${
                d.prod.name+' · '+d.basis+(d.from==='catalogue'?' from the data sheet':'')
                +' · Krypton list €'+round2(packList(d.prod))
                +' less '+Math.round(supplyDisc*100)+'% · '+AED2(d.perUnit,qCur)
                +' per '+(l.unit||'unit')}</div>`;})()}
          </div>`)}
        <div style=${{padding:'9px 12px',display:'flex',gap:'8px',borderTop:'1px solid var(--rule)'}}>
          <button class="btn sec sm" onClick=${()=>addLine(i,false)}>${_t("Add priced line")}</button>
          <button class="btn sec sm" onClick=${()=>addLine(i,true)}>${_t("Add spec note")}</button>
          <button class="btn sec sm" title="An empty line, for spacing on the printed sheet"
            onClick=${()=>addLine(i,'blank')}>${_t("Add blank row")}</button>
          ${(()=>{ const r=sectionCost(s); if(!r.any && !r.missed.length) return '';
            const notArea=s.lines.filter(l=>!l.is_spec_note && !l.is_costing && !isAreaUnit(l.unit));
            return html`<${Frag}>
              <button class="btn sec sm sp" onClick=${()=>costSection(i)}
                title=${'Price the products named in this section: '+r.used.join(', ')}>${
                _t('Cost it from the specification')}</button>
              <span class="muted" style=${{alignSelf:'center',fontSize:'12px'}}>${
                (r.any ? AED2(r.perM2, qCur)+' / m² from '+r.used.join(', ') : '')
                + (r.any && notArea.length ? '. Not put against the line in '
                    + [...new Set(notArea.map(l=>l.unit||'no unit'))].join(', ')
                    + ', which is not per square metre; that rate goes in by hand' : '')
                + (r.missed.length ? (r.any?'. ':'')+'Cannot price '+r.missed.join('; ') : '')
                }</span></${Frag}>`;})()}
        </div>
      </div>`)}

    <button class="btn sec" onClick=${addSec}>${_t("Add section")}</button>

    <div class="panel" style=${{marginTop:'20px'}}><div class="panel-body totrow">
      <div class="totside">
        <p class="muted">${_t('Cost rates are never printed on the client PDF.')}</p>
        <p class="muted">When you save the PDF, turn on <b>Background graphics</b> in the print
          dialog. Without it the blue section bars and the gold rate cells print white.</p>
        ${anyCost && uncosted.length>0 && html`<div class="warnbar" style=${{marginTop:'12px'}}>
          ${uncosted.length} priced ${plural(uncosted.length,'line')} ${uncosted.length===1?'has':'have'}
          no cost rate, carrying ${AED(uncostedRevenue,qCur)} of the subtotal. The margin and the
          floor cover only the ${AED(costedRevenue,qCur)} that is costed.</div>`}
      </div>
      <div class="totmain">
      <div class="tot">
        <span class="lbl">${_t("Subtotal")}</span><span class="val">${AED(subtotal,qCur)}</span>
        ${discount>0 && html`<${Frag}>
          <span class="lbl">${q.discount_label||_t('Discount')}</span>
          <span class="val neg">${'− '+AED(discount,qCur)}</span></${Frag}>`}
        ${q.vat_applies
          ? html`<${Frag}><span class="lbl">VAT ${(nz(q.vat_rate)*100).toFixed(0)}%</span><span class="val">${AED(vat,qCur)}</span></${Frag}>`
          : html`<${Frag}><span class="lbl">VAT</span><span class="val muted">${_t('not applied')}</span></${Frag}>`}
        <span class="lbl"><b>Total</b></span><span class="val big">${AED(total,qCur)}</span>
        ${anyCost && html`<${Frag}>
          <span class="lbl">Cost${uncosted.length?' of the costed lines':''}</span>

        </${Frag}>`}
      </div>

      ${/* ── the number you actually want ──────────────────────────────────────────
             Typed here rather than worked out from the rates, because that is the order
             the decision really happens in. What it does to the rates depends on the
             switch: spread it and the client sees an ordinary quotation, or show it and
             they see what they were given off. */''}
      <div class="pricebox">
        <div class="pricehead">
          <span>${_t('Set the price')}</span>
          <label>${_t('and')}
            <select value=${q.price_mode||'spread'} onChange=${e=>set('price_mode',e.target.value)}>
              <option value="spread">${_t('spread it across the rates')}</option>
              <option value="discount">${_t('show it as a discount')}</option>
            </select>
          </label>
        </div>
        <div class="pricerow">
          <span class="pcur">${qCur}</span>
          <input type="text" inputMode="decimal" placeholder=${Math.round(subtotal)||'0'}
                 value=${wantTxt} onInput=${e=>setWantTxt(e.target.value)}
                 onKeyDown=${e=>{ if(e.key==='Enter') applyPrice(); }}/>
          <button class="btn" disabled=${!canPrice} onClick=${applyPrice}>${_t('Apply')}</button>
          ${(discount>0 || q.price_target) && html`<button class="btn sec"
            onClick=${clearPrice}>${_t('Clear')}</button>`}
        </div>
        <p class="muted">${(()=>{
          const want = num(wantTxt);
          const vatWord = q.vat_applies ? ' including VAT' : '';
          if(!wantTxt.trim()) return (q.price_mode||'spread')==='discount'
            ? 'Type the total you want the client to pay'+vatWord+'. The rates stay as they '
              + 'are and the difference shows as a discount line on their copy.'
            : 'Type the total you want the client to pay'+vatWord+'. Every sell rate is '
              + 'scaled so the lines add up to it, and nothing on their copy says so.';
          if(!isFinite(want) || want<=0) return 'That is not a number I can price to.';

          const net = Math.round(netOf(want)*100)/100;
          const spread = (q.price_mode||'spread')==='spread';
          if(!spread && net > subtotal)
            return 'A discount cannot be more than the price. Switch to spreading it if you '
                 + 'want to put the rates up.';

          const say = [];
          const d = subtotal - net;
          say.push(Math.abs(d) < 0.5
            ? 'That is what the rates already come to.'
            : AED(Math.abs(d),qCur) + (d>0 ? ' off the ' : ' on top of the ')
              + AED(subtotal,qCur) + ' the rates come to.');

          /* Where it will actually land. A rate carries two decimals, so on a quotation
             made of large lines the nearest reachable total can be a few dirhams out, and
             Charles should see that before he presses rather than afterwards. */
          if(spread){
            const trial = scaleRatesTo(secs.flatMap(x=>x.lines), net);
            if(trial && Math.abs(trial.landed - net) >= 0.5)
              say.push('It lands on '
                + AED(q.vat_applies ? trial.landed*(1+nz(q.vat_rate)) : trial.landed, qCur)
                + ', because a rate only carries two decimals. Show it as a discount if it '
                + 'has to be exact.');
          }

          /* And what it does to the money, which is the whole reason for looking. Only the
             costed lines count, for the same reason the floor box only counts them. */
          if(costTotal>0 && costedRevenue>0 && subtotal>0){
            const share   = costedRevenue/subtotal;
            const newRev  = net*share;
            const newPct  = newRev>0 ? (newRev-costTotal)/newRev*100 : null;
            if(newPct!=null) say.push('Margin would be ' + newPct.toFixed(1) + '%'
              + (newPct < floorPct ? ', under your own floor of '+floorPct+'%.' : '.'));
          }
          return say.join(' ');
        })()}</p>
      </div>

      ${anyCost && costTotal>0 && html`<div class="floorbox">
        <div class="floorhead">
          <span>How far you can go</span>
          <label>Hold at least
            <select value=${floorPct} onChange=${e=>setFloor(Number(e.target.value))}>
              ${[10,15,20,25,30,35,40].map(v=>html`<option key=${v} value=${v}>${v}%</option>`)}
            </select>
          </label>
        </div>
        <div class="tot">
          <span class="lbl">${_t("Break even")}</span><span class="val">${AED(costTotal,qCur)}</span>
          <span class="lbl">Lowest price at ${floorPct}%</span><span class="val">${AED(floorPrice,qCur)}</span>
          <span class="lbl">${_t("Room to move")}</span>
          <span class=${'val '+(room<0?'neg':'pos')}>
            ${room<0?'Already below it by ':''}${AED(Math.abs(room),qCur)}${
              costedRevenue>0?' ('+Math.abs(roomPct).toFixed(1)+'%)':''}</span>
        </div>
        <p class="muted">${room<0
          ? 'This quotation is under your own floor. Either the rates go up or the floor comes down.'
          : 'Matching somebody else’s price is fine down to here. Below it the job is buying practice, not profit, so decide that on purpose.'}</p>
      </div>`}
      </div>
    </div></div>

    <div class="panel"><div class="panel-head"><h2>${_t("Notes")}</h2></div><div class="panel-body">
      <div class="field"><label>${_t("Remarks printed on the quotation")}</label>
        <textarea value=${q.remarks||''} onInput=${e=>set('remarks',e.target.value)}></textarea></div>
      <div class="field"><label>${_t("Meeting notes, internal only")}</label>
        <textarea placeholder="${_t("What was agreed face to face, equivalents proposed, and why")}"

      <button class="btn sec" style=${{color:'var(--crit)'}} onClick=${remove}>${_t("Delete quotation")}</button>
    </div></div>
    </div>

    <div class="print-area">
      <div class="pa-head">
        <div class="pa-logo"><img src="./logo.png" alt=""
             onError=${e=>{e.target.parentNode.style.visibility='hidden';}}/></div>
        <div class="pa-headright">
          <div class="pa-title">${W.title}</div>
          <table class="pa-meta"><tbody>

            <tr><td class="k">${W.reference+' :'}</td><td>${q.project_name||''}</td></tr>
            <tr><td class="k">${W.date+' :'}</td><td>${fmtDate(q.quote_date)}</td></tr>
            <tr class="pa-gap"><td colspan="2"></td></tr>
            ${/* the letterhead is the office's own legal entity, not one company name in

            <tr><td></td><td class="pa-co">${(coName||'').toUpperCase()}</td></tr>
            <tr><td class="k">${W.address+' :'}</td><td>${coAddr}</td></tr>
            <tr><td class="k">${coTaxLabel+' :'}</td><td>${coTax}</td></tr>
            <tr class="pa-gap"><td colspan="2"></td></tr>
            ${/* The customer's own address goes under their name. The site is a separate
                  line, because when we sell to a main contractor the two are different

            <tr><td class="k">${W.forWhom+' :'}</td><td>${client?client.name:''}</td></tr>
            <tr><td class="k">${W.address+' :'}</td><td>${client?.location||q.location||''}</td></tr>

          (q.remarks||cfg('quote_remarks')||'').replace(/\s+$/,'').split('\n')
          .map((t,n)=> t.trim()

const FIN_CATEGORIES=['Cost of Goods Sold','Shipping','Legal & Professional','Trade licence',
  'Tenancy','Consultancy','IT & Internet','Software & Subscriptions','Domain & Registration',
  'Printing & Stationery','Meeting Expenses','Marketing','Salaries','Bank Charges',
  'Bank Deposit / Fund Transfer','Other Expenses'];
const ISTATUS=[['draft','Draft'],['sent','Sent'],['part_paid','Part paid'],
               ['paid','Paid'],['cancelled','Cancelled']];

// amount in words, for the tax invoice, in the invoice's own money
function inWords(n, cur){
  const [one, many, small] = cur==='EUR' ? ['euro','euros','cents'] : ['dirham','dirhams','fils'];
  const ones=['zero','one','two','three','four','five','six','seven','eight','nine','ten',
    'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  const three=x=>{ let s='';
    if(x>=100){ s+=ones[Math.floor(x/100)]+' hundred'; x%=100; if(x) s+=' and '; }
    if(x>=20){ s+=tens[Math.floor(x/10)]; x%=10; if(x) s+='-'+ones[x]; }
    else if(x>0) s+=ones[x];
    return s; };
  const whole=Math.floor(Math.abs(nz(n)));
  const fils=Math.round((Math.abs(nz(n))-whole)*100);
  if(whole===0 && fils===0) return 'Zero '+many+' only';
  const units=[[1e9,'billion'],[1e6,'million'],[1e3,'thousand']];
  let r=whole, parts=[];
  for(const [v,name] of units){ if(r>=v){ parts.push(three(Math.floor(r/v))+' '+name); r%=v; } }
  if(r>0) parts.push(three(r));
  let s=parts.join(' ').trim()||'zero';
  s=s.charAt(0).toUpperCase()+s.slice(1)+' '+(whole===1?one:many);
  if(fils>0) s+=' and '+three(fils)+' '+small;
  return s+' only';
}

    if(status==='settled'){

    ${rows.length===0 && html`<div class="panel"><div class="empty">

      return html`

                <td class="r">${nz(l.quantity)}</td>
                <td class="r">${AED0(l.rate,r.currency)}</td>
                <td class="r">${AED0(l.amount,r.currency)}</td></tr>`)}
              <tr class="tot"><td colspan="4"><b>Total</b></td>
                  <td class="r"><b>${AED(r.header_amount,r.currency)}</b></td></tr>

          <div style=${{display:'flex',gap:'8px',flexWrap:'wrap',alignItems:'center',
                        marginTop:'10px'}}>
            <label style=${{margin:0}}>Status</label>

function FinanceOverview({go}){
  const [d,setD]=useState(null); const [err,setErr]=useState('');
  useEffect(()=>{(async()=>{
    const [cash,inv,exp,led,pay,rec]=await Promise.all([
      sb.from('cash_position').select('*'),
      sb.from('invoice_totals').select('*'),
      sb.from('expenses').select('*').order('expense_date',{ascending:false}),
      sb.from('partner_ledger').select('*'),
      sb.from('payroll').select('*'),
      invoicePayments('paid_on,amount')]);
    const e=cash.error||inv.error||exp.error||led.error||pay.error||rec.error;
    if(e) setErr(e.message);
    setD({cash:cash.data||[],inv:inv.data||[],exp:exp.data||[],
          led:led.data||[],pay:pay.data||[],received:rec.data||[]});
  })();},[]);
  if(!d) return html`${err && html`<div class="err">${err}</div>`}<div class="spinner"></div>`;

  const bank=d.cash.reduce((s,b)=>s+toActive(b.balance,b.currency),0);
  const live=d.inv.filter(i=>!['draft','cancelled'].includes(i.status));
  const owed=live.reduce((s,i)=>s+officeToActive(i.outstanding,i.office_id),0);
  const overdue=live.filter(i=>nz(i.outstanding)>0.005 && i.due_date && i.due_date<today());
  const unpaid=d.exp.filter(x=>!x.paid_on && x.kind==='expense');
  // a cost in the currency on screen is exact; one in the other currency comes over at the rate
  const expIn=x=>x.currency===ACTIVE_CUR ? nz(x.amount) : toActive(x.amount_aed,'AED');
  const toPay=unpaid.reduce((s,x)=>s+expIn(x),0);
  const costs=d.exp.filter(x=>x.kind==='expense');
  const spent=costs.reduce((s,x)=>s+expIn(x),0);
  const wages=d.pay.filter(x=>x.kind==='salary').reduce((s,x)=>s+officeToActive(x.amount,x.office_id),0);

  const drawings=d.pay.filter(x=>x.kind!=='salary').reduce((s,x)=>s+officeToActive(x.amount,x.office_id),0);
  const byCat={}; costs.forEach(x=>{byCat[x.category]=(byCat[x.category]||0)+expIn(x);});
  // Payroll is not in the expenses table, so a chart built from expenses alone left the
  // biggest single outgoing off a picture headed "where the money has gone".
  if(wages)    byCat['Salaries']       = (byCat['Salaries']||0)       + wages;
  if(drawings) byCat['Owner drawings'] = (byCat['Owner drawings']||0) + drawings;
  const allCats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  // past about seven bars the reader stops comparing, so the tail folds into Other
  const cats = allCats.length>8
    ? [...allCats.slice(0,7),['Other', allCats.slice(7).reduce((s,c)=>s+c[1],0)]]
    : allCats;

  // twelve months back, so an empty month still holds its place on the axis
  const flow=(()=>{
    const keys=[]; const now=new Date();
    for(let i=11;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      keys.push(monthKey(d));   // local parts; see the note on the home screen's months
    }
    const paid={}, got={};
    costs.filter(x=>x.paid_on).forEach(x=>{
      const k=monthOf(x.paid_on); paid[k]=(paid[k]||0)+expIn(x);});
    d.pay.filter(x=>x.paid_on).forEach(x=>{
      const k=monthOf(x.paid_on); paid[k]=(paid[k]||0)+officeToActive(x.amount,x.office_id);});
    (d.received||[]).forEach(x=>{
      const k=monthOf(x.paid_on); got[k]=(got[k]||0)+officeToActive(x.amount,x.invoices&&x.invoices.office_id);});
    const any=keys.some(k=>paid[k]||got[k]);
    const used=any?keys:[];
    return {months:used.map(k=>k.slice(5)+'/'+k.slice(2,4)),
            inAmt:used.map(k=>got[k]||0), outAmt:used.map(k=>paid[k]||0)};
  })();

  const thisYear=today().slice(0,4);
  const yearCost=costs.filter(x=>(x.expense_date||'').startsWith(thisYear))
                      .reduce((s,x)=>s+expIn(x),0);
  const yearWages=d.pay.filter(x=>(x.paid_on||x.period||'').startsWith(thisYear))
                       .reduce((s,x)=>s+officeToActive(x.amount,x.office_id),0);

  return html`
    ${err && html`<div class="err">${err}</div>`}
    <div class="cards">
      <div class="card card-click" onClick=${()=>go('banks')}><div class="k">In the bank</div>
        <div class="v">${AED0(bank)}</div>
        <div class="s">${d.cash.length?'Across '+d.cash.length+' '+(d.cash.length===1?'account':'accounts')
                        :'No account set up yet'}${bankNote(d.cash)}</div></div>
      <div class=${'card card-click '+(overdue.length?'alert':owed>0?'':'okc')} onClick=${()=>go('invoices')}>
        <div class="k">Owed to us</div><div class="v">${AED0(owed)}</div>
        <div class="s">${overdue.length?overdue.length+' past the due date'
                        :owed>0?(x=>x+' '+plural(x,'invoice')+' open')(live.filter(i=>nz(i.outstanding)>0.005).length):'Nothing outstanding'}</div></div>
      <div class=${'card card-click '+(toPay>0?'alert':'okc')} onClick=${()=>go('costs')}>
        <div class="k">We still owe</div><div class="v">${AED0(toPay)}</div>

      <div class="card"><div class="k">Spent in ${thisYear}</div><div class="v">${AED0(yearCost+yearWages)}</div>
        <div class="s">${AED0(spent+wages)} since the company started${
          wages?', of which '+AED0(wages)+' is wages and drawings':''}${bothNote()}</div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>${_t("What each partner has put in")}</h2>
        <span class="sp muted">Share capital plus costs they funded, against their ownership share</span></div>
      ${d.led.length ? d.led.map(p=>html`
        <div class="ledger" key=${p.partner_id}>
          <div><div class="nm">${p.name}</div>
            <div class="sub">${nz(p.ownership_pct)}% owner · ${AED0(p.share_capital,officeCur(p.office_id))} capital${
              nz(p.funded)?' · '+AED0(p.funded,officeCur(p.office_id))+' of costs funded':''}${
              nz(p.drawings)?' · '+AED0(p.drawings,officeCur(p.office_id))+' drawn out':''}</div></div>

          <div class="amt">${AED0(p.fair_share,officeCur(p.office_id))}<div class="sub">their share</div></div>
          <div class="verdict">

      ${d.led.length>0 && html`<div class="panel-body" style=${{borderTop:'1px solid var(--rule)'}}>
        <p class="muted" style=${{margin:0}}>${'Everyone should carry their ownership share of what the company has needed so far. This updates itself every time a cost is entered against a partner, so it never drifts the way a spreadsheet does.'}</p>

    <div class="panel">
      <div class="panel-head"><h2>${_t("Money in and money out")}</h2>

                          {k:'Paid out',c:'var(--s2)'}]}/>
      <div class="viz-wrap" style=${{paddingTop:0}}>
        <${ColumnsGrouped} months=${flow.months} a=${flow.inAmt} b=${flow.outAmt}
          labelA="Received" labelB="Paid out"
          empty="No payments or costs dated yet."/>

    </div>

    <div class="panel">
      <div class="panel-head"><h2>${_t("Where the money has gone")}</h2>
        <span class="sp muted">${AED0(spent+wages+drawings)} in total, wages and drawings included</span></div>
      <div class="viz-wrap">
        <${BarsH} rows=${cats.map(([c,v])=>({label:c,value:v,note:'Spent'}))}
          ramp=${['var(--ord3)']}
          empty="Nothing recorded yet."/>
      </div>
    </div>`;
}

/* ── money out ── */
function Costs({rate}){
  const [rows,setRows]=useState(null); const [partners,setPartners]=useState([]);
  const [banks,setBanks]=useState([]); const [projects,setProjects]=useState([]);
  const [err,setErr]=useState(''); const [msg,setMsg]=useState(''); const [busy,setBusy]=useState(false);
  const [fCat,setFCat]=useState(''); const [fMonth,setFMonth]=useState('');
  const [f,setF]=useState({expense_date:today(),category:'Other Expenses',description:'',
    supplier:'',reference:'',amount:'',currency:'AED',eur_aed_rate:'',paid_by:'',
    paid_by_partner_id:'',bank_account_id:'',paid_on:today(),project_id:'',kind:'expense'});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    const [ex,pa,bk,pj]=await Promise.all([
      sb.from('expenses').select('*, partners(name), projects(name)')
        .order('expense_date',{ascending:false}),
      sb.from('partners').select('*').order('name'),
      sb.from('bank_accounts').select('*').order('name'),
      sb.from('projects').select('id,name').order('name')]);
    const e=ex.error||pa.error||bk.error||pj.error; if(e) setErr(e.message);
    setRows(ex.data||[]); setPartners(pa.data||[]); setBanks(bk.data||[]); setProjects(pj.data||[]);
  },[]);
  useEffect(()=>{load();},[load]);
  if(!rows) return html`${err && html`<div class="err">${err}</div>`}<div class="spinner"></div>`;

  const months=[...new Set(rows.map(r=>monthOf(r.expense_date)).filter(Boolean))].sort().reverse();
  const cats=[...new Set([...FIN_CATEGORIES,...rows.map(r=>r.category)])].sort();
  const shown=rows.filter(r=>(!fCat||r.category===fCat)&&(!fMonth||monthOf(r.expense_date)===fMonth));
  const shownTotal=shown.filter(r=>r.kind!=='contribution')
                        .reduce((s,r)=>s+nz(r.amount_aed),0);
  const shownIn=shown.filter(r=>r.kind==='contribution')
                     .reduce((s,r)=>s+nz(r.amount_aed),0);
  const unpaid=shown.filter(r=>!r.paid_on);

  const add=async()=>{
    if(!f.description.trim()) return setErr('Say what the money was for.');
    if(!(Number(f.amount)>0))  return setErr('Enter an amount greater than zero.');
    setBusy(true); setErr(''); setMsg('');
    const {error}=await sb.from('expenses').insert({
      expense_date:f.expense_date, kind:f.kind, category:f.category,
      description:f.description.trim(), supplier:f.supplier||null,
      reference:f.reference||null, amount:Number(f.amount),
      currency:f.currency, eur_aed_rate:f.currency==='EUR'?(num(f.eur_aed_rate)||rate):null,
      paid_by:f.paid_by||null, paid_by_partner_id:f.paid_by_partner_id||null,
      paid_on:f.paid_on||null, project_id:f.project_id||null,
      // Without this every cost was invisible to the bank balance: cash_position only
      // subtracts expenses that name an account.
      bank_account_id:f.bank_account_id||null});
    setBusy(false);
    if(error){setErr(error.message);return;}
    setMsg('Added.');
    setF(p=>({...p,description:'',amount:'',supplier:'',reference:''}));
    load();
  };
  const upd=async(r,patch)=>{
    const {error}=await sb.from('expenses').update(patch).eq('id',r.id);
    if(error) setErr(error.message); else load();
  };
  const del=async(r)=>{
    if(!confirm('Delete "'+r.description+'"?')) return;
    const {error}=await sb.from('expenses').delete().eq('id',r.id);
    if(error) setErr(error.message); else load();
  };

  return html`
    ${err && html`<div class="err">${err}</div>`}
    ${msg && html`<div class="ok">${msg}</div>`}

    <div class="panel">
      <div class="panel-head"><h2>${_t("Add a cost")}</h2></div>
      <div class="panel-body">
        <div class="grid2">
          <div class="field"><label>${_t("Date")}</label>
            <input type="date" value=${f.expense_date} onInput=${e=>set('expense_date',e.target.value)}/></div>
          <div class="field"><label>${_t("Category")}</label>
            <select value=${f.category} onChange=${e=>set('category',e.target.value)}>
              ${cats.map(c=>html`<option key=${c} value=${c}>${c}</option>`)}</select></div>
        </div>
        <div class="field"><label>${_t("What was it for")}</label>
          <input type="text" placeholder="${_t("Trade licence renewal, materials from Bruges\u2026")}"
                 value=${f.description} onInput=${e=>set('description',e.target.value)}/></div>
        <div class="grid2">
          <div class="field"><label>${_t("Supplier")}</label>
            <input type="text" value=${f.supplier} onInput=${e=>set('supplier',e.target.value)}/></div>
          <div class="field"><label>${_t("Reference")}</label>
            <input type="text" placeholder="${_t("JV number or supplier invoice")}"
                   value=${f.reference} onInput=${e=>set('reference',e.target.value)}/></div>
          <div class="field"><label>${_t("Amount")}</label>
            <input type="number" step="0.01" value=${f.amount} onInput=${e=>set('amount',e.target.value)}/></div>
          <div class="field"><label>${_t("Currency")}</label>
            <select value=${f.currency} onChange=${e=>set('currency',e.target.value)}>
              <option value="AED">${_t("AED")}</option><option value="EUR">${_t("EUR, converted at the rate below")}</option>
            </select></div>
          ${f.currency==='EUR' && html`<div class="field"><label>${_t("Rate used")}</label>
            <input type="number" step="0.0001" placeholder=${String(rate)} value=${f.eur_aed_rate}
                   onInput=${e=>set('eur_aed_rate',e.target.value)}/></div>`}
          <div class="field"><label>${_t("Who paid it")}</label>
            <input type="text" list="payers" placeholder="${_t("Mohammad ALMazrooei (Personal)")}"
                   value=${f.paid_by} onInput=${e=>set('paid_by',e.target.value)}/>
            <datalist id="payers">
              ${[...new Set(rows.map(r=>r.paid_by).filter(Boolean))].map(x=>
                html`<option key=${x} value=${x}></option>`)}</datalist></div>
          <div class="field"><label>${_t("Counts towards which partner")}</label>
            <select value=${f.paid_by_partner_id} onChange=${e=>set('paid_by_partner_id',e.target.value)}>
              <option value="">${_t("Nobody, the company paid it")}</option>
              ${partners.map(p=>html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select></div>
          <div class="field"><label>${_t("Paid on, leave blank if still owed")}</label>
            <input type="date" value=${f.paid_on} onInput=${e=>set('paid_on',e.target.value)}/></div>
          <div class="field"><label>${_t("Paid from which account")}</label>
            <select value=${f.bank_account_id} onChange=${e=>set('bank_account_id',e.target.value)}>
              <option value="">${_t("Not from a company account")}</option>
              ${banks.map(b=>html`<option key=${b.id} value=${b.id}>${b.name}</option>`)}</select></div>
          <div class="field"><label>${_t("Against a project")}</label>
            <select value=${f.project_id} onChange=${e=>set('project_id',e.target.value)}>
              <option value="">${_t("None")}</option>
              ${projects.map(p=>html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select></div>
          <div class="field"><label>${_t("Type")}</label>
            <select value=${f.kind} onChange=${e=>set('kind',e.target.value)}>
              <option value="expense">${_t("A cost of the business")}</option>
              <option value="contribution">${_t("Money a partner put in, not a cost")}</option></select></div>
        </div>
        <button class="btn" onClick=${add} disabled=${busy}>${busy?'Adding…':'Add cost'}</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>${_t("Costs")}</h2>
        <select style=${{width:'auto'}} value=${fCat} onChange=${e=>setFCat(e.target.value)}>
          <option value="">${_t("All categories")}</option>
          ${cats.map(c=>html`<option key=${c} value=${c}>${c}</option>`)}</select>
        <select style=${{width:'auto'}} value=${fMonth} onChange=${e=>setFMonth(e.target.value)}>
          <option value="">${_t("All months")}</option>
          ${months.map(m=>html`<option key=${m} value=${m}>${m}</option>`)}</select>
        <span class="sp muted">${shown.length} ${plural(shown.length,'row')}, ${AED0(shownTotal,'AED')} out${
          shownIn?', '+AED0(shownIn,'AED')+' in':''}${
          unpaid.length?', '+unpaid.length+' unpaid':''}</span></div>
      ${shown.length ? html`<div class="tw"><table>
        <thead><tr><th>${_t("Date")}</th><th>${_t("Category")}</th><th>${_t("Description")}</th><th>${_t("Paid by")}</th>
          <th class="n">${_t("Amount")}</th><th>${_t("Status")}</th><th></th></tr></thead>
        <tbody>${shown.map(r=>html`<tr key=${r.id}>
          <td class="muted">${fmtDate(r.expense_date)}</td>
          <td>${r.category}${r.kind==='contribution'?html`<span class="docbadge">funding</span>`:''}</td>
          <td><b>${r.description}</b>
            ${r.reference?html`<div class="muted" style=${{fontSize:'12px'}}>${r.reference}${
              r.projects?.name?' · '+r.projects.name:''}</div>`:''}</td>
          <td class="muted">${r.partners?.name||r.paid_by||'—'}</td>
          <td class="n">${AED(r.amount_aed,'AED')}${r.currency==='EUR'?html`<div class="muted"
            style=${{fontSize:'12px'}}>EUR ${fmtN(r.amount)}</div>`:''}</td>
          <td>${r.paid_on?html`<span class="pill won">paid</span>`
                        :html`<span class="pill quiet">owed</span>`}</td>
          <td><div style=${{display:'flex',gap:'5px'}}>
            ${!r.paid_on && html`<button class="btn sec sm"
               onClick=${()=>upd(r,{paid_on:today()})}>${_t("Mark paid")}</button>`}
            <button class="xbtn" onClick=${()=>del(r)}>×</button></div></td>
        </tr>`)}</tbody></table></div>`
        : html`<div class="empty">Nothing matches that filter.</div>`}
    </div>`;
}

/* ── salaries, drawings and partners ── */
function People(){
  const [partners,setPartners]=useState(null); const [pay,setPay]=useState([]);
  const [banks,setBanks]=useState([]); const [led,setLed]=useState([]);
  const [err,setErr]=useState(''); const [msg,setMsg]=useState('');
  const [f,setF]=useState({person:'',partner_id:'',kind:'salary',period:today().slice(0,7),
                           amount:'',paid_on:today(),bank_account_id:'',notes:''});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));

  const load=useCallback(async()=>{
    const [pa,py,bk,lg]=await Promise.all([
      sb.from('partners').select('*').order('name'),
      sb.from('payroll').select('*, partners(name)').order('period',{ascending:false}),
      sb.from('bank_accounts').select('*').order('name'),
      sb.from('partner_ledger').select('*')]);
    const e=pa.error||py.error||bk.error||lg.error; if(e) setErr(e.message);
    setPartners(pa.data||[]); setPay(py.data||[]); setBanks(bk.data||[]); setLed(lg.data||[]);
  },[]);
  useEffect(()=>{load();},[load]);
  if(!partners) return html`${err && html`<div class="err">${err}</div>`}<div class="spinner"></div>`;

  const pctTotal=partners.reduce((s,p)=>s+nz(p.ownership_pct),0);
  const upP=(i,k,v)=>setPartners(a=>a.map((x,n)=>n===i?{...x,[k]:v}:x));
  const savePartners=async()=>{
    setErr(''); setMsg('');
    for(const p of partners){
      await sb.from('partners').update({name:p.name,email:p.email||null,
        ownership_pct:num(p.ownership_pct)||0, share_capital:num(p.share_capital)||0}).eq('id',p.id);
    }
    setMsg('Saved.'); load();
  };
  const addPartner=async()=>{
    const row=addedRow(await sb.from('partners').insert({name:'New partner',ownership_pct:0,
      share_capital:0}).select().single(),setErr,'The partner');
    if(row) setPartners(v=>[...v,row]);
  };
  const delPartner=async(p)=>{
    if(!confirm('Remove '+p.name+'?')) return;
    await sb.from('partners').delete().eq('id',p.id); load();
  };
  const addPay=async()=>{
    if(!f.person.trim()) return setErr('Who is being paid?');
    if(!(Number(f.amount)>0)) return setErr('Enter an amount greater than zero.');
    setErr(''); setMsg('');
    const {error}=await sb.from('payroll').insert({person:f.person.trim(),
      partner_id:f.partner_id||null, kind:f.kind, period:f.period||null,
      amount:Number(f.amount), paid_on:f.paid_on||null,
      bank_account_id:f.bank_account_id||null, notes:f.notes||null});
    if(error){setErr(error.message);return;}
    setMsg('Recorded.'); setF(p=>({...p,amount:'',notes:''})); load();
  };
  const delPay=async(r)=>{ await sb.from('payroll').delete().eq('id',r.id); load(); };

  const salaries=pay.filter(x=>x.kind==='salary');
  const drawings=pay.filter(x=>x.kind==='drawing');

  return html`
    ${err && html`<div class="err">${err}</div>`}
    ${msg && html`<div class="ok">${msg}</div>`}

    <div class="panel">
      <div class="panel-head"><h2>${_t("Partners")}</h2>
        <span class=${'sp '+(Math.abs(pctTotal-100)>0.01?'overdue':'muted')}>
          ${pctTotal}% allocated${Math.abs(pctTotal-100)>0.01?', should be 100%':''}</span></div>
      <div class="phead"><span>Name</span><span>Ownership %</span><span>Share capital</span>
        <span>Put in so far</span><span>Position</span><span></span></div>
      ${partners.map((p,i)=>{const l=led.find(x=>x.partner_id===p.id)||{};
        return html`<div class="prow" key=${p.id}>
        <input type="text" value=${p.name||''} onInput=${e=>upP(i,'name',e.target.value)}/>
        <input type="number" step="0.001" value=${p.ownership_pct??''}
               onInput=${e=>upP(i,'ownership_pct',e.target.value)}/>
        <input type="number" step="0.01" value=${p.share_capital??''}
               onInput=${e=>upP(i,'share_capital',e.target.value)}/>
        <span class="muted" style=${{fontSize:'13px'}}>${AED0(l.contributed,officeCur(l.office_id))}</span>
        <span style=${{fontSize:'12.5px',color:nz(l.balance)>0.005?'var(--good)':
              nz(l.balance)<-0.005?'var(--crit)':''}}>
          ${l.balance==null?'—':AED0(Math.abs(nz(l.balance)),officeCur(l.office_id))+', '+owedWords(nz(l.balance))}</span>
        <button class="xbtn" onClick=${()=>delPartner(p)}>×</button>
      </div>`;})}
      <div style=${{padding:'10px 14px',display:'flex',gap:'8px'}}>
        <button class="btn sec sm" onClick=${addPartner}>${_t("Add partner")}</button>
        <button class="btn sm" onClick=${savePartners}>${_t("Save partners")}</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>${_t("Record a salary or a drawing")}</h2></div>
      <div class="panel-body">
        <div class="grid2">
          <div class="field"><label>${_t("Who")}</label>
            <input type="text" value=${f.person} onInput=${e=>set('person',e.target.value)}/></div>
          <div class="field"><label>${_t("Salary or drawing")}</label>
            <select value=${f.kind} onChange=${e=>set('kind',e.target.value)}>
              <option value="salary">${_t("Salary, a cost of the business")}</option>
              <option value="drawing">${_t("Drawing, a partner taking money out")}</option></select></div>
          <div class="field"><label>${_t("Period")}</label>
            <input type="month" value=${f.period} onInput=${e=>set('period',e.target.value)}/></div>
          <div class="field"><label>${_t("Amount (AED)")}</label>
            <input type="number" step="0.01" value=${f.amount} onInput=${e=>set('amount',e.target.value)}/></div>
          <div class="field"><label>${_t("Which partner, for drawings")}</label>
            <select value=${f.partner_id} onChange=${e=>set('partner_id',e.target.value)}>
              <option value="">${_t("Not a partner")}</option>
              ${partners.map(p=>html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select></div>
          <div class="field"><label>${_t("Paid from")}</label>
            <select value=${f.bank_account_id} onChange=${e=>set('bank_account_id',e.target.value)}>
              <option value="">${_t("Not from a company account")}</option>
              ${banks.map(b=>html`<option key=${b.id} value=${b.id}>${b.name}</option>`)}</select></div>
          <div class="field"><label>${_t("Paid on")}</label>
            <input type="date" value=${f.paid_on} onInput=${e=>set('paid_on',e.target.value)}/></div>
        </div>
        <button class="btn" onClick=${addPay}>${_t("Record it")}</button>
        <p class="muted" style=${{marginTop:'12px'}}>${'A salary is a cost. A drawing is not: it reduces what the company owes that partner, so it shows up in the ledger above rather than in the cost figures.'}</p>
      </div>
    </div>

    ${[['Salaries',salaries],['Drawings',drawings]].map(([title,list])=>html`
      <div class="panel" key=${title}>
        <div class="panel-head"><h2>${title}</h2>
          <span class="sp muted">${AED0(list.reduce((s,x)=>s+officeToActive(x.amount,x.office_id),0))}</span></div>
        ${list.length ? html`<div class="tw"><table>
          <thead><tr><th>${_t("Period")}</th><th>${_t("Who")}</th><th class="n">${_t("Amount")}</th><th>${_t("Paid on")}</th><th></th></tr></thead>
          <tbody>${list.map(r=>html`<tr key=${r.id}>
            <td class="muted">${r.period||'—'}</td>
            <td><b>${r.person}</b>${r.partners?.name&&r.partners.name!==r.person
                ?html`<span class="muted"> (${r.partners.name})</span>`:''}</td>
            <td class="n">${AED(r.amount,officeCur(r.office_id))}</td>
            <td class="muted">${r.paid_on?fmtDate(r.paid_on):'not yet'}</td>
            <td><button class="xbtn" onClick=${()=>delPay(r)}>×</button></td>
          </tr>`)}</tbody></table></div>`
          : html`<div class="empty">Nothing recorded.</div>`}
      </div>`)}`;
}

/* ── bank accounts ── */
function Banks(){
  const [rows,setRows]=useState(null); const [pos,setPos]=useState([]);
  const [err,setErr]=useState(''); const [msg,setMsg]=useState('');
  const load=useCallback(async()=>{
    const [b,c]=await Promise.all([
      sb.from('bank_accounts').select('*').order('name'),
      sb.from('cash_position').select('*')]);
    if(b.error||c.error) setErr((b.error||c.error).message);
    setRows(b.data||[]); setPos(c.data||[]);
  },[]);
  useEffect(()=>{load();},[load]);
  if(!rows) return html`${err && html`<div class="err">${err}</div>`}<div class="spinner"></div>`;

  const up=(i,k,v)=>setRows(a=>a.map((x,n)=>n===i?{...x,[k]:v}:x));
  const save=async()=>{
    setErr(''); setMsg('');
    for(const r of rows){
      await sb.from('bank_accounts').update({name:r.name,bank:r.bank||null,
        account_number:r.account_number||null, iban:r.iban||null, currency:r.currency||'AED',
        opening_balance:num(r.opening_balance)||0,
        opening_date:r.opening_date||today()}).eq('id',r.id);
    }
    setMsg('Saved.'); load();
  };
  const add=async()=>{
    const row=addedRow(await sb.from('bank_accounts').insert({name:'New account',
      currency:'AED',opening_balance:0,opening_date:today()}).select().single(),setErr,'The account');
    if(row) setRows(v=>[...v,row]);

                   onInput=${e=>up(i,'account_number',e.target.value)}/></div>
          <div class="field"><label>${_t("IBAN")}</label>
            <input type="text" value=${r.iban||''} onInput=${e=>up(i,'iban',e.target.value)}/></div>
          <div class="field"><label>${_t("Balance when you started using this system")}</label>
            <input type="number" step="0.01" value=${r.opening_balance??''}
                   onInput=${e=>up(i,'opening_balance',e.target.value)}/></div>
          <div class="field"><label>${_t("On this date")}</label>
            <input type="date" value=${r.opening_date||''}
                   onInput=${e=>up(i,'opening_date',e.target.value)}/></div>
        </div>
        <div class="tot">
          ${/* an account is kept in its own money, whichever office is on screen */''}
          <span class="lbl">${_t("Opening")}</span><span class="val">${AED(r.opening_balance,r.currency)}</span>
          <span class="lbl">${_t("Received")}</span><span class="val">${AED(p.received,r.currency)}</span>
          <span class="lbl">${_t("Spent")}</span><span class="val">${AED(nz(p.spent)+nz(p.wages_and_drawings),r.currency)}</span>
          <span class="lbl"><b>Balance now</b></span>
          <span class=${'val big '+(nz(p.balance)<0?'neg':'pos')}>${AED(p.balance,r.currency)}</span>
        </div>
        <button class="btn sec sm" style=${{color:'var(--crit)',marginTop:'10px'}}
                onClick=${()=>del(r)}>${_t("Remove this account")}</button>
      </div>`;})}
      ${!rows.length && html`<div class="empty">No accounts yet. Add one so the dashboard can show your cash position.</div>`}
      <div style=${{padding:'12px 16px',display:'flex',gap:'8px',borderTop:'1px solid var(--rule)'}}>
        <button class="btn sec sm" onClick=${add}>${_t("Add account")}</button>
        <button class="btn sm" onClick=${save}>${_t("Save")}</button>
      </div>
