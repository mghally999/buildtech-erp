  [/\bkerb|curb\b/i,                                           'kerb painting'],
  [/\bline ?marking|numbering|wheel ?stop|signage|bay\b/i,      'markings and fittings'],
  [/\bscaffold|access equipment|temporary power|lighting\b/i,   'site facilities'],
  [/\b(cleaning|jet ?wash|pressure ?wash|sweeping)\b/i,        'cleaning'],
];

/* Every unit a bill of quantities actually uses. LS was missing once, so item 7 of the
   market floor bill, the expansion joint, was silently dropped: a lump sum item that
   vanishes is money left on the table. */
/* Written with [ ] and [.] rather than \s and \. so that every letter in it can be
   doubled up into [xX] below. A pattern that needs the i flag cannot be mixed with a
   pattern that needs case to mean something, and the run-on reader needs both. */
const UNIT_WORDS = 'm²|m2|sq[.]?[ ]?m|sqm|lump[ ]*sum|prov[ ]*sum|item|lot|set|job'
  + '|nos?[.]?|nr|pcs?|ea|each|l[.]?s|p[.]?s|lm|l[.]m|rm|mtr|metres?|meters?'
  + '|kg|ltr|litres?|ton(?:ne)?|m';
// the same alternation, made case-blind letter by letter instead of by a flag
const UNIT_WORDS_CI = UNIT_WORDS.replace(/[a-zA-Z]/g,
  c => '[' + c.toLowerCase() + c.toUpperCase() + ']');
// A whole row on its own line: number, description, quantity, unit, in that order, with
// the quantity and unit at the very end. Anchoring on the end is what lets the
// description contain its own numbers, which it always does.
/* The item number is 1, 1.1, 2.3a or A: every way a bill numbers its rows. */
const SCOPE_ROW = new RegExp(
  '^(\\d{1,3}(?:\\.\\d{1,2})*[a-z]?|[A-Z])[\\.\\)]?[\\s\\t]+([\\s\\S]*?)[\\s\\t]+([\\d][\\d,\\. ]*)[\\s\\t]+('
  + UNIT_WORDS + ')\\.?$', 'i');

/* ── a bill that arrived as one paragraph ──────────────────────────────────────
   Some PDFs draw a table in a way that cannot be put back into rows: the market floor
   bill came out as a single run of text with all seven items inside it, end to end. Read
   line by line that is one unreadable line and the draft is empty, which is exactly what
   Charles saw.

   The items are still all there, in order, each one a serial number then a description
   then a quantity and a unit. This picks them out of the middle of a paragraph.

   The guards are what keep it honest, because a loose reading of prose invents items:
     · a description must begin with a capital letter, so "phases (4 to 8 phases)" and
       "Page 1 of 2" cannot start one
     · the serial numbers must run 1, 2, 3 without a gap, so a stray figure in a sentence
       cannot join the chain
     · there must be at least three of them, because two is a coincidence
   Anything short of that and it returns nothing rather than a guess. */
/* No i flag on purpose. With it, [A-Z] matches lower case as well, the description is
   allowed to begin in the middle of a sentence, and the first item of the market floor
   bill was eaten by a description that started at "of 2 1 Removal". The units carry
   their own case blindness instead. */
const RUNON_ITEM = new RegExp(
  '(?:^|[\\s\\u00a0])(\\d{1,3})[\\s\\u00a0]+([A-Z][\\s\\S]*?)[\\s\\u00a0]+'
  + '([\\d][\\d,]*(?:\\.\\d+)?)[\\s\\u00a0]*(' + UNIT_WORDS_CI + ')\\b', 'g');

function splitRunOn(text){
  const s = String(text||'');
  if(s.length < 60) return { items:[], rest:s };
  const hits = []; RUNON_ITEM.lastIndex = 0;
  let m;
  while((m = RUNON_ITEM.exec(s))){
    const desc = m[2].replace(/\s+/g,' ').trim();
    const unit = scopeUnit(m[4]);
    const qty  = Number(String(m[3]).replace(/,/g,''));
    if(!unit || !isFinite(qty) || desc.length < 8) continue;
    hits.push({ no:Number(m[1]), text:desc, qty, unit,
                from:m.index, to:RUNON_ITEM.lastIndex });
  }
  // the chain has to be unbroken, or this is prose that happens to contain numbers
  let run = [];
  for(const h of hits){
    if(!run.length){ if(h.no === 1 || h.no === 2) run = [h]; continue; }
    if(h.no === run[run.length-1].no + 1) run.push(h);
    else if(h.no === 1) run = [h];
  }
  if(run.length < 3) return { items:[], rest:s };

  // what is left once the table is lifted out is the real conditions, which is what
  // should have been in that panel in the first place
  let rest = '';
  let cut = run[0].from;
  rest = s.slice(0, cut);
  rest += ' ' + s.slice(run[run.length-1].to);
  return {
    items: run.map(h => ({ no:h.no, text:h.text, qty:h.qty, unit:h.unit,
                           optional:false, layers:readLayers(h.text) })),
    rest: rest.replace(/\s+/g,' ').trim(),
  };
}

function parseScope(raw){
  const out = { title:'', client:'', ref:'', items:[], notes:[], unread:[], boilerplate:[] };
  const lines = String(raw||'').replace(/\r/g,'').split('\n');
  let optional = false, inNotes = false, boiler = false, group = '';

  /* "3,659" is three thousand and "424,8" is four hundred; "28.153,00" is Belgian for
     twenty-eight thousand. A comma followed by one or two digits is a decimal point,
     any other comma is a thousands mark. */
  const num = s => { s = String(s).replace(/\s/g,'');
    if(/,\d{1,2}$/.test(s)) s = s.replace(/\./g,'').replace(',','.');
    else s = s.replace(/,/g,'');
    return Number(s); };

  /* The conditions under a bill. A numbered line, or an indented one, starts a note; an
     unindented, unnumbered line continues the one above, which is what a note wrapped
     across two lines of a PDF looks like. "1 - color… 2 - work…" on one line is several.
     The legal boilerplate ("The Contractor shall execute the Works…") is kept aside: it
     is the client's contract language, not a condition Build-Tech is offering. */
  const isBoilerplate = t => (/^(?:the|any)\s+(?:contractor|employer|consultant|vendor|supplier|designer|tenderer)\b/i.test(t) && t.length > 60)
                          || /contract documents|notwithstanding the foregoing|shall remain fully responsible/i.test(t);
  const splitNotes = t => t.split(/(?:^|\s)\d{1,2}\s*[-–\.\)]\s*(?=\S)/).map(x => x.trim()).filter(Boolean);
  const addNote = n => {
    n = n.replace(/\s+/g,' ').trim(); if(!n) return;
    // a PDF can run the last condition and the contract boilerplate into one line
    const b = n.match(/(?:^|\.\s+)((?:the|any)\s+(?:contractor|employer|consultant|vendor|supplier|designer|tenderer)\b[\s\S]*)$/i);
    if(b && b[1].length > 60){ out.boilerplate.push(b[1].trim()); n = n.slice(0, n.length - b[1].length).trim(); if(!n) return; }
    const k = n.toLowerCase();
    const i = out.notes.findIndex(e => { const ek = e.toLowerCase();
      return ek === k || ek.startsWith(k) || k.startsWith(ek.slice(0, Math.min(ek.length, 40))); });
    if(i < 0) out.notes.push(n);
    else if(n.length > out.notes[i].length) out.notes[i] = n;   // the fuller reading wins
  };

  lines.forEach(line => {
    const t = line.trim();
    if(!t) return;

    // the headings a scope carries above the table
    let m;
    if((m = t.match(/^(?:contract\s*title|title|subject)\s*[:\-]\s*(.+)$/i))){
      // "…Market Flooring Tender ref.no : 7089" is two fields on one line of the DOCX
      let tt = m[1];
      const tr = tt.match(/\s*tender\s*(?:ref\.?(?:\s*no\.?)?|reference|no\.?)\s*[:\-]?\s*(.*)$/i);
      if(tr){ tt = tt.slice(0, tr.index); const r = tr[1].replace(/^[\s:\-]+/,'').trim();
              if(r && !out.ref) out.ref = 'Tender ref ' + r; }
      out.title = tt.trim(); return;
    }

    if((m = t.match(/^(?:project|entity)[^:]*name\s*[:\-]\s*(.+)$/i)))
      { out.client = m[1].trim(); return; }
    /* "Project :Waterfront Market LLC" with the colon adrift is how the market bill
       names its client, and it is how half of them do it. */
    if((m = t.match(/^(?:project|client|employer|customer)\s*[:\-]\s*(.+)$/i)))
      { if(!out.client) out.client = m[1].trim(); return; }
    if(/^tender\s*(ref|reference|no)/i.test(t)) {
      // "Tender ref.no  7089:" and "Tender ref.no : 7089" are the same field
      const r = t.replace(/^tender\s*(?:ref\.?(?:\s*no\.?)?|reference|no\.?)\s*[:\-]?\s*/i,'').replace(/\s*:\s*$/,'').trim();
      if(r && !out.ref) out.ref = 'Tender ref ' + r; return; }
    if(/^(brief\s+)?description\s*[:\-]?$/i.test(t))               return;
    if(/^project\s*(background|summary)/i.test(t))                 return;

    // Optional switches the rest of the table to optional. Notes ends the table.
    if(/^optional\b/i.test(t) && t.length < 24)  { optional = true;  return; }
    if(/^notes?\b\s*:?$/i.test(t))               { inNotes  = true;  return; }
    /* "Note: 1-color to be approved..." with the conditions on the same line as the
       word. Reading only a bare "Note:" left the whole block sitting under lines it
       could not read, which is where Charles kept finding it. */
    if((m = t.match(/^(?:notes?|remarks?)\s*[:\-]\s*(.+)$/i)) && m[1].length > 12)
      { inNotes = true; boiler = false; splitNotes(m[1]).forEach(addNote); return; }
    if(/^page\s+\d+\s+of\s+\d+$/i.test(t))       return;              // a page footer
    if(/^no\.?\s+description/i.test(t))          return;              // the header row
    /* A header row in any wording or order. The old test only knew "No. Description",
       so the second bill in a two bill document, headed SN / Description / quantity /
       unit, came through as an unreadable line. */
    if(t.includes('\t')){
      const cells = t.split('\t');
      if(cells.length >= 3 && cells.filter(c => BOQ_ROLE(c)).length >= 3) return;
    }
    /* Which bill this item belongs to. Charles's market floor document is two bills in
       one file, Fruits and Vegetable then Meat, each numbered 1 to 7. Without this the
       draft has two item 1s and no way to tell them apart. */
    if((m = t.match(/^(?:boq|bill of quantities)[^a-z]*(?:&|and)?\s*specification[s]?\s*(?:for|of)\s+(.+)$/i))
       || (m = t.match(/^(.+?\bfor\b.+?(?:flooring|works?|coating|waterproofing))\s*$/i))){
      const g = m[1].trim();
      if(g.length > 6 && g.length < 90){
        if(!out.title) out.title = g;
        group = g; return;
      }
    }

    /* Notes used to be a one way door: once a bill said "Notes:", everything after it
       was a note for ever. On a bill whose conditions are printed above the table, which
       is most of them, that swallowed the entire table and the draft came out empty. A
       line that is plainly a priced row ends the notes and is read as what it is. */
    if(inNotes && SCOPE_ROW.test(t)) inNotes = false;

    if(inNotes){
      if(isBoilerplate(t)){ boiler = true; out.boilerplate.push(t); return; }
      const starts = /^\d{1,2}\s*[-–\.\)]\s*\S/.test(t) || /^[\s\u00a0]/.test(line);
      if(boiler && !starts){ out.boilerplate[out.boilerplate.length-1] += ' ' + t; return; }
      boiler = false;
      if(starts || !out.notes.length) splitNotes(t).forEach(addNote);
      else out.notes[out.notes.length-1] += ' ' + t;
      return;
    }

    // An item row, read by the pattern defined above the function.
    m = t.match(SCOPE_ROW);
    if(m){
      const unit = scopeUnit(m[4]);
      const qty  = num(m[3]);
      if(unit && isFinite(qty)){
        out.items.push({
          no: parseFloat(m[1]) || out.items.length + 1,
          label: m[1],
          text: m[2].replace(/\s+/g,' ').trim(),
          qty, unit, optional, group,
          layers: readLayers(m[2]),
          thickness_mm: readThickness(m[2]),
        });
        return;
      }
    }
    out.unread.push(t);
  });

  /* Nothing came out row by row, so the table was never in rows. Look inside the long
     lines for it. This runs only when the ordinary reading found nothing, so a bill that
     read properly can never have items added to it twice. */
  if(!out.items.length){
    const sweep = arr => {
      const keep = [];
      arr.forEach(t => {
        const r = splitRunOn(t);
        if(r.items.length){ r.items.forEach(i => out.items.push(i)); if(r.rest) keep.push(r.rest); }
        else keep.push(t);
      });
      return keep;
    };
    out.notes  = sweep(out.notes);
    out.unread = sweep(out.unread);
    out.items.sort((a,b) => a.no - b.no);
    /* The fragments the reconstruction left behind are the same rows, half read. Once
       the whole rows have been recovered there is nothing to be gained by showing them
       again under "lines it could not read", and every reason not to: it is the same
       work twice, which is the mess Charles asked me to stop making. */
    if(out.items.length){
      const said = out.items.map(i => i.text.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' '));
      out.unread = out.unread.filter(u => {
        const k = u.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
        if(k.length < 12) return true;
        return !said.some(s => s.includes(k) || k.includes(s.slice(0, Math.min(40, s.length))));
      });
    }
  }

  return out;
}

/* "2 × Deck Shield Hydra Seal DPM, 1 × Deck Shield SF, 1 × Deck Shield Finish, and
   1 × Deck Shield UV" is four layers, not one product. Reading them separately is what
   turns an item into a build-up instead of a guess. */
function readLayers(text){
  const out = [];
  // stops at a comma, a semicolon, "and", or the end of the sentence. Without the full
  // stop, "1 × Dulux Easy Clean. Includes protection of MEP installations" comes back as
  // one product name half a paragraph long.
  const re = /(\d+)\s*[x×]\s*([A-Za-z][A-Za-z0-9''\-\/ ]*?)(?=\s*(?:,|;|\.|\band\b|$))/gi;
  let m;
  while((m = re.exec(text))){
    const name = m[2].replace(/\s+/g,' ').trim();
    if(name.length > 2) out.push({ coats: Number(m[1]), name });
  }
  return out;
}

/* "@ 6mm", "6 mm thick", "max 75mm screed": the thickness the bill asks for, in mm.
   Only the forms that mean thickness; "150mm high x 100 mm width" is a size, not a
   thickness, and "200 mm covered skirting" is a height. */
function readThickness(text){
  const t = String(text||'');
  const m = t.match(/(?:@\s*|\bat\s+|\bmax\.?\s*|\bmin\.?\s*)(\d+(?:[.,]\d+)?)\s*mm\b/i)
         || t.match(/(\d+(?:[.,]\d+)?)\s*mm\s*(?:thick|thk|thickness|dft)\b/i)
         || t.match(/\bthickness\s*(?:of\s*)?(\d+(?:[.,]\d+)?)\s*mm\b/i);
  if(!m) return null;
  const v = Number(String(m[1]).replace(',','.'));
  return v > 0 ? v : null;
}

/* What a product weighs per square metre per millimetre, read off its data sheet line
   when that line gives its figure for a thickness: "7 kg/m² for 4mm final thickness" is
   1.75 kg per mm. A bill asking for 6 mm is then 10.5 kg/m², not the 7 the catalogue
   quotes for 4 mm. Null where the sheet gives no thickness. */
function perMmOf(p){
  const t = String(p.consumption_text||'').replace(/²/g,'2').replace(/–|—/g,'-');
  const m = t.match(/([\d.,]+)(?:\s*-\s*([\d.,]+))?\s*kg\s*\/\s*m2\s*(?:for|at|per|@)\s*([\d.,]+)\s*mm/i);
  if(!m) return null;
  const kg = numOf(m[2]||m[1]), mm = numOf(m[3]);
  return kg > 0 && mm > 0 ? kg/mm : null;
}

/* ── matching ──────────────────────────────────────────────────────────────────
   Three sources, in descending order of how much they should be trusted:

     1. the equivalents table, which is somebody having decided this once, on purpose
     2. the catalogue's own words, scored so that a rare word counts for more than a
        common one; "polyaspartic" identifies a product, "coating" identifies forty
     3. what has actually been quoted before, which breaks ties towards the thing this
        company really sells rather than the thing that reads best

   A score is not a probability and is not presented as one. What the screen shows is
   the reason, and the reason is a sentence. */

const scopeTokens = s => String(s||'').toLowerCase()
  .replace(/[^a-z0-9²\s\-\/]/g,' ')
  .split(/[\s\-\/]+/)
  .filter(w => w.length > 2 && !SCOPE_STOP.has(w));

function buildMatcher(products, equivalents, pastLines){
  // how many products each word appears in, so a rare word can count for more
  const df = new Map();
  const hay = new Map();
  products.forEach(p => {
    const text = [p.name, p.subcategory, p.category, p.application, p.description,
                  p.consumption_text,
                  ...(p.product_aliases||[]).map(a => a.alias)].filter(Boolean).join(' ');
    const set = new Set(scopeTokens(text));
    hay.set(p.id, set);
    set.forEach(w => df.set(w, (df.get(w)||0) + 1));
  });
  const N = Math.max(products.length, 1);
  const weight = w => Math.log(1 + N / (1 + (df.get(w)||0)));

  // what has been quoted before, per product
  const used = new Map();
  (pastLines||[]).forEach(l => {
    if(!l.product_id) return;
    used.set(l.product_id, (used.get(l.product_id)||0) + 1);
  });

  // equivalents, longest term first so "deck shield uv" wins over "uv topcoat"
  const eqs = (equivalents||[]).slice().sort((a,b) => b.term.length - a.term.length);

  return function match(text){
    const low = ' ' + String(text||'').toLowerCase() + ' ';
    const hits = [];

    // 1. somebody has already decided this
    const seen = new Set();
    eqs.forEach(e => {
      if(!low.includes(e.term)) return;
      const key = e.term + '|' + (e.product_id||'none');
      if(seen.has(key)) return;
      seen.add(key);
      hits.push({
        product_id: e.product_id,
        kind: e.product_id ? 'equivalent' : 'gap',
        confidence: e.confidence,
        why: 'The spec says "' + e.term + '". '
             + (e.note || (e.product_id ? '' : 'We have no equivalent for it.')),
        note: e.note || '',
        term: e.term,
        role: e.role,
        score: e.confidence === 'firm' ? 1000 : e.confidence === 'likely' ? 700 : 400,
      });
    });

    // 2. the catalogue's own words
    const q = scopeTokens(text);
    const scored = products.map(p => {
      const set = hay.get(p.id) || new Set();
      let s = 0; const words = [];
      q.forEach(w => { if(set.has(w)){ s += weight(w); words.push(w); } });
      // the product's own name appearing in the text is worth far more than its
      // description sharing a word with it
      if(p.name && low.includes(' ' + p.name.toLowerCase() + ' ')) { s += 12; words.unshift(p.name); }
      (p.product_aliases||[]).forEach(a => {
        if(a.alias && low.includes(' ' + String(a.alias).toLowerCase() + ' ')) {
          s += 10; words.unshift(a.alias);
        }
      });
      if(used.get(p.id)) s += 1.2;              // we have actually sold it
      return { p, s, words };
    })
    /* Two words and a decent score, not one word and a shrug. The old bar of 2.5 let a
       single shared word through, which is how "parking" alone put a UV topcoat against
       an item about removing the old one. A suggestion nobody would defend is noise, and
       noise on this screen is the thing that makes it unusable. */
    .filter(x => x.s > 7 && x.words.length >= 2)
    .sort((a,b) => b.s - a.s).slice(0, 3);

    scored.forEach(x => {
      if(hits.some(h => h.product_id === x.p.id)) return;
      hits.push({
        product_id: x.p.id,
        kind: 'catalogue',
        confidence: x.s > 14 ? 'likely' : 'weak',
        why: 'Nothing in the equivalents list covers this. Closest in the catalogue on '
             + x.words.slice(0,4).join(', ')
             + (used.get(x.p.id) ? ', and it has been quoted before' : '')
             + '. Check it before you send this.',
        score: Math.min(650, x.s * 30),
      });
    });

    // 3. things that are not products at all
    const works = SCOPE_WORKS.find(([re]) => re.test(text));

    hits.sort((a,b) => b.score - a.score);
    return { hits, works: works ? works[1] : null };
  };
}

/* One item can be several layers. Each layer is matched on its own, and the item's own
   words are used as a fallback when it has no layers named. */
function matchItem(item, match){
  const parts = (item.layers && item.layers.length)
    ? item.layers.map(l => ({ coats:l.coats, text:l.name, label:l.name }))
    : [{ coats:1, text:item.text, label:item.text }];
  let rows = parts.map(part => {
    const r = match(part.text);
    return { ...part, hits:r.hits, works:r.works, pick: r.hits.length ? r.hits[0] : null };
  });
  const itemLevel = match(item.text);

  /* Taking an old coating off, painting kerbs, putting up hoarding: these are jobs, not
     products, and the catalogue will always find SOMETHING that shares a word with them.
     It found CBTDUR Eco for "removal of existing coating from the parking garage", on
     the words parking and garage, and a tin of pigment for kerbs painted white and
     black. A guess dressed as a match is worse than no match, so where the item reads as
     site work and nothing in the equivalents table disagrees, the suggestions are
     dropped rather than shown. */
  const anyDecided = rows.some(r => r.pick && r.pick.kind === 'equivalent')
                  || itemLevel.hits.some(h => h.kind === 'equivalent' && h.product_id);
  const isWorks = !!itemLevel.works && !anyDecided;
  if(isWorks) rows = rows.map(r => ({ ...r, hits:[], pick:null }));

  return {
    ...item,
    works: isWorks ? itemLevel.works : null,
    // What the item as a whole says we have no answer for. Reported separately from the
    // layers, because "anti-carbonation coating for columns and walls" is the thing to
    // notice and "Dulux Stucco" is only how the consultant spelled it.
    /* The gaps worth reporting once, at the top of the item, and only the ones a layer
       is not already saying for itself. Item 3 was showing four red banners and then the
       same four sentences again under the dropdowns. */
    gaps: (() => {
      const said = new Set(rows.map(r => r.pick && r.pick.kind === 'gap' ? r.pick.why : null)
                               .filter(Boolean));
      const out = [], seen = new Set();
      itemLevel.hits.filter(h => h.kind === 'gap').forEach(h => {
        if(said.has(h.why) || seen.has(h.why)) return;
        seen.add(h.why); out.push(h);
      });
      return out.slice(0, 1);          // one sentence, not a wall of them
    })(),
    parts: rows,
    // an item is settled when every layer has something we would stand behind
    settled: rows.length > 0 && rows.every(r => r.pick && r.pick.product_id
                                             && r.pick.confidence !== 'weak'),
  };
}

/* ── the draft ─────────────────────────────────────────────────────────────────
   Written in the shape a Build-Tech section already takes, because that is what the
   printed sheet expects and what Charles will be editing:

     Supply and Install          sq.m   28,153   <rate>
                                                          (a blank line)
     CBTDUR Eco : Approx. 0,30 kg/m².                     (bold, the product)
     Protective topcoat for garage flooring and heavy...  (what it is)

   Nothing is priced that cannot be priced honestly. Where the consumption is known the
   cost comes out of the catalogue exactly as it does when a product is added by hand;
   where it is not, the rate is left empty rather than filled with a number that looks
   like it means something. */
function buildDraft(parsed, matched, ctx){
  const prod = id => (ctx.products||[]).find(p => p.id === id) || null;
  const money = n => (n==null || !isFinite(n)) ? '' : Math.round(n*100)/100;
  /* What the reader has to tell Charles: which items it could not price, what it offered
     against what, where a thickness changes the consumption. It goes into the meeting
     notes, which never print. It used to go in as spec notes, and six of the fourteen
     sections of the market bill would have gone to the client reading "Site work rather
     than a coating we supply. Put a rate on the line above and delete this note". */
  const internal = [];

  const secs = matched.map((it, i) => {
    const lines = [];
    const where = (it.group ? shortGroup(it.group) + ' ' : '') + 'item ' + (it.label || it.no);

    const push = (o) => lines.push({
      id: 'l' + Date.now() + '-' + i + '-' + lines.length + '-' + Math.random().toString(36).slice(2,6),
      description:'', unit:'', quantity:'', sell_rate:'', cost_rate:'',
      is_spec_note:false, is_bold:false, is_provisional:false,
      position: lines.length + 1, ...o });

    /* The priced line carries the bill's own words and the quantity, so a consultant
       laying the quotation beside the BOQ finds every item. The section title stays
       short; the wording lives on the line. */
    push({ description: it.text, unit: it.unit, quantity: it.qty });

    // A section that cannot be priced keeps its line, with the rate blank, and the
    // reason goes inside. The editor counts the sections still without a price.
    if(it.works){
      internal.push(where + ': ' + it.works + ', site work rather than a coating we supply. '
        + 'Put a rate on it or take it out.');
      return finishSection(it, i, lines);
    }

    const missing = it.parts.filter(x => !x.pick || !x.pick.product_id);
    if(missing.length === it.parts.length){
      // the layer's own reason first ("75mm of sand and cement… is builders work"), the
      // item-level gap only when the layer has none
      const why = (missing[0].pick && missing[0].pick.note)
               || (it.gaps && it.gaps[0] && it.gaps[0].note)
               || (it.gaps && it.gaps[0] && it.gaps[0].why) || '';
      internal.push(where + ': no product in our range is set against it. '
        + (why || 'Choose one in the catalogue, buy the specified material in, or take the item out.'));
      return finishSection(it, i, lines);
    }

    it.parts.forEach(part => {
      const pk = part.pick;
      if(!pk || !pk.product_id){
        internal.push(where + ': "' + part.label + '" has no product against it; price that layer by hand.');
        return;
      }
      const p = prod(pk.product_id);
      if(!p) return;
      push({ is_spec_note:true, description:'' });

      const cov = (p.coverage_max ?? p.coverage_min);
      const unit = String(p.coverage_unit||'').toLowerCase();
      let kg = cov==null ? null
             : unit.startsWith('g/')  ? Number(cov)/1000
             : unit.startsWith('kg/') ? Number(cov) : null;
      const coats = part.coats || 1;
      /* "@ 6mm" changes the consumption. Where the data sheet gives its figure for a
         thickness the catalogue figure is scaled; where it does not, the catalogue figure
         stands and the note inside says to check it. */
      let at = '';
      if(it.thickness_mm){
        const perMm = perMmOf(p);
        if(perMm){ kg = round2(perMm * it.thickness_mm); at = ' at ' + String(it.thickness_mm).replace('.',',') + ' mm'; }
        else internal.push(where + ' is specified at ' + it.thickness_mm + ' mm; ' + p.name
          + (kg!=null ? '\u2019s catalogue figure of ' + round2(kg) + ' kg/m² is not given per mm, so check the consumption.'
                      : ' has no consumption in the catalogue.'));
      }

      push({ is_spec_note:true, is_bold:true,
             description: p.name + (kg!=null
               ? ' : Approx. ' + String(round2(kg*coats)).replace('.',',') + ' kg/m²' + at
                 + (coats>1 ? ' over ' + coats + ' coats' : '') + '.'
               : (coats>1 ? ' : ' + coats + ' coats.' : '.')) });
      let blurb = (p.description || p.application || '').trim();
      // a blurb that opens with the product's own name would be costed a second time
      if(blurb && normName(blurb).startsWith(normName(p.name)))
        blurb = blurb.slice(p.name.length).replace(/^[\s:,\-–]+/,'').replace(/^[a-z]/, c => c.toUpperCase());
      if(blurb) push({ is_spec_note:true, description: blurb });
      if(pk.kind === 'equivalent' && pk.note)
        internal.push(where + ': offered ' + p.name + ' against "' + part.label + '". ' + pk.note);
    });

    // a per-square-metre cost cannot be put against a line measured in metres or as an item
    if(!isAreaUnit(it.unit) && lines.some(l => l.is_bold))
      internal.push(where + ' is measured in ' + it.unit + ', so the products\u2019 per-m² cost was not '
        + 'applied; work that rate out by hand.');

    /* Deliberately not priced here. The editor already works a section's cost out from
       its bold spec notes, against the catalogue and the margin in Settings, and that is
       the path everything else uses and everything else tests. Pricing it twice, in two
       places, is how the two quietly stop agreeing. */

    return finishSection(it, i, lines);
  });

  return { secs, notes: parsed.notes || [], internal };
}

function finishSection(it, i, lines){
  return {
    id: 'sec' + Date.now() + '-' + i,
    title: sectionTitle(it),
    position: i + 1,
    lines,
  };
}

/* "BOQ & Specification for Fruits and Vegetable Market Flooring" is how a consultant
   heads a bill, and "Fruits and Vegetable" is how anybody on site refers to it. */
function shortGroup(g){
  return String(g||'')
    .replace(/^(?:boq|bill of quantities)\s*(?:&|and)?\s*specifications?\s*(?:for|of)\s*/i,'')
    .replace(/\s*\b(market\s+)?(flooring|floor|works?|coating|waterproofing)\b\s*$/i,'')
    .replace(/\s+/g,' ').trim().slice(0, 34);
}

/* A section is titled the way somebody would refer to the job on site, not with the
   consultant's whole sentence. */
function sectionTitle(it){
  const t = it.text
    .replace(/\s*:.*$/, '')      // everything after a colon is the build-up
    .replace(/\.\s.*$/, '')      // and everything after the first full stop is a caveat
    .replace(/,.*$/, '')         // and after the first comma is detail
    .trim();
  const short = t.length > 62 ? t.slice(0, 60).replace(/\s+\S*$/,'') + '…' : t;
  /* One document can hold two bills, each numbered from 1. Charles's market floor file
     is the Fruits and Vegetable bill then the Meat bill, same seven items, different
     quantities. Without the bill's name on the section there are two item 1s in the
     draft and nothing to say which is which. */
  const where = it.group ? shortGroup(it.group) + ': ' : '';
  return (it.optional ? 'Optional — ' : '') + where + (short || ('Item ' + it.no));
}

/* ── the screen ────────────────────────────────────────────────────────────────
   Paste, read, look at what it made of it, then create. The middle step is the one
   that matters: it is where a wrong equivalent gets caught, and it is why the draft is
   not created straight from the paste box. */
function ScopeReader({products, equivalents, pastLines, settings, rate, office, me,
                      done, cancel}){
  const [text,setText]=useState('');
  const [read,setRead]=useState(null);
  const [picks,setPicks]=useState({});     // "itemIndex:partIndex" -> product_id or ''
  const [file,setFile]=useState(null);     // what was uploaded, once it is stored
  const [teach,setTeach]=useState({});     // "i:j" -> the wording to remember
  const [taught,setTaught]=useState({});   // "i:j" -> what it now says
  const [busy,setBusy]=useState('');
  const [err,setErr]=useState('');
  const [drag,setDrag]=useState(false);

  /* The file is kept whatever happens next. Even a PDF, whose table has to be pasted,
     is worth storing: six months on, the question is not only what we quoted but what
     we were sent. */
  const take = async f => {
    if(!f) return;
    setErr(''); setBusy('Reading ' + f.name + '…');
    let extracted = '', trouble = '';
    try{
      const r = await readScopeFile(f);
      extracted = (r && r.text) || '';
      if(!extracted.trim()) trouble = 'There is no text in that file.';
    }catch(e){
      trouble = (e && e.message) || 'That file could not be read.';
    }

    setBusy('Storing ' + f.name + '…');
    const path = (office ? office.code : 'DXB') + '/' + Date.now() + '-'
               + f.name.replace(/[^A-Za-z0-9._-]/g,'_');
    let stored = null;
    try{
      const up = await sb.storage.from('scope-docs').upload(path, f, {upsert:false});
      if(up.error) throw up.error;
      const row = {
        title: null, client_name: null,
        file_name: f.name, file_path: path,
        mime: f.type || null, size_bytes: f.size || null,
        extracted: extracted || null,
        note: trouble || null,
        uploaded_by: me ? me.id : null,
      };
      const ins = await sb.from('scope_documents').insert(row).select().single();
      if(ins.error) throw ins.error;
      stored = ins.data;
    }catch(e){
      setErr('The file could not be stored: ' + ((e&&e.message)||e)
             + '. You can still paste the table below.');
    }
    setFile({ name:f.name, size:f.size, row:stored, trouble });
    setBusy('');
    if(extracted.trim()) { setText(extracted); go(extracted, stored); }
  };

  const cfg = k => (settings||[]).find(s=>s.key===k)?.value;
  const cur = office ? office.currency : 'AED';
  const supplyDisc = settingNumber(cfg('supply_discount'), 0.70);
  const fxRate     = cur==='EUR' ? 1 : settingNumber(cfg('eur_aed_rate'), rate||4.27);
  const marginPct  = Math.round(settingNumber(cfg('default_margin'), 0.45)*100);
  const costPerKg = p => {
    const per=k=>nz(k.eur_per_unit)||(nz(k.pack_qty)?nz(k.eur_total)/nz(k.pack_qty):0);
    const list=(p.product_packs||[]).filter(k=>!k.is_poa).map(per)
                 .filter(x=>x>0).sort((a,b)=>a-b)[0]||0;
    return list ? list*(1-supplyDisc)*fxRate : 0;
  };
  const sellFrom = c => marginPct>=100 ? 0 : round2(c/(1-marginPct/100));

  const matcher = useMemo(()=>buildMatcher(products||[], equivalents||[], pastLines||[]),
                          [products,equivalents,pastLines]);

  /* A suggested wording to remember. A bill says "Supply and apply of Ucret HFl00 RT
     System @ 6mm"; what identifies it is "ucret hfl00", not the supplying and applying.
     Charles can edit it, and short is better: a shorter term matches the next bill that
     spells it differently. */
  const suggestTerm = label => String(label||'')
    .toLowerCase()
    .replace(/^\s*(supply|supplying|apply|applying|installation|install|provision|provide|of|and|the)\b/g,'')
    .replace(/^[\s,\-:]+/,'')
    .replace(/\b(supply|apply|applying|of|and|the|with|for|including|include|to|at|as|per|system)\b/g,' ')
    .replace(/[^a-z0-9\s\-]/g,' ')
    .replace(/\s+/g,' ')
    .trim()
    .split(' ').slice(0,3).join(' ');

  /* Teaching it. This is the whole answer to "what do you need from me": nothing, tell it
     once when you correct it and it knows from then on. The row goes in the same table
     the migrations seed, so what is learned here and what was written by hand are the
     same thing and are read the same way. */
  const remember = async (key, term, productId, label) => {
    const t = String(term||'').trim().toLowerCase();
    if(!t || !productId) return;
    const row = { term: t, product_id: productId, role: null, confidence: 'firm',
                  note: 'Set by ' + ((me && me.full_name) || 'somebody') + ' from '
                        + (file ? file.name : 'a scope') + ', against "' + label + '".' };
    const r = await sb.from('spec_equivalents').insert(row);
    setTaught(p=>({...p,[key]: r.error ? ('Not saved: ' + r.error.message)
      : ('Remembered. A spec saying "' + t + '" will use this from now on.')}));
  };

  const go = (src, stored) => {
    const use = typeof src === 'string' ? src : text;
    const parsed = parseScope(use);
    const matched = parsed.items.map(it => matchItem(it, matcher));
    setPicks({});
    setRead({parsed, matched});
    /* What the document turned out to be, written back onto its row, so the list of
       scopes reads as documents rather than as filenames. */
    const doc = stored || (file && file.row);
    if(doc && doc.id){
      sb.from('scope_documents').update({
        title: parsed.title || null,
        client_name: parsed.client || null,
        item_count: parsed.items.length,
      }).eq('id', doc.id).then(()=>{}, ()=>{});
    }
  };

  // what the person has chosen, folded back over what was suggested
  const withPicks = () => read.matched.map((it,i)=>({
    ...it,
    parts: it.parts.map((part,j)=>{
      const chosen = picks[i+':'+j];
      if(chosen === undefined) return part;
      if(chosen === '') return {...part, pick:null};
      const hit = part.hits.find(h=>h.product_id===chosen);
      return {...part, pick: hit || {product_id:chosen, kind:'chosen', confidence:'firm',
                                     why:'Chosen by hand.'}};
    }),
  }));

  const create = () => {
    const chosen = withPicks();
    const draft = buildDraft(read.parsed, chosen, {products, costPerKg, sellFrom});
    done({ parsed: read.parsed, secs: draft.secs, notes: draft.notes, internal: draft.internal });
  };

  if(!read) return html`
    <div class="page-head"><h1>${_t('Read a scope of works')}</h1>
      <button class="btn ghost sp" onClick=${cancel}>${_t('Back')}</button></div>

    <div class="panel"><div class="panel-body">
      <p class="muted">Give it the document the client sent. It is kept in the system, so
        the paper behind a quotation is still there in six months, and its table is read
        into a draft now.</p>

      ${err && html`<div class="err">${err}</div>`}

      <label class=${'dropzone'+(drag?' over':'')}
        onDragOver=${e=>{e.preventDefault();setDrag(true);}}
        onDragLeave=${()=>setDrag(false)}
        onDrop=${e=>{e.preventDefault();setDrag(false);
                     take(e.dataTransfer.files && e.dataTransfer.files[0]);}}>
        <input type="file" hidden
          accept=".docx,.xlsx,.xlsm,.csv,.tsv,.txt,.md,.pdf"
          onChange=${e=>take(e.target.files && e.target.files[0])}/>
        <div class="dz-big">${busy || _t('Drop the document here, or choose a file')}</div>
        <div class="dz-small">Word, Excel, CSV or plain text is read straight through.
          A PDF is kept, but its table has to be pasted.</div>
      </label>

      ${file && html`<div class=${file.trouble?'flagbox':'okbox'}>
        <b>${file.name}</b> ${file.row ? 'is stored.' : 'could not be stored.'}
        ${file.trouble ? ' ' + file.trouble : ''}
      </div>`}

      <p class="muted" style=${{marginTop:'18px'}}>Or paste the table, if it is easier or
        if it came out of a PDF.</p>
      <textarea class="scope-in" value=${text} placeholder=${'No.\tDescription\tQuantity\tUnit\n1\t…'}
        onInput=${e=>setText(e.target.value)}></textarea>
      <button class="btn" disabled=${!text.trim()||!!busy} onClick=${()=>go()}>
        ${_t('Read it')}</button>
    </div></div>`;

  const { parsed } = read;
  const chosen = withPicks();
  const unsure = chosen.filter(it => it.parts.some(p => !p.pick || !p.pick.product_id));

  return html`
    <div class="page-head"><h1>${_t('What it read')}</h1>
      <button class="btn ghost sp" onClick=${()=>setRead(null)}>${_t('Start again')}</button></div>

    <div class="cards">
      <div class="card"><div class="k">${_t('Items read')}</div>
        <div class="v">${parsed.items.length}</div>
        <div class="s">${parsed.unread.length ? parsed.unread.length+' lines it could not read'
                                              : 'Every line of the table'}</div></div>
      <div class="card"><div class="k">${_t('Settled')}</div>
        <div class="v">${chosen.length - unsure.length}</div>
        <div class="s">Matched to something we supply</div></div>
      <div class=${'card'+(unsure.length?' alert':'')}><div class="k">${_t('Needs you')}</div>
        <div class="v">${unsure.length}</div>
        <div class="s">${unsure.length?'Pick a product, or leave it to price by hand'
                                      :'Nothing outstanding'}</div></div>
    </div>

    ${(parsed.title || parsed.client) && html`<div class="panel"><div class="panel-body">
      <dl class="kv">
        ${parsed.title  && html`<${Frag}><dt>${_t('Contract')}</dt><dd>${parsed.title}</dd></${Frag}>`}
        ${parsed.client && html`<${Frag}><dt>${_t('Client')}</dt><dd>${parsed.client}</dd></${Frag}>`}
      </dl></div></div>`}

    ${chosen.map((it,i)=>{
      const decided = it.parts.filter(x=>x.pick&&x.pick.product_id).length;
      const state = it.works ? 'works' : decided===it.parts.length&&decided>0 ? 'done' : 'open';
      const chip  = it.works ? 'Site work'
                  : state==='done' ? 'Matched'
                  : decided ? decided+' of '+it.parts.length+' matched' : 'Needs you';
      return html`
      <div class=${'panel scope-item '+state} key=${i}>
        <div class="panel-head">
          <h2>${it.no}. ${sectionTitle(it)}</h2>
          <span class=${'pill sp '+(state==='done'?'won':state==='works'?'quoted':'lost')}>${chip}</span>
          <span class="muted scope-qty">${Number(it.qty).toLocaleString()} ${it.unit}</span>
        </div>
        <div class="panel-body">
          <p class="muted">${it.text}</p>

          ${/* One sentence saying where this item stands, rather than a stack of
                warnings each saying a piece of it. */''}
          ${it.works && html`<div class="flagbox">Reads as ${it.works}. Not a coating we
            supply, so it stays as a priced line for you to rate.</div>`}
          ${(it.gaps||[]).map((g,k)=>html`<div class="flagbox" key=${k}>${g.why}</div>`)}
          ${/* When nothing at all matched, that is one fact about the item, not the same
                sentence written out once under every layer. */''}
          ${/* and not if a gap banner has already said it in the consultant's own words */''}
          ${!it.works && decided===0 && it.parts.length>0 && !(it.gaps||[]).length
            && html`<div class="flagbox">
            Nothing in the catalogue is close enough to suggest for any part of this.
            Pick products below, or leave it and price the line by hand.</div>`}

          ${/* The layers. A layer that is settled shows as a line of text; only one that
                still needs a decision gets a dropdown in front of you. */''}
          ${it.parts.filter(x=>!it.works).map((part,j)=>{
            const has = part.pick && part.pick.product_id;
            const p   = has && (products||[]).find(x=>x.id===part.pick.product_id);
            return html`
            <div class=${'scope-part'+(has?' set':'')} key=${j}>
              <div class="sp-label">${part.coats>1?part.coats+' × ':''}${part.label}</div>
              <select value=${(has && part.pick.product_id) || ''}
                onChange=${e=>setPicks(q=>({...q,[i+':'+j]:e.target.value}))}>
                <option value="">— nothing, price this by hand —</option>
                ${(products||[]).filter(x=>x.is_active).map(x=>html`
                  <option key=${x.id} value=${x.id}>${x.name}</option>`)}
              </select>
              ${(part.pick || decided>0) && html`
                <div class=${'sp-why'+(has?'':' gap')}>${
                  part.pick ? part.pick.why
                  : 'Nothing close enough to suggest for this layer.'}</div>`}

              ${/* Where the answer did not come from the equivalents list, offer to put
                    it there. Next time it is a match with a reason, not a guess. */''}
              ${has && part.pick.kind !== 'equivalent' && html`
                <div class="sp-teach">
                  ${taught[i+':'+j]
                    ? html`<span class="ok">${taught[i+':'+j]}</span>`
                    : html`<${Frag}>
                        <span>Remember: when a spec says</span>
                        <input type="text"
                          value=${teach[i+':'+j] ?? suggestTerm(part.label)}
                          onInput=${e=>setTeach(q=>({...q,[i+':'+j]:e.target.value}))}/>
                        <span>use ${p ? p.name : ''}</span>
                        <button class="btn ghost small" onClick=${()=>remember(
                          i+':'+j, teach[i+':'+j] ?? suggestTerm(part.label),
                          part.pick.product_id, part.label)}>${_t('Remember')}</button>
                      </${Frag}>`}
                </div>`}
            </div>`;})}
        </div>
      </div>`;})}

    ${parsed.notes.length>0 && html`<div class="panel">
      <div class="panel-head"><h2>${_t('Conditions in the scope')}</h2></div>
      <div class="panel-body"><ul class="tight">
        ${parsed.notes.map((n,i)=>html`<li key=${i}>${n}</li>`)}
      </ul>
      <p class="muted">These go onto the draft as remarks. A ten year warranty and spare
        drums are a cost: price them before you send it.</p></div></div>`}

    ${parsed.unread.length>0 && html`<div class="panel">
      <div class="panel-head"><h2>${_t('Lines it could not read')}</h2></div>
      <div class="panel-body"><ul class="tight">
        ${parsed.unread.slice(0,12).map((n,i)=>html`<li key=${i} class="muted">${n}</li>`)}
      </ul></div></div>`}

    <button class="btn" onClick=${create}>${_t('Create the draft')}</button>`;
}

/* ══════════════ SETTING THE PRICE YOURSELF ══════════════
   A quotation is built from the bottom up, rate by rate, and that is the wrong way round
   for how this job is actually won. The number in Charles's head is "this goes out at
   220,000", because that is what he has been told the other man quoted. The rates are the
   arithmetic underneath that number, not the source of it.

   So: type the total you want, and every sell rate is scaled to land on it.

   The awkward part is rounding. Scale eleven rates by 0.87, round each to the fil, and the
   column adds up to 219,998.60 rather than 220,000, which is the first thing a quantity
   surveyor notices. So the residue is put back onto the largest line, where a hundredth of
   a dirham on the rate is invisible, and the printed column adds up exactly.

   Lines with no quantity or no rate are left alone. They are spec notes and things still
   to be priced, and quietly giving them a rate would be inventing money. */
function scaleRatesTo(lines, target){
  /* Only the lines that carry the price. A build-up line's rate is there to show where
     the money goes; scaling it would change nothing on the total and would push the
     product's own rate somewhere absurd, which is how one ended up at minus three fils. */
  const live = (lines||[]).filter(l => !l.is_spec_note && !l.is_costing
                                    && nz(l.quantity) > 0 && nz(l.sell_rate) > 0);
  const base = live.reduce((t,l) => t + nz(l.quantity)*nz(l.sell_rate), 0);
  if(!live.length || base <= 0 || !isFinite(target) || target <= 0) return null;

  const k = target / base;
  const next = new Map();
  live.forEach(l => next.set(l.id, Math.round(nz(l.sell_rate) * k * 100) / 100));

  /* The residue, and the honest limit of this.
     A rate is quoted to two decimals, so a line of 525 m² can only move in steps of
     525 × 0.01, which is 5.25 dirhams. On a quotation made only of large lines there is
     no set of two decimal rates that adds up to exactly 200,000, and pretending otherwise
     would mean printing a rate with four decimals on it, which no client accepts.
     So the residue goes on the line with the SMALLEST quantity, where a hundredth of a
     dirham is worth least and the landing is therefore closest, and what it actually
     landed on is reported back rather than assumed. */
  const sum = live.reduce((t,l) => t + nz(l.quantity) * next.get(l.id), 0);
  let diff = target - sum;
  if(Math.abs(diff) > 0.004){
    /* Moving one line's rate by a fil moves its total by its quantity in fils: 9.25 on a
       925 kg line, 4.30 on a 430 one. One line alone can therefore only land on multiples
       of its own step. Two lines together can land on combinations of both steps, which
       on a real quotation is almost always the number itself. So every line is tried as
       the carrier, and every other line as the one that mops up what is left. */
    const step = l => nz(l.quantity) * 0.01;
    let best = null;
    const consider = (a,kA,b,kB,left) => {
      const moves = Math.abs(kA) + Math.abs(kB);
      if(!best || left < best.left - 1e-9
         || (Math.abs(left - best.left) < 1e-9 && moves < best.moves))
        best = { a, kA, b, kB, left, moves };
    };
    live.forEach(a => {
      if(step(a) <= 0) return;
      const rate = next.get(a.id);
      /* How far one line's rate may be pushed while hunting for the exact landing. Two
         dirhams, or a tenth of the rate, whichever is smaller: enough to reach almost any
         number, small enough that no single line ends up visibly odd against the others. */
      const span = Math.max(1, Math.round(Math.min(200, rate*10)));
      for(let kA = -span; kA <= span; kA++){
        if(rate + kA*0.01 <= 0) continue;
        const restA = diff - kA*step(a);
        consider(a, kA, null, 0, Math.abs(restA));
        live.forEach(b => {
          if(b === a || step(b) <= 0) return;
          const rb = next.get(b.id);
          const kB = Math.round(restA / step(b));
          if(rb + kB*0.01 <= 0) return;
          consider(a, kA, b, kB, Math.abs(restA - kB*step(b)));
        });
      }
    });
    if(best){
      const bump = (l,k) => { if(!l || !k) return;
        const v = Math.round((next.get(l.id) + k*0.01) * 100) / 100;
        if(v > 0) next.set(l.id, v);            // never push a rate to zero or below
      };
      bump(best.a, best.kA);
      bump(best.b, best.kB);
    }
  }
  next.landed = Math.round(live.reduce((t,l) => t + nz(l.quantity)*next.get(l.id), 0) * 100) / 100;
  return next;
}

/* ── one price per section ─────────────────────────────────────────────────────
   A Build-Tech quotation prices a section on ONE line: "Roof waterproofing, 525 m² at
   240 the metre, 126,000". Under it are the products that make up that metre, with their
   consumptions and what they cost us. Those are there so Charles can see where the money
   goes; they are not four things the client is buying, and a client who adds up that
   column gets a number that is not the price.

   So the first line in a section that carries a rate is the priced line, and every other
   line with a rate on it is build-up. That is not a guess about intent, it is how every
   quotation this company has ever sent is written.

   is_costing stays as the override, for the rare section that genuinely sells two things.
   Press the switch on a line and it counts again. */
function normaliseSection(lines){
  let seenPriced = false;
  return (lines||[]).map(l => {
    if(l.is_spec_note) return l;
    const carries = nz(l.quantity) > 0 || nz(l.sell_rate) > 0 || l.sell_rate === 0;
    if(!carries) return l;
    if(!seenPriced){ seenPriced = true; return { ...l, is_costing: false }; }
    return { ...l, is_costing: true };
  });
}

/* What the priced line really costs us: every build-up line under it, per unit of the
   thing being sold. This is the number Charles wants beside Supply and Install, made of
   the product costs plus whatever he types for the application. */
function buildUpCost(lines){
  const priced = (lines||[]).find(l => !l.is_spec_note && !l.is_costing);
  const qty = priced ? nz(priced.quantity) : 0;
  if(!qty) return null;
  const rows = (lines||[]).filter(l => l.is_costing && l.cost_rate!=null && l.cost_rate!=='');
  if(!rows.length) return null;
  const total = rows.reduce((t,l) => t + nz(l.quantity)*nz(l.cost_rate), 0);
  return { total, perUnit: Math.round(total/qty*100)/100, rows: rows.length };
}

/* What a set of lines comes to. One place, so the screen, the printed sheet and the
   tests cannot drift apart on it. */
const sellTotal = lines => (lines||[])
  .filter(l => !l.is_spec_note && !l.is_costing)
  .reduce((t,l) => t + nz(l.quantity)*nz(l.sell_rate), 0);

/* What the sections look like once a target has been spread over them. Kept separate from
   the screen so the arithmetic can be checked without a browser. */
function sectionsAtPrice(secs, target, onlySection){
  const scope = onlySection == null ? (secs||[]).flatMap(s => s.lines)
                                    : ((secs||[])[onlySection]||{}).lines || [];
  const next = scaleRatesTo(scope, target);
  if(!next) return null;
  return (secs||[]).map((s,i) => (onlySection != null && i !== onlySection) ? s : {
    ...s, lines: s.lines.map(l => next.has(l.id) ? { ...l, sell_rate: next.get(l.id) } : l),
  });
}

function QuotationEditor({id,clients,settings,rate,offices,office,back,go}){
  const isNew = id==='new';
  const [q,setQ]=useState(null); const [secs,setSecs]=useState([]);
  const [prods,setProds]=useState([]); const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  // The lowest margin worth taking on this job. Stays on the machine, it is a working
  // preference rather than something that belongs on the quotation.
  const [floorPct,setFloorPct]=useState(()=>{
    try{ return Number(localStorage.getItem('bt-floor')||25); }catch(e){ return 25; }
  });
  const setFloor=v=>{ setFloorPct(v); try{ localStorage.setItem('bt-floor',v); }catch(e){} };
  // The margin the job is priced at. Starts from the standard one in Settings, and moving
  // it re-prices every line that was following it, leaving alone any price somebody has
  // deliberately typed over.
  const [targetPct,setTargetPct]=useState(45);
  /* Typing the price you want. A string rather than a number so that half a number on the
     way to a whole one does not keep resetting itself under the cursor. These live up here
     with the other hooks because this component returns early while it is loading, and a
     hook below that point is only called on some renders, which React will not have. */
  const [wantTxt,setWantTxt]=useState('');
  const [secWant,setSecWant]=useState({});      // the same thing, one section at a time
  const [secSaid,setSecSaid]=useState({});      // and what it actually landed on
  const [wordings,setWordings]=useState([]);   // how these products have been worded before
  const marginSeeded=useRef(false);
  /* Margin or mark-up. They are not the same number and mixing them up is how a job gets
     quoted a third light: 45 on a cost of 20.91 is 38.02 as a margin and 30.32 as a
     mark-up. Doubling the cost is a 100% mark-up, which is a 50% margin. A 100% margin
     would mean the job cost nothing at all, which is why that end is unreachable rather
     than merely disallowed. Whichever way somebody thinks, the box does that, and always
     prints the other so the two can never be confused again. */
  const [priceMode,setPriceMode]=useState(()=>{
    try{ return localStorage.getItem('bt-pricemode')==='markup' ? 'markup' : 'margin'; }
    catch(e){ return 'margin'; }});
  const setMode=v=>{ setPriceMode(v); try{ localStorage.setItem('bt-pricemode',v); }catch(e){} };
  const sellFrom=(c,p,mode)=>{ const m=mode||priceMode, pct=nz(p);
    if(m==='markup') return round2(nz(c)*(1+pct/100));
    return pct>=100 ? 0 : round2(nz(c)/(1-pct/100)); };
  // The full catalogue with packs, and the transport classification, both needed to
  // turn this quotation into something a freight forwarder can price.
  const [cat,setCat]=useState([]); const [trans,setTrans]=useState({});
  const [shipOpen,setShipOpen]=useState(false);
  const set=(k,v)=>setQ(p=>({...p,[k]:v}));
  const cfg=k=>settings.find(s=>s.key===k)?.value||'';

  /* ── never lose a quotation again ──────────────────────────────────────────────
     Losing half an hour of typing because a tab was switched is the worst thing this
     system can do to somebody, so it is guarded three ways. The cause is fixed above.
     This is the belt: everything on screen is written to the machine as it is typed,
     and offered back if the page is ever reopened with the work still unsaved. It
     survives a crash, a closed tab, a flat battery and a mistake nobody has thought of
     yet, none of which the fix above would have covered. */
  const draftKey = 'bt-draft-' + id;
  const qRef = useRef(null), secsRef = useRef(null), cfgRef = useRef(settings);
  useEffect(()=>{ cfgRef.current = settings;
    if(!marginSeeded.current && settings.length){
      const d=settings.find(s=>s.key==='default_margin');
      if(d) setTargetPct(Math.round(settingNumber(d.value, 0.45)*100));
      marginSeeded.current = true;
    }
  },[settings]);
  const [restored,setRestored]=useState('');
  // an unsaved draft found on this machine that is older than what a colleague has since
  // saved: shown and offered, never imposed
  const [offered,setOffered]=useState(null);
  // what the database holds, as last loaded or saved, so a quotation that was only looked
  // at is never mistaken for a draft
  const savedRef = useRef(null);
  const dropDraft = ()=>{ try{ localStorage.removeItem(draftKey); }catch(e){} };
  useEffect(()=>{ qRef.current = q; secsRef.current = secs;
    if(!q) return;
    // A quotation that matches what the database holds is not a draft worth keeping. One
    // used to be written the moment a saved quotation loaded, so every reopen claimed
    // "nothing has been saved" over work that had been, and a colleague's later save sat
    // hidden under this machine's stale copy.
    if(JSON.stringify({q, secs}) === savedRef.current){ dropDraft(); return; }
    try{ localStorage.setItem(draftKey, JSON.stringify({q, secs, at:Date.now()})); }catch(e){}
  },[q,secs,draftKey]);

  /* ── the cost arrives on its own ────────────────────────────────────────────────
     Naming a product and then pressing a button to find out what it costs is one step
     too many: the moment the product is on the page the system knows the price, so it
     should say it. This fills any cost that is still blank, from the products named in
     the section, and prices it at the margin.

     It only ever fills a blank. A cost or a price typed in by hand is a decision
     somebody made, and this must never argue with it. That is also what stops it
     looping: once a line is filled there is nothing left for it to do.

     A line that names a product directly, rather than carrying spec notes under it, is
     costed from that product's own price per unit instead. Both ways of writing a
     quotation are in use and both should just work. */
  const lineOwnCost = l => {
    const r=lineCostDetail(l);
    return r ? r.perUnit : 0;
  };
  /* Writing "CBTDUR" on a square metre line and expecting a cost is entirely reasonable:
     the catalogue already knows CBTDUR goes on at 200 to 500 g/m². So when the line does
     not say a consumption, take the product's own, at the heavy end of its range, because
     erring light on a cost is the direction that loses money. Where the figure came from
     is always shown, since a range taken off a data sheet is an assumption and a number
     typed on the line is a decision. */
  const coverageOf = p => {
    const v=Number(p.coverage_max ?? p.coverage_min);
    if(!(v>0)) return null;
    const u=String(p.coverage_unit||'').toLowerCase();
    if(u.startsWith('g/'))  return {kg:v/1000, how:'catalogue', text:round2(v)+' g/m²'};
    if(u.startsWith('kg/')) return {kg:v,      how:'catalogue', text:round2(v)+' kg/m²'};
    return null;
  };
  const lineCostDetail = l => {
    /* plainText, because a product name somebody has marked bold reads as
       "**IBTMAX B 1K** : 2.5 kg/m²" in the stored text and would match nothing. */
    const prod=findProduct(plainText(l.description));
    if(!prod) return null;
    const unitCost=packCost(prod);
    if(!unitCost) return {prod, perUnit:0, why:'no priced pack in the catalogue'};
    const isArea=(prod.product_packs||[]).some(k=>/m2|m²/i.test(k.unit||''));
    const perArea=/m2|m²|sq\.?m/i.test(l.unit||'');
    if(isArea || !perArea)                          // sold the way it is measured
      return {prod, perUnit:unitCost, basis:'one for one', from:'pack'};
    const said=parseConsumption(plainText(l.description));
    const cov = said ? {kg:said.kg, how:'line', text:round2(said.kg)+' kg/m²'}
                     : coverageOf(prod);
    if(!cov){
      // Two different problems, and they need different answers. Either this page never
      // loaded the coverage, which means it is an old copy still in the browser, or the
      // catalogue genuinely has none for this product and somebody has to say what it is.
      const fetched = ('coverage_max' in prod) || ('coverage_unit' in prod);
      return {prod, perUnit:0, why: fetched
        ? ('the catalogue has no consumption for it. Write it on the line, for example "'
           + prod.name + ' : 1,00 kg/m²", or add it to the product in the Catalogue')
        : ('this page is an old copy that never loaded the consumption figures. Reload '
           + 'with Ctrl and Shift and R, then check Settings shows build ' + BUILD_VERSION)};
    }
    return {prod, perUnit:cov.kg*unitCost, basis:cov.text, from:cov.how};
  };
  // Once per line, and never again. If somebody clears a cost on purpose it stays clear:
  // the system offering a number is help, the system insisting on one is a fight.
  const autoDone = useRef(new Set());
  useEffect(()=>{
    if(!secs.length) return;
    let touched=false;
    const next=secs.map(s=>{
      const fromSpec=sectionCost(s);
      const lines=s.lines.map(l=>{
        if(l.is_spec_note) return l;
        if(autoDone.current.has(l.id)) return l;
        const blankCost = l.cost_rate===''||l.cost_rate==null;
        /* The products' cost is per square metre. Against a line measured in metres or
           as an item it is the wrong number by a long way: a 200 mm skirting was being
           costed as if every metre of it were a square metre. */
        const c = blankCost ? (fromSpec.any && isAreaUnit(l.unit) ? round2(fromSpec.perM2)
                                                                   : round2(lineOwnCost(l)))
                            : nz(l.cost_rate);
        if(blankCost && !(c>0)) return l;      // nothing to offer, so leave it alone
        const blankSell = l.sell_rate===''||l.sell_rate==null||nz(l.sell_rate)===0;
        if(!blankCost && !blankSell){ autoDone.current.add(l.id); return l; }
        touched=true; autoDone.current.add(l.id);
        return {...l, cost_rate: blankCost ? c : l.cost_rate,
                      sell_rate: blankSell ? atMargin(c) : l.sell_rate};
      });
      return touched ? {...s, lines} : s;
    });
    if(touched) setSecs(next);
  },[secs,targetPct,cat]);

  useEffect(()=>{(async()=>{
    // Packs and aliases come too, because the shipping request works the cargo out of
    // them. Transport data is a view, so it is fetched alongside rather than embedded.
    const [{data:pp},tr]=await Promise.all([
      // Everything, not a hand-picked list. Naming the columns here is how the coverage
      // went missing: the editor asked for the name and the price, then tried to read a
      // consumption that had never been fetched, and told the user the catalogue was
      // empty when it was not. It is 132 rows. Take the lot and stop guessing which
      // columns a future feature will need.
      sb.from('products').select('*, product_aliases(alias), product_packs(*)'),
      sb.from('product_transport_summary').select('*')]);
    setCat(pp||[]);
    if(tr && !tr.error && tr.data){
      const m={}; tr.data.forEach(r=>{ m[r.product_id]=r; }); setTrans(m);
    }
    /* How this company has worded these products before, and what was charged. The
       suggestion list offers the whole line Charles wrote last time, not just the
       product's catalogue name, so "IBTMAX B 1K : Approx. 2,50 kg/m2." comes back in one
       keystroke with the cost that went with it. */
    const wd = await sb.from('product_wordings').select('*').order('last_used_at',{ascending:false});
    const said = (wd && wd.data) || [];
    setWordings(said);
    const names=[];
    said.forEach(w=>names.push(w.wording));
    (pp||[]).forEach(x=>{names.push(x.name);(x.product_aliases||[]).forEach(a=>names.push(a.alias));});
    setProds([...new Set(names)]);
    // Work left behind last time comes back, whatever ended the last visit.
    let draft=null;
    try{ const raw=localStorage.getItem(draftKey); if(raw) draft=JSON.parse(raw); }catch(e){}
    const stamp = d => new Date(d).toLocaleString('en-GB',
            {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    const typedAt = draft && draft.at ? 'Last typed '+stamp(draft.at)+'. ' : '';
    const pickUp = ()=>{ setQ(draft.q); setSecs(draft.secs||[]);
      setRestored('Picked up where you left off. '+typedAt+'Nothing has been saved to the database yet.'); };
    if(draft && draft.q && isNew){ pickUp(); return; }
    /* A draft handed over by the scope reader carries its sections and a few fields it
       read off the document, and nothing else. It must NOT carry a whole quotation: the
       currency, the VAT rate, the office and the validity are decided here, from the
       office being worked in, and a scope of works knows nothing about any of that. */
    const fromScope = draft && draft.from === 'scope' && draft.secs;
    /* "Waterfront Market LLC" on the bill is a client already on the books nine times
       out of ten. Matched on the name with the legal suffix and punctuation set aside. */
    const clientKey = n => String(n||'').toLowerCase()
      .replace(/\b(?:l\.?l\.?c|ltd|limited|co|company|inc|plc|b\.?v|n\.?v|s\.?a|s\.?l|fze|fzco|llp)\b\.?/g,'')
      .replace(/[^a-z0-9]+/g,' ').trim();
    const matchClient = name => { const k = clientKey(name); if(k.length < 4) return null;
      const hit = (clients||[]).find(c => clientKey(c.name) === k)
               || (clients||[]).find(c => { const ck = clientKey(c.name);
                    return ck.length >= 4 && (ck.startsWith(k) || k.startsWith(ck)); });
      return hit ? hit.id : null; };
    if(isNew){
      // whatever else happens, never overwrite work already on the screen
      if(qRef.current) return;
      const cfgv=k=>(cfgRef.current||[]).find(x=>x.key===k)?.value;
      const days=settingNumber(cfgv('quote_validity_days'), 30);
      // A new quotation belongs to the office you are working in, and takes its currency,
      // its VAT rate and its language from that. Nobody sets those by hand, which is the
      // only way a Belgian job never goes out priced in dirhams at 5% VAT.
      const home = office || (offices||[])[0] || null;
      const initial={id:null,reference:null,revision:'',client_id:null,project_name:'',location:'',
            quote_date:today(),
            valid_until:new Date(Date.now()+days*864e5).toISOString().slice(0,10),
            status:'draft',
            office_id: home?home.id:null,
            currency:  home?home.currency:'AED',
            language:  home?home.default_lang:'en',
            vat_rate: home?Number(home.vat_rate):settingNumber(cfgv('vat_rate'), 0.05),
            vat_applies:true,
            remarks:cfgv('quote_remarks')||'',
            // the reader's own commentary goes here, where it never prints
            meeting_notes: fromScope ? ((draft.seed&&draft.seed.internal)||[]).join('\n') : '',
            ...(fromScope ? {
                  project_name: (draft.seed&&draft.seed.project_name)||'',
                  client_id: matchClient(draft.seed&&draft.seed.client_name),
                  /* The conditions that came with the scope go into the remarks, which is
                     the field that prints on the sheet, rather than into a banner nobody
                     can act on. The warranty and the spare drums are terms of the job. */
                  remarks: [cfgv('quote_remarks')||'',
                            ((draft.seed&&draft.seed.notes)||[]).length
                              ? 'From the client\'s scope of works:\n'
                                + draft.seed.notes.map((n,ix)=>(ix+1)+'. '+n).join('\n')
                              : ''].filter(Boolean).join('\n\n'),
                } : {})};
      setQ(initial);
      if(fromScope){
        setSecs(draft.secs);
        const who = draft.seed && draft.seed.client_name;
        const notes = (draft.seed && draft.seed.notes) || [];
        const inside = (draft.seed && draft.seed.internal) || [];
        setRestored('Built from the scope of works you pasted'
          + (who ? ', which reads as ' + who + '\'s job'
                   + (initial.client_id ? ', a client on the books' : '') : '') + '. '
          + (notes.length ? 'Its ' + notes.length + ' condition'
              + (notes.length===1?' is':'s are') + ' in the remarks at the bottom. ' : '')
          + (inside.length ? 'The reader left ' + inside.length + ' '
              + (inside.length===1?'note':'notes') + ' for you under Meeting notes; none of that prints. ' : '')
          + 'Check every rate before you send it. Nothing has been saved yet.');
      } else { setSecs([]); savedRef.current = JSON.stringify({q:initial, secs:[]}); }
      return;
    }
    const [{data:qq},{data:ss}]=await Promise.all([
      sb.from('quotations').select('*').eq('id',id).single(),
      sb.from('quotation_sections').select('*, quotation_lines(*)').eq('quotation_id',id).order('position')]);
    const fromDb=(ss||[]).map(x=>({
      ...x, lines: normaliseSection((x.quotation_lines||[]).sort((a,b)=>a.position-b.position))}));
    setQ(qq); setSecs(fromDb);
    savedRef.current = JSON.stringify({q:qq, secs:fromDb});
    if(draft && draft.q && qq){
      // the draft is picked up only over a copy nobody has saved since; otherwise the
      // saved copy is what is shown and the draft is offered
      if(draft.q.updated_at === qq.updated_at) pickUp();
      else setOffered({q:draft.q, secs:draft.secs||[],
        text:'This quotation was saved on '+stamp(qq.updated_at)+', after the unsaved work left on this machine. '
            +typedAt+'The saved copy is what you see.'});
    }
    // Deliberately not depending on settings. A settings reload used to re-run all of this
    // and blank a quotation somebody was halfway through writing, which is the single most
    // expensive bug this system has had. The defaults are read once, at the start.
  })();},[id,isNew]);

  if(!q) return html`<div class="spinner"></div>`;

  // Everything about the money and the words on this quotation comes off its own office,
  // not off whichever office the person is looking at the app from.
  const qOffice = (offices||[]).find(o=>o.id===q.office_id) || office || null;
  const qCur    = q.currency || (qOffice && qOffice.currency) || 'AED';
  const qLangs  = (qOffice && qOffice.languages) || ['en'];
  const W       = sheetWords(q.language||'en');
  // The letterhead belongs to the office. Dubai's details were typed into Settings long
  // before there were two offices, so they are still the fallback and nothing there has
  // to be re-entered.
  const oc        = (k,s) => (qOffice && qOffice[k]) || cfg(s||k) || '';
  const coName    = oc('legal_name','company_legal_name');
  const coAddr    = oc('address','company_address');
  const coEmail   = oc('email','company_email');
  const coTax     = oc('tax_id','trn');
  const coTaxLabel= (qOffice && qOffice.tax_id_label) || W.tax;
  const coBank    = oc('bank_details','bank_details');
  const coTerms   = oc('terms','terms_conditions');
  const coLicence = (qOffice && qOffice.code!=='DXB') ? '' : cfg('trade_licence');

  const addSec=()=>setSecs(v=>[...v,{id:'new'+Date.now(),title:'',position:v.length+1,lines:[
    {id:'l'+Date.now(),description:'Supply and Install',unit:'sq.m',quantity:'',sell_rate:'',cost_rate:'',is_spec_note:false,is_provisional:false,position:1}]}]);
  const upSec=(i,k,v)=>setSecs(a=>a.map((s,n)=>n===i?{...s,[k]:v}:s));
  const delSec=i=>setSecs(a=>a.filter((_,n)=>n!==i));
  const addLine=(i,note)=>setSecs(a=>a.map((s,n)=>n!==i?s:{...s,lines:[...s.lines,
    {id:'l'+Date.now()+Math.random(),description:'',unit:note?'':'sq.m',quantity:'',sell_rate:'',cost_rate:'',
     is_spec_note:!!note,is_bold:false,is_provisional:false,
     /* A second priced line in a section is build-up, the same rule the section is read
        by when it loads. Otherwise adding a product to a finished section would quietly
        put its amount back into the price. */
     is_costing: !note && s.lines.some(x=>!x.is_spec_note && !x.is_costing),
     position:s.lines.length+1}]}));
  const upLine=(i,j,k,v)=>setSecs(a=>a.map((s,n)=>n!==i?s:{...s,lines:s.lines.map((l,m)=>m===j?{...l,[k]:v}:l)}));
  /* Choosing a wording we have used before brings its cost with it. A cost typed into a
     quotation six weeks ago is a decision somebody made with a supplier price in front of
     them, and making Charles remember it, or look it up, is how a quotation goes out at
     the wrong margin. Only fills a cost that is empty: anything typed by hand wins. */
  const pickWording=(i,j,v)=>{
    const w=(wordings||[]).find(x=>x.wording===v);
    setSecs(a=>a.map((s,n)=>n!==i?s:{...s,lines:s.lines.map((l,m)=>{
      if(m!==j) return l;
      const next={...l, description:v};
      if(w && (l.cost_rate==null || l.cost_rate==='') && w.last_cost!=null){
        next.cost_rate=w.last_cost;
        if(!l.unit && w.cost_unit) next.unit=w.cost_unit;
      }
      return next;
    })}));
  };
  const delLine=(i,j)=>setSecs(a=>a.map((s,n)=>n!==i?s:{...s,lines:s.lines.filter((_,m)=>m!==j)}));

  /* What the client is charged, and what it costs us, are two different sets of lines.
     A build-up line is priced for our eyes: its cost is real and counts, its amount is
     not part of what the client pays. */
  const withRates=secs.flatMap(s=>s.lines.filter(l=>!l.is_spec_note));
  const priced=withRates.filter(l=>!l.is_costing);
  const subtotal=priced.reduce((t,l)=>t+nz(l.quantity)*nz(l.sell_rate),0);

  const canPrice = (()=>{ const w=num(wantTxt);
    if(!isFinite(w) || w<=0 || subtotal<=0) return false;
    const net = q.vat_applies ? w/(1+nz(q.vat_rate)) : w;
    // a discount can only take money off, never put it on
    return !((q.price_mode||'spread')==='discount' && net>subtotal+0.005); })();

  /* The number Charles types is what the client pays, VAT and all, because that is the
     number the two of them argue about. The rates underneath it are pre VAT, so it has to
     be worked back through the VAT before anything is scaled. */
  const netOf = v => q.vat_applies ? v/(1+nz(q.vat_rate)) : v;
  const applyPrice=()=>{
    const want=num(wantTxt);
    if(!canPrice) return;
    const net=Math.round(netOf(want)*100)/100;
    if((q.price_mode||'spread')==='discount'){
      // the rates are left exactly where they are and the difference is shown
      setQ(p=>({...p, price_target:want, discount_amount: Math.round((subtotal-net)*100)/100}));
    } else {
      const next=sectionsAtPrice(secs, net, null);
      if(!next) return;
      setSecs(next);
      setQ(p=>({...p, price_target:want, discount_amount:null}));
    }
    setWantTxt('');
  };
  const clearPrice=()=>setQ(p=>({...p, price_target:null, discount_amount:null}));

  /* One section at a time, for when a client pushes back on a single trade rather than on
     the whole job. This always spreads: a discount line belongs at the bottom of a
     quotation, not in the middle of it. */
  const applySecPrice=(i)=>{
    const want=num(secWant[i]);
    if(!isFinite(want) || want<=0) return;
    const next=sectionsAtPrice(secs, want, i);
    if(!next){ setSecSaid(m=>({...m,[i]:'There is no priced line in this section to set.'}));
               return; }
    setSecs(next);
    setSecWant(m=>({...m,[i]:''}));
    /* Where it actually landed. A rate carries two decimals, so a section of one line
       over 525 m² can only land on multiples of 5.25 and 120,000 is not one of them: the
       nearest is 119,999.25. Saying so beats leaving Charles pressing Set again. */
    const got = Math.round(sellTotal(next[i].lines)*100)/100;
    setSecSaid(m=>({...m,[i]: Math.abs(got-want) < 0.005 ? ''
      : 'The nearest a rate with two decimals can get to '+AED(want,qCur)+' on this '
        + 'section is '+AED(got,qCur)+'. Split it into two priced lines if it has to be exact.'}));
  };

  // A blank cost is not a cost of zero. Counting it as one keeps the line's full revenue
  // in the subtotal while contributing nothing to the cost, which inflates the margin and,
  // far worse, tells the floor box you can discount money you have not got. A part priced
  // draft is the normal state of a quotation, so this fires constantly. Margin, break even
  // and the floor are therefore computed over the costed lines ONLY, and the panel says so
  // whenever some lines are left out.
  /* Whether a section is costed is a question about the SECTION, not about each line.
     A section priced on one Supply and Install line, with the products and their costs on
     build-up lines underneath, is fully costed even though the priced line itself carries
     no cost rate. Judging line by line called that section uncosted and quietly left its
     revenue out of every margin on the page. */
  const hasCost = s => (s.lines||[]).some(l =>
    !l.is_spec_note && l.cost_rate!=null && l.cost_rate!=='');
  const costTotal = withRates.filter(l=>l.cost_rate!=null && l.cost_rate!=='')
    .reduce((t,l)=>t+nz(l.quantity)*nz(l.cost_rate),0);
  const costedRevenue = secs.filter(hasCost).flatMap(s=>s.lines)
    .filter(l=>!l.is_spec_note && !l.is_costing)
    .reduce((t,l)=>t+nz(l.quantity)*nz(l.sell_rate),0);
  const uncosted = secs.filter(s=>!hasCost(s)).flatMap(s=>s.lines)
    .filter(l=>!l.is_spec_note && !l.is_costing && nz(l.quantity)*nz(l.sell_rate)>0);
  const uncostedRevenue = uncosted.reduce((t,l)=>t+nz(l.quantity)*nz(l.sell_rate),0);
  const gross    = costedRevenue - costTotal;
  const marginPct= costedRevenue ? gross/costedRevenue*100 : null;
  /* A discount is money off the subtotal, and VAT is charged on what is left, not on what
     it would have been. Getting that the wrong way round overcharges the client 5% of the
     discount, which is exactly the kind of error that gets a quotation sent back. */
  const discount = Math.min(nz(q.discount_amount), subtotal);
  const netSub   = subtotal - discount;
  const vat=q.vat_applies? netSub*nz(q.vat_rate) : 0;
  const total=netSub+vat;
  // What the client-facing sheet prints. Its line cells are rounded to whole dirhams, so
  // the subtotal has to be the sum of those rounded cells, not a separately rounded sum of
  // the exact values, or the printed column does not add up to the printed subtotal.
  const printSub   = priced.reduce((t,l)=>t+Math.round(nz(l.quantity)*nz(l.sell_rate)),0);
  const printDisc  = Math.min(Math.round(discount), printSub);
  const printNet   = printSub - printDisc;
  const printVat   = q.vat_applies ? Math.round(printNet*nz(q.vat_rate)) : 0;
  const printTotal = printNet + printVat;
  const anyCost=priced.some(l=>l.cost_rate!==''&&l.cost_rate!=null);
  const belowCost=priced.filter(l=>l.cost_rate!=null&&l.cost_rate!==''&&nz(l.sell_rate)<nz(l.cost_rate));
  // the sections whose priced line has no rate yet: the sheet would print them blank
  const unpriced=secs.filter(s=>s.lines.some(l=>!l.is_spec_note && !l.is_costing
                             && (l.sell_rate===''||l.sell_rate==null||nz(l.sell_rate)===0)));
  // When you are matching somebody else's price rather than setting your own, the
  // number you need is how far down you can go before the job stops being worth doing.
  const floorPrice = costTotal>0 ? costTotal/(1-floorPct/100) : 0;
  const room       = costedRevenue - floorPrice;
  const roomPct    = costedRevenue>0 ? room/costedRevenue*100 : 0;

  /* ── what a section costs us, worked out of its own specification ───────────────
     These quotations are written the way the trade writes them: one priced line per
     square metre, and under it the products in bold with their consumptions. So the
     cost of a square metre is already written on the page, in the spec notes, and
     typing it in again by hand is both work and a chance to be wrong.

     This reads those notes and prices them: product, consumption, cheapest pack, less
     the supply discount, in the quotation's own currency. Everything it cannot work out
