}

/* ── money in ── */
function Invoices({settings}){
  const [rows,setRows]=useState(null); const [tot,setTot]=useState({});
  const [clients,setClients]=useState([]); const [projects,setProjects]=useState([]);
  const [openId,setOpenId]=useState(null); const [newOpen,setNewOpen]=useState(false);
  const [err,setErr]=useState('');
  const load=useCallback(async()=>{
    setErr('');
    const [iv,tt,cl,pj]=await Promise.all([
      sb.from('invoices').select('*, clients(name), projects(name)')
        .order('invoice_date',{ascending:false}),
      sb.from('invoice_totals').select('*'),
      sb.from('clients').select('*').order('name'),
      sb.from('projects').select('id,name,client_id,value').order('name')]);
    const e=iv.error||tt.error||cl.error||pj.error; if(e) setErr(e.message);
    const m={}; (tt.data||[]).forEach(t=>{m[t.invoice_id]=t;});
    setRows(iv.data||[]); setTot(m); setClients(cl.data||[]); setProjects(pj.data||[]);
  },[]);
  useEffect(()=>{load();},[load]);
  if(!rows) return html`${err && html`<div class="err">${err}</div>`}<div class="spinner"></div>`;
  if(openId) return html`<${InvoicePage} id=${openId} clients=${clients} projects=${projects}
     settings=${settings} back=${()=>{setOpenId(null);load();}}/>`;

  const live=rows.filter(r=>!['draft','cancelled'].includes(r.status));
  const owed=live.reduce((s,r)=>s+officeToActive(tot[r.id]?.outstanding,r.office_id),0);
  const overdue=live.filter(r=>nz(tot[r.id]?.outstanding)>0.005 && r.due_date && r.due_date<today());
  const received=rows.reduce((s,r)=>s+officeToActive(tot[r.id]?.received,r.office_id),0);

  return html`
    <div style=${{display:'flex',marginBottom:'14px'}}>
      <button class="btn" style=${{marginLeft:'auto'}} onClick=${()=>setNewOpen(true)}>${_t("New invoice")}</button>
    </div>
    ${err && html`<div class="err">${err}</div>`}
    <div class="cards">
      <div class=${'card '+(owed>0?'':'okc')}><div class="k">Owed to us</div>
        <div class="v">${AED0(owed)}</div>
        <div class="s">${(x=>x+' '+plural(x,'invoice')+' open')(live.filter(r=>nz(tot[r.id]?.outstanding)>0.005).length)}${bothNote()}</div></div>
      <div class=${'card '+(overdue.length?'alert':'okc')}><div class="k">Past the due date</div>
        <div class="v">${overdue.length}</div>
        <div class="s">${AED0(overdue.reduce((s,r)=>s+officeToActive(tot[r.id]?.outstanding,r.office_id),0))} late</div></div>
      <div class="card"><div class="k">Received</div><div class="v">${AED0(received)}</div>
        <div class="s">Across ${rows.length} ${rows.length===1?'invoice':'invoices'}</div></div>
    </div>
    <div class="panel">
      ${rows.length ? html`<div class="tw"><table>
        <thead><tr><th>${_t("Invoice")}</th><th>${_t("Client")}</th><th>${_t("For")}</th><th>${_t("Date")}</th><th>${_t("Due")}</th>
          <th>${_t("Status")}</th><th class="n">${_t("Total")}</th><th class="n">${_t("Outstanding")}</th></tr></thead>
        <tbody>${rows.map(r=>{const t=tot[r.id]||{}; const c=officeCur(r.office_id);
          const late=nz(t.outstanding)>0.005 && r.due_date && r.due_date<today();
          return html`<tr key=${r.id} class="click" onClick=${()=>setOpenId(r.id)}>
            <td><b>${r.reference}</b></td>
            <td>${r.clients?.name||'—'}</td>
            <td class="muted">${r.projects?.name||'—'}</td>
            <td class="muted">${fmtDate(r.invoice_date)}</td>
            <td class=${late?'overdue':'muted'}>${r.due_date?fmtDate(r.due_date):'—'}</td>
            <td><span class=${'istat '+r.status}>${iLabel(r.status)}</span></td>
            <td class="n">${AED0(t.total,c)}</td>
            <td class="n" style=${{color:nz(t.outstanding)>0.005?'var(--crit)':''}}>${AED0(t.outstanding,c)}</td>
          </tr>`;})}</tbody></table></div>`
        : html`<div class="empty">No invoices yet. Raise one from a project payment milestone.</div>`}
    </div>
    ${newOpen && html`<${NewInvoiceModal} clients=${clients} projects=${projects} settings=${settings}
       close=${()=>setNewOpen(false)} saved=${id=>{setNewOpen(false);load();setOpenId(id);}}/>`}`;
}

function NewInvoiceModal({clients,projects,settings,close,saved}){
  const cfg=k=>(settings.find(s=>s.key===k)||{}).value||'';
  const [f,setF]=useState({client_id:'',project_id:'',milestone_id:'',
    invoice_date:today(),due_date:'',lpo_number:'',vat_applies:true});
  const [mils,setMils]=useState([]); const [err,setErr]=useState(''); const [busy,setBusy]=useState(false);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const terms=Number(cfg('quote_validity_days'))||30;
  useEffect(()=>{
    const d=new Date(f.invoice_date||today());
    d.setDate(d.getDate()+30);
    setF(p=>({...p,due_date:d.toISOString().slice(0,10)}));
  },[f.invoice_date]);

  const pickProject=async(pid)=>{
    const pj=projects.find(x=>x.id===pid);
    setF(p=>({...p,project_id:pid,milestone_id:'',client_id:pj?.client_id||p.client_id}));
    if(!pid){setMils([]);return;}
    const {data}=await sb.from('payment_milestones').select('*').eq('project_id',pid).order('position');
    setMils(data||[]);
  };
  const save=async()=>{
    if(!f.client_id) return setErr('Choose a client.');
    setBusy(true); setErr('');
    // The number, the VAT rate and the money all come off the office the invoice is
    // raised in: the office on screen, or in the company view the person's own. Dubai
    // and Bruges keep separate series, so the two never take the same number.
    const officeId = OFFICE_ID || MY_OFFICE_ID || null;
    const home = OFFICE_BY_ID[officeId] || null;
    const {data:ref,error:e0}=await sb.rpc('next_invoice_reference',{p_office:officeId});
    if(e0){setBusy(false);setErr(e0.message);return;}
    const pj=projects.find(x=>x.id===f.project_id);
    const {data,error}=await sb.from('invoices').insert({
      reference:ref, client_id:f.client_id, project_id:f.project_id||null,
      milestone_id:f.milestone_id||null, invoice_date:f.invoice_date,
      due_date:f.due_date||null, lpo_number:f.lpo_number||null,
      payment_terms:cfg('invoice_payment_terms')||null,
      vat_applies:f.vat_applies,
      vat_rate:home && home.vat_rate!=null ? Number(home.vat_rate) : settingNumber(cfg('vat_rate'), 0.05),
      status:'draft'}).select().single();
    if(error){setBusy(false);setErr(error.message);return;}
    const m=mils.find(x=>x.id===f.milestone_id);
    const line = m
      ? {invoice_id:data.id,position:1,description:(pj?pj.name+', ':'')+(m.name||'Payment'),
         unit:'',quantity:1,rate:nz(m.amount)}
      : {invoice_id:data.id,position:1,description:pj?pj.name:'',unit:'',quantity:1,rate:0};
    await sb.from('invoice_lines').insert(line);
    if(m) await sb.from('payment_milestones').update({invoice_ref:ref,
             invoiced_on:f.invoice_date}).eq('id',m.id);
    setBusy(false); saved(data.id);
  };
  // the rate the office charges, for the label on the choice
  const homeOffice = OFFICE_BY_ID[OFFICE_ID || MY_OFFICE_ID] || null;
  const vatPct = Math.round((homeOffice && homeOffice.vat_rate!=null ? Number(homeOffice.vat_rate)
                              : settingNumber(cfg('vat_rate'), 0.05))*100);
  return html`
    <div class="modal-bg" onClick=${e=>e.target===e.currentTarget&&close()}>
      <div class="modal"><div class="modal-head"><h2>${_t("New invoice")}</h2></div>
      <div class="modal-body">
        ${err && html`<div class="err">${err}</div>`}
        <div class="field"><label>${_t("Project, optional")}</label>
          <select value=${f.project_id} onChange=${e=>pickProject(e.target.value)}>
            <option value="">${_t("Not for a project")}</option>
            ${projects.map(p=>html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}
          </select></div>
        ${mils.length>0 && html`<div class="field"><label>${_t("Which payment milestone")}</label>
          <select value=${f.milestone_id} onChange=${e=>set('milestone_id',e.target.value)}>
            <option value="">${_t("None, I will type the lines myself")}</option>
            ${mils.map(m=>html`<option key=${m.id} value=${m.id}>
              ${(m.name||'Payment')+', '+AED0(m.amount)+(m.invoice_ref?' (already invoiced '+m.invoice_ref+')':'')}
            </option>`)}
          </select></div>`}
        <div class="field"><label>${_t("Client")}</label>
          <select value=${f.client_id} onChange=${e=>set('client_id',e.target.value)}>
            <option value="">${_t("Choose\u2026")}</option>
            ${clients.map(c=>html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}
          </select></div>
        <div class="grid2">
          <div class="field"><label>${_t("Invoice date")}</label>
            <input type="date" value=${f.invoice_date} onInput=${e=>set('invoice_date',e.target.value)}/></div>
          <div class="field"><label>${_t("Due date")}</label>
            <input type="date" value=${f.due_date} onInput=${e=>set('due_date',e.target.value)}/></div>
          <div class="field"><label>${_t("Client LPO number")}</label>
            <input type="text" value=${f.lpo_number} onInput=${e=>set('lpo_number',e.target.value)}/></div>
          <div class="field"><label>${_t("VAT")}</label>
            <select value=${f.vat_applies?'y':'n'} onChange=${e=>set('vat_applies',e.target.value==='y')}>
              <option value="y">${vatPct===5 ? _t("Add 5% VAT") : 'Add '+vatPct+'% VAT'}</option><option value="n">${_t("No VAT")}</option></select></div>
        </div>
        <p class="muted">Picking a milestone fills the first line in for you and stamps the invoice number back onto the project.</p>
      </div>
      <div class="modal-foot">
        <button class="btn sec" onClick=${close}>${_t("Cancel")}</button>
        <button class="btn" onClick=${save} disabled=${busy}>${busy?'Creating…':'Create invoice'}</button>
      </div></div></div>`;
}

function InvoicePage({id,clients,projects,settings,back}){
  const [iv,setIv]=useState(null); const [lines,setLines]=useState([]);
  const [pays,setPays]=useState([]); const [banks,setBanks]=useState([]);
  const [err,setErr]=useState(''); const [msg,setMsg]=useState(''); const [busy,setBusy]=useState(false);
  const cfg=k=>(settings.find(s=>s.key===k)||{}).value||'';
  const set=(k,v)=>setIv(x=>({...x,[k]:v}));

  const load=useCallback(async()=>{
    const [i,l,p,b]=await Promise.all([
      sb.from('invoices').select('*, clients(*), projects(name)').eq('id',id).single(),
      sb.from('invoice_lines').select('*').eq('invoice_id',id).order('position'),
      sb.from('invoice_payments').select('*').eq('invoice_id',id).order('paid_on'),
      sb.from('bank_accounts').select('*').order('name')]);
    if(i.error) setErr(i.error.message);
    setIv(i.data); setLines(l.data||[]); setPays(p.data||[]); setBanks(b.data||[]);
  },[id]);
  useEffect(()=>{load();},[load]);
  if(!iv) return html`<div class="spinner"></div>`;

  const subtotal=lines.reduce((s,l)=>s+nz(l.quantity)*nz(l.rate),0);
  const vat=iv.vat_applies?Math.round(subtotal*nz(iv.vat_rate)*100)/100:0;
  const total=subtotal+vat;
  const received=pays.reduce((s,p)=>s+nz(p.amount),0);
  const outstanding=total-received;
  const ivCur=officeCur(iv.office_id);   // the invoice's money, whichever office is on screen
  // The letterhead, tax number, bank details and terms of the office that raised it,
  // falling back to Settings where the office has nothing. A Belgian invoice used to go
  // out under Dubai's name, TRN and bank account.
  const ivOffice = OFFICE_BY_ID[iv.office_id] || null;
  const oc = (k,s) => (ivOffice && ivOffice[k]) || cfg(s||k) || '';
  const taxLabel = (ivOffice && ivOffice.tax_id_label) || 'TRN';
  const taxId = oc('tax_id','trn');
  const client=iv.clients||null;
  const late=outstanding>0.005 && iv.due_date && iv.due_date<today()
             && !['draft','cancelled'].includes(iv.status);

  const save=async()=>{
    setBusy(true); setErr(''); setMsg('');
    // a draft with money against it is not a draft any more, so payments decide the status
    let status=iv.status;
    if(status!=='cancelled' && (status!=='draft' || pays.length>0)){
      status = outstanding<=0.005 ? 'paid' : received>0.005 ? 'part_paid' : 'sent';
    }
    const {error}=await sb.from('invoices').update({
      client_id:iv.client_id||null, project_id:iv.project_id||null,
      invoice_date:iv.invoice_date, due_date:iv.due_date||null,
      payment_terms:iv.payment_terms||null, lpo_number:iv.lpo_number||null,
      status, vat_applies:!!iv.vat_applies, vat_rate:num(iv.vat_rate)??0.05,
      notes:iv.notes||null}).eq('id',id);
    if(error){setBusy(false);setErr(error.message);return;}
    for(const l of lines){
      await sb.from('invoice_lines').update({description:l.description,unit:l.unit||null,
        quantity:num(l.quantity), rate:num(l.rate)}).eq('id',l.id);
    }
    for(const p of pays){
      await sb.from('invoice_payments').update({paid_on:p.paid_on,amount:num(p.amount)||0,
        bank_account_id:p.bank_account_id||null, method:p.method||null,
        reference:p.reference||null}).eq('id',p.id);
    }
    setBusy(false); setMsg('Saved.'); load();
  };
  const addLine=async()=>{
    const row=addedRow(await sb.from('invoice_lines').insert({invoice_id:id,description:'',
      quantity:1,rate:0,position:lines.length+1}).select().single(),setErr,'The line');
    if(row) setLines(v=>[...v,row]);
  };
  const delLine=async(l)=>{ await sb.from('invoice_lines').delete().eq('id',l.id);
                            setLines(v=>v.filter(x=>x.id!==l.id)); };
  const upL=(i,k,v)=>setLines(a=>a.map((x,n)=>n===i?{...x,[k]:v}:x));
  const addPay=async()=>{
    const amt=Math.max(0,Math.round(outstanding*100)/100);
    const row=addedRow(await sb.from('invoice_payments').insert({invoice_id:id,
      paid_on:today(), amount:amt}).select().single(),setErr,'The payment');
    if(!row) return;
    setPays(v=>[...v,row]);
    // Settling the invoice settles the milestone behind it.
    if(iv?.milestone_id && amt>=outstanding-0.005)
      await sb.from('payment_milestones').update({paid_on:today()}).eq('id',iv.milestone_id);
  };
  const delPay=async(p)=>{ await sb.from('invoice_payments').delete().eq('id',p.id);
                           setPays(v=>v.filter(x=>x.id!==p.id)); };
  const upP=(i,k,v)=>setPays(a=>a.map((x,n)=>n===i?{...x,[k]:v}:x));
  const remove=async()=>{
    if(!confirm('Delete invoice '+iv.reference+'? The number is not reused.')) return;
    await sb.from('invoices').delete().eq('id',id); back();
  };

  return html`
    <div class="page-head">
      <button class="btn sec sm" onClick=${back}>${_t("\u2190 All invoices")}</button>
      <h1 style=${{width:'100%'}}>${iv.reference}</h1>
      <span class=${'istat '+iv.status}>${iLabel(iv.status)}</span>
      ${late && html`<span class="dgflag">Overdue</span>`}
      <button class="btn sec sp" onClick=${printOnePage}>${_t("Print / PDF")}</button>
      <button class="btn" onClick=${save} disabled=${busy}>${busy?_t('Saving…'):_t('Save')}</button>
    </div>
    ${err && html`<div class="err">${err}</div>`}
    ${msg && html`<div class="ok">${msg}</div>`}
    ${!taxId && html`<div class="err">${'This is a tax invoice but the '+taxLabel+' for '+(ivOffice?ivOffice.name:'the office')+' is still blank in Settings. Add it before you send this to a client.'}</div>`}

    <div class="cards">
      <div class="card"><div class="k">Invoice total</div><div class="v">${AED0(total,ivCur)}</div>
        <div class="s">${AED0(subtotal,ivCur)} plus ${iv.vat_applies?AED0(vat,ivCur)+' VAT':'no VAT'}</div></div>
      <div class="card"><div class="k">Received</div><div class="v">${AED0(received,ivCur)}</div>
        <div class="s">${pays.length} ${pays.length===1?'payment':'payments'}</div></div>
      <div class=${'card '+(outstanding>0.005?(late?'alert':''):'okc')}>
        <div class="k">Outstanding</div><div class="v">${AED0(outstanding,ivCur)}</div>
        <div class="s">${outstanding<=0.005?'Settled in full'
          :iv.due_date?(late?'Was due '+fmtDate(iv.due_date):'Due '+fmtDate(iv.due_date)):'No due date set'}</div></div>
    </div>

    <div class="panel"><div class="panel-head"><h2>${_t("Details")}</h2></div><div class="panel-body">
      <div class="grid2">
        <div class="field"><label>${_t("Client")}</label>
          <select value=${iv.client_id||''} onChange=${e=>set('client_id',e.target.value)}>
            <option value="">${_t("Choose\u2026")}</option>
            ${clients.map(c=>html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}</select></div>
        <div class="field"><label>${_t("Project")}</label>
          <select value=${iv.project_id||''} onChange=${e=>set('project_id',e.target.value)}>
            <option value="">${_t("None")}</option>
            ${projects.map(p=>html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select></div>
        <div class="field"><label>${_t("Invoice date")}</label>
          <input type="date" value=${iv.invoice_date||''} onInput=${e=>set('invoice_date',e.target.value)}/></div>
        <div class="field"><label>${_t("Due date")}</label>
          <input type="date" value=${iv.due_date||''} onInput=${e=>set('due_date',e.target.value)}/></div>
        <div class="field"><label>${_t("Client LPO number")}</label>
          <input type="text" value=${iv.lpo_number||''} onInput=${e=>set('lpo_number',e.target.value)}/></div>
        <div class="field"><label>${_t("Payment terms")}</label>
          <input type="text" value=${iv.payment_terms||''} onInput=${e=>set('payment_terms',e.target.value)}/></div>
        <div class="field"><label>${_t("Status")}</label>
          <select value=${iv.status} onChange=${e=>set('status',e.target.value)}>
            ${ISTATUS.map(([v,l])=>html`<option key=${v} value=${v}>${l}</option>`)}</select></div>
        <div class="field"><label>${_t("VAT")}</label>
          <select value=${iv.vat_applies?'y':'n'} onChange=${e=>set('vat_applies',e.target.value==='y')}>
            <option value="y">${Math.round(nz(iv.vat_rate)*100)===5 ? _t("Add 5% VAT")
              : 'Add '+Math.round(nz(iv.vat_rate)*100)+'% VAT'}</option><option value="n">${_t("No VAT")}</option></select></div>
      </div>
      <div class="field"><label>${_t("Notes, printed under the total")}</label>
        <textarea value=${iv.notes||''} onInput=${e=>set('notes',e.target.value)}></textarea></div>
      <p class="muted">${'Status moves itself to part paid and then paid as you record payments, unless you leave it as a draft.'}</p>

// Every check here reads real data. The panel disappears when there is nothing left.
function Readiness({settings,go}){
  const [d,setD]=useState(null);
  const [logo,setLogo]=useState(null);   // null = still checking
  const cfg=k=>((settings||[]).find(s=>s.key===k)||{}).value||'';

  useEffect(()=>{
    const img=new Image();
    img.onload=()=>setLogo(true); img.onerror=()=>setLogo(false);
    img.src='./logo.png?'+Date.now();
  },[]);

  useEffect(()=>{(async()=>{
    const [pf,bk,sd,ap,sh,bl,wa] = await Promise.all([
      sb.from('profiles').select('id'),
      sb.from('bank_accounts').select('id'),
      sb.from('stock').select('id').limit(1),
      sb.from('approval_watch').select('id,title,status,needs_attention'),
      sb.from('shipments').select('id,reference'),
      // the stock that cannot legally move, and why
      sb.from('stock_detail').select('*').eq('blocked',true),
      // the storage certificate we are waiting on, and who it sits with
      sb.from('approvals').select('title,status,handled_by,next_action,warehouse_id')
        .eq('kind','warehouse_storage')]);
    // draft quotations, with their sections and lines, for the ones nobody has priced
    const qd=await sb.from('quotations')
      .select('id,reference,quotation_sections(id,quotation_lines(sell_rate,is_spec_note,is_costing))')
      .eq('status','draft');
    let docs=[];
    if((sh.data||[]).length){
      const {data}=await sb.from('shipment_documents').select('shipment_id');
      docs=data||[];
    }
    setD({people:(pf.data||[]).length, banks:(bk.data||[]).length,
          hasStock:(sd.data||[]).length>0, drafts:(qd&&qd.data)||[],
          approvals:(ap.data||[]).filter(x=>x.needs_attention).length,
          blocked:bl.data||[], whCert:wa.data||[],
          shipmentsNoDocs:(sh.data||[]).filter(x=>!docs.some(y=>y.shipment_id===x.id))});
  })();},[]);

  if(!d || logo===null || !settings || !settings.length) return null;

  const items=[];
  const add=(hard,title,blocks,action,tab)=>items.push({hard,title,blocks,action,tab});

  // ── Civil Defence: where we actually are ──────────────────────────────────────
  // One line per warehouse holding frozen material, because "165 kg somewhere" is not a
  // thing anybody can act on. Every word of it is read off the data, so it stops saying
  // this the day it stops being true, not the day somebody remembers to edit it.
  const byWh={};
  (d.blocked||[]).forEach(x=>{
    const k=x.warehouse_id||x.warehouse_name;
    (byWh[k]=byWh[k]||{name:x.warehouse_name,id:x.warehouse_id,qty:0,prod:false,store:false,
                       products:[]}); 
    byWh[k].qty+=nz(x.qty_on_hand);
    if(x.needs_product_approval||x.product_approval_expired) byWh[k].prod=true;
    if(x.needs_warehouse_certificate||x.warehouse_certificate_expired) byWh[k].store=true;
    byWh[k].products.push(x.product_name);
  });
  Object.values(byWh).sort((a,b)=>b.qty-a.qty).forEach(w=>{
    const cert=(d.whCert||[]).find(a=>a.warehouse_id===w.id&&a.status!=='approved');
    const who=cert&&cert.handled_by;
    const both = w.prod&&w.store;
    add(true,
      round2(w.qty)+' kg at '+w.name+' cannot legally be moved or sold',
      (both
        ? 'Two permissions are missing and both are needed. The products have no Civil '
          +'Defence approval, and the warehouse has no certificate to store materials. '
        : w.prod ? 'The products have no Civil Defence approval. '
                 : 'The warehouse has no Civil Defence certificate to store materials. ')
      + (w.store && who
          ? 'Waiting on '+who+' for a warehouse that already holds the certificate.'
          : w.store ? 'Nobody is named as chasing the certificate.' : '')
      + ' Covers '+[...new Set(w.products)].join(', ')+'.',
      'Open Stock','stock');
    if(cert && cert.next_action)
      add(true,'What we are waiting for at '+w.name,
          cert.next_action,'Open Approvals','approvals');
  });

  // a draft the scope reader built has sections nobody has priced; the sheet would print
  // them with an empty rate and leave them out of the total
  (d.drafts||[]).forEach(q=>{
    const secsQ=q.quotation_sections||[];
    const bare=secsQ.filter(x=>(x.quotation_lines||[]).some(l=>!l.is_spec_note && !l.is_costing
                              && (l.sell_rate==null || nz(l.sell_rate)===0)));
    if(bare.length) add(false, (q.reference||'A draft quotation')+': '+bare.length+' of '+secsQ.length
        +' '+plural(secsQ.length,'section')+' still '+(bare.length===1?'needs':'need')+' a price',
        'The sheet prints those with an empty rate and leaves them out of the total.',
        'Open it and price them','quotations');
  });

  if(!cfg('trn').trim())
    add(true,'No TRN on the letterhead',
        'Tax invoices cannot legally go to a client without it.',
        'Add it in Settings','settings');
  if(!cfg('bank_details').trim())
    add(true,'No bank details',
        'Invoices print with no way for the client to pay you.',
        'Add them in Settings','settings');
  if(!cfg('terms_conditions').trim())
    add(false,'No terms and conditions',
        'Quotations and invoices go out with nothing protecting you.',
        'Add them in Settings','settings');
  if(logo===false)
    add(false,'No logo file',
        'Quotations and invoices print with the letterhead blank.',
        'Put logo.png in the public folder and redeploy',null);
  if(d.people<3)
    add(true,'Only '+d.people+' '+(d.people===1?'person':'people')+' can sign in',
        'The owners cannot see any of this. It was built for four of you.',
        'Invite them in Supabase, Authentication, Users',null);
  if(!d.banks)
    add(true,'No bank account set up',
        'The cash position on this dashboard cannot be worked out.',
        'Add one under Finance, Bank accounts','finance');
  if(!d.hasStock)
    add(false,'No stock recorded',
        'Stock reads zero even though there is material in a warehouse.',
        'Record what is held under Stock','stock');
  if(d.approvals)
    add(false,d.approvals+' '+(d.approvals===1?'approval needs':'approvals need')+' chasing',
        'Stock stays frozen and work stays blocked until these land.',
        'Open Approvals','approvals');
  d.shipmentsNoDocs.forEach(x=>
    add(false,'No paperwork on '+x.reference,
        'The bill of lading and invoices for it are not in the system.',
        'Open Shipments and drag the files in','shipments'));

  if(!items.length) return null;
  const hard=items.filter(i=>i.hard).length;

  return html`
    <div class="panel">
      <div class="panel-head"><h2>${_t("Before this can be used properly")}</h2>
        <span class=${'sp '+(hard?'overdue':'muted')}>
          ${hard?hard+' '+(hard===1?'thing is':'things are')+' blocking real work'
                :items.length+' loose ends'}</span></div>
      ${items.map((i,n)=>html`
        <div class="ready" key=${n}>
          <span class=${'dot'+(i.hard?'':' warn')}></span>
          <div><div class="t">${i.title}</div><div class="m">${i.blocks}</div></div>
          ${i.tab
            ? html`<button class="btn sec sm" onClick=${()=>go(i.tab)}>${i.action}</button>`
            : html`<span class="muted" style=${{fontSize:'12.5px'}}>${i.action}</span>`}
        </div>`)}
    </div>`;
}

const AKINDS=[['product_dcd','Civil Defence product approval'],
              ['warehouse_storage','Civil Defence storage certificate'],
              ['trade_licence','Trade licence'],
              ['vat','VAT registration and TRN'],
              ['customs','Customs client code'],
              ['tenancy','Tenancy and Ejari'],
              ['vendor_registration','Vendor registration with a client'],
              ['product_certification','Product certification, CE, BBA, ISO'],
              ['insurance','Insurance'],
              ['other','Other']];
const ASTATUS=[['not_started','Not started'],['preparing','Preparing'],['submitted','Submitted'],
               ['in_review','Under review'],['approved','Approved'],['rejected','Rejected'],
               ['expired','Expired']];
const aKind=v=>(AKINDS.find(x=>x[0]===v)||[v,v])[1];
const aStat=v=>(ASTATUS.find(x=>x[0]===v)||[v,v])[1];
const APPROVAL_DOC_TYPES=[['application','Application form'],['certificate','Certificate or approval'],

function Approvals({focus,clearFocus}){
  const [rows,setRows]=useState(null); const [openId,setOpenId]=useState(focus||null);
  const [newOpen,setNewOpen]=useState(false); const [err,setErr]=useState('');
  const [prods,setProds]=useState([]); const [whs,setWhs]=useState([]); const [clients,setClients]=useState([]);
  const [held,setHeld]=useState([]);
  useEffect(()=>{ if(focus){ setOpenId(focus); clearFocus&&clearFocus(); } },[focus]);

  const load=useCallback(async()=>{
    setErr('');
    const [aw,pd,wh,cl,sd]=await Promise.all([
      sb.from('approval_watch').select('*').order('status'),
      sb.from('products').select('id,name').order('name'),
      sb.from('warehouses').select('id,name').order('name'),
      sb.from('clients').select('id,name').order('name'),
      sb.from('stock_detail').select('*')]);
    const e=aw.error||pd.error||wh.error||cl.error||sd.error; if(e) setErr(e.message);
    setRows(aw.data||[]); setProds(pd.data||[]); setWhs(wh.data||[]);
    setClients(cl.data||[]); setHeld((sd.data||[]).filter(r=>r.blocked));
  },[]);
  useEffect(()=>{load();},[load]);
  if(!rows) return html`${err && html`<div class="err">${err}</div>`}<div class="spinner"></div>`;
  if(openId) return html`<${ApprovalPage} id=${openId} prods=${prods} whs=${whs} clients=${clients}
     back=${()=>{setOpenId(null);load();}}/>`;

  const open=rows.filter(r=>!['approved'].includes(r.status));
  const waiting=rows.filter(r=>['submitted','in_review'].includes(r.status));
  const expiring=rows.filter(r=>r.expiring_soon||r.has_expired);
  const rejected=rows.filter(r=>r.status==='rejected');
  const heldText=sumByUnit(held);
  const oldest=waiting.filter(r=>r.days_since_submitted!=null)
                      .sort((a,b)=>nz(b.days_since_submitted)-nz(a.days_since_submitted))[0];

  return html`
    <div class="page-head"><h1>${_t("Approvals and certificates")}</h1>
      <button class="btn sp" onClick=${()=>setNewOpen(true)}>${_t("New approval")}</button></div>
    ${err && html`<div class="err">${err}</div>`}

    <div class="cards">
      <div class=${'card '+(open.length?'alert':'okc')}><div class="k">Not yet granted</div>
        <div class="v">${open.length}</div>
        <div class="s">${rejected.length?rejected.length+' rejected and needing a rethink'
                        :open.length?'Of '+rows.length+' tracked':'Everything is in place'}</div></div>
      <div class="card"><div class="k">Sitting with an authority</div><div class="v">${waiting.length}</div>
        <div class="s">${oldest?'Longest is '+oldest.days_since_submitted+' days, '+(oldest.handled_by||'unassigned')
                        :'Nothing submitted'}</div></div>
      <div class=${'card '+(expiring.length?'alert':'okc')}><div class="k">Expiring or expired</div>
        <div class="v">${expiring.length}</div>
        <div class="s">${expiring.length?'Within the next 60 days':'Nothing due for renewal'}</div></div>
      <div class=${'card '+(held.length>0?'alert':'okc')}><div class="k">Stock this is holding up</div>
        <div class="v">${held.length>0?heldText:'0'}</div>
        <div class="s">${held.length>0?'Frozen until these come through':'Nothing frozen'}</div></div>
    </div>

    <div class="panel">
      ${rows.length ? html`<div class="tw"><table>
        <thead><tr><th>${_t("What")}</th><th>${_t("Type")}</th><th>${_t("Applies to")}</th><th>${_t("With")}</th>
          <th>${_t("Status")}</th><th>${_t("Reference")}</th><th>${_t("Expires")}</th></tr></thead>
        <tbody>${rows.map(r=>html`<tr key=${r.id} class="click" onClick=${()=>setOpenId(r.id)}>
          <td><b>${r.title}</b>
            ${r.next_action?html`<div class="muted" style=${{fontSize:'12px'}}>${r.next_action}</div>`:''}</td>
          <td class="muted">${aKind(r.kind)}</td>
          <td class="muted">${r.product_name||r.warehouse_name||r.client_name||'—'}</td>
          <td class="muted">${r.handled_by||'—'}</td>
          <td><span class=${'astat '+(r.has_expired?'expired':r.status)}>
            ${r.has_expired?'Expired':aStat(r.status)}</span>
            ${r.days_since_submitted!=null && ['submitted','in_review'].includes(r.status)
              ? html`<div class="muted" style=${{fontSize:'12px'}}>${r.days_since_submitted} days</div>`:''}</td>
          <td class="muted">${r.reference||'—'}</td>
          <td class=${r.has_expired||r.expiring_soon?'overdue':'muted'}>
            ${r.expires_on?fmtDate(r.expires_on)+(r.days_to_expiry!=null&&r.days_to_expiry>=0
              ?' ('+r.days_to_expiry+'d)':''):'—'}</td>
        </tr>`)}</tbody></table></div>`
        : html`<div class="empty">Nothing tracked yet. Add the licences, certificates and approvals you depend on.</div>`}
    </div>

    ${held.length>0 && html`
      <div class="panel">
        <div class="panel-head"><h2>${_t("What is frozen right now")}</h2>
          <span class="sp muted">${heldText}</span></div>
        <div class="tw"><table>
          <thead><tr><th>${_t("Product")}</th><th>${_t("Warehouse")}</th><th class="n">${_t("Quantity")}</th><th>${_t("Waiting on")}</th></tr></thead>
          <tbody>${held.map(r=>html`<tr key=${r.stock_id}>
            <td><b>${r.product_name}</b></td>
            <td class="muted">${r.warehouse_name}</td>
            <td class="n short">${nz(r.qty_on_hand).toLocaleString()} ${r.unit||''}</td>
            <td>${r.block_reason||'Blocked'}</td>
          </tr>`)}</tbody></table></div>
      </div>`}

    ${newOpen && html`<${NewApprovalModal} prods=${prods} whs=${whs} clients=${clients}
       close=${()=>setNewOpen(false)} saved=${id=>{setNewOpen(false);load();setOpenId(id);}}/>`}`;
}

function NewApprovalModal({prods,whs,clients,close,saved}){
  const [f,setF]=useState({title:'',kind:'product_dcd',status:'preparing',authority:'Dubai Civil Defence',
                           product_id:'',warehouse_id:'',client_id:'',handled_by:'',next_action:''});
  const [err,setErr]=useState(''); const [busy,setBusy]=useState(false);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const setKind=k=>{
    const auth={product_dcd:'Dubai Civil Defence',warehouse_storage:'Dubai Civil Defence',
      trade_licence:'Department of Economy and Tourism, Dubai',vat:'Federal Tax Authority',

/* ══════════════ CHARTS ══════════════ */
// Hand-rolled inline SVG. No chart library, so nothing is fetched from anywhere
// and the whole thing still works with the network off.
//
// Series colours are the validated data-viz palette, not the brand colours:
// the brand gold reads as grey when used as a data colour and the burgundy sits
// outside the lightness band. Burgundy and gold stay on the chrome instead.

function useWidth(){
  const ref=useRef(null); const [w,setW]=useState(0);
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    const set=()=>setW(Math.max(0,Math.round(el.getBoundingClientRect().width)));
    set();
    const ro=new ResizeObserver(set); ro.observe(el);
    return ()=>ro.disconnect();
  },[]);
  return [ref,w];
}

const short=n=>{
  const a=Math.abs(nz(n));
  if(a>=1e6) return (nz(n)/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'')+'M';
  if(a>=1e3) return Math.round(nz(n)/1e3)+'k';
  // keep a decimal on a small scale, or 0.25 and 0.5 both print as "0"
  return String(Number(nz(n).toFixed(a<10 && a%1 ? 2 : 0)));
};
// clean axis stops: 0, 1k, 2k … never 0, 1,337, 2,674
function niceTicks(max,count){
  if(!(max>0)) return [0];
  const raw=max/count, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||10*mag;
  const out=[]; let v=0;
  // keep stepping until the run covers the tallest value, so nothing overshoots
  for(let i=0;i<40;i++){ out.push(v); if(v>=max-1e-9) break; v+=step; }
  return out;
}
// a bar with its data-end rounded and its baseline square
const hbar=(x,y,w,h,r)=>{
  if(w<=0.5) return '';
  r=Math.min(r,w,h/2);
  return `M${x},${y} H${x+w-r} A${r},${r} 0 0 1 ${x+w},${y+r} V${y+h-r} A${r},${r} 0 0 1 ${x+w-r},${y+h} H${x} Z`;
};
const vbar=(x,y,w,h,r)=>{
  if(h<=0.5) return '';
  r=Math.min(r,w/2,h);
  return `M${x},${y+h} V${y+r} A${r},${r} 0 0 1 ${x+r},${y} H${x+w-r} A${r},${r} 0 0 1 ${x+w},${y+r} V${y+h} Z`;
};

function Tip({tip}){
  if(!tip) return null;
  return html`<div class="viz-tip" style=${{left:tip.x+'px',top:tip.y+'px'}}>
    <b>${tip.title}</b>${tip.rows.map((r,i)=>html`<div key=${i} class="tr">
      ${r.c?html`<i style=${{background:r.c}}></i>`:''}<span>${r.k}</span><em>${r.v}</em></div>`)}
  </div>`;
}

/* ── horizontal bars, one series, ordinal or sequential ── */
function BarsH({rows,fmt=AED0,ramp,empty,unit}){
  const [ref,w]=useWidth(); const [tip,setTip]=useState(null);
  if(!rows.length || !rows.some(r=>nz(r.value)!==0))
    return html`<div class="empty">${empty||'Nothing to show yet.'}</div>`;
  const LAB=Math.min(190,Math.max(110,Math.round((w||600)*0.26)));
  const PADR=64, BAR=18, ROW=34, TOP=8;
  const h=TOP+rows.length*ROW+26;
  const raw=Math.max(...rows.map(r=>nz(r.value)),1);
  const ticks=niceTicks(raw,4);
  // Scale to the top tick, not the raw maximum, so the axis and the bars share one scale.
  const max=Math.max(ticks[ticks.length-1]||raw, raw);
  const plot=Math.max(40,(w||600)-LAB-PADR);
  const colours=ramp||['var(--ord2)'];
  return html`
    <div class="viz" ref=${ref}>
      ${w>0 && html`<svg width=${w} height=${h} role="img"
          aria-label=${'Bar chart, '+rows.length+' rows'}>
        ${ticks.map((t,i)=>html`<g key=${'t'+i}>
          <line x1=${LAB+t/max*plot} x2=${LAB+t/max*plot} y1=${TOP-2} y2=${TOP+rows.length*ROW}
                stroke="var(--grid)" stroke-width="1"/>
          <text x=${LAB+t/max*plot} y=${h-8} text-anchor="middle"
                class="viz-ax">${short(t)}</text></g>`)}
        ${rows.map((r,i)=>{
          const bw=nz(r.value)/max*plot, y=TOP+i*ROW+(ROW-BAR)/2;
          const c=r.color||colours[Math.min(i,colours.length-1)];
          return html`<g key=${'r'+i}
              onMouseEnter=${e=>setTip({x:LAB+bw+10,y:y-6,title:r.label,
                rows:[{k:r.note||'Value',v:fmt(r.value)+(unit?' '+unit:''),c}]})}
              onMouseLeave=${()=>setTip(null)}>
            <rect x="0" y=${TOP+i*ROW} width=${w} height=${ROW} fill="transparent"/>
            <text x=${LAB-12} y=${y+BAR/2+4} text-anchor="end" class="viz-lab">${r.label}</text>
            <path d=${hbar(LAB,y,bw,BAR,4)} fill=${c}/>
            <text x=${LAB+bw+8} y=${y+BAR/2+4} class="viz-val">${fmt(r.value)}</text>
          </g>`;})}
      </svg>`}
      <${Tip} tip=${tip}/>
    </div>`;
}

/* ── grouped columns, two series over time ── */
function ColumnsGrouped({months,a,b,labelA,labelB,fmt=AED0,empty}){
  const [ref,w]=useWidth(); const [tip,setTip]=useState(null);
  if(!months.length || !(a.some(v=>nz(v)!==0)||b.some(v=>nz(v)!==0)))
    return html`<div class="empty">${empty||'Nothing to show yet.'}</div>`;
  const PADL=54, PADR=10, TOP=14, PLOT=190, XH=30;
  const h=TOP+PLOT+XH;
  const max=Math.max(...a,...b,1);
  const ticks=niceTicks(max,4); const top=ticks[ticks.length-1]||max;
  const plotw=Math.max(60,(w||600)-PADL-PADR);
  const band=plotw/months.length;
  const BW=Math.min(20,Math.max(6,(band-10)/2));
  const yOf=v=>TOP+PLOT-(nz(v)/top)*PLOT;
  return html`
    <div class="viz" ref=${ref}>
      ${w>0 && html`<svg width=${w} height=${h} role="img" aria-label="Money in against money out by month">
        ${ticks.map((t,i)=>html`<g key=${'t'+i}>
          <line x1=${PADL} x2=${w-PADR} y1=${yOf(t)} y2=${yOf(t)} stroke="var(--grid)" stroke-width="1"/>
          <text x=${PADL-8} y=${yOf(t)+4} text-anchor="end" class="viz-ax">${short(t)}</text></g>`)}
        ${months.map((m,i)=>{
          const cx=PADL+band*i+band/2;
          // 2px of surface between the pair, per the spacer rule
          const xa=cx-BW-1, xb=cx+1;
          return html`<g key=${'m'+i}
              onMouseEnter=${()=>setTip({x:Math.min(cx+8,(w||600)-150),y:TOP,title:m,
                rows:[{k:labelA,v:fmt(a[i]),c:'var(--s1)'},{k:labelB,v:fmt(b[i]),c:'var(--s2)'}]})}
              onMouseLeave=${()=>setTip(null)}>
            <rect x=${PADL+band*i} y=${TOP} width=${band} height=${PLOT} fill="transparent"/>
            <path d=${vbar(xa,yOf(a[i]),BW,TOP+PLOT-yOf(a[i]),4)} fill="var(--s1)"/>
            <path d=${vbar(xb,yOf(b[i]),BW,TOP+PLOT-yOf(b[i]),4)} fill="var(--s2)"/>
            <text x=${cx} y=${TOP+PLOT+18} text-anchor="middle" class="viz-ax">${m}</text>
          </g>`;})}
        <line x1=${PADL} x2=${w-PADR} y1=${TOP+PLOT} y2=${TOP+PLOT} stroke="var(--grid)" stroke-width="1"/>
      </svg>`}
      <${Tip} tip=${tip}/>
    </div>`;
}

/* ── diverging bars: profit right, loss left, off a zero line ── */
function BarsDiverging({rows,fmt=AED0,empty}){
  const [ref,w]=useWidth(); const [tip,setTip]=useState(null);
  if(!rows.length || !rows.some(r=>nz(r.value)!==0))
    return html`<div class="empty">${empty||'Nothing to show yet.'}</div>`;
  const LAB=Math.min(180,Math.max(100,Math.round((w||600)*0.24)));
  const BAR=18, ROW=34, TOP=8, PADR=70;
  const h=TOP+rows.length*ROW+8;
  const max=Math.max(...rows.map(r=>Math.abs(nz(r.value))),1);
  const plot=Math.max(60,(w||600)-LAB-PADR);
  const zero=LAB+plot/2, half=plot/2;
  return html`
    <div class="viz" ref=${ref}>
      ${w>0 && html`<svg width=${w} height=${h} role="img" aria-label="Margin by project, profit and loss">
        <line x1=${zero} x2=${zero} y1=${TOP-2} y2=${TOP+rows.length*ROW} stroke="var(--grid)" stroke-width="1"/>
        ${rows.map((r,i)=>{
          const v=nz(r.value), len=Math.abs(v)/max*half, y=TOP+i*ROW+(ROW-BAR)/2;
          const pos=v>=0, c=pos?'var(--pos)':'var(--neg)';
          const d=pos?hbar(zero,y,len,BAR,4)
                     :`M${zero},${y} H${zero-len+4} A4,4 0 0 0 ${zero-len},${y+4} V${y+BAR-4} A4,4 0 0 0 ${zero-len+4},${y+BAR} H${zero} Z`;
          return html`<g key=${'d'+i}
              onMouseEnter=${()=>setTip({x:Math.min(zero+len+10,(w||600)-160),y:y-6,title:r.label,
                rows:[{k:pos?'Gross profit':'Loss',v:fmt(Math.abs(v)),c},
                      ...(r.pct!=null?[{k:'Margin',v:r.pct.toFixed(1)+'%'}]:[])]})}
              onMouseLeave=${()=>setTip(null)}>
            <rect x="0" y=${TOP+i*ROW} width=${w} height=${ROW} fill="transparent"/>
            <text x=${LAB-12} y=${y+BAR/2+4} text-anchor="end" class="viz-lab">${r.label}</text>
            <path d=${d} fill=${c}/>
            <text x=${pos?zero+len+8:zero-len-8} y=${y+BAR/2+4}
                  text-anchor=${pos?'start':'end'} class="viz-val">${fmt(v)}</text>
          </g>`;})}
      </svg>`}
      <${Tip} tip=${tip}/>
    </div>`;
}

function Legend({items}){
  return html`<div class="viz-legend">
    ${items.map((it,i)=>html`<span key=${i}><i style=${{background:it.c}}></i>${it.k}</span>`)}
  </div>`;
}

/* ══════════════ MASTHEAD ══════════════ */
// A thin utility strip under the nav: who we are, the time in both offices,
// and whether anything needs attention. It sits outside <main> on purpose.
/* the two clocks that matter, Dubai and Bruges, now living in the bar */
function BarClocks(){
  const [now,setNow]=useState(()=>new Date());
  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return ()=>clearInterval(t);},[]);
  const clock=(tz,secs)=>{
    try{ return new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',
      ...(secs?{second:'2-digit'}:{}),hour12:false}).format(now); }catch(e){ return '--:--'; }
  };
  return html`<div class="barclocks">
    <span><i>DXB</i><b>${clock('Asia/Dubai',true)}</b></span>
    <span><i>BRU</i><b>${clock('Europe/Brussels',false)}</b></span>
  </div>`;
}

function Masthead({tab}){
  const [now,setNow]=useState(()=>new Date());
  const [alerts,setAlerts]=useState(null);
  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return ()=>clearInterval(t);},[]);
  useEffect(()=>{(async()=>{
    try{
      const [ap,sd]=await Promise.all([
        sb.from('approval_watch').select('id,needs_attention'),
        sb.from('stock_detail').select('stock_id,blocked')]);
      setAlerts((ap.data||[]).filter(x=>x.needs_attention).length
              + (sd.data||[]).filter(x=>x.blocked).length);
    }catch(e){ setAlerts(null); }
  })();},[tab]);

  const clock=(tz,secs)=>{
    try{
      return new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',
        ...(secs?{second:'2-digit'}:{}),hour12:false}).format(now);
    }catch(e){ return '--:--'; }
  };
  const day=(()=>{try{
    return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Dubai',weekday:'short',
      day:'2-digit',month:'short'}).format(now).toUpperCase();
  }catch(e){return '';}})();

  return html`
    <div class="masthead">
      <div class="mh-brand">BUILDTECH<span class="mh-slash">//</span>OPERATIONS</div>
      <div class="mh-date">${day}</div>
      <div class="mh-clocks">
        <span class="mh-clock"><i>DXB</i><b>${clock('Asia/Dubai',true)}</b></span>
        <span class="mh-clock"><i>BRU</i><b>${clock('Europe/Brussels',false)}</b></span>
      </div>
      <div class=${'mh-stat'+(alerts?' hot':alerts===0?' ok':'')}>
        <span class="mh-dot"></span>
        ${alerts==null?'SYNCING':alerts?alerts+' NEED ATTENTION':'ALL CLEAR'}
      </div>
    </div>`;
}

/* ══════════════ APP ══════════════ */
function App(){
  const [session,setSession]=useState(undefined);

  /* Read once, from what the early script grabbed off the URL before the Supabase client
     wiped it. Recovery links can also announce themselves through an event, so both are
     watched: whichever arrives first is enough. */
  const LINK = (typeof window!=='undefined' && window.__BT_LINK) || {type:'',err:''};
  /* The link's type is in the URL for one page load only. A refresh halfway through
     choosing a password wiped it, the gate vanished, and the person walked in with no
     password at all; the sign-in that failed a week later looked like the app had signed
     them out. So the fact is kept on the machine until a password has actually been
     saved, and cleared again on sign-out so the next person is not asked for one. */
  const [pwLink,setPwLink]=useState(()=>{
    const fromUrl = LINK.type==='recovery' || LINK.type==='invite' || LINK.type==='signup';
    try{
      if(fromUrl) localStorage.setItem('bt-needs-password','1');
      return fromUrl || localStorage.getItem('bt-needs-password')==='1';
    }catch(e){ return fromUrl; }
  });
  const [pwDone,setPwDone]=useState(false);
  const needPassword = pwLink && !pwDone;
  useEffect(()=>{
    const {data:sub}=sb.auth.onAuthStateChange((e)=>{
      if(e==='PASSWORD_RECOVERY'){ setPwLink(true); try{ localStorage.setItem('bt-needs-password','1'); }catch(x){} }
      if(e==='SIGNED_OUT'){ setPwLink(false); setPwDone(false); try{ localStorage.removeItem('bt-needs-password'); }catch(x){} }
    });
    return ()=>sub.subscription.unsubscribe();
  },[]);
  const [tab,setTab]=useState('dashboard');
  const [settings,setSettings]=useState([]);
  const [me,setMe]=useState(null);
  const [clientFocus,setClientFocus]=useState(null);
  // One focus id is enough: only one module is on screen at a time, and each clears it
  // the moment it has acted on it.
  const [focusId,setFocusId]=useState(null);
  const [pal,setPal]=useState(false);
  const [railOpen,setRailOpen]=useState(false);
  const [alerts,setAlerts]=useState({});
  const [offices,setOffices]=useState([]);
  const [officeCode,setOfficeCode]=useState(()=>{
    try{ return localStorage.getItem('bt-office')||''; }catch(e){ return ''; }});
  const isMac = typeof navigator!=='undefined' && /Mac|iP(hone|ad)/.test(navigator.platform||'');
  // bt-theme2: a fresh key, so a 'light' saved under the old three-way toggle
  // does not leave someone stuck on the plain theme after this release
  const [theme,setTheme]=useState(()=>{
    try{ const t=localStorage.getItem('bt-theme2')||'brand';
         return t==='holo' ? 'brand' : t;        // the old name, carried over
    }catch(e){ return 'brand'; }});

  // one keystroke reaches everything, from anywhere, without taking the focus off a field
  // somebody is halfway through typing in
  useEffect(()=>{
    const h=e=>{
      if((e.metaKey||e.ctrlKey) && (e.key==='k'||e.key==='K')){ e.preventDefault(); setPal(v=>!v); }
      else if(e.key==='Escape') setPal(false);
    };
    window.addEventListener('keydown',h);
    return ()=>window.removeEventListener('keydown',h);
  },[]);

  // the counts that sit on the rail. Only things that are actually stuck get a number.
  const loadAlerts=useCallback(async()=>{
    try{
      const [iv,ap,st,po,dw]=await Promise.all([
        sb.from('invoice_totals').select('*'),
        sb.from('approval_watch').select('*'),
        sb.from('stock_position').select('*'),
        sb.from('open_order_lines').select('*'),
        sb.from('document_watch').select('*')]);
      const t=today();
      setAlerts({
        finance:(iv.data||[]).filter(x=>!['draft','cancelled'].includes(x.status)
                  && Number(x.outstanding)>0.005 && x.due_date && x.due_date<t).length,
        approvals:(ap.data||[]).filter(x=>x.status!=='approved').length,
        stock:(st.data||[]).filter(x=>Number(x.blocked)>0).length,
        orders:new Set((po.data||[]).filter(x=>x.expected_on&&x.expected_on<t)
                  .map(x=>x.po_id)).size,
        catalogue:(dw.data||[]).filter(x=>x.state==='expired').length,
      });
    }catch(e){ /* a badge is never worth an error banner */ }
  },[]);
  useEffect(()=>{ if(session) loadAlerts(); },[session,tab,loadAlerts]);

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session));
    // Supabase fires this again every time the tab regains focus, because it re-checks the
    // token. Handing back a brand new session object each time made everything downstream
    // reload, which reset a half-written quotation to blank. Only react when the person
    // actually changed, which is a sign-in or a sign-out and nothing else.
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(prev=>{
      const same = (prev && prev.user && prev.user.id) === (s && s.user && s.user.id);
      return same ? prev : s;
    }));
    return ()=>sub.subscription.unsubscribe();
  },[]);

  const loadSettings=useCallback(async()=>{
    const {data}=await sb.from('settings').select('*').order('key');
    setSettings(data||[]);
  },[]);

  // Which office the screens are showing. Nobody picks a currency or a VAT rate anywhere
  // in this system: they pick the office, and everything else follows from it. The choice
  // sticks on the machine, so Chris opens the app in Bruges and sees Belgium.
  const loadOffices=useCallback(async()=>{
    const {data}=await sb.from('offices').select('*').order('position');
    setOffices(data||[]);
  },[]);
  useEffect(()=>{ if(session) loadOffices(); },[session,loadOffices]);

  const loadMe=useCallback(async()=>{
    if(!session) return;
    const {data}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
    setMe(data||{full_name:session.user.email,email:session.user.email});
  },[session]);

  useEffect(()=>{
    if(!session) return;
    loadSettings();
    loadMe();
  },[session,loadSettings,loadMe]);

  // the nav sticks directly under the topbar, whatever height the topbar happens to be
  useEffect(()=>{
    const bar=document.querySelector('.topbar');
    if(!bar) return;
    const set=()=>document.documentElement.style
      .setProperty('--topbar-h', Math.round(bar.getBoundingClientRect().height)+'px');
    set();
    const ro=new ResizeObserver(set); ro.observe(bar);
    window.addEventListener('resize',set);
    return ()=>{ro.disconnect(); window.removeEventListener('resize',set);};
  },[session]);

  useEffect(()=>{
    document.documentElement.setAttribute('data-theme',theme);
    document.querySelector('meta[name=theme-color]')
      ?.setAttribute('content', theme==='brand' ? '#091929'
                                : theme==='dark' ? '#06090C' : '#1A1A1A');
    try{ localStorage.setItem('bt-theme2',theme); localStorage.removeItem('bt-theme'); }catch(e){}
  },[theme]);

  if(session===undefined) return html`<div class="spinner"></div>`;
  if(!session) return html`<${Login} linkError=${!!(LINK && LINK.err)}/>`;

  /* An invite or a reset link signs somebody in without ever asking for a password, so
     without this they leave with no account and need another email to get back. This is
     the step that was missing, and it comes before the app because a password that can
     be put off is a password that never gets set. */
  if(needPassword) return html`<${SetPassword}
    email=${session.user && session.user.email}
    invite=${LINK.type === 'invite' || LINK.type === 'signup'}
    done=${()=>{ setPwDone(true);
                 try{ localStorage.removeItem('bt-needs-password'); history.replaceState(null,'',location.pathname); }catch(e){} }}/>`;

  const rate = settingNumber(settings.find(s=>s.key==='eur_aed_rate')?.value, 4.27);

  // The office somebody is working in. Their own office is the sensible opening position,
  // and the choice sticks after that. "Both" is a real answer, because the owners want the
  // company total, not two halves they have to add up in their heads.
  // No stored choice yet means we have never been told, so start on the office the person
  // belongs to. Worked out here rather than in an effect, because everything above this
  // line has already returned early and a hook cannot live below that.
  const office = (officeCode==='ALL' ? null
                  : offices.find(o=>o.code===officeCode)
                    || (me && offices.find(o=>o.id===me.office_id))
                    || offices[0] || null);
  const pickOffice = code => { setOfficeCode(code);
    try{ localStorage.setItem('bt-office',code); }catch(e){} };
  // every figure with no record of its own behind it is shown in the office's currency,
  // and the company view falls back to dirhams, which is where the books are kept
  ACTIVE_CUR = office ? office.currency : 'AED';
  // Set before anything below renders, so every query a screen makes on this pass is
  // already scoped. Null means the BOTH view, where nothing is filtered on purpose.
  OFFICE_ID = office ? office.id : null;
  MY_OFFICE_ID = (me && me.office_id) || (offices[0] && offices[0].id) || null;
  MY_ROLE = me ? me.role : null;
  // and every screen can say which office's money a record is in, and convert it
  OFFICE_BY_ID = Object.fromEntries(offices.map(o=>[o.id,o]));
  EUR_AED = rate;
  // and the interface is in the reader's own language, which is a different question from
  // which office's money is on the screen
  UI_LANG = (me && me.language) || 'en';

  const go = ([t,id])=>{ setTab(t); setFocusId(id||null);
    if(t==='clients') setClientFocus(id||null); };
  const clearFocus = ()=>setFocusId(null);
  // The rail groups the work rather than listing twelve equal tabs. Selling, then
  // delivering, then the books, then the reference shelves. That is the order the day
  // actually runs in.
  const RAIL=[
    [null,null,null],
    ['dashboard','◈',_t('Operations')],
    ['SEC',_t('Selling'),null],
    ['visits','◎',_t('Visits')],['pipeline','◇',_t('Pipeline')],['quotations','▤',_t('Quotations')],['clients','◉',_t('Clients')],
    ['SEC',_t('Delivering'),null],
    ['projects','◱',_t('Projects')],['orders','⬒',_t('Orders')],
    ['shipments','⬓',_t('Shipments')],['stock','▦',_t('Stock')],
    ['SEC',_t('The books'),null],
    ['finance','₳',_t('Finance')],['approvals','✓',_t('Approvals')],
    ['SEC',_t('Reference'),null],
    ['catalogue','⬚',_t('Catalogue')],['settings','⚙',_t('Settings')],
  ];
  const LABEL=Object.fromEntries(RAIL.filter(r=>r[0]&&r[0]!=='SEC').map(r=>[r[0],r[2]]));

  return html`
    <div class="deck">
      <div class="starfield" aria-hidden="true"></div>
      ${/* On a phone the open drawer sits on top of the ☰ that opened it, so pressing
            that again is not a way out. Without this, somebody who opens the menu and
            changes their mind has to pick a screen they did not want. Tapping anywhere
            beside the drawer closes it, which is what every phone menu does. */''}
      ${railOpen && html`<div class="rail-back" onClick=${()=>setRailOpen(false)}
        aria-label="Close the menu"></div>`}
      <nav class=${'rail nav'+(railOpen?' open':'')}>
        <div class="rail-top">
          <div class="rail-mark"><img src="./logo.png" alt=""/></div>
          <div class="rail-word">BUILDTECH</div>
        </div>
        ${RAIL.map(([k,i,l],n)=>{
          if(k===null) return null;
          if(k==='SEC') return html`<div class="rail-sec" key=${'s'+n}>${i}</div>`;
          return html`<button key=${k} class=${tab===k?'on':''} title=${l} aria-label=${l}
            onClick=${()=>{setTab(k); setRailOpen(false); if(k!=='clients') setClientFocus(null);}}>
            <span class="ri" aria-hidden="true">${i}</span><span class="rl">${l}</span>
            ${alerts[k]>0 && html`<span class=${'rn'+(railOpen?'':' dot')}
              aria-hidden="true">${alerts[k]}</span>`}
          </button>`;})}
        <div class="rail-foot">
          <button aria-label="Appearance" title=${theme==='brand' ? 'Switch to the quiet dark theme'
                : theme==='dark' ? 'Switch to the plain light theme, best for printing'
                : 'Back to the brochure theme'}
            onClick=${()=>setTheme(t=>t==='brand'?'dark':t==='dark'?'light':'brand')}>
            <span class="ri" aria-hidden="true">${theme==='brand'?'◈':theme==='dark'?'☾':'☀'}</span>
            <span class="rl">${_t('Appearance')}</span></button>
          <button aria-label="Sign out" title="Sign out" onClick=${()=>sb.auth.signOut()}>
            <span class="ri" aria-hidden="true">⏻</span><span class="rl">${_t('Sign out')}</span></button>
        </div>
      </nav>

      <div class="deck-main">
        <div class="cmdbar">
          <button class="icon-btn railtoggle" title="Menu"
            onClick=${()=>setRailOpen(v=>!v)}>☰</button>
          <span class="where">BUILDTECH <b>//</b> ${LABEL[tab]||''}</span>
          ${offices.length>1 && html`<div class="offsw" title="Which office you are working in">
            ${offices.map(o=>html`<button key=${o.id}
              class=${'offbtn'+(office&&office.code===o.code?' on':'')}
              onClick=${()=>pickOffice(o.code)}>${officeTag(o.code)}</button>`)}
            <button class=${'offbtn'+(officeCode==='ALL'?' on':'')}
              onClick=${()=>pickOffice('ALL')} title="Both offices together">${_t("BOTH")}</button>
          </div>`}
          ${officeCode==='ALL' && offices.length>1 && html`<span class="offnote"
            title="In the company view a new record is filed under your own office">${
            'New records go to '+((OFFICE_BY_ID[MY_OFFICE_ID]||{}).name||'your office')}</span>`}
          <button class="cmdkey" onClick=${()=>setPal(true)}>
            <span>⌕</span>
            ${/* The long invitation is right on a laptop and absurd on a phone, where it
                 wraps onto three lines and swallows the whole bar. One of these two is
                 hidden by the stylesheet at any given width. */''}
            <span class="ck-long">${_t('Search anything, or type what you want to do')}</span>
            <span class="ck-short">${_t('Search')}</span>
            <kbd>${isMac?'⌘':'Ctrl'} K</kbd>
          </button>
          <${BarClocks}/>
        </div>
      <main key=${officeCode}>
        <div class="scanline" key=${tab}></div>
        ${tab==='dashboard' && html`<${Operations} go=${go} settings=${settings}/>`}
        ${tab==='pipeline'  && html`<${Pipeline}/>`}
        ${tab==='visits'    && html`<${Visits} go=${go}
                                     focus=${focusId} clearFocus=${clearFocus}/>`}
        ${tab==='quotations'&& html`<${Quotations} rate=${rate} settings=${settings} go=${go}
                                     offices=${offices} office=${office}
                                     focus=${focusId} clearFocus=${clearFocus} me=${me}/>`}
        ${tab==='projects'  && html`<${Projects} focus=${focusId} clearFocus=${clearFocus}/>`}
        ${tab==='orders'    && html`<${Orders} rate=${rate}
                                     focus=${focusId} clearFocus=${clearFocus}/>`}
        ${tab==='shipments' && html`<${Shipments} rate=${rate}/>`}
        ${tab==='stock'     && html`<${Stock}/>`}
        ${tab==='approvals' && html`<${Approvals} focus=${focusId} clearFocus=${clearFocus}/>`}
        ${tab==='finance'   && html`<${Finance} rate=${rate} settings=${settings}/>`}
        ${tab==='clients'   && html`<${Clients} go=${go} focus=${clientFocus}
                                     clearFocus=${()=>setClientFocus(null)}/>`}
        ${tab==='catalogue' && html`<${Catalogue} rate=${rate}
                                     focus=${focusId} clearFocus=${clearFocus}/>`}
        ${tab==='settings'  && html`<${Settings} settings=${settings} reload=${loadSettings}
                                     me=${me} offices=${offices} reloadMe=${loadMe}/>`}
      </main>
      </div>
      <${Palette} open=${pal} close=${()=>setPal(false)} go=${go}/>
    </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
