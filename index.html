        <tr class="grand"><td class="k">${'Total ('+poMoney+')'}</td><td class="v">${fmtN(value)}</td></tr>
      </tbody></table>
      <div class="iv-foot">
        ${o.approved_at && html`<div>Approved by ${who(o.approved_by)}, ${when(o.approved_at)}</div>`}
        <div class="pa-sign"><span>For ${(poOffice.legal_name||poOffice.name||'').toUpperCase()}</span></div>
      </div>
    </div>

    <div class="panel"><div class="panel-body">
      <div class="grid2">
        <div class="field"><label>${_t("Supplier")}</label>
          <input type="text" value=${o.supplier||''} onInput=${e=>set('supplier',e.target.value)}/></div>
        <div class="field"><label>${_t("Their reference")}</label>
          <input type="text" value=${o.supplier_ref||''} onInput=${e=>set('supplier_ref',e.target.value)}/></div>
        <div class="field"><label>${_t("Status")}</label>
          <select value=${o.status} onChange=${e=>set('status',e.target.value)}>
            ${POSTATUS.map(([v,l])=>html`<option key=${v} value=${v}
              disabled=${v==='approved' && MY_ROLE!=='owner' && o.status!=='approved'}>${l}</option>`)}</select></div>
        <div class="field"><label>${_t("Ordered on")}</label>
          <input type="date" value=${o.ordered_on||''} onInput=${e=>set('ordered_on',e.target.value)}/></div>
        <div class="field"><label>${_t("Expected")}</label>
          <input type="date" value=${o.expected_on||''} onInput=${e=>set('expected_on',e.target.value)}/></div>
        <div class="field"><label>${_t("Delivering into")}</label>
          <select value=${o.warehouse_id||''} onChange=${e=>set('warehouse_id',e.target.value)}>
            <option value="">${_t("Decide later")}</option>
            ${whs.map(w=>html`<option key=${w.id} value=${w.id}>${w.name}</option>`)}</select></div>
        <div class="field"><label>${_t("Against which quotation")}</label>
          <select value=${o.quotation_id||''} onChange=${e=>set('quotation_id',e.target.value)}>
            <option value="">${_t("None")}</option>
            ${quotes.map(q=>html`<option key=${q.id} value=${q.id}>${q.reference}</option>`)}</select></div>
        <div class="field"><label>${_t("Against which project")}</label>
          <select value=${o.project_id||''} onChange=${e=>set('project_id',e.target.value)}>
            <option value="">${_t("None")}</option>
            ${projects.map(p=>html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select></div>
      </div>
      <div class="field"><label>${_t("Notes")}</label>
        <textarea value=${o.notes||''} onInput=${e=>set('notes',e.target.value)}></textarea></div>
    </div></div>

    <div class="panel">
      <div class="panel-head"><h2>${_t("What is on order")}</h2>
        <span class="sp muted">${lines.length} ${plural(lines.length,'line')}</span></div>
      ${/* Krypton's own columns, in Krypton's own order, so an order printed from here can
            be laid beside their proforma and read straight down. Description, commodity
            code, quantity, list price, discount, weight, and what that comes to. */''}
      <div class="polhead">
        <span>Description</span><span>Code</span><span>${_t('Packs')}</span>
        <span>${_t('Ordered')}</span><span>${_t('Unit')}</span><span>${_t('Recd')}</span>
        <span>${_t('List/pack')}</span><span>${_t('Disc %')}</span>
        <span>${_t('Weight kg')}</span>
        <span class="r">${_t('Amount')}</span><span></span>
      </div>
      ${lines.map((l,i)=>{
        const left=nz(l.qty_ordered)-nz(l.qty_received);
        const amount = nz(l.qty_ordered)*nz(l.unit_price);
        const perKg  = nz(l.weight_kg) > 0 ? amount/nz(l.weight_kg) : null;
        return html`<div class="polrow" key=${l.id}>
          ${/* The description stays the product's catalogue name so every lookup in the
                system still finds it. Which pack it is goes underneath, where Krypton
                writes it into the description on their own paper. */''}
          <div>
            <input type="text" value=${l.description||''} list="prodlist"
                   onInput=${e=>upL(i,'description',e.target.value)}/>
            ${l.pack_label && html`<div class="packlbl">${l.pack_label}</div>`}
          </div>
          <input type="text" class="code" value=${l.hs_code||''} placeholder="HS"
                 onInput=${e=>upL(i,'hs_code',e.target.value)}/>
          ${/* what Krypton acts on. The kilos beside it are what the warehouse holds. */''}
          <input type="number" step="1" value=${l.packs??''} placeholder="0"
                 title=${l.pack_label ? l.pack_label
                   : 'How many pails or rolls. The quantity beside it is what that weighs.'}
                 onInput=${e=>upL(i,'packs',e.target.value)}/>
          <input type="number" step="0.001" value=${l.qty_ordered??''}
                 onInput=${e=>upL(i,'qty_ordered',e.target.value)}/>
          <input type="text" value=${l.unit||''} onInput=${e=>upL(i,'unit',e.target.value)}/>
          <div class=${'recv '+(left<=0.001?'done':'')}>${nz(l.qty_received).toLocaleString()}</div>
          ${/* the list price, before the discount, which is the figure on their paper */''}
          <input type="number" step="0.0001" value=${l.list_price??''}
                 title=${'Krypton\u2019s list price for one ' + (l.pack_label||'pack')
                        + ' before the discount. What we pay is '
                        + fmtMoney(nz(l.unit_price), poCur) + ' the ' + (l.unit||'unit') + '.'}
                 onInput=${e=>setListPrice(i,e.target.value)}/>
          <input type="number" step="0.01" value=${l.discount_pct??''} placeholder="0"
                 onInput=${e=>setDiscount(i,e.target.value)}/>
          <input type="number" step="0.001" value=${l.weight_kg??''} placeholder="0"
                 title=${perKg==null?'':fmtMoney(perKg,poCur)+' the kilo'}
                 onInput=${e=>upL(i,'weight_kg',e.target.value)}/>
          <div class="polval">${fmtMoney(amount, poCur)}</div>
          <div style=${{display:'flex',gap:'4px'}}>
            ${left>0.001 && l.product_id && html`<button class="xbtn" title="Record what arrived"
              onClick=${()=>setRec(l)}>↓</button>`}
            <button class="xbtn" onClick=${()=>delLine(l)}>×</button>
          </div>
        </div>`;})}
      ${!lines.length && !pf && html`<div class="empty">Nothing on this order yet.</div>`}
      ${pfBusy && html`<div class="empty">${pfBusy}</div>`}
      ${pf && html`<div class="pfbox">
        <div class="pfhead">
          <b>${pf.lines.length+' '+plural(pf.lines.length,'line')+' read off '+pf.file}</b>
          ${pf.ref && html`<span class="muted">${pf.ref}</span>`}
        </div>
        <div class="tw"><table><thead><tr>
          <th>${_t('Description')}</th><th>${_t('Code')}</th><th class="n">${_t('Packs')}</th>
          <th class="n">${_t('List')}</th><th class="n">${_t('Disc %')}</th>
          <th class="n">${_t('Weight kg')}</th><th class="n">${_t('Amount')}</th><th></th>
        </tr></thead><tbody>
        ${pf.lines.map((l,i)=>html`<tr key=${i}>
          <td>${l.description}</td>
          <td class="muted" style=${{fontFamily:'ui-monospace,Menlo,monospace',fontSize:'12px'}}>${l.hs_code}</td>
          <td class="n">${l.packs}</td>
          <td class="n">${nz(l.list_price).toLocaleString('en',{minimumFractionDigits:2})}</td>
          <td class="n">${l.discount_pct?l.discount_pct+'%':'—'}</td>
          <td class="n">${l.weight_kg==null?'—':nz(l.weight_kg).toLocaleString('en',{minimumFractionDigits:2})}</td>
          <td class="n">${nz(l.amount).toLocaleString('en',{minimumFractionDigits:2})}</td>
          ${/* their own arithmetic, checked. A line that does not multiply out is a line
                that was misread, and it is better to say so than to order from it. */''}
          <td class="n">${l.checks ? html`<span class="ok-tick">✓</span>`
            : html`<span class="pfbad" title=${'Their figures do not multiply out: '
                + l.packs+' × '+l.list_price+' less '+l.discount_pct+'% is not '+l.amount
                + '. Check this line against the paper before you use it.'}>?</span>`}</td>
        </tr>`)}
        </tbody></table></div>
        ${pf.unread.length>0 && html`<p class="muted" style=${{margin:'8px 0 0'}}>
          ${pf.unread.length+' '+plural(pf.unread.length,'row')+' on that document '
            +(pf.unread.length===1?'was':'were')+' not read. Anything missing here has to '
            +'go on by hand.'}</p>`}
        <div style=${{display:'flex',gap:'8px',marginTop:'10px',alignItems:'center'}}>
          <button class="btn" onClick=${takeProforma} disabled=${!!pfBusy}>${
            _t('Put these on the order')}</button>
          <button class="btn sec" onClick=${()=>setPf(null)}>${_t('Cancel')}</button>
          <span class="muted">${'Total '+(o.currency||'EUR')+' '
            + pf.lines.reduce((t,l)=>t+nz(l.amount),0)
                .toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})
            + ' · ' + pf.lines.reduce((t,l)=>t+nz(l.weight_kg),0)
                .toLocaleString('en',{maximumFractionDigits:2}) + ' kg'}</span>
        </div>
      </div>`}
      <div style=${{padding:'9px 12px',borderTop:'1px solid var(--rule)',display:'flex',
                    gap:'8px',alignItems:'center'}}>
        <button class="btn sec sm" onClick=${addLine}>${_t("Add a line")}</button>
        ${/* Krypton's proforma already has every figure this order needs, and typing them
              again is where a digit gets dropped on a document that goes to customs. */''}
        <label class="btn sec sm" style=${{cursor:'pointer'}}>
          ${_t('Read a proforma')}
          <input type="file" accept=".pdf,.txt,.csv,.docx,.xlsx" style=${{display:'none'}}
            onChange=${e=>{ const f=e.target.files&&e.target.files[0];
                            e.target.value=''; if(f) readProforma(f); }}/>
        </label>
        ${lineErr && html`<span class="lineerr">${lineErr}</span>`}
        <span class="sp" style=${{display:'flex',alignItems:'center',gap:'10px'}}>
          <b style=${{fontVariantNumeric:'tabular-nums'}}>${
            _t('Total')+' '+poCur+' '+fmtMoney(value, poCur)}</b>
          <span class="muted">${nz(lines.reduce((t,l)=>t+nz(l.weight_kg),0))
            .toLocaleString('en',{maximumFractionDigits:2})+' kg'}</span>
          ${/* one switch for the whole order, at the rate the order was placed at */''}
          <select class="curpick" value=${poCur}
            title=${'Converted at '+poRate+' to the euro, the rate recorded on this order'}
            onChange=${e=>setViewCur(e.target.value)}>
            <option value="EUR">EUR</option>
            <option value="AED">AED</option>
          </select>
        </span>
      </div>
      <p class="muted" style=${{padding:'0 14px 14px'}}>
        Unit prices are what Krypton charges us, their list less the supply discount, not the
        catalogue price. An order is a commitment, not a cost: it stays out of Money out and
        out of the partner ledger until the supplier's invoice is entered there.</p>
    </div>

    <${DocumentsPanel} table="po_documents" bucket="po-docs" fk="po_id" id=${id}
      types=${PO_DOC_TYPES} heading="Paperwork on this order"/>

    <${CorrespondencePanel} poId=${id} heading="What was said about this order"/>

    ${rec && html`<${ReceiveModal} line=${rec} order=${o} whs=${whs}
      close=${()=>setRec(null)} saved=${()=>{setRec(null);load();}}/>`}`;
}

/* Receiving is one call in the database: it moves the line on, writes the stock movement
   that actually puts the material in a warehouse, and moves the order's status. Doing
   those three separately is how stock and orders drift apart. */
function ReceiveModal({line,order,whs,close,saved}){
  const left=nz(line.qty_ordered)-nz(line.qty_received);
  const [f,setF]=useState({qty:String(left),warehouse_id:order.warehouse_id||whs[0]?.id||'',
                           moved_on:today(),note:''});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const [busy,setBusy]=useState(false); const [err,setErr]=useState('');

  const go=async()=>{
    setErr('');
    if(!(Number(f.qty)>0)) return setErr('Enter how much arrived.');
    if(Number(f.qty)>left+0.001) return setErr('Only '+left.toLocaleString()+' '+(line.unit||'')+' are still outstanding.');
    if(!f.warehouse_id) return setErr('Say which warehouse it went into.');
    setBusy(true);
    const {error}=await sb.rpc('receive_po_line',{
      p_line_id:line.id, p_qty:Number(f.qty), p_warehouse_id:f.warehouse_id,
      p_moved_on:f.moved_on, p_note:f.note||null});
    setBusy(false);
    if(error) return setErr(error.message);
    saved();
  };

  return html`<div class="modal-back" onClick=${close}>
    <div class="modal" onClick=${e=>e.stopPropagation()}>
      <div class="modal-head"><h2>${_t("Record what arrived")}</h2></div>
      <div class="modal-body">
        ${err && html`<div class="err">${err}</div>`}
        <p class="muted">${line.description} · ${left.toLocaleString()} ${line.unit||''} still
          outstanding on ${order.reference}.</p>
        <div class="grid2">
          <div class="field"><label>${_t("How much arrived")}</label>
            <input type="number" step="0.001" value=${f.qty} onInput=${e=>set('qty',e.target.value)}/></div>
          <div class="field"><label>${_t("Into which warehouse")}</label>
            <select value=${f.warehouse_id} onChange=${e=>set('warehouse_id',e.target.value)}>
              <option value="">${_t("Choose\u2026")}</option>
              ${whs.map(w=>html`<option key=${w.id} value=${w.id}>${w.name}</option>`)}</select></div>
          <div class="field"><label>${_t("On what date")}</label>
            <input type="date" value=${f.moved_on} onInput=${e=>set('moved_on',e.target.value)}/></div>
          <div class="field"><label>${_t("Note, optional")}</label>
            <input type="text" placeholder="${_t("Delivery note number")}" value=${f.note}
                   onInput=${e=>set('note',e.target.value)}/></div>
        </div>
        <p class="muted">This writes a stock movement as well, so the material appears in
          Stock against that warehouse. Civil Defence rules still apply to it once it is there.</p>
      </div>

        <button class="btn sec" onClick=${close}>${_t("Cancel")}</button>
        <button class="btn" onClick=${go} disabled=${busy}>${busy?'Recording…':'Record it'}</button>

}

const SSTATUS=[['planning','Planning'],['quoted','Getting quotes'],['booked','Booked'],
               ['in_transit','In transit'],['customs','At customs'],['delivered','Delivered'],
               ['cancelled','Cancelled']];
const sLabel=v=>(SSTATUS.find(x=>x[0]===v)||[v,v])[1];
const SMODE=[['','Not decided'],['sea','Sea freight'],['air','Air freight'],
             ['road','Road'],['courier','Courier']];
const SHIP_DOC_TYPES=[
  ['bill_of_lading','Bill of lading / air waybill'],
  ['commercial_invoice','Commercial invoice'],
  ['packing_list','Packing list'],
  ['certificate_origin','Certificate of origin'],
  ['dg_declaration','Dangerous goods declaration'],
  ['insurance','Insurance certificate'],
  ['customs','Customs / duty paperwork'],

function Shipments({rate}){
  const [rows,setRows]=useState(null); const [tot,setTot]=useState({});
  const [clients,setClients]=useState([]); const [quotes,setQuotes]=useState([]);
  const [projects,setProjects]=useState([]);
  const [openId,setOpenId]=useState(null); const [newOpen,setNewOpen]=useState(false);
  const [err,setErr]=useState('');

  const load=useCallback(async()=>{
    setErr('');
    const [sh,tt,cl,qu,pj]=await Promise.all([
      sb.from('shipments').select('*, clients(name), quotations(reference), projects(name)')
        .order('created_at',{ascending:false}),
      sb.from('shipment_totals').select('*'),
      sb.from('clients').select('id,name').order('name'),
      sb.from('quotations').select('id,reference,project_name,client_id,location')
        .order('reference',{ascending:false}),
      sb.from('projects').select('id,name').order('name')]);
    const e=sh.error||tt.error||cl.error||qu.error||pj.error; if(e) setErr(e.message);
    const m={}; (tt.data||[]).forEach(t=>{m[t.shipment_id]=t;});
    setRows(sh.data||[]); setTot(m); setClients(cl.data||[]);
    setQuotes(qu.data||[]); setProjects(pj.data||[]);
  },[]);
  useEffect(()=>{load();},[load]);
  if(!rows) return html`<div class="spinner"></div>`;
  if(openId) return html`<${ShipmentPage} id=${openId} clients=${clients} quotes=${quotes}
      projects=${projects} rate=${rate} back=${()=>{setOpenId(null);load();}}/>`;

  const moving=rows.filter(r=>['booked','in_transit','customs'].includes(r.status));
  const openCost=rows.filter(r=>r.status!=='cancelled'&&r.status!=='delivered')
    .reduce((s,r)=>s+nz(tot[r.id]?.landed_cost),0);
  const dg=rows.filter(r=>tot[r.id]?.has_dangerous_goods);
  const arriving=rows.filter(r=>r.eta && r.eta.slice(0,7)===today().slice(0,7)
                             && !['delivered','cancelled'].includes(r.status));

  return html`
    <div class="page-head"><h1>${_t("Shipments")}</h1>
      <button class="btn sp" onClick=${()=>setNewOpen(true)}>${_t("New shipment")}</button></div>
    ${err && html`<div class="err">${err}</div>`}

    <div class="cards">
      <div class="card"><div class="k">On the water or in the air</div><div class="v">${moving.length}</div>
        <div class="s">Booked, in transit or at customs</div></div>
      <div class="card"><div class="k">Arriving this month</div><div class="v">${arriving.length}</div>
        <div class="s">By expected arrival date</div></div>
      <div class="card"><div class="k">Money committed</div><div class="v">${AED0(openCost,'AED')}</div>
        <div class="s">Goods plus freight, duty and clearance</div></div>
      <div class=${'card '+(dg.length?'alert':'')}><div class="k">Carrying dangerous goods</div>
        <div class="v">${dg.length}</div>
        <div class="s">${dg.length?'These need a DG declaration':'None declared'}</div></div>
    </div>

    <div class="panel">
      ${rows.length ? html`<div class="tw"><table>
        <thead><tr><th>${_t("Reference")}</th><th>${_t("For")}</th><th>${_t("Route")}</th><th>${_t("Mode")}</th><th>${_t("Status")}</th>
          <th>${_t("ETD")}</th><th>${_t("ETA")}</th><th class="n">${_t("Landed cost")}</th><th class="n">${_t("Docs")}</th></tr></thead>
        <tbody>${rows.map(r=>{const t=tot[r.id]||{};
          return html`<tr key=${r.id} class="click" onClick=${()=>setOpenId(r.id)}>
            <td><b>${r.reference}</b>
              ${t.has_dangerous_goods?html`<span class="docbadge" style=${{background:'var(--crit-bg)',color:'var(--crit)'}}>DG</span>`:''}</td>
            <td>${r.quotations?.reference||r.projects?.name||r.clients?.name||'—'}</td>
            <td class="muted">${[r.origin,r.destination].filter(Boolean).join(' → ')||'—'}</td>
            <td class="muted">${(SMODE.find(m=>m[0]===r.mode)||[null,r.mode||'—'])[1]}</td>
            <td><span class=${'sstat '+r.status}>${sLabel(r.status)}</span></td>
            <td class="muted">${fmtDate(r.etd)||'—'}</td>
            <td class="muted">${fmtDate(r.eta)||'—'}</td>
            <td class="n">${AED0(t.landed_cost,'AED')}</td>
            <td class="n muted">${t.document_count||0}</td>
          </tr>`;})}</tbody></table></div>`
        : html`<div class="empty">No shipments yet. Create one from the quotation it is supplying.</div>`}
    </div>

    ${newOpen && html`<${NewShipmentModal} clients=${clients} quotes=${quotes} projects=${projects}
       rate=${rate} existing=${rows.map(r=>r.reference)}
       close=${()=>setNewOpen(false)} saved=${id=>{setNewOpen(false);load();setOpenId(id);}}/>`}`;
}

function NewShipmentModal({clients,quotes,projects,rate,existing,close,saved}){
  const year=String(new Date().getFullYear());
  const nextRef=()=>{
    let n=0;
    existing.forEach(r=>{const m=/^SHP-(\d{4})-(\d+)$/.exec(r||'');
      if(m && m[1]===year) n=Math.max(n,Number(m[2]));});
    return 'SHP-'+year+'-'+String(n+1).padStart(2,'0');
  };
  const [f,setF]=useState({reference:nextRef(),quotation_id:'',project_id:'',client_id:'',
    supplier:'',origin:'',destination:'Dubai, UAE',mode:'sea',status:'planning',copyLines:true});
  const [err,setErr]=useState(''); const [busy,setBusy]=useState(false);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const pickQuote=qid=>{
    set('quotation_id',qid);
    const q=quotes.find(x=>x.id===qid); if(!q) return;
    setF(p=>({...p,quotation_id:qid,client_id:q.client_id||p.client_id,
      destination:p.destination||q.location||''}));
  };
  const save=async()=>{
    if(!f.reference.trim()) return setErr('Give the shipment a reference.');
    setBusy(true); setErr('');
    const {data,error}=await sb.from('shipments').insert({
      reference:f.reference.trim(), quotation_id:f.quotation_id||null,
      project_id:f.project_id||null, client_id:f.client_id||null,
      supplier:f.supplier||null, origin:f.origin||null, destination:f.destination||null,
      mode:f.mode||null, status:f.status, eur_aed_rate:rate}).select().single();
    if(error){setBusy(false);setErr(error.message);return;}
    if(f.quotation_id && f.copyLines){
      const {data:secs}=await sb.from('quotation_sections')
        .select('id, quotation_lines(description,unit,quantity,is_spec_note,product_id)')
        .eq('quotation_id',f.quotation_id);
      const ids=[]; const raw=[];
      (secs||[]).forEach(sc=>(sc.quotation_lines||[]).forEach(l=>{
        if(l.is_spec_note||!l.quantity) return;
        raw.push(l); if(l.product_id) ids.push(l.product_id);
      }));
      let pmap={};
      if(ids.length){
        const {data:prods}=await sb.from('products')
          .select('id,hs_code,un_number,packing_group').in('id',ids);
        (prods||[]).forEach(p=>{pmap[p.id]=p;});
      }
      const lines=raw.map((l,i)=>{const p=pmap[l.product_id]||{};
        return {shipment_id:data.id, product_id:l.product_id||null,
          description:l.description||'Line', unit:l.unit||'kg', quantity:l.quantity,
          hs_code:p.hs_code||null, un_number:p.un_number||null,
          packing_group:p.packing_group||null, position:i+1};});
      if(lines.length) await sb.from('shipment_lines').insert(lines);
    }
    setBusy(false); saved(data.id);
  };
  return html`
    <div class="modal-bg" onClick=${e=>e.target===e.currentTarget&&close()}>
      <div class="modal"><div class="modal-head"><h2>${_t("New shipment")}</h2></div>
      <div class="modal-body">
        ${err && html`<div class="err">${err}</div>`}
        <div class="field"><label>${_t("Reference")}</label>
          <input type="text" value=${f.reference} onInput=${e=>set('reference',e.target.value)}/></div>
        <div class="field"><label>${_t("Supplying which quotation")}</label>
          <select value=${f.quotation_id} onChange=${e=>pickQuote(e.target.value)}>
            <option value="">${_t("Not tied to one")}</option>
            ${quotes.map(q=>html`<option key=${q.id} value=${q.id}>
              ${q.reference}${q.project_name?' · '+q.project_name:''}</option>`)}
          </select></div>
        <div class="field"><label>${_t("Project, optional")}</label>
          <select value=${f.project_id} onChange=${e=>set('project_id',e.target.value)}>
            <option value="">${_t("None")}</option>
            ${projects.map(x=>html`<option key=${x.id} value=${x.id}>${x.name}</option>`)}
          </select></div>
        <div class="field"><label>${_t("Client")}</label>
          <select value=${f.client_id} onChange=${e=>set('client_id',e.target.value)}>
            <option value="">${_t("None")}</option>
            ${clients.map(c=>html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}
          </select></div>
        <div class="grid2">
          <div class="field"><label>${_t("Supplier")}</label>
            <input type="text" placeholder="${_t("Rayston, Bruges\u2026")}" value=${f.supplier}
                   onInput=${e=>set('supplier',e.target.value)}/></div>
          <div class="field"><label>${_t("Mode")}</label>
            <select value=${f.mode} onChange=${e=>set('mode',e.target.value)}>
              ${SMODE.map(([v,l])=>html`<option key=${v} value=${v}>${l}</option>`)}</select></div>
          <div class="field"><label>${_t("Collecting from")}</label>
            <input type="text" placeholder="${_t("Valencia, Spain")}" value=${f.origin}
                   onInput=${e=>set('origin',e.target.value)}/></div>
          <div class="field"><label>${_t("Delivering to")}</label>
            <input type="text" value=${f.destination} onInput=${e=>set('destination',e.target.value)}/></div>
        </div>
        <label class="check"><input type="checkbox" checked=${f.copyLines}
          onChange=${e=>set('copyLines',e.target.checked)}/>
          <span>Copy the quotation's priced lines in as the packing list</span></label>
      </div>
      <div class="modal-foot">
        <button class="btn sec" onClick=${close}>${_t("Cancel")}</button>
        <button class="btn" onClick=${save} disabled=${busy}>${busy?'Creating…':'Create shipment'}</button>
      </div></div></div>`;
}

function ShipmentPage({id,clients,quotes,projects,rate,back}){
  const [s,setS]=useState(null); const [lines,setLines]=useState([]);
  const [prods,setProds]=useState([]); const [pdocs,setPdocs]=useState([]);
  const [err,setErr]=useState(''); const [msg,setMsg]=useState(''); const [busy,setBusy]=useState(false);
  const set=(k,v)=>setS(x=>({...x,[k]:v}));

  const load=useCallback(async()=>{
    const [sh,ln,pd]=await Promise.all([
      sb.from('shipments').select('*, clients(name), quotations(reference), projects(name)').eq('id',id).single(),
      sb.from('shipment_lines').select('*').eq('shipment_id',id).order('position'),
      sb.from('products').select('id,name,hs_code,un_number,packing_group,is_dangerous').order('name')]);
    if(sh.error) setErr(sh.error.message);
    setS(sh.data); setLines(ln.data||[]); setProds(pd.data||[]);
    const ids=[...new Set((ln.data||[]).map(l=>l.product_id).filter(Boolean))];
    if(ids.length){
      const {data}=await sb.from('product_documents')
        .select('*, products(name)').in('product_id',ids)
        .in('doc_type',['sds','tds','cert','dcd']).order('doc_type');
      setPdocs(data||[]);
    } else setPdocs([]);
  },[id]);
  useEffect(()=>{load();},[load]);
  if(!s) return html`<div class="spinner"></div>`;

  const r=nz(s.eur_aed_rate)||rate;
  const goodsAed=lines.reduce((a,l)=>a+nz(l.value_eur),0)*r || nz(s.goods_value_eur)*r;
  const shipCost=nz(s.freight_cost)+nz(s.insurance_cost)+nz(s.duty_cost)
                +nz(s.clearance_cost)+nz(s.other_cost);
  const landed=goodsAed+shipCost;
  const netKg=lines.reduce((a,l)=>a+nz(l.net_weight_kg),0)||nz(s.net_weight_kg);
  const grossKg=lines.reduce((a,l)=>a+nz(l.gross_weight_kg),0)||nz(s.gross_weight_kg);
  const pkgs=lines.reduce((a,l)=>a+nz(l.packages),0)||nz(s.packages);
  const dgLines=lines.filter(l=>(l.un_number||'').trim());
  const dgConsignment=(s.un_numbers||'').trim();
  const isDG=dgLines.length>0||!!dgConsignment;

  const save=async()=>{
    setBusy(true); setErr(''); setMsg('');
    const {error}=await sb.from('shipments').update({
      reference:s.reference, quotation_id:s.quotation_id||null, project_id:s.project_id||null,
      client_id:s.client_id||null, supplier:s.supplier||null, origin:s.origin||null,
      destination:s.destination||null, mode:s.mode||null, incoterm:s.incoterm||null,
      forwarder:s.forwarder||null, transport_doc:s.transport_doc||null,
      container_no:s.container_no||null, etd:s.etd||null, eta:s.eta||null, status:s.status,
      un_numbers:(s.un_numbers||'').trim()||null,
      goods_value_eur:num(s.goods_value_eur)||0, freight_cost:num(s.freight_cost)||0,
      insurance_cost:num(s.insurance_cost)||0, duty_cost:num(s.duty_cost)||0,
      clearance_cost:num(s.clearance_cost)||0, other_cost:num(s.other_cost)||0,
      eur_aed_rate:num(s.eur_aed_rate)||rate, gross_weight_kg:num(s.gross_weight_kg),
      net_weight_kg:num(s.net_weight_kg), volume_cbm:num(s.volume_cbm),
      packages:s.packages===''||s.packages==null?null:Math.round(Number(s.packages))||null,
      notes:s.notes||null}).eq('id',id);
    if(error){setBusy(false);setErr(error.message);return;}
    for(const l of lines){
      await sb.from('shipment_lines').update({
        description:l.description, product_id:l.product_id||null, hs_code:l.hs_code||null,
        un_number:l.un_number||null, packing_group:l.packing_group||null,
        packages:l.packages===''||l.packages==null?null:Math.round(Number(l.packages))||null,
        quantity:num(l.quantity), unit:l.unit||'kg',
        net_weight_kg:num(l.net_weight_kg), gross_weight_kg:num(l.gross_weight_kg),
        value_eur:num(l.value_eur)}).eq('id',l.id);
    }
    setBusy(false); setMsg('Saved.'); load();
  };
  const addLine=async()=>{
    const row=addedRow(await sb.from('shipment_lines').insert({shipment_id:id,description:'',
      unit:'kg',position:lines.length+1}).select().single(),setErr,'The cargo line');
    if(row) setLines(v=>[...v,row]);
  };
  const delLine=async(l)=>{ await sb.from('shipment_lines').delete().eq('id',l.id);
                            setLines(v=>v.filter(x=>x.id!==l.id)); };
  const upL=(i,k,v)=>setLines(a=>a.map((x,n)=>n===i?{...x,[k]:v}:x));
  const pickProduct=(i,name)=>{
    const p=prods.find(x=>x.name===name.trim());
    setLines(a=>a.map((x,n)=>n!==i?x:({...x,description:name,
      product_id:p?p.id:null,
      hs_code:p&&p.hs_code?p.hs_code:x.hs_code,
      un_number:p&&p.un_number?p.un_number:x.un_number,
      packing_group:p&&p.packing_group?p.packing_group:x.packing_group})));
  };
  const openPdoc=async(d)=>{
    if(d.external_url){window.open(d.external_url,'_blank','noopener');return;}
    const {data,error}=await sb.storage.from('product-docs').createSignedUrl(d.storage_path,120);
    if(error){setErr('Could not open the file: '+error.message);return;}
    window.open(data.signedUrl,'_blank','noopener');
  };

  return html`
    <div class="page-head">
      <button class="btn sec sm" onClick=${back}>${_t("\u2190 All shipments")}</button>
      <h1 style=${{width:'100%'}}>${s.reference}</h1>
      <span class=${'sstat '+s.status}>${sLabel(s.status)}</span>
      ${isDG?html`<span class="dgflag">Dangerous goods</span>`:''}
      <button class="btn sp" onClick=${save} disabled=${busy}>${busy?_t('Saving…'):_t('Save')}</button>
    </div>
    ${err && html`<div class="err">${err}</div>`}
    ${msg && html`<div class="ok">${msg}</div>`}

    <div class="cards">
      <div class="card"><div class="k">Goods value</div><div class="v">${AED0(goodsAed,'AED')}</div>
        <div class="s">${s.quotations?.reference?'For '+s.quotations.reference:(s.clients?.name||'no quotation linked')}</div></div>
      <div class="card"><div class="k">Cost to get it here</div><div class="v">${AED0(shipCost,'AED')}</div>
        <div class="s">Freight, insurance, duty and clearance</div></div>
      <div class="card"><div class="k">Landed cost</div><div class="v">${AED0(landed,'AED')}</div>
        <div class="s">${goodsAed?((shipCost/goodsAed)*100).toFixed(1)+'% on top of goods':'Enter the goods value'}</div></div>
      <div class="card"><div class="k">Weight and packages</div>
        <div class="v">${grossKg?Math.round(grossKg).toLocaleString()+' kg':'—'}</div>
        <div class="s">${pkgs?pkgs+' '+plural(pkgs,'package'):'no package count'}${netKg?' · '+Math.round(netKg).toLocaleString()+' kg net':''}</div></div>
    </div>

    <div class="panel"><div class="panel-head"><h2>${_t("Details")}</h2></div><div class="panel-body">
      <div class="grid2">
        <div class="field"><label>${_t("Reference")}</label>
          <input type="text" value=${s.reference||''} onInput=${e=>set('reference',e.target.value)}/></div>
        <div class="field"><label>${_t("Status")}</label>
          <select value=${s.status} onChange=${e=>set('status',e.target.value)}>
            ${SSTATUS.map(([v,l])=>html`<option key=${v} value=${v}>${l}</option>`)}</select></div>
        <div class="field"><label>${_t("Supplying quotation")}</label>
          <select value=${s.quotation_id||''} onChange=${e=>set('quotation_id',e.target.value)}>
            <option value="">${_t("Not tied to one")}</option>

              ${q.reference}${q.project_name?' · '+q.project_name:''}</option>`)}</select></div>
        <div class="field"><label>${_t("Project")}</label>

// bumped on every deploy, so it is obvious whether a new upload actually landed
const BUILD_VERSION = '2026.09.10-e';
/* Who changed what, and a way to get everything out.
   Four people with identical access and no record of who moved a price is fine at four
   people and stops being fine at six. And everything lives in one free-tier project, so a
   copy you hold yourself is cheap insurance. */
function ActivityAndBackup(){
  const [log,setLog]=useState(null); const [err,setErr]=useState('');
  const [busy,setBusy]=useState(''); const [done,setDone]=useState('');

  useEffect(()=>{(async()=>{
    const {data,error}=await sb.from('activity_log').select('*')
      .order('happened_at',{ascending:false}).limit(40);
    if(error) setErr(error.message);
    setLog(data||[]);
  })();},[]);

  const TABLES=['clients','inquiries','quotations','quotation_sections','quotation_lines',
                'projects','project_materials','payment_milestones','purchase_orders',
                'purchase_order_lines','shipments','shipment_lines','stock','stock_movements',
                'warehouses','products','product_packs','product_documents','product_transport',
                'approvals','expenses','payroll','partners','bank_accounts','invoices',
                'invoice_lines','invoice_payments','commitments','commitment_lines',
                'correspondence','settings'];

  const backup=async()=>{
    setBusy('Collecting…'); setDone(''); setErr('');
    const out={taken_at:new Date().toISOString(), build:BUILD_VERSION, tables:{}};
    for(const t of TABLES){
      const {data,error}=await sb.from(t).select('*');
      if(error){ out.tables[t]={error:error.message}; continue; }
      out.tables[t]=data||[];
      setBusy('Collecting '+t+'…');
    }
    const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='buildtech-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    const rows=Object.values(out.tables).reduce((s,v)=>s+(Array.isArray(v)?v.length:0),0);
    setBusy(''); setDone('Downloaded. '+rows.toLocaleString()+' rows across '
      +TABLES.length+' tables. Keep it somewhere that is not this system.');
  };

  return html`
    <div class="panel">
      <div class="panel-head"><h2>${_t("Who changed what")}</h2>
        <span class="sp muted">The last 40 changes, newest first</span></div>
      ${err && html`<div class="err" style=${{margin:'10px 14px'}}>${err}</div>`}
      ${log===null ? html`<div class="spinner"></div>`
        : log.length ? html`<div class="tw"><table>
            <thead><tr><th>${_t("When")}</th><th>${_t("Who")}</th><th>${_t("What")}</th><th>${_t("Change")}</th></tr></thead>
            <tbody>${log.map(r=>html`<tr key=${r.id}>
              <td class="muted">${(r.happened_at||'').slice(0,16).replace('T',' ')}</td>
              <td>${r.actor_email||html`<span class="muted">not signed in</span>`}</td>
              <td class="muted">${(r.table_name||'').replace(/_/g,' ')}</td>
              <td>${r.summary||r.action}</td>
            </tr>`)}</tbody></table></div>`
        : html`<div class="empty">Nothing recorded yet. Every edit to a quotation, a price,
            a project, an order, a cost or a payment lands here from now on.</div>`}
    </div>

    <div class="panel">
      <div class="panel-head"><h2>${_t("Take a copy")}</h2></div>
      <div class="panel-body">
        ${busy && html`<div class="ok">${busy}</div>`}
        ${done && html`<div class="ok">${done}</div>`}
        <p class="muted" style=${{marginTop:0}}>Everything sits in one free Supabase project.
          This downloads the lot as a single file you can keep yourself. Do it before
          anything large changes, and once a month otherwise.</p>
        <button class="btn sec" onClick=${backup} disabled=${!!busy}>
          ${busy?'Working…':'Download everything'}</button>
      </div>
    </div>`;
}

/* Who can get in. Four people, so this is a list and not a user-management system. The
   only decision on it is owner or not, and the only person who can make that decision is
   an owner. Somebody is added by inviting their email in Supabase Authentication, which is
   deliberately not a button here: creating logins is not something to do by accident, and
   the person doing it should be looking at the place the passwords live. */
function AccessList({me}){
  const [rows,setRows]=useState(null); const [err,setErr]=useState(''); const [msg,setMsg]=useState('');
  const owner=me?.role==='owner';
  const load=useCallback(async()=>{
    const {data,error}=await sb.from('profiles').select('*').order('role').order('full_name');
    if(error) setErr(error.message); else setRows(data||[]);
  },[]);
  useEffect(()=>{load();},[load]);

  const setRole=async(p,role)=>{
    setErr(''); setMsg('');
    const {error}=await sb.from('profiles').update({role}).eq('id',p.id);
    if(error) return setErr(error.message);
    setMsg((p.full_name||p.email)+(role==='owner'
      ? ' can now change the system values.'
      : ' can use everything except the system values.'));
    load();
  };

  return html`
    <div class="panel">
      <div class="panel-head"><h2>${_t("Who can get in")}</h2>
        <span class="sp muted">${rows?rows.length+' '+plural(rows.length,'person','people'):''}</span></div>
      <div class="panel-body">
        ${err && html`<div class="err">${err}</div>`}
        ${msg && html`<div class="ok">${msg}</div>`}
        ${rows===null ? html`<div class="spinner"></div>`
         : !rows.length ? html`<p class="muted">${
            'Nobody yet, which cannot be right since you are reading this. Run 0046 in Supabase.'}</p>`
         : html`<div class="tw"><table>
            <thead><tr><th>${_t("Name")}</th><th>${_t("Email")}</th><th>${_t("Can do")}</th>${
              owner?html`<th></th>`:''}</tr></thead>
            <tbody>${rows.map(p=>html`<tr key=${p.id}>
              <td><b>${p.full_name||'—'}</b>${p.id===me?.id
                ? html`<span class="muted">${' (you)'}</span>`:''}</td>
              <td class="muted">${p.email}</td>
              <td>${p.role==='owner'
                ? 'Everything, including the system values'
                : 'Everything except the system values'}</td>
              ${owner?html`<td class="n">${p.id===me?.id
                ? html`<span class="muted">${'—'}</span>`
                : html`<button class="btn sec sm" onClick=${()=>setRole(p,
                    p.role==='owner'?'full':'owner')}>${
                    p.role==='owner'?'Take the dials off them':'Give them the dials'}</button>`}</td>`:''}
            </tr>`)}</tbody></table></div>`}
        <p class="muted" style=${{marginTop:'12px'}}>${
          'To add somebody, invite their email in Supabase under Authentication, Users, '
          +'Invite. They appear here the moment they accept, with everything except the '
          +'system values. Changing the app itself is not on this list because it is not '
          +'done in the app: that is the files on the host and the SQL editor in Supabase.'}</p>
      </div>
    </div>`;
}

/* The two companies. This is where a letterhead, a VAT rate and a numbering series
   actually live now, and the equivalents under The document are only what Dubai used
   before there were two offices. */
function OfficesPanel({offices,reload,owner}){
  const [f,setF]=useState({}); const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState(''); const [err,setErr]=useState('');
  useEffect(()=>{ const m={}; (offices||[]).forEach(o=>{ m[o.id]={...o}; }); setF(m); },[offices]);
  const up=(id,k,v)=>setF(p=>({...p,[id]:{...p[id],[k]:v}}));
  const save=async()=>{
    setBusy(true); setMsg(''); setErr('');
    let bad=null;
    for(const o of offices||[]){
      const n=f[o.id]||{};
      /* A rate typed as 0,21 became NaN and the save failed with a Postgres sentence; a
         rate typed as 21 became 2100% and saved. Both are read as the person meant them. */
      let vat = settingNumber(n.vat_rate, NaN);
      if(String(n.vat_rate||'').includes('%') || vat>1) vat = vat/100;
      if(!isFinite(vat) || vat<0 || vat>1){ setBusy(false);
        return setErr('The VAT rate for '+o.name+' is a fraction: 0.05 for 5%, 0.21 for 21%.'); }
      const {error}=await sb.from('offices').update({
        name:n.name, legal_name:n.legal_name, address:n.address, email:n.email,
        tax_id:n.tax_id, tax_id_label:n.tax_id_label,
        vat_rate:vat, quote_prefix:n.quote_prefix||'',
        quote_suffix:n.quote_suffix||'', quote_digits:Number(n.quote_digits)||4,
        bank_details:n.bank_details, terms:n.terms}).eq('id',o.id);
      if(error) bad=error.message;
    }
    setBusy(false);
    if(bad) setErr('That did not save: '+bad); else { setMsg('Saved.'); reload&&reload(); }
  };
  return html`<${Frag}>
    ${msg && html`<div class="ok">${msg}</div>`}
    ${err && html`<div class="err">${err}</div>`}
    ${!owner && html`<p class="muted">${
      'These are Charles’s to change. Everything else in the system is yours to work with '
      +'as normal.'}</p>`}
    ${(offices||[]).map(o=>{ const n=f[o.id]||{};
      return html`<div class="panel" key=${o.id}>
        <div class="panel-head"><h2>${o.name}</h2>
          <span class="sp muted">${o.currency+' · VAT '+(Number(o.vat_rate)*100).toFixed(0)
            +'% · '+(o.quote_prefix||'')+'nnnn'+(o.quote_suffix||'')
            +' · next '+o.quote_next}</span></div>
        <div class="panel-body">
          <div class="grid2">
            <div class="field"><label>Name on screen</label>
              <input type="text" disabled=${!owner} value=${n.name||''}
                onInput=${e=>up(o.id,'name',e.target.value)}/></div>
            <div class="field"><label>Legal name on the paperwork</label>
              <input type="text" disabled=${!owner} value=${n.legal_name||''}
                onInput=${e=>up(o.id,'legal_name',e.target.value)}/></div>
            <div class="field"><label>Address</label>
              <input type="text" disabled=${!owner} value=${n.address||''}
                onInput=${e=>up(o.id,'address',e.target.value)}/></div>
            <div class="field"><label>Email on the quotation</label>
              <input type="text" disabled=${!owner} value=${n.email||''}
                onInput=${e=>up(o.id,'email',e.target.value)}/></div>
            <div class="field"><label>What its tax number is called</label>
              <input type="text" disabled=${!owner} value=${n.tax_id_label||''}
                onInput=${e=>up(o.id,'tax_id_label',e.target.value)}/></div>
            <div class="field"><label>The number itself</label>
              <input type="text" disabled=${!owner} value=${n.tax_id||''}
                onInput=${e=>up(o.id,'tax_id',e.target.value)}/></div>
            <div class="field"><label>VAT rate, as a fraction</label>
              <input type="text" disabled=${!owner} value=${n.vat_rate??''}
                onInput=${e=>up(o.id,'vat_rate',e.target.value)}/></div>
            <div class="field"><label>Currency, fixed</label>
              <input type="text" disabled value=${o.currency}/></div>
            <div class="field"><label>Before the number</label>
              <input type="text" disabled=${!owner} value=${n.quote_prefix||''}
                onInput=${e=>up(o.id,'quote_prefix',e.target.value)}/></div>
            <div class="field"><label>After the number</label>
              <input type="text" disabled=${!owner} value=${n.quote_suffix||''}
                onInput=${e=>up(o.id,'quote_suffix',e.target.value)}/></div>
          </div>
          <div class="field"><label>Bank details, one item per line</label>
            <textarea disabled=${!owner} value=${n.bank_details||''}
              onInput=${e=>up(o.id,'bank_details',e.target.value)}></textarea></div>
          <div class="field"><label>Terms and conditions</label>
            <textarea disabled=${!owner} value=${n.terms||''}
              onInput=${e=>up(o.id,'terms',e.target.value)}></textarea></div>

/* ══════════════ INSTALL AS AN APP ══════════════
   The system is a web address, which is the only way it stays free and stays the same
   for everybody. Installing it puts it on the home screen or the taskbar with its own
   icon and no browser bar, so it behaves like any other app on the phone.

   Three different browsers do this three different ways, so rather than write one
   instruction that is wrong for two of them, this asks the browser what it can do.
   Chrome and Edge hand over a prompt, which becomes a button. Safari never does,
   so it gets the Share sheet in words. Already installed gets neither. */
/* ══════════════ CHANGING YOUR OWN PASSWORD ══════════════
   Sitting in Settings so that nobody ever has to go through an email to change one, and
   so somebody who got in on a link and skipped past the prompt has an obvious way to
   finish the job. It changes only the signed-in person's own password: an owner cannot
   set somebody else's from here, and should not be able to. */
function PasswordBox(){
  const [pw,setPw]=useState(''); const [pw2,setPw2]=useState('');
  const [msg,setMsg]=useState(''); const [err,setErr]=useState(''); const [busy,setBusy]=useState(false);
  const save = async () => {
    setErr(''); setMsg('');
    if(pw.length < 8) return setErr('Use at least eight characters.');
    if(pw !== pw2)    return setErr('The two passwords are not the same.');
    setBusy(true);
    const {error} = await sb.auth.updateUser({password: pw});
    setBusy(false);
    if(error) return setErr(error.message);
    setPw(''); setPw2('');
    setMsg('Saved. That is what you sign in with from now on, on every device.');
  };
  return html`<div class="panel">
    <div class="panel-head"><h2>${_t('Your password')}</h2></div>
    <div class="panel-body">
      <p class="muted">Set one here and you never need an email link again.</p>
      ${err && html`<div class="err">${err}</div>`}
      ${msg && html`<div class="flagbox">${msg}</div>`}
      <div class="field" style=${{maxWidth:'260px'}}><label>${_t('New password')}</label>
        <input type="password" value=${pw} autoComplete="new-password"
               onInput=${e=>setPw(e.target.value)}/></div>
      <div class="field" style=${{maxWidth:'260px'}}><label>${_t('Again')}</label>
        <input type="password" value=${pw2} autoComplete="new-password"
               onInput=${e=>setPw2(e.target.value)}/></div>
      <button class="btn" disabled=${busy} onClick=${save}>${
        busy?_t('Saving…'):_t('Save password')}</button>
    </div>
  </div>`;
}

function InstallBox(){
  const [can,setCan]=useState(()=>!!(typeof window!=='undefined' && window.__BT_INSTALL));
  const [done,setDone]=useState('');
  useEffect(()=>{
    const f=()=>setCan(!!window.__BT_INSTALL);
    window.addEventListener('bt-installable',f);
    return ()=>window.removeEventListener('bt-installable',f);
  },[]);

  const standalone = (()=>{ try{
    return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true; }catch(e){ return false; } })();
  const onFile = (()=>{ try{ return location.protocol==='file:'; }catch(e){ return false; } })();
  const apple  = (()=>{ try{
    return /iPad|iPhone|iPod/.test(navigator.userAgent)
        || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }catch(e){ return false; } })();

  const go = async ()=>{
    const e = window.__BT_INSTALL; if(!e) return;
    window.__BT_INSTALL = null; setCan(false);
    try{
      e.prompt();
      const r = await e.userChoice;
      setDone(r && r.outcome==='accepted'
        ? 'Installed. It is on your home screen now, or in your taskbar.'
        : 'Not installed. The offer comes back next time you open this page.');
    }catch(err){ setDone('The browser would not open the install dialog.'); }
  };

  return html`<div class="panel">
    <div class="panel-head"><h2>${_t('Install as an app')}</h2></div>
    <div class="panel-body">
      ${standalone ? html`<p class="muted">You are already using the installed app.</p>`
      : onFile ? html`<p class="muted">
          This copy is opened from a file on your computer, so it cannot be installed.
          Open the web address instead and the option appears here.</p>`
      : can ? html`<${Frag}>
          <p class="muted">It gets its own icon, opens without the browser bar, and
            starts even when the connection is poor.</p>
          <button class="btn" onClick=${go}>${_t('Install')}</button>
        </${Frag}>`
      : apple ? html`<p class="muted">
          On iPhone and iPad it is the Share button at the bottom of Safari, then
          <b>Add to Home Screen</b>. Safari has no install button of its own.</p>`
      : html`<p class="muted">
          In Edge and Chrome it is the install icon at the right-hand end of the address
          bar, or the three dots, then <b>Apps</b>, then <b>Install this site as an app</b>.</p>`}
      ${done && html`<p class="muted">${done}</p>`}
    </div>
  </div>`;
}

function Settings({settings,reload,me,offices,reloadMe}){
  const [f,setF]=useState({}); const [msg,setMsg]=useState(''); const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');
  const [tab,setTab]=useState('offices');
  const owner=me?.role==='owner';
  const [langMsg,setLangMsg]=useState('');
  const myOffice=(offices||[]).find(o=>o.id===me?.office_id)||null;
  const setLang=async v=>{
    setLangMsg('');
    const {error}=await sb.from('profiles').update({language:v}).eq('id',me.id);
    if(error) return setLangMsg('That did not save: '+error.message);
    reloadMe && reloadMe();
  };
  useEffect(()=>{setF(Object.fromEntries(settings.map(s=>[s.key,s.value])));},[settings]);
  const save=async()=>{
    setMsg(''); setErr('');
    /* The pricing and freight values are the numbers every price is built on. A comma or
       a percent sign in one of them used to become NaN somewhere deep inside a quotation,
       with nothing on screen to say why. They are checked here, and written back the way
       the code and Postgres both read them. */
    const numeric = new Set(SETTING_GROUPS.filter(g=>g[0]==='pricing'||g[0]==='freight').flatMap(g=>g[3]));
    const next = {...f};
    for(const s of settings){
      if(!numeric.has(s.key) || next[s.key]===s.value) continue;
      const n = settingNumber(next[s.key], NaN);
      if(!isFinite(n) || n<0) return setErr(s.label+' has to be a number: 0.70 for a 70% discount, 4.27 for the rate.');
      next[s.key] = String(n);
    }
    setBusy(true);
    let bad=null;
    for(const s of settings){
      if(next[s.key]!==s.value){
        const {error}=await sb.from('settings')
          .update({value:next[s.key],updated_at:new Date().toISOString()}).eq('key',s.key);
        if(error) bad=error.message;
      }
    }
    setBusy(false);
    if(bad) setErr('That did not save: '+bad); else { setMsg('Saved.'); reload(); }
  };

  // anything nobody filed into a group still has to be reachable
  const loose = settings.filter(s=>!SETTING_GROUP_OF[s.key]);
  const TABS = [
    ['offices','Offices'],
    ...SETTING_GROUPS.map(([id,label])=>[id,label]),
    ...(loose.length?[['other','Everything else']]:[]),
    ['people','Who can get in'],
    ['account','Your account'],
    ['system','Log and backup'],
  ];

  const valueField = s => html`
    <div class="field" key=${s.key}>
      <label>${s.label}</label>
      ${/^(terms_conditions|bank_details|quote_remarks)$/.test(s.key)
        ? html`<textarea disabled=${!owner} value=${f[s.key]??''}
            onInput=${e=>setF(p=>({...p,[s.key]:e.target.value}))}></textarea>`
        : html`<input type="text" disabled=${!owner} value=${f[s.key]??''}
            onInput=${e=>setF(p=>({...p,[s.key]:e.target.value}))}/>`}
    </div>`;

  const group = SETTING_GROUPS.find(g=>g[0]===tab);
  const rows = group ? settings.filter(s=>SETTING_GROUP_OF[s.key]===tab)
                              .sort((a,b)=>group[3].indexOf(a.key)-group[3].indexOf(b.key))
             : tab==='other' ? loose : [];

  return html`
    <div class="page-head"><h1>${_t("Settings")}</h1>
      <span class="sp muted" style=${{fontSize:'12px'}} title="Tells you which deployment you are looking at">
        Build ${BUILD_VERSION}</span></div>

    <div class="settabs">${TABS.map(([id,label])=>html`
      <button key=${id} class=${'settab'+(tab===id?' on':'')}
        onClick=${()=>setTab(id)}>${_t(label)}</button>`)}</div>

    ${tab==='offices' && html`<${OfficesPanel} offices=${offices} reload=${reload}
        owner=${owner}/>`}

    ${(group||tab==='other') && html`<div class="panel">
      <div class="panel-head"><h2>${_t(group?group[1]:'Everything else')}</h2>
        <span class="sp muted">${group?group[2]:'Values with no home yet'}</span></div>
      <div class="panel-body" style=${{maxWidth:'560px'}}>
        ${msg && html`<div class="ok">${msg}</div>`}
        ${err && html`<div class="err">${err}</div>`}
        ${!owner && html`<p class="muted" style=${{margin:'0 0 14px'}}>${
          'These are the numbers the whole system prices off, so they are Charles’s to '
          +'change. You can see them here, and everything else in the system is yours to '
          +'work with as normal.'}</p>`}
        ${rows.map(valueField)}
        ${owner && html`<button class="btn" onClick=${save} disabled=${busy}>${
          busy?_t('Saving…'):_t('Save changes')}</button>`}
        ${tab==='pricing' && html`<p class="muted" style=${{marginTop:'14px'}}>${
          'Change the EUR to AED rate here and every converted price follows. Quotations '
          +'keep the rate that applied on their issue date.'}</p>`}
        ${tab==='document' && html`<p class="muted" style=${{marginTop:'14px'}}>${
          'These are Dubai’s, from before there were two offices. A quotation now takes its '
          +'letterhead from its own office, so Offices is the place to change either one.'}</p>`}
      </div>
    </div>`}

    ${tab==='people'  && html`<${AccessList} me=${me}/>`}
    ${tab==='system'  && html`<${ActivityAndBackup}/>`}

    ${tab==='account' && html`<div class="panel">
      <div class="panel-head"><h2>${_t("Your account")}</h2></div>
      <div class="panel-body">
        <dl class="kv"><dt>${_t('Name')}</dt><dd>${me?.full_name||'—'}</dd>
          <dt>${_t('Email')}</dt><dd>${me?.email||'—'}</dd>
          <dt>${_t('Office')}</dt><dd>${(myOffice&&myOffice.name)||'—'}</dd>
          <dt>${_t('Can do')}</dt><dd>${owner
            ? 'Owner. Everything, including the system values.'
            : 'Full. Every screen and every record. Everyone sees everything.'}</dd></dl>
        ${/* The language is the reader's, not the office's. Chris reads Dutch whether he
              is looking at a Belgian job or a Dubai one. */''}
        <div class="field" style=${{maxWidth:'260px',marginTop:'10px'}}>
          <label>${_t('Language')}</label>
          <select value=${me?.language||'en'} onChange=${e=>setLang(e.target.value)}>
            ${LANGS.map(([c,n])=>html`<option key=${c} value=${c}>${n}</option>`)}
          </select>
        </div>
        ${langMsg && html`<p class="muted">${langMsg}</p>`}
      </div>
    </div>
    <${PasswordBox}/>
    <${InstallBox}/>`}`;
}

/* ══════════════ COMMAND PALETTE ══════════════
   One keystroke reaches anything. It searches the real tables, not a menu, and it also
   carries the actions somebody would otherwise hunt through three screens for. This is
   the fastest route through the system once you know it exists, which is why the bar
   advertises it rather than hiding it behind a shortcut. */
const PAL_PLACES=[
  ['dashboard','◈','Operations'],['pipeline','◇','Pipeline'],['quotations','▤','Quotations'],
  ['projects','◱','Projects'],['orders','⬒','Orders'],['shipments','⬓','Shipments'],
  ['stock','▦','Stock'],['approvals','✓','Approvals'],['finance','₳','Finance'],
  ['clients','◉','Clients'],['catalogue','⬚','Catalogue'],['settings','⚙','Settings'],
];

function Palette({open, close, go}){
  const [q,setQ]=useState(''); const [hits,setHits]=useState([]); const [sel,setSel]=useState(0);
  const inp=useRef(null); const listRef=useRef(null);

  useEffect(()=>{ if(open){ setQ(''); setSel(0);
    setTimeout(()=>inp.current&&inp.current.focus(),20); } },[open]);

  // places and actions are instant; records are looked up as you type
  const places = PAL_PLACES
    .filter(([,,l])=>!q.trim()||l.toLowerCase().includes(q.trim().toLowerCase()))
    .map(([k,i,l])=>({group:'Go to',icon:i,title:l,hint:'',act:()=>go([k])}));

  const actions = [
    {icon:'＋',title:'New quotation',hint:'Quotations',act:()=>go(['quotations','new'])},
    {icon:'＋',title:'New order',hint:'Orders',act:()=>go(['orders','new'])},
    {icon:'＋',title:'Record a cost',hint:'Finance',act:()=>go(['finance','costs'])},
    {icon:'＋',title:'Record a stock movement',hint:'Stock',act:()=>go(['stock'])},
    {icon:'⤓',title:'Download everything, a backup',hint:'Settings',act:()=>go(['settings'])},
  ].filter(a=>!q.trim()||a.title.toLowerCase().includes(q.trim().toLowerCase()))
   .map(a=>({group:'Do',...a}));

  useEffect(()=>{
    const t=q.trim();
    if(t.length<2){ setHits([]); return; }
    let dead=false;
    const id=setTimeout(async()=>{
      const like='%'+t+'%';
      const [cl,qt,pr,po,pj]=await Promise.all([
        sb.from('clients').select('id,name,location,kind').ilike('name',like).limit(5),
        sb.from('quotations').select('id,reference,project_name').ilike('reference',like).limit(4),
        sb.from('products').select('id,name,subcategory').ilike('name',like).limit(5),
        sb.from('purchase_orders').select('id,reference,supplier').ilike('reference',like).limit(3),
        sb.from('projects').select('id,name,status').ilike('name',like).limit(3)]);
      if(dead) return;
      setHits([
        ...(cl.data||[]).map(r=>({
             group:r.kind==='prospect'?'Visited':'Clients',
             icon:r.kind==='prospect'?'◎':'◉',
             title:r.name, hint:r.location||'',
             // a prospect lives on the visits screen, which is the only place it appears
             act:()=>go([r.kind==='prospect'?'visits':'clients',r.id])})),
        ...(qt.data||[]).map(r=>({group:'Quotations',icon:'▤',title:r.reference,
             hint:r.project_name||'',act:()=>go(['quotations',r.id])})),
        ...(po.data||[]).map(r=>({group:'Orders',icon:'⬒',title:r.reference,hint:r.supplier||'',
             act:()=>go(['orders',r.id])})),
        ...(pj.data||[]).map(r=>({group:'Projects',icon:'◱',title:r.name,hint:r.status||'',
             act:()=>go(['projects',r.id])})),
        ...(pr.data||[]).map(r=>({group:'Catalogue',icon:'⬚',title:r.name,
             hint:r.subcategory||'',act:()=>go(['catalogue',r.id])})),
      ]);
    },180);
    return ()=>{dead=true;clearTimeout(id);};
  },[q]);

  const all=[...hits,...places,...actions];
  useEffect(()=>{ setSel(0); },[q]);

  const run=i=>{ const it=all[i]; if(!it) return; close(); it.act(); };

  const key=e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); setSel(s=>Math.min(s+1,all.length-1)); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); setSel(s=>Math.max(s-1,0)); }
    else if(e.key==='Enter'){ e.preventDefault(); run(sel); }
    else if(e.key==='Escape'){ e.preventDefault(); close(); }
  };
  useEffect(()=>{
    const el=listRef.current&&listRef.current.querySelector('.pal-item.sel');
    if(el&&el.scrollIntoView) el.scrollIntoView({block:'nearest'});
  },[sel]);

  if(!open) return null;
  let last=null;
  return html`
    <div class="pal-back" onMouseDown=${e=>{if(e.target===e.currentTarget) close();}}>
      <div class="pal" onKeyDown=${key}>
        <input ref=${inp} type="text" value=${q} placeholder="${_t("Search anything, or type what you want to do\u2026")}"
               onInput=${e=>setQ(e.target.value)}/>
        <div class="pal-list" ref=${listRef}>
          ${all.length===0 ? html`<div class="pal-empty">Nothing matches “${q}”.</div>`
            : all.map((it,i)=>{ const head = it.group!==last; last=it.group;
              return html`<${Frag} key=${i}>
                ${head && html`<div class="pal-sec">${it.group}</div>`}
                <button class=${'pal-item'+(i===sel?' sel':'')}
                  onMouseEnter=${()=>setSel(i)} onClick=${()=>run(i)}>
                  <span class="pi">${it.icon}</span>
                  <span class="pt">${it.title}</span>
                  ${it.hint && html`<span class="ps">${it.hint}</span>`}
                </button></${Frag}>`; })}
        </div>
        <div class="pal-foot">
          <span><b>↑ ↓</b> move</span><span><b>↵</b> open</span><span><b>esc</b> close</span>
          <span style=${{marginLeft:'auto'}}>Everything in the system is reachable from here.</span>
        </div>
      </div>
    </div>`;
}

/* ══════════════ CARGO FROM A QUOTATION ══════════════ */
/* A quotation already says what goes on the building and how much of it per square
   metre. That is a bill of materials in everything but name, so rather than ask
   anybody to type it a second time we read it back out.

   The bold specification lines carry "Product : consumption". Everything below turns
   those into pails, kilos and cubic metres a freight forwarder can price. It is a
   draft on purpose: it shows its working, and anything it could not read it says so
   rather than quietly leaving out. */

/* "Geomax 80gr./m²" and "Geomax 80gr/m2" are the same product written two ways, so
   the superscript has to become a plain digit before the punctuation is stripped.
   Strip it first and one name keeps its 2 while the other loses it. */
const normName = s => (s||'').toLowerCase()
  .replace(/²/g,'2').replace(/³/g,'3')
  .replace(/[^a-z0-9]/g,'');
const numOf    = s => parseFloat(String(s).replace(',','.'));

/* Consumption comes in several shapes across the catalogue. Return kg per m2, or
   null when the line does not state one. */
function parseConsumption(text){
  const t = (text||'').replace(/²/g,'2').replace(/–|—/g,'-');
  let m;
  // "2 layers of 0,80 - 1,00 kg/m2"  ->  layers x the upper figure
  if((m = t.match(/(\d+)\s*layers?\s*of\s*([\d.,]+)\s*-\s*([\d.,]+)\s*(kg|gr?)\s*\/\s*m2/i)))
    return { kg: numOf(m[1]) * numOf(m[3]) / (/^g/i.test(m[4])?1000:1), how:'layers, upper end' };
  if((m = t.match(/(\d+)\s*layers?\s*of\s*([\d.,]+)\s*(kg|gr?)\s*\/\s*m2/i)))
    return { kg: numOf(m[1]) * numOf(m[2]) / (/^g/i.test(m[3])?1000:1), how:'layers' };
  // "0,80 - 1,00 kg/m2"  ->  the upper figure, because that is what gets ordered
  if((m = t.match(/([\d.,]+)\s*-\s*([\d.,]+)\s*(kg|gr?)\s*\/\s*m2/i)))
    return { kg: numOf(m[2]) / (/^g/i.test(m[3])?1000:1), how:'upper end of the range' };
  // "Approx. 2,50 kg/m2"  or  "500 g/m2"
  if((m = t.match(/([\d.,]+)\s*(kg|gr?)\s*\/\s*m2/i)))
    return { kg: numOf(m[1]) / (/^g/i.test(m[2])?1000:1), how:'as stated' };
  return null;
}

/* Turn a quotation into a cargo list. `products` must carry product_packs and
   product_aliases. Returns rows plus whatever could not be resolved. */
// How many square metres are actually on a roll. The column is the truth; the label is the
// fallback for a catalogue row somebody has not finished filling in. Returns 0 when neither
// says, because a guess here is an order that is short on site.
function rollM2(pack){
  if(!pack) return 0;
  const q = Number(pack.pack_qty);
  if(q > 0) return q;
  const lab = String(pack.label||'');
  const area = lab.match(/\(\s*([\d.]+)\s*m²\s*\)/);      // "0.30m × 100m roll (30 m²)"
  if(area) return Number(area[1]) || 0;
  const wl = lab.match(/^([\d.]+)\s*m\s*[×x]\s*([\d.]+)\s*m/); // "1m × 20m roll"
  if(wl) return (Number(wl[1])||0) * (Number(wl[2])||0);
  return 0;
}
// Of the rolls on a product, the one that costs least per square metre.
function bestRoll(packs){
  const rolls = (packs||[]).filter(k=>/m2|m²/i.test(k.unit||'') && rollM2(k) > 0);
  if(!rolls.length) return (packs||[]).find(k=>/m2|m²/i.test(k.unit||''));
  return rolls.slice().sort((a,b)=>
    (nz(a.eur_total)/rollM2(a)) - (nz(b.eur_total)/rollM2(b)))[0];
}

function cargoFromQuotation(secs, products, cfgNum){
  const tare   = cfgNum('pack_tare_pct',    0.11);
  const perPal = cfgNum('pails_per_pallet', 24);
  const palM3  = cfgNum('pallet_m3',        1.104);
  const rollKg = cfgNum('roll_kg',          9);
  // what Krypton actually charges us, which is list less the supply discount, in dirhams
  const disc   = cfgNum('supply_discount',  0.70);
  const fx     = cfgNum('eur_aed_rate',     4.27);
  const netAed = eur => nz(eur) * (1 - disc) * fx;

  // one lookup covering names and aliases
  const byName = {};
  (products||[]).forEach(p=>{
    byName[normName(p.name)] = p;
    (p.product_aliases||[]).forEach(a=>{ byName[normName(a.alias)] = p; });
  });

  const need = {}, unresolved = [];
  (secs||[]).forEach(s=>{
    // The area a section covers is the area of the lines measured in square metres, and
    // ONLY those. Summing every priced line and then trusting the first line's unit was
    // wrong twice over: a section split into a supply line and an install line over the
    // same 500 m2 came out as 1,000 m2 and ordered double the material and double the
    // freight, and a section mixing sq.m with kg added square metres to kilograms.
    const isArea = l => /^\s*(sq\.?\s*m|m2|m²|sqm)\s*$/i.test(l.unit||'');
    const priced = (s.lines||[]).filter(l=>!l.is_spec_note && !l.is_costing && l.quantity);
    const areaLines = priced.filter(isArea);
    if(!areaLines.length) return;                  // not measured by area, no take-off
    // Lines over the same scope repeat the area, they do not add to it. Supply and install
    // of one roof is one roof. Taking the largest is the reading that cannot over-order.
    const area = Math.max(...areaLines.map(l=>Number(l.quantity)||0));
    if(!area) return;
    /* Anything measured in something else still has to be said out loud, whether it is
       priced or build-up. A build-up line in kilograms is real material; if its name does
       not resolve to a product it would otherwise vanish without a word. */
    const measured = (s.lines||[]).filter(l=>!l.is_spec_note && l.quantity);
    const otherUnits = [...new Set(measured.filter(l=>!isArea(l)).map(l=>(l.unit||'').trim()).filter(Boolean))];
    if(otherUnits.length) unresolved.push({section:s.title,
      text:'Lines measured in '+otherUnits.join(', ')+' alongside the square metre lines',
      why:'left out of the take-off, only the '+area+' m² is counted'});
    /* A product line is one that is bold. That used to mean the whole line was marked
       bold with the B button; now that part of a line can be marked instead, a line with
       marks in it counts too, or marking only the product name would quietly drop it out
       of the material take-off. */
    /* Where the products are named. Originally that was a bold specification note. A
       build-up line is the same thing with a cost on it, so it counts too, and Charles's
       older quotations, which put the products on plain priced lines, start producing a
       shipping take-off the moment those lines are marked as build-up. */
    (s.lines||[]).filter(l=>l.description
                            && (l.is_costing
                                || (l.is_spec_note
                                    && (l.is_bold || String(l.description).indexOf(BOLD_MARK) >= 0)))).forEach(l=>{
      const raw  = plainText(l.description);
      const name = raw.split(':')[0].trim();
      const prod = byName[normName(name)]
                || byName[normName(name.replace(/\d+\s*gr?\.?\s*\/?\s*m2?$/i,''))];
      if(!prod){ unresolved.push({section:s.title, text:raw, why:'no catalogue match'}); return; }
      const packs = (prod.product_packs||[]).filter(k=>!k.is_poa);
      if(!packs.length){ unresolved.push({section:s.title, text:raw, why:'price on application, no pack size'}); return; }
      // Sold by the roll. Pick the cheapest per square metre, which is the same rule the
      // kilogram path uses, rather than whichever roll happened to be entered first. On
      // Geomax the 100 m² roll is EUR 3.20/m² against EUR 4.01 for the 30 m² one.
      const areaPack = bestRoll(packs);
      // Work out the figure BEFORE creating the record. Creating it first and then
      // bailing out leaves a product on the cargo list with a quantity of zero, which
      // reads as "we checked and you need none of it" rather than "we could not tell".
      let add;
      if(areaPack){                                 // sold by the square metre, a roll
        add = {m2:area, kg:0, note:`${s.title} ${area} m²`, how:'one for one with the area'};
      } else {
        const c = parseConsumption(raw);
        if(!c){ unresolved.push({section:s.title, text:raw, why:'no consumption stated'}); return; }
        add = {m2:0, kg:area*c.kg, note:`${s.title} ${area} m² × ${c.kg} kg/m²`, how:c.how};
      }
      const rec = need[prod.id] || (need[prod.id] = {product:prod, kg:0, m2:0, from:[],
                                                     used:[], how:null});
      rec.kg += add.kg; rec.m2 += add.m2;
      rec.from.push(add.note); rec.how = add.how;
      // Keep the section, the area and the consumption rather than flattening them into a
      // string. The same product turns up in two sections at two different rates, so a
      // single cost per square metre for a product would be a blend of two real numbers
      // and true of neither.
      rec.used.push({section:s.title, m2:area, kgPerM2:add.kg?add.kg/area:0, kg:add.kg,
                     byArea:!!add.m2});
    });
  });

  const rows = Object.values(need).map(r=>{
    const packs = (r.product.product_packs||[]).filter(k=>!k.is_poa);
    const area  = bestRoll(packs);   // cheapest per m², matching the choice made above
    // the cost is taken off the pack we would actually buy, not the catalogue default,
    // so the figure on screen is the one that will be on the invoice
    const perUnit = k => nz(k.eur_per_unit) || (nz(k.pack_qty) ? nz(k.eur_total)/nz(k.pack_qty) : 0);
    if(area){
      // A roll with no stated coverage used to fall back to a hardcoded 100 m². On the
      // 0.30m Geomax roll, which really covers 30, that ordered a third of what the job
      // needed and said nothing. Never invent a coverage: say we cannot work it out.
      const per = rollM2(area);
      if(!per){
        unresolved.push({section:(r.used[0]||{}).section||'', text:r.product.name,
          why:'the pack "'+area.label+'" does not say how many square metres are on the roll'});
        return null;
      }
      const n   = Math.ceil(r.m2/per);
      const aedPerM2 = netAed(perUnit(area));
      return {product:r.product, required:r.m2, unit:'m²', pack:area.label, packId:area.id,
              packUnit:'m²',
              packs:n, supplied:n*per, net:n*rollKg, gross:n*rollKg*(1+tare),
              from:r.from.join('; '), how:r.how, used:r.used,
              aedPerUnit:aedPerM2, aedNeeded:r.m2*aedPerM2, aedOrdered:n*per*aedPerM2};
    }
    // the biggest pack, because that is always the cheapest per kilo
    const big = packs.slice().sort((a,b)=>(Number(b.pack_qty)||0)-(Number(a.pack_qty)||0))[0];
    const per = Number(big.pack_qty)||1;
    const n   = Math.ceil(r.kg/per);
    const aedPerKg = netAed(perUnit(big));
    return {product:r.product, required:r.kg, unit:'kg', pack:big.label, packId:big.id,
            packUnit:'kg',
            packs:n, supplied:n*per, net:n*per, gross:n*per*(1+tare),
            from:r.from.join('; '), how:r.how, used:r.used,
            aedPerUnit:aedPerKg, aedNeeded:r.kg*aedPerKg, aedOrdered:n*per*aedPerKg};
  }).filter(Boolean).sort((a,b)=>b.net-a.net);

  // Per section: what the material for it costs, and what that is per square metre. This
  // is the exact requirement, not whole packs, because the question is what the section
  // costs, not what is left over in the warehouse afterwards.
  const bySec = {};
  rows.forEach(r=>{
    (r.used||[]).forEach(u=>{
      const g = bySec[u.section] || (bySec[u.section] = {title:u.section, m2:u.m2, items:[], aed:0});
      g.m2 = Math.max(g.m2, u.m2);
      const qty = u.byArea ? u.m2 : u.kg;
      const aed = qty * nz(r.aedPerUnit);
      g.items.push({name:r.product.name, kgPerM2:u.kgPerM2, byArea:u.byArea,
                    qty, unit:r.packUnit, aedPerUnit:nz(r.aedPerUnit),
                    aedPerM2: u.m2 ? aed/u.m2 : 0, aed});
      g.aed += aed;
    });
  });
  const sections = Object.values(bySec).map(g=>({...g,
    items: g.items.sort((a,b)=>b.aed-a.aed),
    aedPerM2: g.m2 ? g.aed/g.m2 : 0})).sort((a,b)=>b.aed-a.aed);
  const goodsNeeded = rows.reduce((t,r)=>t+nz(r.aedNeeded),0);
  const goodsOrdered= rows.reduce((t,r)=>t+nz(r.aedOrdered),0);

  const pails   = rows.filter(r=>r.packUnit==='kg').reduce((t,r)=>t+r.packs,0);
  const rolls   = rows.filter(r=>r.packUnit==='m²').reduce((t,r)=>t+r.packs,0);
  const net     = rows.reduce((t,r)=>t+r.net,0);
  const gross   = rows.reduce((t,r)=>t+r.gross,0);
  const pallets = (pails?Math.ceil(pails/perPal):0) + (rolls?1:0);
  const vol     = pallets*palM3;
  return {rows, unresolved, pails, rolls, net, gross, pallets, vol, sections,
          goodsNeeded, goodsOrdered, supplyDiscount:disc, fx,
          chargeable: Math.max(gross/1000, vol)};
}

/* What a forwarder is told, and what we are still missing before they can be firm. */
function ShippingRequest({q, secs, cat, trans, settings, client, onOrder}){
  const cfgNum=(k,d)=>settingNumber(settings.find(s=>s.key===k)?.value, d);
  const c = useMemo(()=>cargoFromQuotation(secs, cat, cfgNum), [secs, cat, settings]);
  const [sdsFiles,setSdsFiles]=useState([]);
  const [packBusy,setPackBusy]=useState(''); const [packErr,setPackErr]=useState('');

  // the actual safety data sheets for the products on this cargo, so the pack can carry
  // them rather than telling the forwarder to go and find them
  const cargoIds = c.rows.map(r=>r.product.id).join(',');
  useEffect(()=>{(async()=>{
    const ids=c.rows.map(r=>r.product.id);
    if(!ids.length){ setSdsFiles([]); return; }
    const {data}=await sb.from('product_documents')
      .select('*, products(name)').in('product_id',ids).eq('doc_type','sds');
    setSdsFiles((data||[]).map(x=>({
      id:x.id, label:(x.products?.name?x.products.name+' - ':'')+x.title,
      storage_path:x.storage_path, external_url:x.external_url })));
  })();},[cargoIds]);
  const n = (v,d=0)=>Number(v||0).toLocaleString('en-AE',
              {minimumFractionDigits:d,maximumFractionDigits:d});

  if(!c.rows.length && !c.unresolved.length) return html`<div class="panel"><div class="panel-body">
    <p class="muted">Nothing to ship yet. Add priced sections measured in square metres, with the
    product and its consumption on the bold specification lines, and the cargo appears here.</p>
  </div></div>`;

  // Three states, and they are not the same thing. Classified as dangerous, read and
  // found not to be, and never read at all. Only the last one should stop a forwarder.
  const dg=[], clean=[], unknown=[];
  c.rows.forEach(r=>{ const t=trans[r.product.id];
    if(!t || !(t.classified_components>0)) unknown.push(r);
    else if(!t.un_numbers)                 clean.push(r);
    else dg.push({name:r.product.name, un:t.un_numbers, cls:t.un_classes,
                  pg:t.worst_packing_group, mp:t.marine_pollutant}); });
  const noSds = c.rows.filter(r=>!(trans[r.product.id]?.sds_on_file>0));
  const haveSds = c.rows.filter(r=>trans[r.product.id]?.sds_on_file>0);

  // Everything the forwarder needs, as one file that can be forwarded as it stands. The
  // PDF is written here rather than printed, so it is a real attachment and not a browser
  // print dialogue. The pack adds every safety data sheet we actually hold.
  const buildPdf=()=>freightRequestPdf({
    q, client, c, dg, clean, unknown, trans,
    docs:(sdsFiles||[]).map(f=>f.label),
    cfg:k=>(settings.find(s=>s.key===k)||{}).value||'', cfgNum});

  const savePdf=()=>{
    setPackErr('');
    try{ saveBlob(buildPdf(), 'Freight request '+q.reference+'.pdf'); }
    catch(e){ setPackErr('Could not build the PDF: '+e.message); }
  };

  const savePack=async()=>{
    setPackErr(''); setPackBusy('Building the request…');
    try{
      const files=[{name:'1. Request for freight quotation - '+q.reference+'.pdf',
                    data:new Uint8Array(await buildPdf().arrayBuffer())}];
      const missed=[];
      for(const f of (sdsFiles||[])){
        setPackBusy('Fetching '+f.label+'…');
        try{
          let url=f.external_url;
          if(f.storage_path){
            const {data,error}=await sb.storage.from('product-docs')
              .createSignedUrl(f.storage_path,120);
            if(error) throw new Error(error.message);
            url=data.signedUrl;
          }
          const res=await fetch(url);
          if(!res.ok) throw new Error('HTTP '+res.status);
          files.push({name:'Safety data sheets/'+f.label.replace(/[\\/:*?"<>|]/g,'-')+'.pdf',
                      data:new Uint8Array(await res.arrayBuffer())});
        }catch(e){ missed.push(f); }
      }
      if(missed.length){
        // A file kept on Drive cannot be fetched by a browser on another origin. Say so and
        // hand over the links, rather than quietly shipping a pack with holes in it.
        const txt='These safety data sheets are kept in Google Drive and a browser cannot\n'
          +'download them from here. Open each link, save the file, and drop it into the\n'
          +'"Safety data sheets" folder before you send the pack.\n\n'
          +missed.map(f=>f.label+'\n'+(f.external_url||'')+'\n').join('\n');
        files.push({name:'Safety data sheets/READ ME, files still to add.txt',
                    data:new TextEncoder().encode(txt)});
      }
      saveBlob(miniZip(files), 'Freight request '+q.reference+'.zip');
      setPackBusy('');
      if(missed.length) setPackErr(missed.length+' '+plural(missed.length,'data sheet')
        +' could not be pulled from Drive. The pack contains a note listing them with links.');
    }catch(e){ setPackBusy(''); setPackErr('Could not build the pack: '+e.message); }
  };

  return html`<div class="panel ship-print">
    <div class="panel-head"><h2>${_t("Shipping request")}</h2>
      <div class="sp" style=${{display:'flex',gap:'8px'}}>
        ${/* The request used to stop here, as a PDF for the forwarder, and the order had to
              be typed from it. The same take-off now goes straight onto a draft order, to
              be approved and sent. */''}
        ${onOrder && html`<button class="btn sec" onClick=${onOrder}
          title="A draft purchase order with these cargo lines on it, ready to be approved and sent">${
          _t("Create an order from this request")}</button>`}
        <button class="btn sec" onClick=${savePdf}>${_t("Save as PDF")}</button>
        <button class="btn" onClick=${savePack} disabled=${!!packBusy}>
